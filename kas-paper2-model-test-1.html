<style>:root{--bg:#f4f6fb;--c:#fff;--t:#14213d;--m:#5a6478;--b:#d5dae6;--p:#14305f;--r:#c8102e;--ok:#1b8a4b;--no:#c8102e;--mk:#7b3fe4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,sans-serif}.w{max-width:820px;margin:auto;padding:12px}

.o{display:block;width:100%;text-align:left;margin:7px 0;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font:inherit;cursor:pointer}
.o.s{border-color:var(--p);background:rgba(20,48,95,.14)}.o.g{border-color:var(--ok);background:rgba(27,138,75,.16)}.o.x{border-color:var(--no);background:rgba(200,16,46,.14)}
button.n{background:var(--p);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}button.n.a{background:var(--c);color:var(--t);border:1px solid var(--b)}button.n.r{background:var(--r)}button.n.mk{background:var(--mk)}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-top:8px}.tg{display:block;text-align:center;background:#229ed9;color:#fff;border-radius:10px;padding:12px;text-decoration:none;font-weight:700;margin:10px 0}

.pal{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.pal button{padding:6px 0;border:1px solid var(--b);border-radius:6px;background:var(--c);color:var(--t);font:13px system-ui;cursor:pointer}
.pal .an{background:var(--ok);color:#fff;border-color:var(--ok)}.pal .vi{background:var(--no);color:#fff;border-color:var(--no)}.pal .mk{background:var(--mk);color:#fff;border-color:var(--mk)}.pal .cur{outline:2px solid var(--p)}

<script>
const Q=[["General Science", "What is the SI unit of power?", "ಶಕ್ತಿಯ (ಪವರ್) SI ಏಕಮಾನ ಯಾವುದು?", [["Joule", "ಜೂಲ್"], ["Watt", "ವ್ಯಾಟ್"], ["Newton", "ನ್ಯೂಟನ್"], ["Pascal", "ಪಾಸ್ಕಲ್"]], 1, ["Power = work/time; 1 watt = 1 joule per second.", "ಪವರ್ = ಕೆಲಸ/ಕಾಲ; 1 ವ್ಯಾಟ್ = ಸೆಕೆಂಡಿಗೆ 1 ಜೂಲ್."]], ["General Science", "Sound travels fastest in which of the following media?", "ಕೆಳಗಿನ ಯಾವ ಮಾಧ್ಯಮದಲ್ಲಿ ಶಬ್ದ ಅತಿ ವೇಗವಾಗಿ ಚಲಿಸುತ್ತದೆ?", [["Air", "ಗಾಳಿ"], ["Water", "ನೀರು"], ["Solids", "ಘನ ವಸ್ತುಗಳು"], ["Vacuum", "ನಿರ್ವಾತ"]], 2, ["Sound is fastest in solids, slower in liquids and slowest in gases; it cannot travel in vacuum.", "ಶಬ್ದ ಘನದಲ್ಲಿ ಅತಿ ವೇಗ, ದ್ರವದಲ್ಲಿ ಕಡಿಮೆ, ಅನಿಲದಲ್ಲಿ ಇನ್ನೂ ಕಡಿಮೆ; ನಿರ್ವಾತದಲ್ಲಿ ಚಲಿಸದು."]], ["General Science", "Consider the following statements:\nA. Light travels slower in glass than in vacuum.\nB. Total internal reflection can occur when light passes from a denser to a rarer medium beyond the critical angle.\nC. A concave mirror always forms a virtual image.\nWhich of the above are correct?", "ಈ ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ:\nA. ಬೆಳಕು ನಿರ್ವಾತಕ್ಕಿಂತ ಗಾಜಿನಲ್ಲಿ ನಿಧಾನವಾಗಿ ಚಲಿಸುತ್ತದೆ.\nB. ಬೆಳಕು ದಟ್ಟ ಮಾಧ್ಯಮದಿಂದ ವಿರಳ ಮಾಧ್ಯಮಕ್ಕೆ ಕ್ರಾಂತಿ ಕೋನ ಮೀರಿ ಬಂದಾಗ ಪೂರ್ಣ ಆಂತರಿಕ ಪ್ರತಿಫಲನ ಉಂಟಾಗಬಹುದು.\nC. ನಿಮ್ನ ದರ್ಪಣ ಯಾವಾಗಲೂ ಮಿಥ್ಯಾ ಪ್ರತಿಬಿಂಬ ರೂಪಿಸುತ್ತದೆ.\nಮೇಲಿನ ಯಾವುವು ಸರಿ?", [["A only", "A ಮಾತ್ರ"], ["A and B only", "A ಮತ್ತು B ಮಾತ್ರ"], ["B and C only", "B ಮತ್ತು C ಮಾತ್ರ"], ["A, B and C", "A, B ಮತ್ತು C"]], 1, ["A and B are correct; a concave mirror can also form real images, so C is wrong.", "A ಮತ್ತು B ಸರಿ; ನಿಮ್ನ ದರ್ಪಣ ನೈಜ ಪ್ರತಿಬಿಂಬವನ್ನೂ ರೂಪಿಸಬಲ್ಲದು, ಆದ್ದರಿಂದ C ತಪ್ಪು."]], ["General Science", "Match the instruments (List I) with their uses (List II):\nList I: A. Barometer  B. Hygrometer  C. Ammeter  D. Seismograph\nList II: I. Humidity  II. Earthquakes  III. Atmospheric pressure  IV. Electric current", "ಉಪಕರಣಗಳನ್ನು (ಪಟ್ಟಿ I) ಬಳಕೆಯೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. ಬಾರೋಮೀಟರ್  B. ಹೈಗ್ರೋಮೀಟರ್  C. ಅಮ್ಮೀಟರ್  D. ಭೂಕಂಪನ ಮಾಪಕ\nಪಟ್ಟಿ II: I. ತೇವಾಂಶ  II. ಭೂಕಂಪಗಳು  III. ವಾತಾವರಣದ ಒತ್ತಡ  IV. ವಿದ್ಯುತ್ ಪ್ರವಾಹ", [["A–III, B–I, C–IV, D–II", "A–III, B–I, C–IV, D–II"], ["A–I, B–III, C–IV, D–II", "A–I, B–III, C–IV, D–II"], ["A–III, B–I, C–II, D–IV", "A–III, B–I, C–II, D–IV"], ["A–IV, B–I, C–III, D–II", "A–IV, B–I, C–III, D–II"]], 0, ["Barometer – pressure; hygrometer – humidity; ammeter – current; seismograph – earthquakes.", "ಬಾರೋಮೀಟರ್ – ಒತ್ತಡ; ಹೈಗ್ರೋಮೀಟರ್ – ತೇವಾಂಶ; ಅಮ್ಮೀಟರ್ – ಪ್ರವಾಹ; ಸೀಸ್ಮೋಗ್ರಾಫ್ – ಭೂಕಂಪ."]], ["General Science", "Assertion (A): The sky appears blue during the day.\nReason (R): Blue light is scattered more than red light by atmospheric particles.", "ಪ್ರತಿಪಾದನೆ (A): ಹಗಲಿನಲ್ಲಿ ಆಕಾಶ ನೀಲಿಯಾಗಿ ಕಾಣುತ್ತದೆ.\nಕಾರಣ (R): ವಾತಾವರಣದ ಕಣಗಳು ಕೆಂಪು ಬೆಳಕಿಗಿಂತ ನೀಲಿ ಬೆಳಕನ್ನು ಹೆಚ್ಚು ಚದುರಿಸುತ್ತವೆ.", [["Both (A) and (R) are true and (R) is the correct explanation of (A)", "(A) ಮತ್ತು (R) ಎರಡೂ ಸತ್ಯ ಮತ್ತು (R) ಯು (A) ಯ ಸರಿಯಾದ ವಿವರಣೆ"], ["Both (A) and (R) are true but (R) is not the correct explanation of (A)", "(A) ಮತ್ತು (R) ಎರಡೂ ಸತ್ಯ ಆದರೆ (R) ಯು (A) ಯ ಸರಿಯಾದ ವಿವರಣೆಯಲ್ಲ"], ["(A) is true but (R) is false", "(A) ಸತ್ಯ ಆದರೆ (R) ಸುಳ್ಳು"], ["(A) is false but (R) is true", "(A) ಸುಳ್ಳು ಆದರೆ (R) ಸತ್ಯ"]], 0, ["Rayleigh scattering scatters shorter (blue) wavelengths more strongly.", "ರೇಲೀ ಚದುರುವಿಕೆ ಕಡಿಮೆ ತರಂಗಾಂತರದ (ನೀಲಿ) ಬೆಳಕನ್ನು ಹೆಚ್ಚು ಚದುರಿಸುತ್ತದೆ."]], ["General Science", "Which of the following is a vector quantity?", "ಕೆಳಗಿನವುಗಳಲ್ಲಿ ಸದಿಶ ಪ್ರಮಾಣ ಯಾವುದು?", [["Speed", "ಜವ (ವೇಗ ಪ್ರಮಾಣ)"], ["Mass", "ರಾಶಿ"], ["Velocity", "ವೇಗ (ವೆಲಾಸಿಟಿ)"], ["Energy", "ಶಕ್ತಿ"]], 2, ["Velocity has both magnitude and direction.", "ವೆಲಾಸಿಟಿಗೆ ಪರಿಮಾಣ ಮತ್ತು ದಿಕ್ಕು ಎರಡೂ ಇವೆ."]], ["General Science", "What is the pH of pure water at 25°C?", "25°C ನಲ್ಲಿ ಶುದ್ಧ ನೀರಿನ pH ಎಷ್ಟು?", [["5", "5"], ["7", "7"], ["9", "9"], ["14", "14"]], 1, ["Pure water is neutral with pH 7.", "ಶುದ್ಧ ನೀರು ತಟಸ್ಥ; pH 7."]], ["General Science", "The chemical formula of baking soda is", "ಅಡುಗೆ ಸೋಡಾದ ರಾಸಾಯನಿಕ ಸೂತ್ರ", [["Na₂CO₃", "Na₂CO₃"], ["NaHCO₃", "NaHCO₃"], ["NaOH", "NaOH"], ["CaCO₃", "CaCO₃"]], 1, ["Baking soda is sodium bicarbonate, NaHCO₃.", "ಅಡುಗೆ ಸೋಡಾ ಸೋಡಿಯಂ ಬೈಕಾರ್ಬೊನೇಟ್, NaHCO₃."]], ["General Science", "Match the compounds (List I) with their common names (List II):\nList I: A. NaOH  B. Ca(OH)₂  C. CaCO₃  D. Na₂CO₃·10H₂O\nList II: I. Limestone  II. Washing soda  III. Caustic soda  IV. Slaked lime", "ಸಂಯುಕ್ತಗಳನ್ನು (ಪಟ್ಟಿ I) ಸಾಮಾನ್ಯ ಹೆಸರುಗಳೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. NaOH  B. Ca(OH)₂  C. CaCO₃  D. Na₂CO₃·10H₂O\nಪಟ್ಟಿ II: I. ಸುಣ್ಣದ ಕಲ್ಲು  II. ಅಗಸೆ (ವಾಷಿಂಗ್) ಸೋಡಾ  III. ಕಾಸ್ಟಿಕ್ ಸೋಡಾ  IV. ಕರಗಿದ ಸುಣ್ಣ (ಸ್ಲೇಕ್ಡ್ ಲೈಮ್)", [["A–III, B–IV, C–I, D–II", "A–III, B–IV, C–I, D–II"], ["A–III, B–I, C–IV, D–II", "A–III, B–I, C–IV, D–II"], ["A–IV, B–III, C–I, D–II", "A–IV, B–III, C–I, D–II"], ["A–II, B–IV, C–I, D–III", "A–II, B–IV, C–I, D–III"]], 0, ["NaOH – caustic soda; Ca(OH)₂ – slaked lime; CaCO₃ – limestone; Na₂CO₃·10H₂O – washing soda.", "NaOH – ಕಾಸ್ಟಿಕ್ ಸೋಡಾ; Ca(OH)₂ – ಸ್ಲೇಕ್ಡ್ ಲೈಮ್; CaCO₃ – ಸುಣ್ಣದ ಕಲ್ಲು; Na₂CO₃·10H₂O – ವಾಷಿಂಗ್ ಸೋಡಾ."]], ["General Science", "Which gas is the most abundant in the Earth’s atmosphere?", "ಭೂಮಿಯ ವಾತಾವರಣದಲ್ಲಿ ಅತಿ ಹೆಚ್ಚು ಇರುವ ಅನಿಲ ಯಾವುದು?", [["Oxygen", "ಆಮ್ಲಜನಕ"], ["Nitrogen", "ಸಾರಜನಕ"], ["Carbon dioxide", "ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್"], ["Argon", "ಆರ್ಗಾನ್"]], 1, ["Nitrogen makes up about 78% of air; oxygen about 21%.", "ಗಾಳಿಯಲ್ಲಿ ಸಾರಜನಕ ಸುಮಾರು ಶೇ. 78; ಆಮ್ಲಜನಕ ಸುಮಾರು ಶೇ. 21."]], ["General Science", "Consider the following statements:\nA. Diamond and graphite are allotropes of carbon.\nB. Graphite is a good conductor of electricity.\nC. Diamond is the hardest natural substance.\nWhich of the above are correct?", "ಈ ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ:\nA. ವಜ್ರ ಮತ್ತು ಗ್ರ್ಯಾಫೈಟ್ ಕಾರ್ಬನ್‌ನ ಭಿನ್ನರೂಪಗಳು.\nB. ಗ್ರ್ಯಾಫೈಟ್ ವಿದ್ಯುತ್‌ನ ಉತ್ತಮ ವಾಹಕ.\nC. ವಜ್ರ ಅತ್ಯಂತ ಗಟ್ಟಿಯಾದ ನೈಸರ್ಗಿಕ ವಸ್ತು.\nಮೇಲಿನ ಯಾವುವು ಸರಿ?", [["A only", "A ಮಾತ್ರ"], ["A and B only", "A ಮತ್ತು B ಮಾತ್ರ"], ["B and C only", "B ಮತ್ತು C ಮಾತ್ರ"], ["A, B and C", "A, B ಮತ್ತು C"]], 3, ["All three statements are correct.", "ಮೂರೂ ಹೇಳಿಕೆಗಳು ಸರಿ."]], ["General Science", "Which cell organelle is called the ‘powerhouse of the cell’?", "ಯಾವ ಜೀವಕೋಶ ಅಂಗಕವನ್ನು ‘ಕೋಶದ ವಿದ್ಯುತ್ ಕೇಂದ್ರ’ ಎನ್ನುತ್ತಾರೆ?", [["Ribosome", "ರೈಬೋಸೋಮ್"], ["Mitochondria", "ಮೈಟೊಕಾಂಡ್ರಿಯಾ"], ["Golgi body", "ಗಾಲ್ಗಿ ಕಾಯ"], ["Lysosome", "ಲೈಸೋಸೋಮ್"]], 1, ["Mitochondria produce most of the cell’s ATP.", "ಮೈಟೊಕಾಂಡ್ರಿಯಾ ಕೋಶದ ಹೆಚ್ಚಿನ ATP ಉತ್ಪಾದಿಸುತ್ತದೆ."]], ["General Science", "Deficiency of which vitamin leads to delayed blood clotting?", "ಯಾವ ಜೀವಸತ್ವದ ಕೊರತೆಯಿಂದ ರಕ್ತ ಹೆಪ್ಪುಗಟ್ಟುವುದು ತಡವಾಗುತ್ತದೆ?", [["Vitamin A", "ಜೀವಸತ್ವ A"], ["Vitamin C", "ಜೀವಸತ್ವ C"], ["Vitamin K", "ಜೀವಸತ್ವ K"], ["Vitamin D", "ಜೀವಸತ್ವ D"]], 2, ["Vitamin K is needed to make clotting factors.", "ರಕ್ತ ಹೆಪ್ಪುಗಟ್ಟುವ ಅಂಶಗಳ ತಯಾರಿಗೆ ಜೀವಸತ್ವ K ಬೇಕು."]], ["General Science", "Arrange the parts of the human alimentary canal in the order food passes through them:\nA. Stomach\nB. Small intestine\nC. Oesophagus\nD. Large intestine", "ಆಹಾರ ಹಾದುಹೋಗುವ ಕ್ರಮದಲ್ಲಿ ಮಾನವ ಜೀರ್ಣನಾಳದ ಭಾಗಗಳನ್ನು ಜೋಡಿಸಿ:\nA. ಜಠರ\nB. ಸಣ್ಣ ಕರುಳು\nC. ಅನ್ನನಾಳ\nD. ದೊಡ್ಡ ಕರುಳು", [["C, A, B, D", "C, A, B, D"], ["A, C, B, D", "A, C, B, D"], ["C, B, A, D", "C, B, A, D"], ["C, A, D, B", "C, A, D, B"]], 0, ["Oesophagus → stomach → small intestine → large intestine.", "ಅನ್ನನಾಳ → ಜಠರ → ಸಣ್ಣ ಕರುಳು → ದೊಡ್ಡ ಕರುಳು."]], ["General Science", "Match the diseases (List I) with their causative agents (List II):\nList I: A. Malaria  B. Tuberculosis  C. Polio  D. Ringworm\nList II: I. Fungus  II. Virus  III. Protozoan  IV. Bacterium", "ರೋಗಗಳನ್ನು (ಪಟ್ಟಿ I) ಕಾರಕ ಜೀವಿಗಳೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. ಮಲೇರಿಯಾ  B. ಕ್ಷಯ  C. ಪೋಲಿಯೋ  D. ಉರಿ ಹುಳುಕಡ್ಡಿ (ರಿಂಗ್‌ವರ್ಮ್)\nಪಟ್ಟಿ II: I. ಶಿಲೀಂಧ್ರ  II. ವೈರಸ್  III. ಏಕಕೋಶ ಪ್ರೊಟೊಜೋವಾ  IV. ಬ್ಯಾಕ್ಟೀರಿಯಾ", [["A–III, B–IV, C–II, D–I", "A–III, B–IV, C–II, D–I"], ["A–IV, B–III, C–II, D–I", "A–IV, B–III, C–II, D–I"], ["A–III, B–II, C–IV, D–I", "A–III, B–II, C–IV, D–I"], ["A–III, B–IV, C–I, D–II", "A–III, B–IV, C–I, D–II"]], 0, ["Malaria – Plasmodium (protozoan); TB – bacterium; polio – virus; ringworm – fungus.", "ಮಲೇರಿಯಾ – ಪ್ಲಾಸ್ಮೋಡಿಯಂ (ಪ್ರೊಟೊಜೋವಾ); ಕ್ಷಯ – ಬ್ಯಾಕ್ಟೀರಿಯಾ; ಪೋಲಿಯೋ – ವೈರಸ್; ರಿಂಗ್‌ವರ್ಮ್ – ಶಿಲೀಂಧ್ರ."]], ["General Science", "Consider the following about human blood:\nA. Mature red blood cells of mammals lack a nucleus.\nB. Haemoglobin carries oxygen.\nC. White blood cells help defend the body against infection.\nWhich of the above are correct?", "ಮಾನವ ರಕ್ತದ ಕುರಿತು:\nA. ಸಸ್ತನಿಗಳ ಪ್ರೌಢ ಕೆಂಪು ರಕ್ತಕಣಗಳಲ್ಲಿ ನ್ಯೂಕ್ಲಿಯಸ್ ಇರುವುದಿಲ್ಲ.\nB. ಹಿಮೋಗ್ಲೋಬಿನ್ ಆಮ್ಲಜನಕ ಸಾಗಿಸುತ್ತದೆ.\nC. ಬಿಳಿ ರಕ್ತಕಣಗಳು ಸೋಂಕಿನ ವಿರುದ್ಧ ದೇಹವನ್ನು ರಕ್ಷಿಸುತ್ತವೆ.\nಮೇಲಿನ ಯಾವುವು ಸರಿ?", [["A only", "A ಮಾತ್ರ"], ["A and B only", "A ಮತ್ತು B ಮಾತ್ರ"], ["B and C only", "B ಮತ್ತು C ಮಾತ್ರ"], ["A, B and C", "A, B ಮತ್ತು C"]], 3, ["All three are correct.", "ಮೂರೂ ಸರಿ."]], ["General Science", "Which gland secretes insulin?", "ಯಾವ ಗ್ರಂಥಿ ಇನ್ಸುಲಿನ್ ಸ್ರವಿಸುತ್ತದೆ?", [["Thyroid", "ಥೈರಾಯ್ಡ್"], ["Pancreas", "ಮೇದೋಜೀರಕ ಗ್ರಂಥಿ (ಪ್ಯಾಂಕ್ರಿಯಾಸ್)"], ["Adrenal", "ಅಡ್ರಿನಲ್"], ["Pituitary", "ಪಿಟ್ಯುಟರಿ"]], 1, ["Beta cells of the pancreatic islets secrete insulin.", "ಮೇದೋಜೀರಕ ಗ್ರಂಥಿಯ ಬೀಟಾ ಕೋಶಗಳು ಇನ್ಸುಲಿನ್ ಸ್ರವಿಸುತ್ತವೆ."]], ["Environment & Ecology", "Which group of substances is mainly responsible for depletion of the ozone layer?", "ಓಜೋನ್ ಪದರ ಕ್ಷೀಣಿಸಲು ಮುಖ್ಯ ಕಾರಣವಾದ ವಸ್ತುಗಳ ಗುಂಪು ಯಾವುದು?", [["Chlorofluorocarbons (CFCs)", "ಕ್ಲೋರೋಫ್ಲೋರೋಕಾರ್ಬನ್‌ಗಳು (CFC)"], ["Carbon monoxide", "ಕಾರ್ಬನ್ ಮಾನಾಕ್ಸೈಡ್"], ["Methane", "ಮೀಥೇನ್"], ["Argon", "ಆರ್ಗಾನ್"]], 0, ["CFCs release chlorine atoms in the stratosphere which destroy ozone.", "CFC ಗಳು ವಾಯುಮಂಡಲದಲ್ಲಿ ಕ್ಲೋರಿನ್ ಪರಮಾಣು ಬಿಡುಗಡೆ ಮಾಡಿ ಓಜೋನ್ ನಾಶಮಾಡುತ್ತವೆ."]], ["Environment & Ecology", "The Ramsar Convention (1971) is concerned with the conservation of", "ರಾಮ್ಸರ್ ಸಮಾವೇಶ (1971) ಯಾವುದರ ಸಂರಕ್ಷಣೆಗೆ ಸಂಬಂಧಿಸಿದೆ?", [["Wetlands", "ಜೌಗು ಪ್ರದೇಶಗಳು"], ["Tropical forests", "ಉಷ್ಣವಲಯದ ಕಾಡುಗಳು"], ["Coral reefs", "ಹವಳದ ದಿಬ್ಬಗಳು"], ["Deserts", "ಮರುಭೂಮಿಗಳು"]], 0, ["It is an intergovernmental treaty for the wise use of wetlands.", "ಇದು ಜೌಗು ಪ್ರದೇಶಗಳ ವಿವೇಕಯುತ ಬಳಕೆಗಾಗಿ ಇರುವ ಅಂತರ್ ಸರ್ಕಾರಿ ಒಪ್ಪಂದ."]], ["Environment & Ecology", "Which of the following is a renewable source of energy?", "ಕೆಳಗಿನವುಗಳಲ್ಲಿ ನವೀಕರಿಸಬಹುದಾದ ಇಂಧನ ಮೂಲ ಯಾವುದು?", [["Coal", "ಕಲ್ಲಿದ್ದಲು"], ["Petroleum", "ಪೆಟ್ರೋಲಿಯಂ"], ["Natural gas", "ನೈಸರ್ಗಿಕ ಅನಿಲ"], ["Solar energy", "ಸೌರಶಕ್ತಿ"]], 3, ["Solar energy is inexhaustible; the others are fossil fuels.", "ಸೌರಶಕ್ತಿ ಮುಗಿಯದ ಮೂಲ; ಉಳಿದವು ಪಳೆಯುಳಿಕೆ ಇಂಧನಗಳು."]], ["Environment & Ecology", "Assertion (A): Biodiversity hotspots need priority in conservation.\nReason (R): They have high endemism and are under severe threat of habitat loss.", "ಪ್ರತಿಪಾದನೆ (A): ಜೀವವೈವಿಧ್ಯ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳಿಗೆ ಸಂರಕ್ಷಣೆಯಲ್ಲಿ ಆದ್ಯತೆ ಬೇಕು.\nಕಾರಣ (R): ಅವುಗಳಲ್ಲಿ ಸ್ಥಳೀಯ ಜಾತಿಗಳು ಹೆಚ್ಚು ಮತ್ತು ಆವಾಸ ನಾಶದ ತೀವ್ರ ಅಪಾಯವಿದೆ.", [["Both (A) and (R) are true and (R) is the correct explanation of (A)", "(A) ಮತ್ತು (R) ಎರಡೂ ಸತ್ಯ ಮತ್ತು (R) ಯು (A) ಯ ಸರಿಯಾದ ವಿವರಣೆ"], ["Both (A) and (R) are true but (R) is not the correct explanation of (A)", "(A) ಮತ್ತು (R) ಎರಡೂ ಸತ್ಯ ಆದರೆ (R) ಯು (A) ಯ ಸರಿಯಾದ ವಿವರಣೆಯಲ್ಲ"], ["(A) is true but (R) is false", "(A) ಸತ್ಯ ಆದರೆ (R) ಸುಳ್ಳು"], ["(A) is false but (R) is true", "(A) ಸುಳ್ಳು ಆದರೆ (R) ಸತ್ಯ"]], 0, ["High endemism plus high threat is exactly why hotspots get conservation priority.", "ಹೆಚ್ಚು ಸ್ಥಳೀಯ ಜಾತಿಗಳು ಮತ್ತು ಹೆಚ್ಚು ಅಪಾಯ — ಇದೇ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳಿಗೆ ಆದ್ಯತೆಯ ಕಾರಣ."]], ["Environment & Ecology", "Consider the following statements:\nA. The Western Ghats and Sri Lanka form a biodiversity hotspot.\nB. India has four biodiversity hotspots.\nC. The Eastern Ghats are recognised as a biodiversity hotspot.\nWhich of the above are correct?", "ಈ ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ:\nA. ಪಶ್ಚಿಮ ಘಟ್ಟ ಮತ್ತು ಶ್ರೀಲಂಕಾ ಒಂದು ಜೀವವೈವಿಧ್ಯ ಹಾಟ್‌ಸ್ಪಾಟ್ ರೂಪಿಸುತ್ತವೆ.\nB. ಭಾರತದಲ್ಲಿ ನಾಲ್ಕು ಜೀವವೈವಿಧ್ಯ ಹಾಟ್‌ಸ್ಪಾಟ್‌ಗಳಿವೆ.\nC. ಪೂರ್ವ ಘಟ್ಟಗಳು ಜೀವವೈವಿಧ್ಯ ಹಾಟ್‌ಸ್ಪಾಟ್ ಎಂದು ಮಾನ್ಯತೆ ಪಡೆದಿವೆ.\nಮೇಲಿನ ಯಾವುವು ಸರಿ?", [["A only", "A ಮಾತ್ರ"], ["A and B only", "A ಮತ್ತು B ಮಾತ್ರ"], ["B and C only", "B ಮತ್ತು C ಮಾತ್ರ"], ["A, B and C", "A, B ಮತ್ತು C"]], 1, ["India’s four hotspots: Himalaya, Indo-Burma, Western Ghats–Sri Lanka and Sundaland (Nicobar). Eastern Ghats is not one.", "ಭಾರತದ ನಾಲ್ಕು ಹಾಟ್‌ಸ್ಪಾಟ್: ಹಿಮಾಲಯ, ಇಂಡೋ-ಬರ್ಮಾ, ಪಶ್ಚಿಮ ಘಟ್ಟ–ಶ್ರೀಲಂಕಾ, ಸುಂದಲ್ಯಾಂಡ್ (ನಿಕೋಬಾರ್). ಪೂರ್ವ ಘಟ್ಟ ಅಲ್ಲ."]], ["Environment & Ecology", "Match the protected areas (List I) with the States (List II):\nList I: A. Kaziranga  B. Gir  C. Periyar  D. Sundarbans\nList II: I. Kerala  II. Assam  III. West Bengal  IV. Gujarat", "ಸಂರಕ್ಷಿತ ಪ್ರದೇಶಗಳನ್ನು (ಪಟ್ಟಿ I) ರಾಜ್ಯಗಳೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. ಕಾಜಿರಂಗ  B. ಗಿರ್  C. ಪೆರಿಯಾರ್  D. ಸುಂದರಬನ\nಪಟ್ಟಿ II: I. ಕೇರಳ  II. ಅಸ್ಸಾಂ  III. ಪಶ್ಚಿಮ ಬಂಗಾಳ  IV. ಗುಜರಾತ್", [["A–II, B–IV, C–I, D–III", "A–II, B–IV, C–I, D–III"], ["A–IV, B–II, C–I, D–III", "A–IV, B–II, C–I, D–III"], ["A–II, B–I, C–IV, D–III", "A–II, B–I, C–IV, D–III"], ["A–II, B–IV, C–III, D–I", "A–II, B–IV, C–III, D–I"]], 0, ["Kaziranga – Assam; Gir – Gujarat; Periyar – Kerala; Sundarbans – West Bengal.", "ಕಾಜಿರಂಗ – ಅಸ್ಸಾಂ; ಗಿರ್ – ಗುಜರಾತ್; ಪೆರಿಯಾರ್ – ಕೇರಳ; ಸುಂದರಬನ – ಪಶ್ಚಿಮ ಬಂಗಾಳ."]], ["Environment & Ecology", "Arrange the following in the correct order of a food chain (producer to top consumer):\nA. Frog\nB. Grass\nC. Snake\nD. Grasshopper", "ಆಹಾರ ಸರಪಳಿಯ ಸರಿಯಾದ ಕ್ರಮದಲ್ಲಿ (ಉತ್ಪಾದಕದಿಂದ ಉನ್ನತ ಭಕ್ಷಕದವರೆಗೆ) ಜೋಡಿಸಿ:\nA. ಕಪ್ಪೆ\nB. ಹುಲ್ಲು\nC. ಹಾವು\nD. ಮಿಡತೆ", [["B, D, A, C", "B, D, A, C"], ["B, A, D, C", "B, A, D, C"], ["D, B, A, C", "D, B, A, C"], ["B, D, C, A", "B, D, C, A"]], 0, ["Grass → grasshopper → frog → snake.", "ಹುಲ್ಲು → ಮಿಡತೆ → ಕಪ್ಪೆ → ಹಾವು."]], ["Environment & Ecology", "The increase in concentration of toxic substances like DDT at successive trophic levels of a food chain is called", "ಆಹಾರ ಸರಪಳಿಯ ಒಂದೊಂದು ಪೋಷಣಾ ಹಂತದಲ್ಲಿ DDT ಯಂತಹ ವಿಷಕಾರಿ ವಸ್ತುಗಳ ಸಾಂದ್ರತೆ ಹೆಚ್ಚುವುದನ್ನು ಹೀಗೆನ್ನುತ್ತಾರೆ", [["Eutrophication", "ಯುಟ್ರೋಫಿಕೇಶನ್"], ["Biomagnification", "ಜೈವಿಕ ವರ್ಧನೆ (ಬಯೋಮ್ಯಾಗ್ನಿಫಿಕೇಶನ್)"], ["Bioremediation", "ಜೈವಿಕ ಪರಿಹಾರ"], ["Succession", "ಅನುಕ್ರಮಣ"]], 1, ["Non-degradable toxins accumulate and magnify up the food chain.", "ಕರಗದ ವಿಷ ವಸ್ತುಗಳು ಆಹಾರ ಸರಪಳಿಯಲ್ಲಿ ಮೇಲಕ್ಕೆ ಹೋದಂತೆ ಹೆಚ್ಚುತ್ತವೆ."]], ["Environment & Ecology", "Which of the following is NOT a biotic component of an ecosystem?", "ಕೆಳಗಿನವುಗಳಲ್ಲಿ ಪರಿಸರ ವ್ಯವಸ್ಥೆಯ ಜೈವಿಕ ಘಟಕವಲ್ಲದ್ದು ಯಾವುದು?", [["Bacteria", "ಬ್ಯಾಕ್ಟೀರಿಯಾ"], ["Fungi", "ಶಿಲೀಂಧ್ರ"], ["Sunlight", "ಸೂರ್ಯನ ಬೆಳಕು"], ["Green plants", "ಹಸಿರು ಸಸ್ಯಗಳು"]], 2, ["Sunlight is an abiotic factor.", "ಸೂರ್ಯನ ಬೆಳಕು ಅಜೈವಿಕ ಘಟಕ."]], ["Environment & Ecology", "Project Tiger was launched in India in the year", "ಭಾರತದಲ್ಲಿ ‘ಹುಲಿ ಯೋಜನೆ’ (ಪ್ರಾಜೆಕ್ಟ್ ಟೈಗರ್) ಆರಂಭವಾದ ವರ್ಷ", [["1963", "1963"], ["1973", "1973"], ["1983", "1983"], ["1992", "1992"]], 1, ["Project Tiger began on 1 April 1973 at Jim Corbett National Park.", "ಪ್ರಾಜೆಕ್ಟ್ ಟೈಗರ್ 1973 ಏಪ್ರಿಲ್ 1 ರಂದು ಜಿಮ್ ಕಾರ್ಬೆಟ್ ರಾಷ್ಟ್ರೀಯ ಉದ್ಯಾನದಿಂದ ಆರಂಭವಾಯಿತು."]], ["Environment & Ecology", "Consider the following about climate change:\nA. Carbon dioxide from human activities is the largest contributor to enhanced global warming.\nB. The Kyoto Protocol aims to reduce greenhouse gas emissions.\nC. The Paris Agreement aims to keep global warming well below 2°C.\nWhich of the above are correct?", "ಹವಾಮಾನ ಬದಲಾವಣೆಯ ಕುರಿತು:\nA. ಮಾನವ ಚಟುವಟಿಕೆಗಳ ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್ ಹೆಚ್ಚಿದ ಜಾಗತಿಕ ತಾಪಮಾನಕ್ಕೆ ಅತಿ ದೊಡ್ಡ ಕೊಡುಗೆ.\nB. ಕ್ಯೋಟೋ ಪ್ರೋಟೋಕಾಲ್ ಹಸಿರುಮನೆ ಅನಿಲ ಹೊರಸೂಸುವಿಕೆ ಕಡಿಮೆ ಮಾಡುವ ಗುರಿ ಹೊಂದಿದೆ.\nC. ಪ್ಯಾರಿಸ್ ಒಪ್ಪಂದ ಜಾಗತಿಕ ತಾಪಮಾನವನ್ನು 2°C ಗಿಂತ ಬಹಳ ಕಡಿಮೆ ಇಡುವ ಗುರಿ ಹೊಂದಿದೆ.\nಮೇಲಿನ ಯಾವುವು ಸರಿ?", [["A only", "A ಮಾತ್ರ"], ["A and B only", "A ಮತ್ತು B ಮಾತ್ರ"], ["B and C only", "B ಮತ್ತು C ಮಾತ್ರ"], ["A, B and C", "A, B ಮತ್ತು C"]], 3, ["All three statements are correct.", "ಮೂರೂ ಹೇಳಿಕೆಗಳು ಸರಿ."]], ["Environment & Ecology", "The Biological Diversity Act of India was enacted in the year", "ಭಾರತದ ಜೈವಿಕ ವೈವಿಧ್ಯತಾ ಕಾಯ್ದೆ ಜಾರಿಯಾದ ವರ್ಷ", [["1986", "1986"], ["1992", "1992"], ["2002", "2002"], ["2010", "2010"]], 2, ["The Biological Diversity Act, 2002 created the National Biodiversity Authority.", "ಜೈವಿಕ ವೈವಿಧ್ಯತಾ ಕಾಯ್ದೆ 2002 ರಾಷ್ಟ್ರೀಯ ಜೈವಿಕ ವೈವಿಧ್ಯತಾ ಪ್ರಾಧಿಕಾರವನ್ನು ರೂಪಿಸಿತು."]], ["Environment & Ecology", "Which of the following is a Tiger Reserve in Karnataka?", "ಕೆಳಗಿನವುಗಳಲ್ಲಿ ಕರ್ನಾಟಕದ ಹುಲಿ ಸಂರಕ್ಷಿತ ಪ್ರದೇಶ ಯಾವುದು?", [["Bannerghatta", "ಬನ್ನೇರುಘಟ್ಟ"], ["Daroji", "ದರೋಜಿ"], ["Bhadra", "ಭದ್ರಾ"], ["Kudremukh", "ಕುದುರೆಮುಖ"]], 2, ["Karnataka’s tiger reserves: Bandipur, Nagarahole, BRT, Bhadra and Dandeli-Anshi.", "ಕರ್ನಾಟಕದ ಹುಲಿ ಸಂರಕ್ಷಿತ ಪ್ರದೇಶಗಳು: ಬಂಡೀಪುರ, ನಾಗರಹೊಳೆ, ಬಿಆರ್‌ಟಿ, ಭದ್ರಾ, ದಾಂಡೇಲಿ-ಅಣಶಿ."]], ["Environment & Ecology", "The primary producers in an ecosystem are", "ಪರಿಸರ ವ್ಯವಸ್ಥೆಯ ಪ್ರಾಥಮಿಕ ಉತ್ಪಾದಕರು", [["Herbivores", "ಸಸ್ಯಾಹಾರಿಗಳು"], ["Green plants", "ಹಸಿರು ಸಸ್ಯಗಳು"], ["Carnivores", "ಮಾಂಸಾಹಾರಿಗಳು"], ["Decomposers", "ವಿಘಟಕಗಳು"]], 1, ["Green plants make food by photosynthesis.", "ಹಸಿರು ಸಸ್ಯಗಳು ದ್ಯುತಿಸಂಶ್ಲೇಷಣೆಯಿಂದ ಆಹಾರ ತಯಾರಿಸುತ್ತವೆ."]], ["Science & Technology", "The headquarters of ISRO is located at", "ಇಸ್ರೋದ ಪ್ರಧಾನ ಕಚೇರಿ ಇರುವುದು", [["Thiruvananthapuram", "ತಿರುವನಂತಪುರಂ"], ["Bengaluru", "ಬೆಂಗಳೂರು"], ["Sriharikota", "ಶ್ರೀಹರಿಕೋಟಾ"], ["Hyderabad", "ಹೈದರಾಬಾದ್"]], 1, ["ISRO is headquartered in Bengaluru; Sriharikota is the launch site.", "ಇಸ್ರೋ ಪ್ರಧಾನ ಕಚೇರಿ ಬೆಂಗಳೂರು; ಶ್ರೀಹರಿಕೋಟಾ ಉಡಾವಣಾ ಕೇಂದ್ರ."]], ["Science & Technology", "GPS stands for", "GPS ಎಂದರೆ", [["Global Positioning System", "ಗ್ಲೋಬಲ್ ಪೊಸಿಷನಿಂಗ್ ಸಿಸ್ಟಮ್"], ["General Positioning Signal", "ಜನರಲ್ ಪೊಸಿಷನಿಂಗ್ ಸಿಗ್ನಲ್"], ["Global Position Sensor", "ಗ್ಲೋಬಲ್ ಪೊಸಿಷನ್ ಸೆನ್ಸರ್"], ["Geo Positioning Service", "ಜಿಯೋ ಪೊಸಿಷನಿಂಗ್ ಸರ್ವಿಸ್"]], 0, ["GPS is a satellite-based navigation system.", "GPS ಉಪಗ್ರಹ ಆಧಾರಿತ ದಿಕ್ಸೂಚಿ ವ್ಯವಸ್ಥೆ."]], ["Science & Technology", "Match the missiles (List I) with their types (List II):\nList I: A. Akash  B. Prithvi  C. BrahMos  D. Nag\nList II: I. Anti-tank guided missile  II. Surface-to-air missile  III. Supersonic cruise missile  IV. Surface-to-surface missile", "ಕ್ಷಿಪಣಿಗಳನ್ನು (ಪಟ್ಟಿ I) ಪ್ರಕಾರಗಳೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. ಆಕಾಶ್  B. ಪೃಥ್ವಿ  C. ಬ್ರಹ್ಮೋಸ್  D. ನಾಗ್\nಪಟ್ಟಿ II: I. ಟ್ಯಾಂಕ್ ವಿರೋಧಿ ಕ್ಷಿಪಣಿ  II. ನೆಲದಿಂದ ಆಕಾಶಕ್ಕೆ ಕ್ಷಿಪಣಿ  III. ಸೂಪರ್‌ಸಾನಿಕ್ ಕ್ರೂಸ್ ಕ್ಷಿಪಣಿ  IV. ನೆಲದಿಂದ ನೆಲಕ್ಕೆ ಕ್ಷಿಪಣಿ", [["A–II, B–IV, C–III, D–I", "A–II, B–IV, C–III, D–I"], ["A–IV, B–II, C–III, D–I", "A–IV, B–II, C–III, D–I"], ["A–II, B–IV, C–I, D–III", "A–II, B–IV, C–I, D–III"], ["A–II, B–III, C–IV, D–I", "A–II, B–III, C–IV, D–I"]], 0, ["Akash – SAM; Prithvi – surface-to-surface; BrahMos – supersonic cruise; Nag – anti-tank.", "ಆಕಾಶ್ – ನೆಲದಿಂದ ಆಕಾಶಕ್ಕೆ; ಪೃಥ್ವಿ – ನೆಲದಿಂದ ನೆಲಕ್ಕೆ; ಬ್ರಹ್ಮೋಸ್ – ಸೂಪರ್‌ಸಾನಿಕ್ ಕ್ರೂಸ್; ನಾಗ್ – ಟ್ಯಾಂಕ್ ವಿರೋಧಿ."]], ["Science & Technology", "Consider the following:\nA. The World Wide Web was invented by Tim Berners-Lee.\nB. HTTP is a protocol used to transfer web pages.\nC. RAM is a volatile memory.\nWhich of the above are correct?", "ಈ ಕೆಳಗಿನವುಗಳನ್ನು ಪರಿಗಣಿಸಿ:\nA. ವರ್ಲ್ಡ್ ವೈಡ್ ವೆಬ್ ಅನ್ನು ಟಿಮ್ ಬರ್ನರ್ಸ್-ಲೀ ಆವಿಷ್ಕರಿಸಿದರು.\nB. HTTP ವೆಬ್ ಪುಟಗಳನ್ನು ವರ್ಗಾಯಿಸಲು ಬಳಸುವ ಪ್ರೋಟೋಕಾಲ್.\nC. RAM ಒಂದು ಅಸ್ಥಿರ (ವೊಲಟೈಲ್) ಮೆಮೊರಿ.\nಮೇಲಿನ ಯಾವುವು ಸರಿ?", [["A only", "A ಮಾತ್ರ"], ["A and B only", "A ಮತ್ತು B ಮಾತ್ರ"], ["B and C only", "B ಮತ್ತು C ಮಾತ್ರ"], ["A, B and C", "A, B ಮತ್ತು C"]], 3, ["All three are correct; RAM loses its data when power is off.", "ಮೂರೂ ಸರಿ; ವಿದ್ಯುತ್ ಹೋದರೆ RAM ದತ್ತಾಂಶ ಕಳೆದುಕೊಳ್ಳುತ್ತದೆ."]], ["Science & Technology", "India’s first satellite ‘Aryabhata’ was launched in the year", "ಭಾರತದ ಮೊದಲ ಉಪಗ್ರಹ ‘ಆರ್ಯಭಟ’ ಉಡಾವಣೆಯಾದ ವರ್ಷ", [["1965", "1965"], ["1975", "1975"], ["1980", "1980"], ["1984", "1984"]], 1, ["Aryabhata was launched on 19 April 1975.", "ಆರ್ಯಭಟ 1975 ಏಪ್ರಿಲ್ 19 ರಂದು ಉಡಾವಣೆಯಾಯಿತು."]], ["Science & Technology", "Assertion (A): Optical fibres are widely used in telecommunication.\nReason (R): They transmit light signals over long distances by total internal reflection.", "ಪ್ರತಿಪಾದನೆ (A): ದೂರಸಂಪರ್ಕದಲ್ಲಿ ಆಪ್ಟಿಕಲ್ ಫೈಬರ್‌ಗಳನ್ನು ವ್ಯಾಪಕವಾಗಿ ಬಳಸಲಾಗುತ್ತದೆ.\nಕಾರಣ (R): ಅವು ಪೂರ್ಣ ಆಂತರಿಕ ಪ್ರತಿಫಲನದಿಂದ ಬೆಳಕಿನ ಸಂಕೇತಗಳನ್ನು ದೂರದವರೆಗೆ ಸಾಗಿಸುತ್ತವೆ.", [["Both (A) and (R) are true and (R) is the correct explanation of (A)", "(A) ಮತ್ತು (R) ಎರಡೂ ಸತ್ಯ ಮತ್ತು (R) ಯು (A) ಯ ಸರಿಯಾದ ವಿವರಣೆ"], ["Both (A) and (R) are true but (R) is not the correct explanation of (A)", "(A) ಮತ್ತು (R) ಎರಡೂ ಸತ್ಯ ಆದರೆ (R) ಯು (A) ಯ ಸರಿಯಾದ ವಿವರಣೆಯಲ್ಲ"], ["(A) is true but (R) is false", "(A) ಸತ್ಯ ಆದರೆ (R) ಸುಳ್ಳು"], ["(A) is false but (R) is true", "(A) ಸುಳ್ಳು ಆದರೆ (R) ಸತ್ಯ"]], 0, ["Total internal reflection keeps light inside the fibre with little loss.", "ಪೂರ್ಣ ಆಂತರಿಕ ಪ್ರತಿಫಲನ ಬೆಳಕನ್ನು ಕಡಿಮೆ ನಷ್ಟದೊಂದಿಗೆ ಫೈಬರ್‌ನೊಳಗೇ ಇಡುತ್ತದೆ."]], ["Science & Technology", "How many bits are there in one byte?", "ಒಂದು ಬೈಟ್‌ನಲ್ಲಿ ಎಷ್ಟು ಬಿಟ್‌ಗಳಿವೆ?", [["4", "4"], ["8", "8"], ["16", "16"], ["32", "32"]], 1, ["1 byte = 8 bits.", "1 ಬೈಟ್ = 8 ಬಿಟ್‌ಗಳು."]], ["Science & Technology", "Which of the following is NOT an input device?", "ಕೆಳಗಿನವುಗಳಲ್ಲಿ ಇನ್‌ಪುಟ್ ಸಾಧನವಲ್ಲದ್ದು ಯಾವುದು?", [["Keyboard", "ಕೀಬೋರ್ಡ್"], ["Mouse", "ಮೌಸ್"], ["Scanner", "ಸ್ಕ್ಯಾನರ್"], ["Monitor", "ಮಾನಿಟರ್"]], 3, ["A monitor displays output; the others feed data into a computer.", "ಮಾನಿಟರ್ ಔಟ್‌ಪುಟ್ ತೋರಿಸುತ್ತದೆ; ಉಳಿದವು ದತ್ತಾಂಶ ಒದಗಿಸುತ್ತವೆ."]], ["Logical Reasoning", "Find the next number in the series: 2, 6, 12, 20, 30, ?", "ಮುಂದಿನ ಸಂಖ್ಯೆಯನ್ನು ಕಂಡುಹಿಡಿಯಿರಿ: 2, 6, 12, 20, 30, ?", [["40", "40"], ["42", "42"], ["44", "44"], ["36", "36"]], 1, ["Differences are 4, 6, 8, 10, so the next difference is 12: 30 + 12 = 42.", "ವ್ಯತ್ಯಾಸಗಳು 4, 6, 8, 10; ಮುಂದಿನದು 12: 30 + 12 = 42."]], ["Logical Reasoning", "Find the missing number: 3, 9, 27, 81, ?", "ಕಾಣೆಯಾದ ಸಂಖ್ಯೆ: 3, 9, 27, 81, ?", [["162", "162"], ["243", "243"], ["324", "324"], ["729", "729"]], 1, ["Each term is multiplied by 3: 81 × 3 = 243.", "ಪ್ರತಿ ಪದವನ್ನು 3 ರಿಂದ ಗುಣಿಸಲಾಗಿದೆ: 81 × 3 = 243."]], ["Logical Reasoning", "Find the odd one out: 8, 27, 64, 100, 125", "ಭಿನ್ನವಾದದ್ದನ್ನು ಗುರುತಿಸಿ: 8, 27, 64, 100, 125", [["8", "8"], ["64", "64"], ["100", "100"], ["125", "125"]], 2, ["All others are perfect cubes (2³, 3³, 4³, 5³); 100 is not.", "ಉಳಿದವು ಪೂರ್ಣ ಘನಗಳು (2³, 3³, 4³, 5³); 100 ಅಲ್ಲ."]], ["Logical Reasoning", "In a certain code, CAT is written as 24 and BAT as 23. How is DOG written in that code?", "ಒಂದು ಸಂಕೇತದಲ್ಲಿ CAT ಅನ್ನು 24 ಮತ್ತು BAT ಅನ್ನು 23 ಎಂದು ಬರೆಯಲಾಗಿದೆ. ಅದೇ ಸಂಕೇತದಲ್ಲಿ DOG ಅನ್ನು ಹೇಗೆ ಬರೆಯುತ್ತಾರೆ?", [["24", "24"], ["26", "26"], ["28", "28"], ["30", "30"]], 1, ["Letters are added by position: C+A+T = 3+1+20 = 24; D+O+G = 4+15+7 = 26.", "ಅಕ್ಷರ ಸ್ಥಾನಗಳ ಮೊತ್ತ: C+A+T = 3+1+20 = 24; D+O+G = 4+15+7 = 26."]], ["Logical Reasoning", "If MANGO is written as NBOHP in a code, how is APPLE written in that code?", "MANGO ಅನ್ನು NBOHP ಎಂದು ಸಂಕೇತದಲ್ಲಿ ಬರೆದರೆ APPLE ಅನ್ನು ಹೇಗೆ ಬರೆಯುತ್ತಾರೆ?", [["BQQMF", "BQQMF"], ["BPQMF", "BPQMF"], ["BQQLF", "BQQLF"], ["CQQMF", "CQQMF"]], 0, ["Each letter is shifted one place forward: A→B, P→Q, P→Q, L→M, E→F.", "ಪ್ರತಿ ಅಕ್ಷರ ಒಂದು ಸ್ಥಾನ ಮುಂದಕ್ಕೆ: A→B, P→Q, P→Q, L→M, E→F."]], ["Logical Reasoning", "Pointing to a photograph, Ravi says, “He is the son of my father’s only son.” How is the person in the photograph related to Ravi?", "ಭಾವಚಿತ್ರವನ್ನು ತೋರಿಸಿ ರವಿ ಹೇಳುತ್ತಾನೆ, “ಇವನು ನನ್ನ ತಂದೆಯ ಒಬ್ಬನೇ ಮಗನ ಮಗ.” ಭಾವಚಿತ್ರದಲ್ಲಿರುವವನು ರವಿಗೆ ಏನಾಗಬೇಕು?", [["Son", "ಮಗ"], ["Nephew", "ಸೋದರಳಿಯ"], ["Brother", "ಸಹೋದರ"], ["Father", "ತಂದೆ"]], 0, ["Father’s only son = Ravi himself, so the person is Ravi’s son.", "ತಂದೆಯ ಒಬ್ಬನೇ ಮಗ = ರವಿ; ಆದ್ದರಿಂದ ಅವನು ರವಿಯ ಮಗ."]], ["Logical Reasoning", "A is B’s sister, C is B’s mother, D is C’s father and E is D’s mother. How is A related to D?", "A, B ಯ ಸಹೋದರಿ; C, B ಯ ತಾಯಿ; D, C ಯ ತಂದೆ; E, D ಯ ತಾಯಿ. A ಯು D ಗೆ ಏನಾಗಬೇಕು?", [["Granddaughter", "ಮೊಮ್ಮಗಳು"], ["Daughter", "ಮಗಳು"], ["Grandmother", "ಅಜ್ಜಿ"], ["Niece", "ಸೋದರ ಸೊಸೆ"]], 0, ["D is C’s father and C is A’s mother, so A is D’s granddaughter.", "D, C ಯ ತಂದೆ; C, A ಯ ತಾಯಿ; ಆದ್ದರಿಂದ A, D ಯ ಮೊಮ್ಮಗಳು."]], ["Logical Reasoning", "Pointing to a lady, a man said, “Her mother is the only daughter of my mother.” How is the lady related to the man?", "ಒಬ್ಬ ಮಹಿಳೆಯನ್ನು ತೋರಿಸಿ ಪುರುಷ ಹೇಳಿದ, “ಅವಳ ತಾಯಿ ನನ್ನ ತಾಯಿಯ ಒಬ್ಬಳೇ ಮಗಳು.” ಆ ಮಹಿಳೆ ಪುರುಷನಿಗೆ ಏನಾಗಬೇಕು?", [["Niece", "ಸೋದರ ಸೊಸೆ (ಸಹೋದರಿಯ ಮಗಳು)"], ["Daughter", "ಮಗಳು"], ["Sister", "ಸಹೋದರಿ"], ["Aunt", "ಚಿಕ್ಕಮ್ಮ"]], 0, ["Only daughter of my mother = my sister; her daughter is my niece.", "ನನ್ನ ತಾಯಿಯ ಒಬ್ಬಳೇ ಮಗಳು = ನನ್ನ ಸಹೋದರಿ; ಅವಳ ಮಗಳು ನನ್ನ ಸೋದರ ಸೊಸೆ."]], ["Logical Reasoning", "Raju walks 5 km north, then turns right and walks 3 km, then turns right again and walks 5 km. How far and in which direction is he from his starting point?", "ರಾಜು 5 ಕಿ.ಮೀ. ಉತ್ತರಕ್ಕೆ ನಡೆದು, ಬಲಕ್ಕೆ ತಿರುಗಿ 3 ಕಿ.ಮೀ. ನಡೆದು, ಮತ್ತೆ ಬಲಕ್ಕೆ ತಿರುಗಿ 5 ಕಿ.ಮೀ. ನಡೆಯುತ್ತಾನೆ. ಆರಂಭದ ಸ್ಥಳದಿಂದ ಎಷ್ಟು ದೂರ, ಯಾವ ದಿಕ್ಕಿನಲ್ಲಿದ್ದಾನೆ?", [["3 km East", "3 ಕಿ.ಮೀ. ಪೂರ್ವ"], ["3 km West", "3 ಕಿ.ಮೀ. ಪಶ್ಚಿಮ"], ["5 km East", "5 ಕಿ.ಮೀ. ಪೂರ್ವ"], ["8 km North", "8 ಕಿ.ಮೀ. ಉತ್ತರ"]], 0, ["North 5, East 3, South 5 brings him 3 km east of the start.", "ಉತ್ತರ 5, ಪೂರ್ವ 3, ದಕ್ಷಿಣ 5 — ಆರಂಭದಿಂದ 3 ಕಿ.ಮೀ. ಪೂರ್ವದಲ್ಲಿ."]], ["Logical Reasoning", "A person faces north, turns 90° clockwise and then 180° anticlockwise. Which direction is he facing now?", "ಒಬ್ಬ ವ್ಯಕ್ತಿ ಉತ್ತರಕ್ಕೆ ಮುಖಮಾಡಿದ್ದಾನೆ; 90° ಪ್ರದಕ್ಷಿಣೆ ತಿರುಗಿ ನಂತರ 180° ಅಪ್ರದಕ್ಷಿಣೆ ತಿರುಗುತ್ತಾನೆ. ಈಗ ಅವನು ಯಾವ ದಿಕ್ಕಿಗೆ ಮುಖಮಾಡಿದ್ದಾನೆ?", [["North", "ಉತ್ತರ"], ["South", "ದಕ್ಷಿಣ"], ["East", "ಪೂರ್ವ"], ["West", "ಪಶ್ಚಿಮ"]], 3, ["North → East (90° clockwise) → West (180° anticlockwise).", "ಉತ್ತರ → ಪೂರ್ವ (90° ಪ್ರದಕ್ಷಿಣೆ) → ಪಶ್ಚಿಮ (180° ಅಪ್ರದಕ್ಷಿಣೆ)."]], ["Logical Reasoning", "Statements: All pens are books. All books are papers.\nConclusions:\nI. All pens are papers.\nII. Some papers are books.", "ಹೇಳಿಕೆಗಳು: ಎಲ್ಲ ಪೆನ್ನುಗಳು ಪುಸ್ತಕಗಳು. ಎಲ್ಲ ಪುಸ್ತಕಗಳು ಕಾಗದಗಳು.\nತೀರ್ಮಾನಗಳು:\nI. ಎಲ್ಲ ಪೆನ್ನುಗಳು ಕಾಗದಗಳು.\nII. ಕೆಲವು ಕಾಗದಗಳು ಪುಸ್ತಕಗಳು.", [["Only I follows", "I ಮಾತ್ರ ಅನುಸರಿಸುತ್ತದೆ"], ["Only II follows", "II ಮಾತ್ರ ಅನುಸರಿಸುತ್ತದೆ"], ["Both I and II follow", "I ಮತ್ತು II ಎರಡೂ ಅನುಸರಿಸುತ್ತವೆ"], ["Neither I nor II follows", "I ಅಥವಾ II ಯಾವುದೂ ಅನುಸರಿಸುವುದಿಲ್ಲ"]], 2, ["Pens ⊂ books ⊂ papers gives I; ‘all books are papers’ gives ‘some papers are books’ (II).", "ಪೆನ್ ⊂ ಪುಸ್ತಕ ⊂ ಕಾಗದ ಎಂದರೆ I ಸರಿ; ‘ಎಲ್ಲ ಪುಸ್ತಕ ಕಾಗದ’ ಎಂದರೆ ‘ಕೆಲವು ಕಾಗದ ಪುಸ್ತಕ’ (II)."]], ["Logical Reasoning", "Statements: All roses are flowers. Some flowers are red.\nConclusions:\nI. Some roses are red.\nII. Some red things are flowers.", "ಹೇಳಿಕೆಗಳು: ಎಲ್ಲ ಗುಲಾಬಿಗಳು ಹೂವುಗಳು. ಕೆಲವು ಹೂವುಗಳು ಕೆಂಪು.\nತೀರ್ಮಾನಗಳು:\nI. ಕೆಲವು ಗುಲಾಬಿಗಳು ಕೆಂಪು.\nII. ಕೆಲವು ಕೆಂಪು ವಸ್ತುಗಳು ಹೂವುಗಳು.", [["Only I follows", "I ಮಾತ್ರ ಅನುಸರಿಸುತ್ತದೆ"], ["Only II follows", "II ಮಾತ್ರ ಅನುಸರಿಸುತ್ತದೆ"], ["Both follow", "ಎರಡೂ ಅನುಸರಿಸುತ್ತವೆ"], ["Neither follows", "ಯಾವುದೂ ಅನುಸರಿಸುವುದಿಲ್ಲ"]], 1, ["‘Some flowers are red’ converts to ‘some red things are flowers’ (II); roses may or may not be red, so I does not follow.", "‘ಕೆಲವು ಹೂವುಗಳು ಕೆಂಪು’ ಎಂದರೆ ‘ಕೆಲವು ಕೆಂಪು ವಸ್ತುಗಳು ಹೂವುಗಳು’ (II); ಗುಲಾಬಿ ಕೆಂಪಾಗಿರಬಹುದು/ಇಲ್ಲದಿರಬಹುದು, ಆದ್ದರಿಂದ I ಅನುಸರಿಸದು."]], ["Logical Reasoning", "In a row of 40 students, Rama is 15th from the left. What is her position from the right end?", "40 ವಿದ್ಯಾರ್ಥಿಗಳ ಸಾಲಿನಲ್ಲಿ ರಾಮಾ ಎಡದಿಂದ 15ನೇಯವಳು. ಬಲ ತುದಿಯಿಂದ ಅವಳ ಸ್ಥಾನ ಯಾವುದು?", [["24th", "24th"], ["25th", "25th"], ["26th", "26th"], ["27th", "27th"]], 2, ["Position from right = 40 − 15 + 1 = 26.", "ಬಲದಿಂದ ಸ್ಥಾನ = 40 − 15 + 1 = 26."]], ["Logical Reasoning", "What is the angle between the hour hand and the minute hand of a clock at 3:00?", "ಗಡಿಯಾರದಲ್ಲಿ 3:00 ಗಂಟೆಗೆ ಗಂಟೆ ಮುಳ್ಳು ಮತ್ತು ನಿಮಿಷ ಮುಳ್ಳಿನ ನಡುವಿನ ಕೋನ ಎಷ್ಟು?", [["60°", "60°"], ["75°", "75°"], ["90°", "90°"], ["120°", "120°"]], 2, ["At 3:00 the hands are 3 hour-marks apart: 3 × 30° = 90°.", "3:00 ಕ್ಕೆ ಮುಳ್ಳುಗಳ ನಡುವೆ 3 ಗುರುತು: 3 × 30° = 90°."]], ["Logical Reasoning", "What is the angle between the hands of a clock at 4:20?", "ಗಡಿಯಾರದಲ್ಲಿ 4:20 ಕ್ಕೆ ಮುಳ್ಳುಗಳ ನಡುವಿನ ಕೋನ ಎಷ್ಟು?", [["0°", "0°"], ["10°", "10°"], ["20°", "20°"], ["30°", "30°"]], 1, ["Hour hand: 4×30 + 20×0.5 = 130°; minute hand: 20×6 = 120°; difference 10°.", "ಗಂಟೆ ಮುಳ್ಳು: 4×30 + 20×0.5 = 130°; ನಿಮಿಷ ಮುಳ್ಳು: 20×6 = 120°; ವ್ಯತ್ಯಾಸ 10°."]], ["Logical Reasoning", "If 1 January 2023 was a Sunday, which day was 1 January 2024?", "2023ರ ಜನವರಿ 1 ಭಾನುವಾರವಾಗಿದ್ದರೆ 2024ರ ಜನವರಿ 1 ಯಾವ ವಾರ?", [["Sunday", "ಭಾನುವಾರ"], ["Monday", "ಸೋಮವಾರ"], ["Tuesday", "ಮಂಗಳವಾರ"], ["Saturday", "ಶನಿವಾರ"]], 1, ["2023 is a non-leap year (365 days = 52 weeks + 1 day), so the day moves forward by one: Monday.", "2023 ಅಧಿಕ ವರ್ಷವಲ್ಲ (365 ದಿನ = 52 ವಾರ + 1 ದಿನ); ಒಂದು ದಿನ ಮುಂದೆ: ಸೋಮವಾರ."]], ["Logical Reasoning", "Five friends A, B, C, D and E sit in a row facing north. A is to the left of B but to the right of C. D is at the extreme right end and E sits between B and D. Who sits in the middle?", "ಐವರು ಸ್ನೇಹಿತರು A, B, C, D, E ಉತ್ತರಾಭಿಮುಖವಾಗಿ ಸಾಲಾಗಿ ಕುಳಿತಿದ್ದಾರೆ. A, B ಯ ಎಡಕ್ಕೆ ಆದರೆ C ಯ ಬಲಕ್ಕೆ ಇದ್ದಾನೆ. D ಬಲ ತುದಿಯಲ್ಲಿದ್ದಾನೆ ಮತ್ತು E, B ಮತ್ತು D ನಡುವೆ ಕುಳಿತಿದ್ದಾನೆ. ಮಧ್ಯದಲ್ಲಿ ಯಾರಿದ್ದಾರೆ?", [["A", "A"], ["B", "B"], ["C", "C"], ["E", "E"]], 1, ["Order left to right: C, A, B, E, D — B is in the middle.", "ಎಡದಿಂದ ಬಲಕ್ಕೆ: C, A, B, E, D — ಮಧ್ಯದಲ್ಲಿ B."]], ["Logical Reasoning", "A father is three times as old as his son. After 10 years he will be twice as old as his son. What is the son’s present age?", "ತಂದೆಯ ವಯಸ್ಸು ಮಗನ ವಯಸ್ಸಿನ ಮೂರು ಪಟ್ಟು. 10 ವರ್ಷಗಳ ನಂತರ ಅವನು ಮಗನ ವಯಸ್ಸಿನ ಎರಡು ಪಟ್ಟು ಆಗುತ್ತಾನೆ. ಮಗನ ಈಗಿನ ವಯಸ್ಸು ಎಷ್ಟು?", [["8 years", "8 years"], ["10 years", "10 years"], ["12 years", "12 years"], ["15 years", "15 years"]], 1, ["3S + 10 = 2(S + 10) gives S = 10.", "3S + 10 = 2(S + 10) ⇒ S = 10."]], ["Logical Reasoning", "Arrange the following in a meaningful order:\nA. Seed  B. Fruit  C. Flower  D. Plant", "ಅರ್ಥಪೂರ್ಣ ಕ್ರಮದಲ್ಲಿ ಜೋಡಿಸಿ:\nA. ಬೀಜ  B. ಹಣ್ಣು  C. ಹೂವು  D. ಸಸ್ಯ", [["A, D, C, B", "A, D, C, B"], ["A, C, D, B", "A, C, D, B"], ["D, A, C, B", "D, A, C, B"], ["A, D, B, C", "A, D, B, C"]], 0, ["Seed → plant → flower → fruit.", "ಬೀಜ → ಸಸ್ಯ → ಹೂವು → ಹಣ್ಣು."]], ["Logical Reasoning", "If + means ×, × means −, − means ÷ and ÷ means +, then find the value of 12 + 3 − 4 × 5 ÷ 2.", "+ ಎಂದರೆ ×, × ಎಂದರೆ −, − ಎಂದರೆ ÷ ಮತ್ತು ÷ ಎಂದರೆ + ಆದರೆ 12 + 3 − 4 × 5 ÷ 2 ರ ಬೆಲೆ ಕಂಡುಹಿಡಿಯಿರಿ.", [["4", "4"], ["6", "6"], ["8", "8"], ["10", "10"]], 1, ["Substituting: 12 × 3 ÷ 4 − 5 + 2 = 9 − 5 + 2 = 6.", "ಬದಲಿಸಿದಾಗ: 12 × 3 ÷ 4 − 5 + 2 = 9 − 5 + 2 = 6."]], ["Logical Reasoning", "Find the next letter in the series: A, C, F, J, O, ?", "ಮುಂದಿನ ಅಕ್ಷರ ಕಂಡುಹಿಡಿಯಿರಿ: A, C, F, J, O, ?", [["T", "T"], ["U", "U"], ["V", "V"], ["S", "S"]], 1, ["Position jumps are +2, +3, +4, +5, so next is +6: O(15) + 6 = U(21).", "ಜಿಗಿತ +2, +3, +4, +5; ಮುಂದಿನದು +6: O(15) + 6 = U(21)."]], ["Logical Reasoning", "Find the missing number: 4 : 64 :: 5 : ?", "ಕಾಣೆಯಾದ ಸಂಖ್ಯೆ: 4 : 64 :: 5 : ?", [["25", "25"], ["100", "100"], ["125", "125"], ["150", "150"]], 2, ["The relation is the cube: 4³ = 64, so 5³ = 125.", "ಸಂಬಂಧ ಘನ: 4³ = 64; ಆದ್ದರಿಂದ 5³ = 125."]], ["Logical Reasoning", "In a certain code, ‘3 4 5’ means ‘sun is bright’, ‘5 6 7’ means ‘bright light only’ and ‘3 8 9’ means ‘sun shines daily’. Which number stands for ‘sun’?", "ಒಂದು ಸಂಕೇತದಲ್ಲಿ ‘3 4 5’ ಎಂದರೆ ‘sun is bright’, ‘5 6 7’ ಎಂದರೆ ‘bright light only’, ‘3 8 9’ ಎಂದರೆ ‘sun shines daily’. ‘sun’ ಗೆ ಯಾವ ಸಂಖ್ಯೆ?", [["3", "3"], ["4", "4"], ["5", "5"], ["8", "8"]], 0, ["‘Sun’ is the only word common to the 1st and 3rd codes, and 3 is the only common number.", "‘sun’ 1ನೇ ಮತ್ತು 3ನೇ ಸಂಕೇತಗಳಲ್ಲಿ ಇರುವ ಏಕೈಕ ಪದ; ಸಾಮಾನ್ಯ ಸಂಖ್ಯೆ 3."]], ["Logical Reasoning", "Find the next number: 1, 4, 9, 16, 25, ?", "ಮುಂದಿನ ಸಂಖ್ಯೆ: 1, 4, 9, 16, 25, ?", [["30", "30"], ["36", "36"], ["49", "49"], ["35", "35"]], 1, ["These are squares of 1, 2, 3, 4, 5; the next is 6² = 36.", "ಇವು 1, 2, 3, 4, 5 ರ ವರ್ಗಗಳು; ಮುಂದಿನದು 6² = 36."]], ["Logical Reasoning", "A is taller than B; C is shorter than B; D is taller than A. Who is the shortest?", "A, B ಗಿಂತ ಎತ್ತರ; C, B ಗಿಂತ ಕುಳ್ಳ; D, A ಗಿಂತ ಎತ್ತರ. ಅತಿ ಕುಳ್ಳ ಯಾರು?", [["A", "A"], ["B", "B"], ["C", "C"], ["D", "D"]], 2, ["Order of height: D > A > B > C, so C is the shortest.", "ಎತ್ತರದ ಕ್ರಮ: D > A > B > C; ಅತಿ ಕುಳ್ಳ C."]], ["Quantitative Aptitude", "What is 15% of 240?", "240 ರ ಶೇ. 15 ಎಷ್ಟು?", [["30", "30"], ["32", "32"], ["36", "36"], ["40", "40"]], 2, ["240 × 15/100 = 36.", "240 × 15/100 = 36."]], ["Quantitative Aptitude", "The average of 12, 15, 18, 21 and 24 is", "12, 15, 18, 21 ಮತ್ತು 24 ರ ಸರಾಸರಿ", [["16", "16"], ["17", "17"], ["18", "18"], ["19", "19"]], 2, ["Sum 90 ÷ 5 = 18.", "ಮೊತ್ತ 90 ÷ 5 = 18."]], ["Quantitative Aptitude", "A trader buys an article for ₹400 and sells it for ₹500. What is the profit percentage?", "ವ್ಯಾಪಾರಿ ₹400 ಕ್ಕೆ ಒಂದು ವಸ್ತು ಖರೀದಿಸಿ ₹500 ಕ್ಕೆ ಮಾರುತ್ತಾನೆ. ಲಾಭ ಶೇಕಡಾ ಎಷ್ಟು?", [["20%", "ಶೇ. 20"], ["25%", "ಶೇ. 25"], ["30%", "ಶೇ. 30"], ["40%", "ಶೇ. 40"]], 1, ["Profit 100/400 × 100 = 25%.", "ಲಾಭ 100/400 × 100 = ಶೇ. 25."]], ["Quantitative Aptitude", "The simple interest on ₹5,000 at 8% per annum for 3 years is", "₹5,000 ಕ್ಕೆ ವಾರ್ಷಿಕ ಶೇ. 8 ದರದಲ್ಲಿ 3 ವರ್ಷಗಳ ಸರಳ ಬಡ್ಡಿ", [["₹1,000", "₹1,000"], ["₹1,200", "₹1,200"], ["₹1,400", "₹1,400"], ["₹1,600", "₹1,600"]], 1, ["SI = PRT/100 = 5000 × 8 × 3 / 100 = ₹1,200.", "SI = PRT/100 = 5000 × 8 × 3 / 100 = ₹1,200."]], ["Quantitative Aptitude", "The compound interest on ₹10,000 at 10% per annum for 2 years is", "₹10,000 ಕ್ಕೆ ವಾರ್ಷಿಕ ಶೇ. 10 ದರದಲ್ಲಿ 2 ವರ್ಷಗಳ ಚಕ್ರಬಡ್ಡಿ", [["₹2,000", "₹2,000"], ["₹2,100", "₹2,100"], ["₹2,200", "₹2,200"], ["₹2,400", "₹2,400"]], 1, ["Amount = 10000 × 1.1² = 12,100; CI = ₹2,100.", "ಮೊತ್ತ = 10000 × 1.1² = 12,100; ಚಕ್ರಬಡ್ಡಿ = ₹2,100."]], ["Quantitative Aptitude", "A 120 m long train crosses a pole in 6 seconds. Its speed is", "120 ಮೀ. ಉದ್ದದ ರೈಲು ಒಂದು ಕಂಬವನ್ನು 6 ಸೆಕೆಂಡಿನಲ್ಲಿ ದಾಟುತ್ತದೆ. ಅದರ ವೇಗ", [["60 km/h", "60 ಕಿ.ಮೀ./ಗಂ"], ["72 km/h", "72 ಕಿ.ಮೀ./ಗಂ"], ["80 km/h", "80 ಕಿ.ಮೀ./ಗಂ"], ["90 km/h", "90 ಕಿ.ಮೀ./ಗಂ"]], 1, ["Speed = 120/6 = 20 m/s = 20 × 18/5 = 72 km/h.", "ವೇಗ = 120/6 = 20 ಮೀ./ಸೆ = 20 × 18/5 = 72 ಕಿ.ಮೀ./ಗಂ."]], ["Quantitative Aptitude", "A can do a piece of work in 12 days and B in 18 days. Working together, they will finish it in", "A ಒಂದು ಕೆಲಸವನ್ನು 12 ದಿನಗಳಲ್ಲಿ ಮತ್ತು B 18 ದಿನಗಳಲ್ಲಿ ಮಾಡಬಲ್ಲರು. ಒಟ್ಟಿಗೆ ಕೆಲಸ ಮಾಡಿದರೆ ಎಷ್ಟು ದಿನಗಳಲ್ಲಿ ಮುಗಿಸುತ್ತಾರೆ?", [["6 days", "6 ದಿನ"], ["7.2 days", "7.2 ದಿನ"], ["8 days", "8 ದಿನ"], ["9 days", "9 ದಿನ"]], 1, ["Time = (12 × 18)/(12 + 18) = 216/30 = 7.2 days.", "ಸಮಯ = (12 × 18)/(12 + 18) = 216/30 = 7.2 ದಿನ."]], ["Quantitative Aptitude", "Two numbers are in the ratio 3 : 5 and their sum is 64. The larger number is", "ಎರಡು ಸಂಖ್ಯೆಗಳ ಅನುಪಾತ 3 : 5 ಮತ್ತು ಅವುಗಳ ಮೊತ್ತ 64. ದೊಡ್ಡ ಸಂಖ್ಯೆ", [["24", "24"], ["32", "32"], ["40", "40"], ["45", "45"]], 2, ["Larger = 5/8 × 64 = 40.", "ದೊಡ್ಡದು = 5/8 × 64 = 40."]], ["Quantitative Aptitude", "The LCM of 12, 18 and 24 is", "12, 18 ಮತ್ತು 24 ರ ಲ.ಸಾ.ಅ. (LCM)", [["48", "48"], ["72", "72"], ["96", "96"], ["144", "144"]], 1, ["12 = 2²·3, 18 = 2·3², 24 = 2³·3; LCM = 2³·3² = 72.", "12 = 2²·3, 18 = 2·3², 24 = 2³·3; LCM = 2³·3² = 72."]], ["Quantitative Aptitude", "The HCF of 36 and 48 is", "36 ಮತ್ತು 48 ರ ಮ.ಸಾ.ಅ. (HCF)", [["6", "6"], ["8", "8"], ["12", "12"], ["16", "16"]], 2, ["Common factors give 2² × 3 = 12.", "ಸಾಮಾನ್ಯ ಅಪವರ್ತನಗಳು 2² × 3 = 12."]], ["Quantitative Aptitude", "Pipe A can fill a tank in 10 hours and pipe B can empty it in 15 hours. If both are opened together, the tank will be filled in", "ನಲ್ಲಿ A ಟ್ಯಾಂಕ್ ಅನ್ನು 10 ಗಂಟೆಗಳಲ್ಲಿ ತುಂಬಬಲ್ಲದು ಮತ್ತು ನಲ್ಲಿ B ಅದನ್ನು 15 ಗಂಟೆಗಳಲ್ಲಿ ಖಾಲಿ ಮಾಡಬಲ್ಲದು. ಎರಡನ್ನೂ ಒಟ್ಟಿಗೆ ತೆರೆದರೆ ಟ್ಯಾಂಕ್ ತುಂಬಲು ಬೇಕಾದ ಸಮಯ", [["25 hours", "25 ಗಂಟೆ"], ["30 hours", "30 ಗಂಟೆ"], ["35 hours", "35 ಗಂಟೆ"], ["50 hours", "50 ಗಂಟೆ"]], 1, ["Net rate = 1/10 − 1/15 = 1/30 per hour, so 30 hours.", "ನಿವ್ವಳ ದರ = 1/10 − 1/15 = ಗಂಟೆಗೆ 1/30; ಅಂದರೆ 30 ಗಂಟೆ."]], ["Quantitative Aptitude", "The area of a circle of radius 7 cm is (take π = 22/7)", "7 ಸೆಂ.ಮೀ. ತ್ರಿಜ್ಯದ ವೃತ್ತದ ವಿಸ್ತೀರ್ಣ (π = 22/7 ತೆಗೆದುಕೊಳ್ಳಿ)", [["144 cm²", "144 ಸೆಂ.ಮೀ.²"], ["154 cm²", "154 ಸೆಂ.ಮೀ.²"], ["164 cm²", "164 ಸೆಂ.ಮೀ.²"], ["44 cm²", "44 ಸೆಂ.ಮೀ.²"]], 1, ["Area = πr² = 22/7 × 49 = 154 cm².", "ವಿಸ್ತೀರ್ಣ = πr² = 22/7 × 49 = 154 ಸೆಂ.ಮೀ.²"]], ["Quantitative Aptitude", "A boat goes 45 km downstream. Its speed in still water is 12 km/h and the speed of the stream is 3 km/h. How long does it take?", "ಒಂದು ದೋಣಿ ಪ್ರವಾಹದ ದಿಕ್ಕಿನಲ್ಲಿ 45 ಕಿ.ಮೀ. ಹೋಗುತ್ತದೆ. ಸ್ತಬ್ಧ ನೀರಿನಲ್ಲಿ ಅದರ ವೇಗ 12 ಕಿ.ಮೀ./ಗಂ ಮತ್ತು ಪ್ರವಾಹದ ವೇಗ 3 ಕಿ.ಮೀ./ಗಂ. ಎಷ್ಟು ಸಮಯ ಬೇಕು?", [["2 hours", "2 ಗಂಟೆ"], ["3 hours", "3 ಗಂಟೆ"], ["4 hours", "4 ಗಂಟೆ"], ["5 hours", "5 ಗಂಟೆ"]], 1, ["Downstream speed = 12 + 3 = 15 km/h; time = 45/15 = 3 hours.", "ಪ್ರವಾಹ ದಿಕ್ಕಿನ ವೇಗ = 12 + 3 = 15 ಕಿ.ಮೀ./ಗಂ; ಸಮಯ = 45/15 = 3 ಗಂಟೆ."]], ["Quantitative Aptitude", "A fair die is rolled once. What is the probability of getting a prime number?", "ಒಂದು ನ್ಯಾಯಯುತ ದಾಳವನ್ನು ಒಮ್ಮೆ ಉರುಳಿಸಲಾಗುತ್ತದೆ. ಅವಿಭಾಜ್ಯ ಸಂಖ್ಯೆ ಬೀಳುವ ಸಂಭವನೀಯತೆ ಎಷ್ಟು?", [["1/3", "1/3"], ["1/2", "1/2"], ["2/3", "2/3"], ["1/6", "1/6"]], 1, ["Primes 2, 3, 5 give 3/6 = 1/2.", "ಅವಿಭಾಜ್ಯ 2, 3, 5 ⇒ 3/6 = 1/2."]], ["Quantitative Aptitude", "In how many ways can the letters of the word ‘BOOK’ be arranged?", "‘BOOK’ ಪದದ ಅಕ್ಷರಗಳನ್ನು ಎಷ್ಟು ವಿಧಗಳಲ್ಲಿ ಜೋಡಿಸಬಹುದು?", [["6", "6"], ["12", "12"], ["24", "24"], ["8", "8"]], 1, ["4!/2! = 12 because the letter O repeats twice.", "O ಅಕ್ಷರ ಎರಡು ಬಾರಿ ಇರುವುದರಿಂದ 4!/2! = 12."]], ["Quantitative Aptitude", "A price is increased by 20% and then decreased by 20%. The net change is", "ಒಂದು ಬೆಲೆಯನ್ನು ಶೇ. 20 ಹೆಚ್ಚಿಸಿ ನಂತರ ಶೇ. 20 ಕಡಿಮೆ ಮಾಡಲಾಗಿದೆ. ನಿವ್ವಳ ಬದಲಾವಣೆ", [["No change", "ಬದಲಾವಣೆ ಇಲ್ಲ"], ["4% decrease", "ಶೇ. 4 ಇಳಿಕೆ"], ["4% increase", "ಶೇ. 4 ಏರಿಕೆ"], ["2% decrease", "ಶೇ. 2 ಇಳಿಕೆ"]], 1, ["100 → 120 → 96, a 4% fall.", "100 → 120 → 96; ಶೇ. 4 ಇಳಿಕೆ."]], ["Quantitative Aptitude", "The sum of the first 20 natural numbers is", "ಮೊದಲ 20 ನೈಸರ್ಗಿಕ ಸಂಖ್ಯೆಗಳ ಮೊತ್ತ", [["190", "190"], ["200", "200"], ["210", "210"], ["220", "220"]], 2, ["n(n + 1)/2 = 20 × 21/2 = 210.", "n(n + 1)/2 = 20 × 21/2 = 210."]], ["Quantitative Aptitude", "The average of 7 numbers is 15. If one number, 21, is removed, the average of the remaining numbers is", "7 ಸಂಖ್ಯೆಗಳ ಸರಾಸರಿ 15. ಒಂದು ಸಂಖ್ಯೆ 21 ಅನ್ನು ತೆಗೆದರೆ ಉಳಿದ ಸಂಖ್ಯೆಗಳ ಸರಾಸರಿ", [["13", "13"], ["14", "14"], ["15", "15"], ["16", "16"]], 1, ["Total 105 − 21 = 84; 84/6 = 14.", "ಒಟ್ಟು 105 − 21 = 84; 84/6 = 14."]], ["Quantitative Aptitude", "In a right-angled triangle the two sides containing the right angle are 6 cm and 8 cm. The hypotenuse is", "ಲಂಬಕೋನ ತ್ರಿಭುಜದಲ್ಲಿ ಲಂಬಕೋನ ರೂಪಿಸುವ ಎರಡು ಬದಿಗಳು 6 ಸೆಂ.ಮೀ. ಮತ್ತು 8 ಸೆಂ.ಮೀ. ಕರ್ಣದ ಉದ್ದ", [["9 cm", "9 ಸೆಂ.ಮೀ."], ["10 cm", "10 ಸೆಂ.ಮೀ."], ["12 cm", "12 ಸೆಂ.ಮೀ."], ["14 cm", "14 ಸೆಂ.ಮೀ."]], 1, ["√(6² + 8²) = √100 = 10 cm.", "√(6² + 8²) = √100 = 10 ಸೆಂ.ಮೀ."]], ["Quantitative Aptitude", "The smallest prime number greater than 50 is", "50 ಕ್ಕಿಂತ ದೊಡ್ಡದಾದ ಚಿಕ್ಕ ಅವಿಭಾಜ್ಯ ಸಂಖ್ಯೆ", [["51", "51"], ["53", "53"], ["55", "55"], ["57", "57"]], 1, ["51 = 3 × 17; 53 has no divisors other than 1 and itself.", "51 = 3 × 17; 53 ಕ್ಕೆ 1 ಮತ್ತು ಅದನ್ನು ಬಿಟ್ಟು ಬೇರೆ ಭಾಜಕಗಳಿಲ್ಲ."]], ["Quantitative Aptitude", "54 km/h is equal to how many metres per second?", "54 ಕಿ.ಮೀ./ಗಂ ಎಂದರೆ ಸೆಕೆಂಡಿಗೆ ಎಷ್ಟು ಮೀಟರ್?", [["10 m/s", "10 ಮೀ./ಸೆ"], ["12 m/s", "12 ಮೀ./ಸೆ"], ["15 m/s", "15 ಮೀ./ಸೆ"], ["18 m/s", "18 ಮೀ./ಸೆ"]], 2, ["54 × 5/18 = 15 m/s.", "54 × 5/18 = 15 ಮೀ./ಸೆ."]], ["Quantitative Aptitude", "The value of 25² − 15² is", "25² − 15² ರ ಬೆಲೆ", [["100", "100"], ["300", "300"], ["400", "400"], ["500", "500"]], 2, ["(25 + 15)(25 − 15) = 40 × 10 = 400.", "(25 + 15)(25 − 15) = 40 × 10 = 400."]], ["Quantitative Aptitude", "If x + 1/x = 3, then x² + 1/x² equals", "x + 1/x = 3 ಆದರೆ x² + 1/x² ಬೆಲೆ", [["5", "5"], ["7", "7"], ["9", "9"], ["11", "11"]], 1, ["(x + 1/x)² − 2 = 9 − 2 = 7.", "(x + 1/x)² − 2 = 9 − 2 = 7."]], ["Quantitative Aptitude", "A can complete a work in 10 days. After A works for 4 days, what fraction of the work is left?", "A ಒಂದು ಕೆಲಸವನ್ನು 10 ದಿನಗಳಲ್ಲಿ ಮುಗಿಸಬಲ್ಲ. A 4 ದಿನ ಕೆಲಸ ಮಾಡಿದ ನಂತರ ಕೆಲಸದ ಎಷ್ಟು ಭಾಗ ಉಳಿದಿದೆ?", [["2/5", "2/5"], ["3/5", "3/5"], ["1/2", "1/2"], ["7/10", "7/10"]], 1, ["Done = 4/10; left = 6/10 = 3/5.", "ಮುಗಿದದ್ದು = 4/10; ಉಳಿದದ್ದು = 6/10 = 3/5."]], ["Data Interpretation", "Annual sales of a company (₹ lakh): 2019 – 40; 2020 – 50; 2021 – 45; 2022 – 60.\nWhat is the percentage increase in sales from 2021 to 2022?", "ಒಂದು ಕಂಪನಿಯ ವಾರ್ಷಿಕ ಮಾರಾಟ (₹ ಲಕ್ಷ): 2019 – 40; 2020 – 50; 2021 – 45; 2022 – 60.\n2021 ರಿಂದ 2022 ಕ್ಕೆ ಮಾರಾಟದ ಶೇಕಡಾ ಹೆಚ್ಚಳ ಎಷ್ಟು?", [["25%", "ಶೇ. 25"], ["30%", "ಶೇ. 30"], ["33.33%", "ಶೇ. 33.33"], ["40%", "ಶೇ. 40"]], 2, ["(60 − 45)/45 × 100 = 33.33%.", "(60 − 45)/45 × 100 = ಶೇ. 33.33."]], ["Data Interpretation", "Annual sales of a company (₹ lakh): 2019 – 40; 2020 – 50; 2021 – 45; 2022 – 60.\nWhat is the average annual sales over the four years?", "ಒಂದು ಕಂಪನಿಯ ವಾರ್ಷಿಕ ಮಾರಾಟ (₹ ಲಕ್ಷ): 2019 – 40; 2020 – 50; 2021 – 45; 2022 – 60.\nನಾಲ್ಕು ವರ್ಷಗಳ ಸರಾಸರಿ ವಾರ್ಷಿಕ ಮಾರಾಟ ಎಷ್ಟು?", [["₹45 lakh", "₹45 ಲಕ್ಷ"], ["₹47.5 lakh", "₹47.5 ಲಕ್ಷ"], ["₹48.75 lakh", "₹48.75 ಲಕ್ಷ"], ["₹50 lakh", "₹50 ಲಕ್ಷ"]], 2, ["(40 + 50 + 45 + 60)/4 = 195/4 = 48.75.", "(40 + 50 + 45 + 60)/4 = 195/4 = 48.75."]], ["Data Interpretation", "Annual sales of a company (₹ lakh): 2019 – 40; 2020 – 50; 2021 – 45; 2022 – 60.\nIn which year was the percentage growth over the previous year the highest?", "ಒಂದು ಕಂಪನಿಯ ವಾರ್ಷಿಕ ಮಾರಾಟ (₹ ಲಕ್ಷ): 2019 – 40; 2020 – 50; 2021 – 45; 2022 – 60.\nಯಾವ ವರ್ಷ ಹಿಂದಿನ ವರ್ಷಕ್ಕಿಂತ ಶೇಕಡಾ ಬೆಳವಣಿಗೆ ಅತಿ ಹೆಚ್ಚು?", [["2019", "2019"], ["2020", "2020"], ["2021", "2021"], ["2022", "2022"]], 3, ["2020: 25%; 2021: −10%; 2022: 33.33% — highest in 2022.", "2020: ಶೇ. 25; 2021: −ಶೇ. 10; 2022: ಶೇ. 33.33 — 2022 ರಲ್ಲಿ ಅತ್ಯಧಿಕ."]], ["Data Interpretation", "Annual sales of a company (₹ lakh): 2019 – 40; 2020 – 50; 2021 – 45; 2022 – 60.\nWhat is the ratio of sales in 2020 to sales in 2022?", "ಒಂದು ಕಂಪನಿಯ ವಾರ್ಷಿಕ ಮಾರಾಟ (₹ ಲಕ್ಷ): 2019 – 40; 2020 – 50; 2021 – 45; 2022 – 60.\n2020 ರ ಮಾರಾಟ ಮತ್ತು 2022 ರ ಮಾರಾಟದ ಅನುಪಾತ ಎಷ್ಟು?", [["4 : 5", "4 : 5"], ["5 : 6", "5 : 6"], ["6 : 5", "6 : 5"], ["3 : 4", "3 : 4"]], 1, ["50 : 60 = 5 : 6.", "50 : 60 = 5 : 6."]], ["Comprehension", "What is the central idea of the passage?", "ಈ ಗದ್ಯಭಾಗದ ಕೇಂದ್ರ ಆಶಯ ಏನು?", [["Forests are valuable but are being destroyed by human activities", "ಕಾಡುಗಳು ಮೌಲ್ಯಯುತ ಆದರೆ ಮಾನವ ಚಟುವಟಿಕೆಗಳಿಂದ ನಾಶವಾಗುತ್ತಿವೆ"], ["Urbanisation always benefits communities", "ನಗರೀಕರಣ ಯಾವಾಗಲೂ ಸಮುದಾಯಗಳಿಗೆ ಲಾಭ"], ["Mining is the best use of forest land", "ಅರಣ್ಯ ಭೂಮಿಯ ಉತ್ತಮ ಬಳಕೆ ಗಣಿಗಾರಿಕೆ"], ["Rainfall is unrelated to forests", "ಮಳೆಗೂ ಕಾಡಿಗೂ ಸಂಬಂಧವಿಲ್ಲ"]], 0, ["The passage praises forests’ functions and warns about deforestation.", "ಗದ್ಯಭಾಗ ಕಾಡುಗಳ ಕಾರ್ಯಗಳನ್ನು ಹೊಗಳಿ ಅರಣ್ಯ ನಾಶದ ಬಗ್ಗೆ ಎಚ್ಚರಿಸುತ್ತದೆ."], ["Forests act as the lungs of the planet. They absorb carbon dioxide, release oxygen, regulate rainfall and prevent soil erosion. However, rapid urbanisation and mining have led to large-scale deforestation, threatening biodiversity and the livelihoods of forest-dwelling communities.", "ಕಾಡುಗಳು ಭೂಮಿಯ ಶ್ವಾಸಕೋಶಗಳಂತೆ ಕೆಲಸ ಮಾಡುತ್ತವೆ. ಅವು ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್ ಹೀರಿ ಆಮ್ಲಜನಕ ಬಿಡುಗಡೆ ಮಾಡುತ್ತವೆ, ಮಳೆಯನ್ನು ನಿಯಂತ್ರಿಸುತ್ತವೆ ಮತ್ತು ಮಣ್ಣಿನ ಸವೆತ ತಡೆಯುತ್ತವೆ. ಆದರೆ ತ್ವರಿತ ನಗರೀಕರಣ ಮತ್ತು ಗಣಿಗಾರಿಕೆಯಿಂದ ದೊಡ್ಡ ಪ್ರಮಾಣದ ಅರಣ್ಯ ನಾಶವಾಗಿ ಜೀವವೈವಿಧ್ಯ ಮತ್ತು ಅರಣ್ಯವಾಸಿ ಸಮುದಾಯಗಳ ಜೀವನೋಪಾಯಕ್ಕೆ ಅಪಾಯ ಉಂಟಾಗಿದೆ."]], ["Comprehension", "Which of the following is NOT mentioned in the passage as a function of forests?", "ಕೆಳಗಿನವುಗಳಲ್ಲಿ ಕಾಡುಗಳ ಕಾರ್ಯವಾಗಿ ಗದ್ಯಭಾಗದಲ್ಲಿ ಉಲ್ಲೇಖಿಸದೇ ಇರುವುದು ಯಾವುದು?", [["Regulating rainfall", "ಮಳೆ ನಿಯಂತ್ರಣ"], ["Preventing soil erosion", "ಮಣ್ಣಿನ ಸವೆತ ತಡೆ"], ["Absorbing carbon dioxide", "ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್ ಹೀರುವುದು"], ["Generating electricity", "ವಿದ್ಯುತ್ ಉತ್ಪಾದನೆ"]], 3, ["Electricity generation is not mentioned.", "ವಿದ್ಯುತ್ ಉತ್ಪಾದನೆಯ ಉಲ್ಲೇಖವಿಲ್ಲ."], ["Forests act as the lungs of the planet. They absorb carbon dioxide, release oxygen, regulate rainfall and prevent soil erosion. However, rapid urbanisation and mining have led to large-scale deforestation, threatening biodiversity and the livelihoods of forest-dwelling communities.", "ಕಾಡುಗಳು ಭೂಮಿಯ ಶ್ವಾಸಕೋಶಗಳಂತೆ ಕೆಲಸ ಮಾಡುತ್ತವೆ. ಅವು ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್ ಹೀರಿ ಆಮ್ಲಜನಕ ಬಿಡುಗಡೆ ಮಾಡುತ್ತವೆ, ಮಳೆಯನ್ನು ನಿಯಂತ್ರಿಸುತ್ತವೆ ಮತ್ತು ಮಣ್ಣಿನ ಸವೆತ ತಡೆಯುತ್ತವೆ. ಆದರೆ ತ್ವರಿತ ನಗರೀಕರಣ ಮತ್ತು ಗಣಿಗಾರಿಕೆಯಿಂದ ದೊಡ್ಡ ಪ್ರಮಾಣದ ಅರಣ್ಯ ನಾಶವಾಗಿ ಜೀವವೈವಿಧ್ಯ ಮತ್ತು ಅರಣ್ಯವಾಸಿ ಸಮುದಾಯಗಳ ಜೀವನೋಪಾಯಕ್ಕೆ ಅಪಾಯ ಉಂಟಾಗಿದೆ."]], ["Comprehension", "According to the passage, education should primarily develop", "ಗದ್ಯಭಾಗದ ಪ್ರಕಾರ ಶಿಕ್ಷಣ ಮುಖ್ಯವಾಗಿ ಏನನ್ನು ಬೆಳೆಸಬೇಕು?", [["Memory power", "ಸ್ಮರಣ ಶಕ್ತಿ"], ["Critical thinking and responsible action", "ವಿಮರ್ಶಾತ್ಮಕ ಚಿಂತನೆ ಮತ್ತು ಜವಾಬ್ದಾರಿಯುತ ನಡವಳಿಕೆ"], ["Examination skills", "ಪರೀಕ್ಷಾ ಕೌಶಲ್ಯ"], ["Collection of information", "ಮಾಹಿತಿ ಸಂಗ್ರಹ"]], 1, ["The first sentence defines education as critical thinking and responsible action.", "ಮೊದಲ ವಾಕ್ಯ ಶಿಕ್ಷಣವನ್ನು ವಿಮರ್ಶಾತ್ಮಕ ಚಿಂತನೆ ಮತ್ತು ಜವಾಬ್ದಾರಿಯುತ ನಡವಳಿಕೆ ಎಂದು ವ್ಯಾಖ್ಯಾನಿಸುತ್ತದೆ."], ["Education is not merely the acquisition of information; it is the development of the ability to think critically and act responsibly. A student who memorises facts without understanding them may pass examinations but will struggle when real-life problems demand reasoning.", "ಶಿಕ್ಷಣ ಎಂದರೆ ಕೇವಲ ಮಾಹಿತಿ ಸಂಪಾದನೆಯಲ್ಲ; ವಿಮರ್ಶಾತ್ಮಕವಾಗಿ ಯೋಚಿಸಿ ಜವಾಬ್ದಾರಿಯಿಂದ ವರ್ತಿಸುವ ಸಾಮರ್ಥ್ಯದ ಬೆಳವಣಿಗೆ. ಅರ್ಥಮಾಡಿಕೊಳ್ಳದೆ ವಾಸ್ತವಾಂಶಗಳನ್ನು ಕಂಠಪಾಠ ಮಾಡುವ ವಿದ್ಯಾರ್ಥಿ ಪರೀಕ್ಷೆಯಲ್ಲಿ ಉತ್ತೀರ್ಣನಾಗಬಹುದು, ಆದರೆ ನಿಜ ಜೀವನದ ಸಮಸ್ಯೆಗಳಿಗೆ ತರ್ಕ ಬೇಕಾದಾಗ ಕಷ್ಟಪಡುತ್ತಾನೆ."]], ["Comprehension", "What can be inferred from the passage?", "ಗದ್ಯಭಾಗದಿಂದ ಏನನ್ನು ಊಹಿಸಬಹುದು?", [["Memorisation alone is insufficient for solving real-life problems", "ಕೇವಲ ಕಂಠಪಾಠ ನಿಜ ಜೀವನದ ಸಮಸ್ಯೆ ಪರಿಹರಿಸಲು ಸಾಲದು"], ["Examinations should be abolished", "ಪರೀಕ್ಷೆಗಳನ್ನು ರದ್ದುಪಡಿಸಬೇಕು"], ["Facts are of no importance", "ವಾಸ್ತವಾಂಶಗಳಿಗೆ ಮಹತ್ವವಿಲ್ಲ"], ["Students who pass exams always reason well", "ಪರೀಕ್ಷೆ ಪಾಸಾದವರು ಯಾವಾಗಲೂ ಚೆನ್ನಾಗಿ ತರ್ಕಿಸುತ್ತಾರೆ"]], 0, ["The passage says such students struggle when reasoning is needed.", "ತರ್ಕ ಬೇಕಾದಾಗ ಅಂತಹ ವಿದ್ಯಾರ್ಥಿಗಳು ಕಷ್ಟಪಡುತ್ತಾರೆ ಎಂದು ಗದ್ಯಭಾಗ ಹೇಳುತ್ತದೆ."], ["Education is not merely the acquisition of information; it is the development of the ability to think critically and act responsibly. A student who memorises facts without understanding them may pass examinations but will struggle when real-life problems demand reasoning.", "ಶಿಕ್ಷಣ ಎಂದರೆ ಕೇವಲ ಮಾಹಿತಿ ಸಂಪಾದನೆಯಲ್ಲ; ವಿಮರ್ಶಾತ್ಮಕವಾಗಿ ಯೋಚಿಸಿ ಜವಾಬ್ದಾರಿಯಿಂದ ವರ್ತಿಸುವ ಸಾಮರ್ಥ್ಯದ ಬೆಳವಣಿಗೆ. ಅರ್ಥಮಾಡಿಕೊಳ್ಳದೆ ವಾಸ್ತವಾಂಶಗಳನ್ನು ಕಂಠಪಾಠ ಮಾಡುವ ವಿದ್ಯಾರ್ಥಿ ಪರೀಕ್ಷೆಯಲ್ಲಿ ಉತ್ತೀರ್ಣನಾಗಬಹುದು, ಆದರೆ ನಿಜ ಜೀವನದ ಸಮಸ್ಯೆಗಳಿಗೆ ತರ್ಕ ಬೇಕಾದಾಗ ಕಷ್ಟಪಡುತ್ತಾನೆ."]], ["Comprehension", "Which of the following is stated in the passage as a cause of water scarcity?", "ನೀರಿನ ಕೊರತೆಗೆ ಕಾರಣವಾಗಿ ಗದ್ಯಭಾಗದಲ್ಲಿ ಹೇಳಿರುವುದು ಯಾವುದು?", [["Wasteful irrigation", "ವ್ಯರ್ಥ ನೀರಾವರಿ"], ["Excess rainfall", "ಅತಿಯಾದ ಮಳೆ"], ["Growing forests", "ಬೆಳೆಯುತ್ತಿರುವ ಕಾಡುಗಳು"], ["Cold weather", "ಚಳಿ ವಾತಾವರಣ"]], 0, ["The passage lists poor storage, wasteful irrigation and pollution.", "ಕಳಪೆ ಸಂಗ್ರಹಣೆ, ವ್ಯರ್ಥ ನೀರಾವರಿ ಮತ್ತು ಮಾಲಿನ್ಯವನ್ನು ಗದ್ಯಭಾಗ ಪಟ್ಟಿ ಮಾಡುತ್ತದೆ."], ["Water scarcity is not caused by a shortage of rain alone. Poor storage, wasteful irrigation and pollution of existing sources reduce the water available for use. Traditional structures such as tanks and step-wells, if revived, can store rainwater and recharge groundwater.", "ನೀರಿನ ಕೊರತೆ ಕೇವಲ ಮಳೆಯ ಕೊರತೆಯಿಂದ ಉಂಟಾಗುವುದಿಲ್ಲ. ಕಳಪೆ ಸಂಗ್ರಹಣೆ, ವ್ಯರ್ಥ ನೀರಾವರಿ ಮತ್ತು ಇರುವ ಮೂಲಗಳ ಮಾಲಿನ್ಯದಿಂದ ಬಳಕೆಗೆ ಲಭ್ಯ ನೀರು ಕಡಿಮೆಯಾಗುತ್ತದೆ. ಕೆರೆ ಮತ್ತು ಕಲ್ಯಾಣಿಗಳಂತಹ ಸಾಂಪ್ರದಾಯಿಕ ರಚನೆಗಳನ್ನು ಪುನಶ್ಚೇತನಗೊಳಿಸಿದರೆ ಮಳೆನೀರು ಸಂಗ್ರಹಿಸಿ ಅಂತರ್ಜಲ ಮರುಪೂರಣ ಮಾಡಬಹುದು."]], ["Comprehension", "What does the author recommend?", "ಲೇಖಕರು ಏನನ್ನು ಶಿಫಾರಸು ಮಾಡುತ್ತಾರೆ?", [["Reviving traditional water structures", "ಸಾಂಪ್ರದಾಯಿಕ ಜಲ ರಚನೆಗಳ ಪುನಶ್ಚೇತನ"], ["Stopping all irrigation", "ಎಲ್ಲ ನೀರಾವರಿ ನಿಲ್ಲಿಸುವುದು"], ["Importing water", "ನೀರನ್ನು ಆಮದು ಮಾಡಿಕೊಳ್ಳುವುದು"], ["Building only large dams", "ದೊಡ್ಡ ಅಣೆಕಟ್ಟುಗಳನ್ನು ಮಾತ್ರ ಕಟ್ಟುವುದು"]], 0, ["The last sentence recommends reviving tanks and step-wells.", "ಕೊನೆಯ ವಾಕ್ಯ ಕೆರೆ, ಕಲ್ಯಾಣಿಗಳ ಪುನಶ್ಚೇತನವನ್ನು ಸೂಚಿಸುತ್ತದೆ."], ["Water scarcity is not caused by a shortage of rain alone. Poor storage, wasteful irrigation and pollution of existing sources reduce the water available for use. Traditional structures such as tanks and step-wells, if revived, can store rainwater and recharge groundwater.", "ನೀರಿನ ಕೊರತೆ ಕೇವಲ ಮಳೆಯ ಕೊರತೆಯಿಂದ ಉಂಟಾಗುವುದಿಲ್ಲ. ಕಳಪೆ ಸಂಗ್ರಹಣೆ, ವ್ಯರ್ಥ ನೀರಾವರಿ ಮತ್ತು ಇರುವ ಮೂಲಗಳ ಮಾಲಿನ್ಯದಿಂದ ಬಳಕೆಗೆ ಲಭ್ಯ ನೀರು ಕಡಿಮೆಯಾಗುತ್ತದೆ. ಕೆರೆ ಮತ್ತು ಕಲ್ಯಾಣಿಗಳಂತಹ ಸಾಂಪ್ರದಾಯಿಕ ರಚನೆಗಳನ್ನು ಪುನಶ್ಚೇತನಗೊಳಿಸಿದರೆ ಮಳೆನೀರು ಸಂಗ್ರಹಿಸಿ ಅಂತರ್ಜಲ ಮರುಪೂರಣ ಮಾಡಬಹುದು."]], ["Comprehension", "The term ‘digital divide’ in the passage refers to", "ಗದ್ಯಭಾಗದಲ್ಲಿರುವ ‘ಡಿಜಿಟಲ್ ಅಂತರ’ ಪದ ಯಾವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ?", [["The gap between those with and without access to technology", "ತಂತ್ರಜ್ಞಾನ ಲಭ್ಯವಿರುವವರು ಮತ್ತು ಇಲ್ಲದವರ ನಡುವಿನ ಅಂತರ"], ["The difference between two software", "ಎರಡು ತಂತ್ರಾಂಶಗಳ ನಡುವಿನ ವ್ಯತ್ಯಾಸ"], ["Division of a computer network", "ಕಂಪ್ಯೂಟರ್ ಜಾಲದ ವಿಭಜನೆ"], ["Speed difference of two services", "ಎರಡು ಸೇವೆಗಳ ವೇಗದ ವ್ಯತ್ಯಾಸ"]], 0, ["The passage links it to rural people lacking internet access and skills.", "ಗ್ರಾಮೀಣರಿಗೆ ಇಂಟರ್ನೆಟ್ ಮತ್ತು ಕೌಶಲ್ಯದ ಕೊರತೆಯೊಂದಿಗೆ ಗದ್ಯಭಾಗ ಇದನ್ನು ಜೋಡಿಸುತ್ತದೆ."], ["Digital technology has made services faster and more transparent. However, a large section of the rural population lacks access to the internet and the skills to use it. Unless this digital divide is bridged, technology may widen inequality instead of reducing it.", "ಡಿಜಿಟಲ್ ತಂತ್ರಜ್ಞಾನ ಸೇವೆಗಳನ್ನು ವೇಗವಾಗಿ ಮತ್ತು ಪಾರದರ್ಶಕವಾಗಿ ಮಾಡಿದೆ. ಆದರೆ ಗ್ರಾಮೀಣ ಜನಸಂಖ್ಯೆಯ ದೊಡ್ಡ ವರ್ಗಕ್ಕೆ ಇಂಟರ್ನೆಟ್ ಲಭ್ಯತೆ ಮತ್ತು ಅದನ್ನು ಬಳಸುವ ಕೌಶಲ್ಯ ಇಲ್ಲ. ಈ ಡಿಜಿಟಲ್ ಅಂತರವನ್ನು ನೀಗಿಸದಿದ್ದರೆ ತಂತ್ರಜ್ಞಾನ ಅಸಮಾನತೆ ಕಡಿಮೆ ಮಾಡುವ ಬದಲು ಹೆಚ್ಚಿಸಬಹುದು."]], ["Comprehension", "What is the author’s main concern?", "ಲೇಖಕರ ಮುಖ್ಯ ಕಳವಳ ಏನು?", [["Technology could increase inequality if access remains unequal", "ಲಭ್ಯತೆ ಅಸಮಾನವಾಗಿದ್ದರೆ ತಂತ್ರಜ್ಞಾನ ಅಸಮಾನತೆ ಹೆಚ್ಚಿಸಬಹುದು"], ["Services have become too transparent", "ಸೇವೆಗಳು ತುಂಬಾ ಪಾರದರ್ಶಕವಾಗಿವೆ"], ["Technology is too fast", "ತಂತ್ರಜ್ಞಾನ ತುಂಬಾ ವೇಗ"], ["Villages do not need services", "ಹಳ್ಳಿಗಳಿಗೆ ಸೇವೆಗಳ ಅಗತ್ಯವಿಲ್ಲ"]], 0, ["The final sentence warns that the divide may widen inequality.", "ಈ ಅಂತರ ಅಸಮಾನತೆ ಹೆಚ್ಚಿಸಬಹುದು ಎಂದು ಕೊನೆಯ ವಾಕ್ಯ ಎಚ್ಚರಿಸುತ್ತದೆ."], ["Digital technology has made services faster and more transparent. However, a large section of the rural population lacks access to the internet and the skills to use it. Unless this digital divide is bridged, technology may widen inequality instead of reducing it.", "ಡಿಜಿಟಲ್ ತಂತ್ರಜ್ಞಾನ ಸೇವೆಗಳನ್ನು ವೇಗವಾಗಿ ಮತ್ತು ಪಾರದರ್ಶಕವಾಗಿ ಮಾಡಿದೆ. ಆದರೆ ಗ್ರಾಮೀಣ ಜನಸಂಖ್ಯೆಯ ದೊಡ್ಡ ವರ್ಗಕ್ಕೆ ಇಂಟರ್ನೆಟ್ ಲಭ್ಯತೆ ಮತ್ತು ಅದನ್ನು ಬಳಸುವ ಕೌಶಲ್ಯ ಇಲ್ಲ. ಈ ಡಿಜಿಟಲ್ ಅಂತರವನ್ನು ನೀಗಿಸದಿದ್ದರೆ ತಂತ್ರಜ್ಞಾನ ಅಸಮಾನತೆ ಕಡಿಮೆ ಮಾಡುವ ಬದಲು ಹೆಚ್ಚಿಸಬಹುದು."]]];const LOGO="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCACgAKADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2 <p class="m">ನಾಲ್ಕು ಆಯ್ಕೆಗಳಲ್ಲಿ ಒಂದೇ ಸರಿಯಾದ ಉತ್ತರ. ಗೊಂದಲವಿದ್ದರೆ ಇಂಗ್ಲಿಷ್ ಆವೃತ್ತಿಯನ್ನು ಅನುಸರಿಸಿ. ಸಮಯ ಮುಗಿದಾಗ ಪರೀಕ್ಷೆ ತಾನಾಗಿ ಸಲ್ಲಿಕೆಯಾಗುತ್ತದೆ.</p></div>
<a class="tg" href="${TG}">Join our Telegram: t.me/karnatakaeExamseries</a><button class="n" style="width:100%" onclick="start()">Start Test / ಪರೀಕ್ಷೆ ಆರಂಭಿಸಿ</button>`}
function start(){V[0]=true;T=setInterval(()=>{left--;if(left<=0){left=0;submit(true)}tick()},1000);draw()}
const fmt=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return [h,m,x].map(n=>String(n).padStart(2,'0')).join(':')};
function tick(){const e=document.getElementById('tm');if(e){e.textContent=fmt(left);e.className='tm'+(left<600?' lo':'')}}
function pal(){return `<div class="pal">${Q.map((q,j)=>`<button class="${M[j]?'mk':A[j]!=null?'an':V[j]?'vi':''}${j===i?' cur':''}" onclick="go(${j})">${j+1}</button>`).join('')}</div><div class="lg m" style="margin-top:8px"><span>🟩 Answered</span><span>🟥 Not answered</span><span>🟪 Marked</span><span>⬜ Not visited</span></div>`}
function go(j){i=j;V[j]=true;draw()}
function sel(j){A[i]=A[i]===j?null:j;draw()}
function mark(){M[i]=!M[i];draw()}
function draw(){const q=Q[i],ans=A.filter(x=>x!=null).length;
a.innerHTML=`<div class="top"><span class="m">Q ${i+1}/100 · Answered ${ans}</span><span class="tm${left<600?' lo':''}" id="tm">${fmt(left)}</span><button class="n r" onclick="confirmSubmit()">Submit</button></div>
<div class="card"><div class="yr">${q[0]} · Q${i+1}</div>${q[6]?`<div class="ex"><b>Passage / ಗದ್ಯಭಾಗ</b><p class="q">${q[6][0]}</p><p class="q k">${q[6][1]}</p></div>`:''}<p class="q"><b>${q[1]}</b></p><p class="q k">${q[2]}</p>${q[3].map((o,j)=>`<button class="o${A[i]===j?' s':''}" onclick="sel(${j})">(${L[j]}) ${o[0]}${(o[1]&&o[1]!==o[0])?`<br><span class="k">${o[1]}</span>`:''}</button>`).join('')}
<div class="bar"><button class="n a" onclick="go(Math.max(0,i-1))">← Prev</button><button class="n mk" onclick="mark()">${M[i]?'Unmark':'Mark for review'}</button><button class="n a" onclick="A[i]=null;draw()">Clear</button><button class="n" onclick="go(Math.min(99,i+1))">Next →</button></div></div>
<div class="card"><div class="m" style="margin-bottom:6px">${SECS.map(s=>`<a href="#" onclick="go(${Q.findIndex(x=>x[0]==s)});return false">${s}</a>`).join(' · ')}</div>${pal()}</div>`}
function confirmSubmit(){const ans=A.filter(x=>x!=null).length;if(confirm(`You have answered ${ans} of 100 questions. Submit the test?\nನೀವು 100 ರಲ್ಲಿ ${ans} ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿದ್ದೀರಿ. ಸಲ್ಲಿಸಬೇಕೇ?`))submit(false)}
let filt='all';
function submit(auto){if(done)return;done=true;clearInterval(T);result(DUR-left)}
function result(used){let c=0,w=0;const S={};Q.forEach((q,j)=>{S[q[0]]=S[q[0]]||[0,0,0];if(A[j]==null)S[q[0]][2]++;else if(A[j]===q[4]){c++;S[q[0]][0]++}else{w++;S[q[0]][1]++}});
const sc=c*2-w*0.5,sk=100-c-w,acc=c+w?Math.round(c/(c+w)*100):0;
a.innerHTML=`<header><img src="${LOGO}" alt="logo" style="width:64px;height:64px"><h1>Result / ಫಲಿತಾಂಶ</h1></header><div class="card" style="text-align:center"><div class="sc">${sc.toFixed(2)} <small>/ 200</small></div><p>Correct ${c} (+${c*2}) · Wrong ${w} (−${(w*0.5).toFixed(2)}) · Skipped ${sk}<br>Accuracy ${acc}% · Time used ${fmt(used)}</p></div>
<div class="card"><table><tr><th>Section / ವಿಭಾಗ</th><th>✔</th><th>✘</th><th>–</th><th>Marks</th></tr>${SECS.map(s=>`<tr><td>${s}</td><td>${S[s][0]}</td><td>${S[s][1]}</td><td>${S[s][2]}</td><td>${(S[s][0]*2-S[s][1]*0.5).toFixed(1)}</td></tr>`).join('')}</table></div>
<a class="tg" href="${TG}">Join our Telegram for more tests</a><div class="bar" id="fl"></div><div id="rv"></div><button class="n" onclick="location.reload()">Retry / ಮರುಪ್ರಯತ್ನ</button>`;review();window.scrollTo(0,0)}
function review(){document.getElementById('fl').innerHTML=[['all','All'],['wrong','Wrong'],['skip','Skipped'],['right','Correct']].map(f=>`<button class="n${filt==f[0]?'':' a'}" onclick="filt='${f[0]}';review()">${f[1]}</button>`).join('');
document.getElementById('rv').innerHTML=Q.map((q,j)=>{const st=A[j]==null?'skip':A[j]===q[4]?'right':'wrong';if(filt!='all'&&filt!=st)return'';
return `<div class="card"><div class="yr">${q[0]} · Q${j+1} · ${st=='right'?'✔ Correct':st=='wrong'?'✘ Wrong':'– Skipped'}</div>${q[6]?`<div class="ex"><b>Passage / ಗದ್ಯಭಾಗ</b><p class="q">${q[6][0]}</p><p class="q k">${q[6][1]}</p></div>`:''}<p class="q"><b>${q[1]}</b></p><p class="q k">${q[2]}</p>${q[3].map((o,k)=>`<div class="o ${k===q[4]?'g':A[j]===k?'x':''}">(${L[k]}) ${o[0]}${k===q[4]?' ✓':''}${(o[1]&&o[1]!==o[0])?`<br><span class="k">${o[1]}</span>`:''}</div>`).join('')}<div class="ex">💡 ${q[5][0]}<br><span class="k">${q[5][1]}</span></div></div>`}).join('')}
intro();
</script></body></html>
