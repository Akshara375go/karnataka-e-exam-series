<style>
:root{--bg:#f6f7fb;--c:#fff;--t:#14213d;--m:#5b6475;--p:#14275e;--ok:#157347;--okb:#e3f5ea;--no:#b3261e;--nob:#fdeceb;--bd:#d9deea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.w{max-width:680px;margin:0 auto;padding:16px}

.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:16px}
.bar{height:6px;background:var(--bd);border-radius:6px;margin:0 0 12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p);width:0}
.meta{display:flex;justify-content:space-between;color:var(--m);font-size:13px;margin-bottom:8px}
.q{font-size:17px;font-weight:600;white-space:pre-line;margin:0 0 12px}
.o{display:block;width:100%;text-align:left;background:var(--c);color:var(--t);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;margin:8px 0;font:inherit;cursor:pointer}

.e{margin-top:10px;font-size:14px;color:var(--m)}
.b{background:var(--p);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .b{color:#0f1420}}
.tg{display:inline-block;background:#229ed9;color:#fff;text-decoration:none;border-radius:10px;padding:11px 18px;font-weight:600;margin:12px 8px 0 0}
.s{font-size:44px;font-weight:700;margin:6px 0}
.o.sel{border-color:var(--p);background:var(--bg)}.b:disabled{opacity:.4;cursor:not-allowed}.rv{border:1px solid var(--bd);border-left-width:4px;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px;white-space:pre-line}.rv.ok{border-left-color:var(--ok)}.rv.no{border-left-color:var(--no)}h3{margin:18px 0 4px}</style></head><body><div class="w">
