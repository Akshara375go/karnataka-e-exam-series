const Q=[["Paper-2 · 2020", "Which among the following is/are threats for the Great Barrier Reef in Australia?\nA. Surface water temperature rising\nB. Crown-of-Thorns Starfishes\nC. Oil transportation\nD. Tourism", "ಆಸ್ಟ್ರೇಲಿಯಾದ ಗ್ರೇಟ್ ಬ್ಯಾರಿಯರ್ ರೀಫ್‌ಗೆ ಕೆಳಗಿನ ಯಾವುದು ಅಪಾಯಗಳು?\nA. ಮೇಲ್ಮೈ ನೀರಿನ ತಾಪಮಾನ ಏರಿಕೆ\nB. ಕ್ರೌನ್-ಆಫ್-ಥಾರ್ನ್ಸ್ ನಕ್ಷತ್ರಮೀನುಗಳು\nC. ತೈಲ ಸಾಗಣೆ\nD. ಪ್ರವಾಸೋದ್ಯಮ", [["Only A", "ಕೇವಲ A"], ["Only C", "ಕೇವಲ C"], ["Only C and D", "ಕೇವಲ C ಮತ್ತು D"], ["Only A and B", "ಕೇವಲ A ಮತ್ತು B"]], 3, ["Rising sea temperature (bleaching) and crown-of-thorns starfish are the main threats cited in the key.", "ಸಮುದ್ರದ ತಾಪಮಾನ ಏರಿಕೆ (ಹವಳ ಬಿಳಿಚುವಿಕೆ) ಮತ್ತು ಕ್ರೌನ್-ಆಫ್-ಥಾರ್ನ್ಸ್ ನಕ್ಷತ್ರಮೀನು ಪ್ರಮುಖ ಅಪಾಯಗಳು (ಅಧಿಕೃತ ಕೀ)."]], ["Paper-2 · 2020", "Fact 1 : Jessica has four children.\nFact 2 : Two of the children have blue eyes and two of the children have brown eyes.\nFact 3 : Half of the children are girls.\nIf the first three statements are facts, which of the following statement/(s) must also be a fact?\nI. At least one girl has blue eyes.\nII. Two of the children are boys.\nIII. The boys have brown eyes.", "ವಾಸ್ತವ 1: ಜೆಸ್ಸಿಕಾಗೆ ನಾಲ್ಕು ಮಕ್ಕಳು.\nವಾಸ್ತವ 2: ಇಬ್ಬರು ಮಕ್ಕಳ ಕಣ್ಣು ನೀಲಿ, ಇಬ್ಬರದು ಕಂದು.\nವಾಸ್ತವ 3: ಅರ್ಧದಷ್ಟು ಮಕ್ಕಳು ಹುಡುಗಿಯರು.\nಮೊದಲ ಮೂರು ಹೇಳಿಕೆಗಳು ಸತ್ಯವಾದರೆ ಯಾವ ಹೇಳಿಕೆ/ಹೇಳಿಕೆಗಳು ಖಂಡಿತ ಸತ್ಯ?\nI. ಕನಿಷ್ಠ ಒಬ್ಬ ಹುಡುಗಿಯ ಕಣ್ಣು ನೀಲಿ.\nII. ಇಬ್ಬರು ಮಕ್ಕಳು ಹುಡುಗರು.\nIII. ಹುಡುಗರ ಕಣ್ಣು ಕಂದು.", [["Only II", "ಕೇವಲ II"], ["Only I and III", "ಕೇವಲ I ಮತ್ತು III"], ["Only II and III", "ಕೇವಲ II ಮತ್ತು III"], ["None of the statements is a known fact", "ಯಾವ ಹೇಳಿಕೆಯೂ ತಿಳಿದ ಸತ್ಯವಲ್ಲ"]], 0, ["Half of four children are girls, so exactly two are boys. Eye colour of boys/girls is not fixed by the facts.", "ನಾಲ್ವರಲ್ಲಿ ಅರ್ಧ ಹುಡುಗಿಯರು ಎಂದರೆ ಇಬ್ಬರು ಹುಡುಗರು. ಕಣ್ಣಿನ ಬಣ್ಣದ ಬಗ್ಗೆ ವಾಸ್ತವಗಳು ಏನೂ ಹೇಳುವುದಿಲ್ಲ."]], ["Paper-2 · 2020", "Assertion (A) : Tropical rain forests are disappearing fast from developing countries like India.\nReason (R) : No value is attached to these forests because they are poor in biodiversity.", "ಪ್ರತಿಪಾದನೆ (A): ಭಾರತದಂತಹ ಅಭಿವೃದ್ಧಿಶೀಲ ದೇಶಗಳಲ್ಲಿ ಉಷ್ಣವಲಯದ ಮಳೆಕಾಡುಗಳು ವೇಗವಾಗಿ ಕಣ್ಮರೆಯಾಗುತ್ತಿವೆ.\nಕಾರಣ (R): ಈ ಕಾಡುಗಳು ಜೀವವೈವಿಧ್ಯದಲ್ಲಿ ಬಡವಾಗಿರುವುದರಿಂದ ಅವುಗಳಿಗೆ ಯಾವ ಮೌಲ್ಯವನ್ನೂ ನೀಡಲಾಗುವುದಿಲ್ಲ.", [["Both Assertion and Reason are true and Reason is the correct explanation of the Assertion.", "ಪ್ರತಿಪಾದನೆ ಮತ್ತು ಕಾರಣ ಎರಡೂ ಸತ್ಯ, ಮತ್ತು ಕಾರಣವು ಪ್ರತಿಪಾದನೆಯ ಸರಿಯಾದ ವಿವರಣೆ."], ["Both Assertion and Reason are true but the Reason is not the correct explanation of the Assertion.", "ಎರಡೂ ಸತ್ಯ, ಆದರೆ ಕಾರಣವು ಪ್ರತಿಪಾದನೆಯ ಸರಿಯಾದ ವಿವರಣೆಯಲ್ಲ."], ["Assertion is true, but Reason is false.", "ಪ್ರತಿಪಾದನೆ ಸತ್ಯ, ಆದರೆ ಕಾರಣ ಸುಳ್ಳು."], ["Both Assertion and Reason are false.", "ಎರಡೂ ಸುಳ್ಳು."]], 2, ["Rain forests are vanishing, but they are among the richest in biodiversity — so R is false.", "ಮಳೆಕಾಡುಗಳು ಕಣ್ಮರೆಯಾಗುತ್ತಿವೆ, ಆದರೆ ಅವು ಜೀವವೈವಿಧ್ಯದಲ್ಲಿ ಅತಿ ಶ್ರೀಮಂತ — ಆದ್ದರಿಂದ R ಸುಳ್ಳು."]], ["Paper-2 · 2020", "Which of the following is/are correct with regard to Supercomputing in India?\nA. India’s supercomputer programme was started in late 1980s.\nB. PARAM 8000 is considered as India’s first supercomputer.\nC. Aaditya is a series of supercomputers designed and developed by Bhabha Atomic Research Centre (BARC) for their internal use.", "ಭಾರತದ ಸೂಪರ್‌ಕಂಪ್ಯೂಟಿಂಗ್ ಕುರಿತು ಕೆಳಗಿನ ಯಾವುದು ಸರಿ?\nA. ಭಾರತದ ಸೂಪರ್‌ಕಂಪ್ಯೂಟರ್ ಕಾರ್ಯಕ್ರಮ 1980ರ ದಶಕದ ಅಂತ್ಯದಲ್ಲಿ ಆರಂಭವಾಯಿತು.\nB. PARAM 8000 ಭಾರತದ ಮೊದಲ ಸೂಪರ್‌ಕಂಪ್ಯೂಟರ್.\nC. ಆದಿತ್ಯ ಎಂಬುದು BARC ತನ್ನ ಆಂತರಿಕ ಬಳಕೆಗೆ ವಿನ್ಯಾಸಗೊಳಿಸಿದ ಸೂಪರ್‌ಕಂಪ್ಯೂಟರ್ ಸರಣಿ.", [["Only A and B", "ಕೇವಲ A ಮತ್ತು B"], ["Only B and C", "ಕೇವಲ B ಮತ್ತು C"], ["Only B", "ಕೇವಲ B"], ["A, B and C", "A, B ಮತ್ತು C"]], 0, ["PARAM 8000 (C-DAC, 1991) was India’s first; Aaditya belongs to IITM Pune, not BARC.", "PARAM 8000 (C-DAC, 1991) ಭಾರತದ ಮೊದಲ ಸೂಪರ್‌ಕಂಪ್ಯೂಟರ್; ಆದಿತ್ಯ IITM ಪುಣೆಯದು, BARC ಅಲ್ಲ."]], ["Paper-2 · 2020", "Consider the following four conditions (A to D) and select the correct pair of adaptations to environment in desert lizards.\nA. Burrowing in soil to escape high temperature.\nB. Losing heat rapidly from the body during high temperature.\nC. Bask in sun when temperature is low.\nD. Insulating body due to thick fatty dermis.", "ಮರುಭೂಮಿ ಹಲ್ಲಿಗಳ ಪರಿಸರ ಹೊಂದಾಣಿಕೆಗಳ ಸರಿಯಾದ ಜೋಡಿಯನ್ನು ಆರಿಸಿ.\nA. ಹೆಚ್ಚಿನ ತಾಪಮಾನ ತಪ್ಪಿಸಲು ಮಣ್ಣಿನಲ್ಲಿ ಬಿಲ ತೋಡುವುದು.\nB. ಹೆಚ್ಚಿನ ತಾಪಮಾನದಲ್ಲಿ ದೇಹದ ಶಾಖವನ್ನು ವೇಗವಾಗಿ ಕಳೆದುಕೊಳ್ಳುವುದು.\nC. ತಾಪಮಾನ ಕಡಿಮೆ ಇದ್ದಾಗ ಬಿಸಿಲು ಕಾಯುವುದು.\nD. ದಪ್ಪ ಕೊಬ್ಬಿನ ಚರ್ಮದಿಂದ ದೇಹವನ್ನು ನಿರೋಧಿಸುವುದು.", [["A and B", "A ಮತ್ತು B"], ["C and D", "C ಮತ್ತು D"], ["A and C", "A ಮತ್ತು C"], ["B and D", "B ಮತ್ತು D"]], 2, ["Desert lizards burrow to avoid heat and bask to warm up when it is cool.", "ಮರುಭೂಮಿ ಹಲ್ಲಿಗಳು ಶಾಖ ತಪ್ಪಿಸಲು ಬಿಲ ತೋಡುತ್ತವೆ ಮತ್ತು ತಂಪಾದಾಗ ಬಿಸಿಲು ಕಾಯುತ್ತವೆ."]], ["Paper-2 · 2020", "Which of the following statement/(s) is/are true with regard to “Nuclear Fuel Cycle”?\nA. It is the series of industrial processes which involve the production of electricity from uranium in nuclear power reactors.\nB. The nuclear fuel cycles start with the mining of uranium and end with the disposal of nuclear waste.\nC. To prepare uranium for use in a nuclear reactor, it undergoes the steps of mining, milling, conversion, enrichment and fuel fabrication.", "“ಪರಮಾಣು ಇಂಧನ ಚಕ್ರ”ದ ಕುರಿತು ಯಾವ ಹೇಳಿಕೆ/ಹೇಳಿಕೆಗಳು ಸರಿ?\nA. ಇದು ಪರಮಾಣು ರಿಯಾಕ್ಟರ್‌ಗಳಲ್ಲಿ ಯುರೇನಿಯಂನಿಂದ ವಿದ್ಯುತ್ ಉತ್ಪಾದಿಸುವ ಕೈಗಾರಿಕಾ ಪ್ರಕ್ರಿಯೆಗಳ ಸರಣಿ.\nB. ಪರಮಾಣು ಇಂಧನ ಚಕ್ರ ಯುರೇನಿಯಂ ಗಣಿಗಾರಿಕೆಯಿಂದ ಆರಂಭವಾಗಿ ಪರಮಾಣು ತ್ಯಾಜ್ಯ ವಿಲೇವಾರಿಯಲ್ಲಿ ಕೊನೆಗೊಳ್ಳುತ್ತದೆ.\nC. ರಿಯಾಕ್ಟರ್‌ಗೆ ಯುರೇನಿಯಂ ಸಿದ್ಧಪಡಿಸಲು ಗಣಿಗಾರಿಕೆ, ಮಿಲ್ಲಿಂಗ್, ಪರಿವರ್ತನೆ, ಸಮೃದ್ಧೀಕರಣ ಮತ್ತು ಇಂಧನ ತಯಾರಿಕೆ ಹಂತಗಳಿವೆ.", [["Only A and C", "ಕೇವಲ A ಮತ್ತು C"], ["Only B and C", "ಕೇವಲ B ಮತ್ತು C"], ["Only A", "ಕೇವಲ A"], ["A, B and C", "A, B ಮತ್ತು C"]], 3, ["All three describe the nuclear fuel cycle correctly.", "ಮೂರೂ ಹೇಳಿಕೆಗಳು ಪರಮಾಣು ಇಂಧನ ಚಕ್ರವನ್ನು ಸರಿಯಾಗಿ ವಿವರಿಸುತ್ತವೆ."]], ["Paper-2 · 2020", "People speculate when they consider a situation and assume something to be true based on inconclusive evidence. Which situation below is the best example of Speculation?", "ನಿರ್ಣಾಯಕವಲ್ಲದ ಸಾಕ್ಷ್ಯದ ಆಧಾರದ ಮೇಲೆ ಏನನ್ನಾದರೂ ಸತ್ಯವೆಂದು ಭಾವಿಸಿದರೆ ಅದು ಊಹಾಪೋಹ (Speculation). ಕೆಳಗಿನ ಯಾವ ಸನ್ನಿವೇಶ ಇದಕ್ಕೆ ಉತ್ತಮ ಉದಾಹರಣೆ?", [["Francine decides that it would be appropriate to wear jeans to her new office on Friday after reading about “Casual Fridays” in her employee handbook.", "ಫ್ರಾನ್ಸಿನ್ ತನ್ನ ಉದ್ಯೋಗಿ ಕೈಪಿಡಿಯಲ್ಲಿ “ಕ್ಯಾಶುಯಲ್ ಫ್ರೈಡೇಸ್” ಬಗ್ಗೆ ಓದಿ ಶುಕ್ರವಾರ ಜೀನ್ಸ್ ಧರಿಸುವುದು ಸೂಕ್ತ ಎಂದು ನಿರ್ಧರಿಸುತ್ತಾಳೆ."], ["Mary spends thirty minutes sitting in traffic and wishes that she took the train instead of driving.", "ಮೇರಿ ಮೂವತ್ತು ನಿಮಿಷ ಟ್ರಾಫಿಕ್‌ನಲ್ಲಿ ಸಿಲುಕಿ, ಚಾಲನೆ ಬದಲು ರೈಲಿನಲ್ಲಿ ಹೋಗಬೇಕಿತ್ತು ಎಂದು ಬಯಸುತ್ತಾಳೆ."], ["After consulting several guidebooks and her travel agent, Jennifer feels confident that the hotel she has chosen is first-rate.", "ಹಲವು ಮಾರ್ಗದರ್ಶಿ ಪುಸ್ತಕಗಳು ಮತ್ತು ಪ್ರವಾಸ ಏಜೆಂಟರನ್ನು ಸಂಪರ್ಕಿಸಿದ ನಂತರ ತಾನು ಆರಿಸಿದ ಹೋಟೆಲ್ ಉತ್ಕೃಷ್ಟ ಎಂದು ಜೆನ್ನಿಫರ್‌ಗೆ ವಿಶ್ವಾಸವಿದೆ."], ["When Emily opens the door in tears, Theo guesses that she had a death in her family.", "ಎಮಿಲಿ ಕಣ್ಣೀರಿನೊಂದಿಗೆ ಬಾಗಿಲು ತೆರೆದಾಗ, ಅವಳ ಕುಟುಂಬದಲ್ಲಿ ಸಾವು ಸಂಭವಿಸಿರಬೇಕು ಎಂದು ಥಿಯೋ ಊಹಿಸುತ್ತಾನೆ."]], 3, ["Theo assumes a cause from just one clue (tears) — that is speculation.", "ಒಂದೇ ಸುಳಿವಿನ (ಕಣ್ಣೀರು) ಆಧಾರದ ಮೇಲೆ ಕಾರಣ ಊಹಿಸುವುದು ಊಹಾಪೋಹ."]], ["Paper-2 · 2020", "Mahatma Gandhi believed industrialization was no answer to the problems that plague the mass of India’s poor and that villagers should be taught to be self-sufficient in food, weave their own cloth from cotton and eschew the glittering prizes that the 20th century so temptingly offers. Such an idyllic and rural paradise did not appeal to those who inherited the reins of political power.\nGandhiji’s views opposed industrialization of villages because\nA. it would help the poor and not the rich.\nB. it would take away the skills of the villagers.\nC. it would affect the culture of the Indians.\nD. it would undermine the beauty of the villages.", "ಕೈಗಾರಿಕೀಕರಣ ಭಾರತದ ಬಡವರ ಸಮಸ್ಯೆಗಳಿಗೆ ಉತ್ತರವಲ್ಲ, ಹಳ್ಳಿಗರು ಆಹಾರದಲ್ಲಿ ಸ್ವಾವಲಂಬಿಗಳಾಗಿ, ತಾವೇ ಹತ್ತಿಯಿಂದ ಬಟ್ಟೆ ನೇಯಬೇಕು ಎಂದು ಮಹಾತ್ಮ ಗಾಂಧೀಜಿ ನಂಬಿದ್ದರು. ಇಂತಹ ಗ್ರಾಮೀಣ ಸ್ವರ್ಗ ರಾಜಕೀಯ ಅಧಿಕಾರ ಪಡೆದವರಿಗೆ ಇಷ್ಟವಾಗಲಿಲ್ಲ.\nಗ್ರಾಮಗಳ ಕೈಗಾರಿಕೀಕರಣವನ್ನು ಗಾಂಧೀಜಿ ವಿರೋಧಿಸಲು ಕಾರಣ:\nA. ಅದು ಬಡವರಿಗೆ ಸಹಾಯ ಮಾಡಿ ಶ್ರೀಮಂತರಿಗೆ ಅಲ್ಲ.\nB. ಅದು ಹಳ್ಳಿಗರ ಕೌಶಲ್ಯಗಳನ್ನು ಕಸಿದುಕೊಳ್ಳುತ್ತದೆ.\nC. ಅದು ಭಾರತೀಯರ ಸಂಸ್ಕೃತಿಯ ಮೇಲೆ ಪರಿಣಾಮ ಬೀರುತ್ತದೆ.\nD. ಅದು ಹಳ್ಳಿಗಳ ಸೌಂದರ್ಯವನ್ನು ಹಾಳುಮಾಡುತ್ತದೆ.", [["C and D", "C ಮತ್ತು D"], ["A and B", "A ಮತ್ತು B"], ["Only B", "ಕೇವಲ B"], ["A and D", "A ಮತ್ತು D"]], 2, ["The passage says villagers should stay self-sufficient with their own skills; only B follows from it.", "ಹಳ್ಳಿಗರು ತಮ್ಮದೇ ಕೌಶಲ್ಯದಿಂದ ಸ್ವಾವಲಂಬಿಗಳಾಗಿರಬೇಕು ಎಂದು ಪ್ಯಾರಾ ಹೇಳುತ್ತದೆ; ಆದ್ದರಿಂದ B ಮಾತ್ರ ಸರಿ."]], ["Paper-2 · 2020", "Consider the following about Geographical Indications of Goods (Registration and Protection) Act, 1999:\nA. It is used for agricultural, natural and manufactured goods and services.\nB. For a product to get GI tag, the goods need not be produced or processed or prepared in that region.\nWhich of the statement/(s) is/are correct?", "ಭೌಗೋಳಿಕ ಸೂಚಕ (ನೋಂದಣಿ ಮತ್ತು ರಕ್ಷಣೆ) ಕಾಯ್ದೆ, 1999ರ ಕುರಿತು:\nA. ಇದು ಕೃಷಿ, ನೈಸರ್ಗಿಕ ಮತ್ತು ತಯಾರಿಸಿದ ಸರಕುಗಳು ಹಾಗೂ ಸೇವೆಗಳಿಗೆ ಬಳಕೆಯಾಗುತ್ತದೆ.\nB. GI ಟ್ಯಾಗ್ ಪಡೆಯಲು ಸರಕುಗಳನ್ನು ಆ ಪ್ರದೇಶದಲ್ಲಿ ಉತ್ಪಾದಿಸಬೇಕಿಲ್ಲ.\nಯಾವ ಹೇಳಿಕೆ/ಹೇಳಿಕೆಗಳು ಸರಿ?", [["Only A", "ಕೇವಲ A"], ["Only B", "ಕೇವಲ B"], ["Both A and B", "Both A ಮತ್ತು B"], ["None of the above", "ಮೇಲಿನ ಯಾವುದೂ ಅಲ್ಲ"]], 3, ["GI covers goods only (not services), and goods must originate from that region — both statements are wrong.", "GI ಸರಕುಗಳಿಗೆ ಮಾತ್ರ (ಸೇವೆಗಳಿಗಲ್ಲ), ಮತ್ತು ಸರಕು ಆ ಪ್ರದೇಶದಿಂದಲೇ ಬರಬೇಕು — ಎರಡೂ ಹೇಳಿಕೆ ತಪ್ಪು."]], ["Paper-2 · 2020", "Match List-I with List-II.\nList-I: A. Population  B. Community  C. Ecosystem  D. Ecosphere\nList-II: I. Part of the Earth consisting of all the ecosystems of the world  II. Assemblage of all the individuals belonging to different species occurring in an area  III. Group of similar individuals belonging to the same species found in an area  IV. Interaction between the living organisms and their physical environmental components  V. Classification of organisms based on the type of environment", "ಪಟ್ಟಿ-I ಅನ್ನು ಪಟ್ಟಿ-II ರೊಂದಿಗೆ ಹೊಂದಿಸಿ.\nಪಟ್ಟಿ-I: A. ಸಮೂಹ (ಜನಸಂಖ್ಯೆ)  B. ಸಮುದಾಯ  C. ಪರಿಸರ ವ್ಯವಸ್ಥೆ  D. ಇಕೋಸ್ಫಿಯರ್\nಪಟ್ಟಿ-II: I. ಜಗತ್ತಿನ ಎಲ್ಲ ಪರಿಸರ ವ್ಯವಸ್ಥೆಗಳನ್ನು ಒಳಗೊಂಡ ಭೂಮಿಯ ಭಾಗ  II. ಒಂದು ಪ್ರದೇಶದ ವಿವಿಧ ಜಾತಿಗಳ ಎಲ್ಲ ಜೀವಿಗಳ ಸಮೂಹ  III. ಒಂದು ಪ್ರದೇಶದಲ್ಲಿನ ಒಂದೇ ಜಾತಿಯ ಸಮಾನ ಜೀವಿಗಳ ಗುಂಪು  IV. ಜೀವಿಗಳು ಮತ್ತು ಅವುಗಳ ಭೌತಿಕ ಪರಿಸರ ಘಟಕಗಳ ನಡುವಿನ ಅಂತರಕ್ರಿಯೆ  V. ಪರಿಸರದ ಪ್ರಕಾರದ ಆಧಾರದ ಮೇಲೆ ಜೀವಿಗಳ ವರ್ಗೀಕರಣ", [["A–I, B–IV, C–V, D–III", ""], ["A–V, B–II, C–III, D–I", ""], ["A–II, B–III, C–V, D–IV", ""], ["A–III, B–II, C–IV, D–I", ""]], 3, ["Population – same species; Community – different species together; Ecosystem – living + physical interaction; Ecosphere – all ecosystems.", "ಸಮೂಹ – ಒಂದೇ ಜಾತಿ; ಸಮುದಾಯ – ವಿವಿಧ ಜಾತಿಗಳು; ಪರಿಸರ ವ್ಯವಸ್ಥೆ – ಜೀವಿ + ಭೌತಿಕ ಅಂತರಕ್ರಿಯೆ; ಇಕೋಸ್ಫಿಯರ್ – ಎಲ್ಲ ಪರಿಸರ ವ್ಯವಸ್ಥೆಗಳು."]], ["Paper-2 · 2020", "Earthworms used for Vermicomposting is/are\nA. Eisenia fetida\nB. Lumbricus rubellus\nC. Caenorhabditis elegans\nD. Platyhelminthes", "ಎರೆಹುಳು ಗೊಬ್ಬರ (ವರ್ಮಿಕಂಪೋಸ್ಟ್) ತಯಾರಿಕೆಗೆ ಬಳಸುವ ಎರೆಹುಳು/ಹುಳುಗಳು:\nA. ಐಸೀನಿಯಾ ಫೆಟಿಡಾ\nB. ಲುಂಬ್ರಿಕಸ್ ರುಬೆಲ್ಲಸ್\nC. ಕೀನೋರ್ಹ್ಯಾಬ್ಡಿಟಿಸ್ ಎಲಿಗಾನ್ಸ್\nD. ಪ್ಲ್ಯಾಟಿಹೆಲ್ಮಿಂಥೀಸ್", [["Only A", "ಕೇವಲ A"], ["Only A and B", "ಕೇವಲ A ಮತ್ತು B"], ["Only A, B and C", "ಕೇವಲ A, B ಮತ್ತು C"], ["A, B, C and D", "A, B, C ಮತ್ತು D"]], 1, ["Eisenia fetida and Lumbricus rubellus are the standard composting worms; C. elegans is a nematode and Platyhelminthes are flatworms.", "ಐಸೀನಿಯಾ ಫೆಟಿಡಾ ಮತ್ತು ಲುಂಬ್ರಿಕಸ್ ರುಬೆಲ್ಲಸ್ ಗೊಬ್ಬರ ಹುಳುಗಳು; C. ಎಲಿಗಾನ್ಸ್ ನೆಮಟೋಡ್, ಪ್ಲ್ಯಾಟಿಹೆಲ್ಮಿಂಥೀಸ್ ಚಪ್ಪಟೆ ಹುಳುಗಳು."]], ["Paper-2 · 2020", "Five ladies are sitting on a bench in a park ready to be photographed. Sheena is to the left of Remya and to the right of Beena. Monica is to the right of Remya. Reena is between Remya and Monica.\nWho is in the middle of the bench in the park?", "ಐವರು ಮಹಿಳೆಯರು ಉದ್ಯಾನದ ಬೆಂಚಿನ ಮೇಲೆ ಫೋಟೋಗಾಗಿ ಕುಳಿತಿದ್ದಾರೆ. ಶೀನಾ ರೆಮ್ಯಾಳ ಎಡಕ್ಕೆ ಮತ್ತು ಬೀನಾಳ ಬಲಕ್ಕೆ ಇದ್ದಾಳೆ. ಮೋನಿಕಾ ರೆಮ್ಯಾಳ ಬಲಕ್ಕೆ ಇದ್ದಾಳೆ. ರೀನಾ ರೆಮ್ಯಾ ಮತ್ತು ಮೋನಿಕಾ ನಡುವೆ ಇದ್ದಾಳೆ.\nಬೆಂಚಿನ ಮಧ್ಯದಲ್ಲಿ ಯಾರಿದ್ದಾರೆ?", [["Beena", "ಬೀನಾ"], ["Reena", "ರೀನಾ"], ["Remya", "ರೆಮ್ಯಾ"], ["Sheena", "ಶೀನಾ"]], 2, ["Order left to right: Beena, Sheena, Remya, Reena, Monica — Remya is in the middle.", "ಎಡದಿಂದ ಬಲಕ್ಕೆ: ಬೀನಾ, ಶೀನಾ, ರೆಮ್ಯಾ, ರೀನಾ, ಮೋನಿಕಾ — ಮಧ್ಯದಲ್ಲಿ ರೆಮ್ಯಾ."]], ["Paper-2 · 2020", "If the product of two numbers is 47,915 and their H.C.F. is 37, then their sum is", "ಎರಡು ಸಂಖ್ಯೆಗಳ ಗುಣಲಬ್ಧ 47,915 ಮತ್ತು ಅವುಗಳ ಮ.ಸಾ.ಅ. (HCF) 37 ಆದರೆ ಅವುಗಳ ಮೊತ್ತ", [["333", "333"], ["444", "444"], ["555", "555"], ["666", "666"]], 1, ["Numbers are 37a and 37b with ab = 47915/37² = 35, so (5, 7): sum = 37 × 12 = 444.", "ಸಂಖ್ಯೆಗಳು 37a ಮತ್ತು 37b; ab = 47915/37² = 35 → (5, 7); ಮೊತ್ತ = 37 × 12 = 444."]], ["Paper-2 · 2020", "A meeting is scheduled at 11:00 AM and a person ‘P’, who is at a distance of 100 km from the meeting place, has to attend. If ‘P’ starts at 09:45 AM in his car which moves with a speed of 60 kmph, then ‘P’ is late to the meeting by how many minutes?", "ಸಭೆ ಬೆಳಿಗ್ಗೆ 11:00ಕ್ಕೆ ನಿಗದಿಯಾಗಿದೆ. ಸಭೆಯ ಸ್ಥಳದಿಂದ 100 ಕಿ.ಮೀ. ದೂರದಲ್ಲಿರುವ ‘P’ ಗಂಟೆಗೆ 60 ಕಿ.ಮೀ. ವೇಗದ ಕಾರಿನಲ್ಲಿ 09:45ಕ್ಕೆ ಹೊರಟರೆ, ಅವನು ಎಷ್ಟು ನಿಮಿಷ ತಡವಾಗುತ್ತಾನೆ?", [["5 minutes", "5 ನಿಮಿಷ"], ["15 minutes", "15 ನಿಮಿಷ"], ["25 minutes", "25 ನಿಮಿಷ"], ["35 minutes", "35 ನಿಮಿಷ"]], 2, ["100 km at 60 kmph takes 100 minutes; 9:45 + 1h40 = 11:25, i.e. 25 minutes late.", "60 ಕಿ.ಮೀ./ಗಂ ವೇಗದಲ್ಲಿ 100 ಕಿ.ಮೀ.ಗೆ 100 ನಿಮಿಷ; 9:45 + 1ಗಂ 40ನಿ = 11:25 → 25 ನಿಮಿಷ ತಡ."]], ["Paper-2 · 2020", "A family consists of six members J, K, L, M, N and O. There are two married couples. K is a doctor and the father of N. O is the grandfather of L and is a contractor. M is the grandmother of N and is a housewife. There are one doctor, one contractor, one nurse, one housewife and two students in the family. What is the profession of J?", "J, K, L, M, N ಮತ್ತು O ಎಂಬ ಆರು ಸದಸ್ಯರ ಕುಟುಂಬದಲ್ಲಿ ಎರಡು ವಿವಾಹಿತ ಜೋಡಿಗಳಿವೆ. K ವೈದ್ಯ ಮತ್ತು N ನ ತಂದೆ. O, L ನ ಅಜ್ಜ ಮತ್ತು ಗುತ್ತಿಗೆದಾರ. M, N ನ ಅಜ್ಜಿ ಮತ್ತು ಗೃಹಿಣಿ. ಕುಟುಂಬದಲ್ಲಿ ಒಬ್ಬ ವೈದ್ಯ, ಒಬ್ಬ ಗುತ್ತಿಗೆದಾರ, ಒಬ್ಬ ನರ್ಸ್, ಒಬ್ಬ ಗೃಹಿಣಿ ಮತ್ತು ಇಬ್ಬರು ವಿದ್ಯಾರ್ಥಿಗಳಿದ್ದಾರೆ. J ನ ವೃತ್ತಿ ಯಾವುದು?", [["Nurse", "ನರ್ಸ್"], ["Doctor", "ವೈದ್ಯ"], ["Contractor", "ಗುತ್ತಿಗೆದಾರ"], ["Housewife", "ಗೃಹಿಣಿ"]], 0, ["Couples: O–M and K–J. J is K’s wife and N’s mother; the only profession left is nurse.", "ಜೋಡಿಗಳು: O–M ಮತ್ತು K–J. J, K ನ ಪತ್ನಿ ಮತ್ತು N ನ ತಾಯಿ; ಉಳಿದಿರುವ ವೃತ್ತಿ ನರ್ಸ್."]], ["Paper-2 · 2020", "A training college has to conduct a refresher course for teachers of seven different subjects, Mechanics, Psychology, Philosophy, Sociology, Economics, Science and Engineering from 22nd July to 29th July.\nI. Course should start with Psychology.\nII. 23rd July, being Sunday, should be a holiday.\nIII. Science subject should be on the previous day of Engineering subject.\nIV. Course should end with Mechanics subject.\nV. Philosophy should be immediately after the holiday.\nVI. There should be a gap of one day between Economics and Engineering.\nVII. There should be a gap of two days between Sociology and Economics.\nBased on the above information, which subject precedes Science?", "ತರಬೇತಿ ಕಾಲೇಜು ಮೆಕ್ಯಾನಿಕ್ಸ್, ಮನೋವಿಜ್ಞಾನ, ತತ್ವಶಾಸ್ತ್ರ, ಸಮಾಜಶಾಸ್ತ್ರ, ಅರ್ಥಶಾಸ್ತ್ರ, ವಿಜ್ಞಾನ ಮತ್ತು ಎಂಜಿನಿಯರಿಂಗ್ ಎಂಬ ಏಳು ವಿಷಯಗಳ ಶಿಕ್ಷಕರಿಗೆ ಜುಲೈ 22ರಿಂದ 29ರವರೆಗೆ ಪುನಶ್ಚೇತನ ಕೋರ್ಸ್ ನಡೆಸಬೇಕು.\nI. ಕೋರ್ಸ್ ಮನೋವಿಜ್ಞಾನದಿಂದ ಆರಂಭವಾಗಬೇಕು.\nII. ಜುಲೈ 23 ಭಾನುವಾರವಾದ್ದರಿಂದ ರಜೆ.\nIII. ವಿಜ್ಞಾನ ವಿಷಯ ಎಂಜಿನಿಯರಿಂಗ್‌ನ ಹಿಂದಿನ ದಿನ ಇರಬೇಕು.\nIV. ಕೋರ್ಸ್ ಮೆಕ್ಯಾನಿಕ್ಸ್‌ನೊಂದಿಗೆ ಕೊನೆಗೊಳ್ಳಬೇಕು.\nV. ತತ್ವಶಾಸ್ತ್ರ ರಜೆಯ ತಕ್ಷಣದ ನಂತರ ಇರಬೇಕು.\nVI. ಅರ್ಥಶಾಸ್ತ್ರ ಮತ್ತು ಎಂಜಿನಿಯರಿಂಗ್ ನಡುವೆ ಒಂದು ದಿನದ ಅಂತರ ಇರಬೇಕು.\nVII. ಸಮಾಜಶಾಸ್ತ್ರ ಮತ್ತು ಅರ್ಥಶಾಸ್ತ್ರ ನಡುವೆ ಎರಡು ದಿನಗಳ ಅಂತರ ಇರಬೇಕು.\nಮೇಲಿನ ಮಾಹಿತಿಯ ಪ್ರಕಾರ ವಿಜ್ಞಾನದ ಹಿಂದೆ ಯಾವ ವಿಷಯವಿದೆ?", [["Sociology", "ಸಮಾಜಶಾಸ್ತ್ರ"], ["Engineering", "ಎಂಜಿನಿಯರಿಂಗ್"], ["Economics", "ಅರ್ಥಶಾಸ್ತ್ರ"], ["Mechanics", "ಮೆಕ್ಯಾನಿಕ್ಸ್"]], 2, ["Schedule: Psychology 22, holiday 23, Philosophy 24, Economics 25, Science 26, Engineering 27, Sociology 28, Mechanics 29.", "ವೇಳಾಪಟ್ಟಿ: ಮನೋವಿಜ್ಞಾನ 22, ರಜೆ 23, ತತ್ವಶಾಸ್ತ್ರ 24, ಅರ್ಥಶಾಸ್ತ್ರ 25, ವಿಜ್ಞಾನ 26, ಎಂಜಿನಿಯರಿಂಗ್ 27, ಸಮಾಜಶಾಸ್ತ್ರ 28, ಮೆಕ್ಯಾನಿಕ್ಸ್ 29."]], ["Paper-2 · 2020", "Which of the following statements about large intestine are correct?\nA. It includes caecum, colon, rectum and anal canal.\nB. The last stages of chemical digestion occur in the large intestine through bacterial action. Substances are further broken down and some vitamins are synthesized.\nC. The large intestine absorbs water, ions and vitamins.\nD. The elimination of faeces from the rectum is called defecation. Defecation is a reflex action aided by voluntary contractions of the diaphragm and abdominal muscles.", "ದೊಡ್ಡ ಕರುಳಿನ ಕುರಿತು ಕೆಳಗಿನ ಯಾವ ಹೇಳಿಕೆಗಳು ಸರಿ?\nA. ಇದರಲ್ಲಿ ಸೀಕಂ, ಕೊಲೋನ್, ಗುದನಾಳ ಮತ್ತು ಗುದ ಕಾಲುವೆ ಸೇರಿವೆ.\nB. ರಾಸಾಯನಿಕ ಜೀರ್ಣಕ್ರಿಯೆಯ ಕೊನೆಯ ಹಂತಗಳು ಬ್ಯಾಕ್ಟೀರಿಯಾ ಕ್ರಿಯೆಯಿಂದ ಇಲ್ಲಿ ನಡೆಯುತ್ತವೆ; ಕೆಲವು ವಿಟಮಿನ್‌ಗಳು ಸಂಶ್ಲೇಷಿತವಾಗುತ್ತವೆ.\nC. ದೊಡ್ಡ ಕರುಳು ನೀರು, ಅಯಾನುಗಳು ಮತ್ತು ವಿಟಮಿನ್‌ಗಳನ್ನು ಹೀರಿಕೊಳ್ಳುತ್ತದೆ.\nD. ಗುದನಾಳದಿಂದ ಮಲ ವಿಸರ್ಜನೆಯನ್ನು ಶೌಚಕ್ರಿಯೆ ಎನ್ನುತ್ತಾರೆ; ಇದು ಡಯಾಫ್ರಾಮ್ ಮತ್ತು ಹೊಟ್ಟೆಯ ಸ್ನಾಯುಗಳ ಸ್ವಯಂಪ್ರೇರಿತ ಸಂಕೋಚನದಿಂದ ನೆರವಾಗುವ ಪ್ರತಿಕ್ರಿಯಾ ಕ್ರಿಯೆ.", [["Only A and B", "ಕೇವಲ A ಮತ್ತು B"], ["Only A, C and D", "ಕೇವಲ A, C ಮತ್ತು D"], ["Only B, C and D", "ಕೇವಲ B, C ಮತ್ತು D"], ["A, B, C and D", "A, B, C ಮತ್ತು D"]], 3, ["All four statements correctly describe the large intestine.", "ನಾಲ್ಕೂ ಹೇಳಿಕೆಗಳು ದೊಡ್ಡ ಕರುಳನ್ನು ಸರಿಯಾಗಿ ವಿವರಿಸುತ್ತವೆ."]], ["Paper-2 · 2020", "An ecological “Niche” can be defined as _________ .", "ಪರಿಸರ “ನಿಚ್” (Niche) ಅನ್ನು ಹೀಗೆ ವ್ಯಾಖ್ಯಾನಿಸಬಹುದು _________ .", [["The various habitats an organism may inhabit", "ಒಂದು ಜೀವಿ ವಾಸಿಸಬಹುದಾದ ವಿವಿಧ ಆವಾಸಗಳು"], ["The specific environment an organism inhabits", "ಒಂದು ಜೀವಿ ವಾಸಿಸುವ ನಿರ್ದಿಷ್ಟ ಪರಿಸರ"], ["The role an organism plays in its community", "ಒಂದು ಜೀವಿ ತನ್ನ ಸಮುದಾಯದಲ್ಲಿ ವಹಿಸುವ ಪಾತ್ರ"], ["The inorganic, non-living aspects of a given area", "ಒಂದು ಪ್ರದೇಶದ ಅಜೈವಿಕ, ನಿರ್ಜೀವ ಅಂಶಗಳು"]], 2, ["Habitat is the address; niche is the organism’s role or ‘profession’ in its community.", "ಆವಾಸ ‘ವಿಳಾಸ’; ನಿಚ್ ಜೀವಿಯ ಸಮುದಾಯದಲ್ಲಿನ ‘ಪಾತ್ರ’."]], ["Paper-2 · 2017", "Muscle fatigue occurs due to the accumulation of which of the following?", "ಸ್ನಾಯು ಆಯಾಸವು ಕೆಳಗಿನ ಯಾವುದರ ಸಂಗ್ರಹಣೆಯಿಂದ ಉಂಟಾಗುತ್ತದೆ?", [["Pyruvic acid", "ಪೈರುವಿಕ್ ಆಮ್ಲ"], ["Acetic acid", "ಅಸಿಟಿಕ್ ಆಮ್ಲ"], ["Lactic acid", "ಲ್ಯಾಕ್ಟಿಕ್ ಆಮ್ಲ"], ["Uric acid", "ಯೂರಿಕ್ ಆಮ್ಲ"]], 2, ["Anaerobic respiration in muscles produces lactic acid, causing fatigue.", "ಸ್ನಾಯುಗಳಲ್ಲಿನ ಅನಾಮ್ಲಜನಕ ಉಸಿರಾಟದಿಂದ ಲ್ಯಾಕ್ಟಿಕ್ ಆಮ್ಲ ಉತ್ಪತ್ತಿಯಾಗಿ ಆಯಾಸ ಉಂಟಾಗುತ್ತದೆ."]], ["Paper-2 · 2017", "Match the study disciplines (List I) with the subjects of study (List II):\nList I: A. Entomology  B. Mycology  C. Phycology  D. Desmology\nList II: I. Algae  II. Fungi  III. Insects  IV. Ligaments", "ಅಧ್ಯಯನ ಶಾಖೆಗಳನ್ನು (ಪಟ್ಟಿ I) ಅಧ್ಯಯನ ವಿಷಯಗಳೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. ಕೀಟಶಾಸ್ತ್ರ  B. ಶಿಲೀಂಧ್ರಶಾಸ್ತ್ರ  C. ಪಾಚಿಶಾಸ್ತ್ರ  D. ಸ್ನಾಯುಬಂಧಶಾಸ್ತ್ರ (ಡೆಸ್ಮಾಲಜಿ)\nಪಟ್ಟಿ II: I. ಪಾಚಿ  II. ಶಿಲೀಂಧ್ರ  III. ಕೀಟಗಳು  IV. ಸ್ನಾಯುರಜ್ಜುಗಳು (ಲಿಗಮೆಂಟ್)", [["A–III, B–II, C–IV, D–I", ""], ["A–III, B–II, C–I, D–IV", ""], ["A–II, B–III, C–IV, D–I", ""], ["A–II, B–III, C–I, D–IV", ""]], 1, ["Entomology – insects; Mycology – fungi; Phycology – algae; Desmology – ligaments.", "ಎಂಟೊಮಾಲಜಿ – ಕೀಟಗಳು; ಮೈಕಾಲಜಿ – ಶಿಲೀಂಧ್ರ; ಫೈಕಾಲಜಿ – ಪಾಚಿ; ಡೆಸ್ಮಾಲಜಿ – ಲಿಗಮೆಂಟ್."]], ["Paper-2 · 2017", "Consider the following hydrocarbons:\nA. Methane  B. Ethane  C. Propane  D. Butane  E. Pentane\nWhat is the correct sequence of increasing order of their molecular weight?", "ಕೆಳಗಿನ ಹೈಡ್ರೋಕಾರ್ಬನ್‌ಗಳನ್ನು ಪರಿಗಣಿಸಿ:\nA. ಮೀಥೇನ್  B. ಈಥೇನ್  C. ಪ್ರೊಪೇನ್  D. ಬ್ಯೂಟೇನ್  E. ಪೆಂಟೇನ್\nಅವುಗಳ ಅಣು ತೂಕದ ಏರುಕ್ರಮದ ಸರಿಯಾದ ಅನುಕ್ರಮ ಯಾವುದು?", [["A, B, D, C, E", ""], ["B, A, D, C, E", ""], ["A, B, C, D, E", ""], ["C, B, A, D, E", ""]], 2, ["Molecular weights: methane 16, ethane 30, propane 44, butane 58, pentane 72.", "ಅಣು ತೂಕ: ಮೀಥೇನ್ 16, ಈಥೇನ್ 30, ಪ್ರೊಪೇನ್ 44, ಬ್ಯೂಟೇನ್ 58, ಪೆಂಟೇನ್ 72."]], ["Paper-2 · 2017", "Which of the following are correct about Indian Aircrafts?\nA. Tejas is a multirole light combat aircraft.\nB. Saras is the first indigenous multipurpose civilian aircraft.\nC. Lakshya is a pilotless target aircraft.", "ಭಾರತೀಯ ವಿಮಾನಗಳ ಕುರಿತು ಯಾವುದು ಸರಿ?\nA. ತೇಜಸ್ ಬಹುಪಾತ್ರದ ಲಘು ಯುದ್ಧ ವಿಮಾನ.\nB. ಸರಸ್ ಮೊದಲ ದೇಶೀಯ ಬಹೂಪಯೋಗಿ ನಾಗರಿಕ ವಿಮಾನ.\nC. ಲಕ್ಷ್ಯ ಚಾಲಕರಹಿತ ಗುರಿ ವಿಮಾನ.", [["A and B only", "A ಮತ್ತು B ಮಾತ್ರ"], ["B and C only", "B ಮತ್ತು C ಮಾತ್ರ"], ["A and C only", "A ಮತ್ತು C ಮಾತ್ರ"], ["A, B and C", "A, B ಮತ್ತು C"]], 3, ["All three descriptions are correct.", "ಮೂರೂ ವಿವರಣೆಗಳು ಸರಿಯಾಗಿವೆ."]], ["Paper-2 · 2017", "Which of the following is the air-to-air refueller aircraft of the Indian Air Force?", "ಭಾರತೀಯ ವಾಯುಪಡೆಯ ಗಾಳಿಯಲ್ಲೇ ಇಂಧನ ತುಂಬುವ (air-to-air refueller) ವಿಮಾನ ಯಾವುದು?", [["C-17 Globemaster", "C-17 ಗ್ಲೋಬ್‌ಮಾಸ್ಟರ್"], ["Ilyushin-76", "ಇಲ್ಯುಶಿನ್-76"], ["Ilyushin-78", "ಇಲ್ಯುಶಿನ್-78"], ["C-130J Hercules", "C-130J ಹರ್ಕ್ಯುಲಸ್"]], 2, ["The IAF’s tanker is the Ilyushin Il-78 (‘Midas’).", "ವಾಯುಪಡೆಯ ಟ್ಯಾಂಕರ್ ವಿಮಾನ ಇಲ್ಯುಶಿನ್ Il-78."]], ["Paper-2 · 2017", "Kigali Agreement 2016 is a big step in fighting climate change. It is related to which of the following?\nA. Amendment to the Montreal Protocol to reduce the manufacture and use of Hydrofluorocarbons (HFCs).\nB. Amendment to the Montreal Protocol to reduce the manufacture and use of Chlorofluorocarbons (CFCs).", "2016ರ ಕಿಗಾಲಿ ಒಪ್ಪಂದ ಹವಾಮಾನ ಬದಲಾವಣೆ ವಿರುದ್ಧದ ಹೋರಾಟದಲ್ಲಿ ದೊಡ್ಡ ಹೆಜ್ಜೆ. ಇದು ಯಾವುದಕ್ಕೆ ಸಂಬಂಧಿಸಿದೆ?\nA. ಹೈಡ್ರೋಫ್ಲೋರೋಕಾರ್ಬನ್ (HFC) ಗಳ ತಯಾರಿಕೆ ಮತ್ತು ಬಳಕೆ ಕಡಿಮೆ ಮಾಡಲು ಮಾಂಟ್ರಿಯಲ್ ಪ್ರೋಟೋಕಾಲ್‌ಗೆ ತಿದ್ದುಪಡಿ.\nB. ಕ್ಲೋರೋಫ್ಲೋರೋಕಾರ್ಬನ್ (CFC) ಗಳ ತಯಾರಿಕೆ ಮತ್ತು ಬಳಕೆ ಕಡಿಮೆ ಮಾಡಲು ಮಾಂಟ್ರಿಯಲ್ ಪ್ರೋಟೋಕಾಲ್‌ಗೆ ತಿದ್ದುಪಡಿ.", [["A only", "A ಮಾತ್ರ"], ["B only", "B ಮಾತ್ರ"], ["Both A and B", "Both A ಮತ್ತು B"], ["Neither A nor B", "Neither A nor B"]], 0, ["Kigali (2016) phases down HFCs; CFCs were already covered earlier by the Montreal Protocol.", "ಕಿಗಾಲಿ (2016) HFC ಗಳನ್ನು ಹಂತಹಂತವಾಗಿ ಕಡಿಮೆ ಮಾಡುತ್ತದೆ; CFC ಗಳು ಮೊದಲೇ ಮಾಂಟ್ರಿಯಲ್ ಪ್ರೋಟೋಕಾಲ್‌ನಲ್ಲಿವೆ."]], ["Paper-2 · 2017", "Which of these are tiger reserves in the State of Karnataka?\nA. Bannerghatta National Park\nB. Daroji Wildlife Sanctuary\nC. Cauvery Wildlife Sanctuary\nD. Kudremukh National Park", "ಕರ್ನಾಟಕ ರಾಜ್ಯದ ಹುಲಿ ಸಂರಕ್ಷಿತ ಪ್ರದೇಶಗಳು ಯಾವುವು?\nA. ಬನ್ನೇರುಘಟ್ಟ ರಾಷ್ಟ್ರೀಯ ಉದ್ಯಾನ\nB. ದರೋಜಿ ವನ್ಯಜೀವಿ ಧಾಮ\nC. ಕಾವೇರಿ ವನ್ಯಜೀವಿ ಧಾಮ\nD. ಕುದುರೆಮುಖ ರಾಷ್ಟ್ರೀಯ ಉದ್ಯಾನ", [["A and D only", "A ಮತ್ತು D ಮಾತ್ರ"], ["A, C and D only", "A, C ಮತ್ತು D ಮಾತ್ರ"], ["A, B, C and D", "A, B, C ಮತ್ತು D"], ["None of the above", "ಮೇಲಿನ ಯಾವುದೂ ಅಲ್ಲ"]], 3, ["Karnataka’s tiger reserves are Bandipur, Nagarahole, BRT, Bhadra and Dandeli-Anshi — none of the four listed.", "ಕರ್ನಾಟಕದ ಹುಲಿ ಸಂರಕ್ಷಿತ ಪ್ರದೇಶಗಳು ಬಂಡೀಪುರ, ನಾಗರಹೊಳೆ, ಬಿಆರ್‌ಟಿ, ಭದ್ರಾ, ದಾಂಡೇಲಿ-ಅಣಶಿ — ಪಟ್ಟಿಯಲ್ಲಿ ಯಾವುದೂ ಇಲ್ಲ."]], ["Paper-2 · 2017", "The pendulum of a clock consists of a heavy point mass (bob) tied to a massless string. It is oscillating faster and so the clock is going fast. What option below should be adopted to increase the time of oscillation?", "ಗಡಿಯಾರದ ಲೋಲಕವು ತೂಕವಿಲ್ಲದ ದಾರಕ್ಕೆ ಕಟ್ಟಿದ ಭಾರವಾದ ಬಿಂದು ರಾಶಿಯನ್ನು (ಬಾಬ್) ಹೊಂದಿದೆ. ಅದು ವೇಗವಾಗಿ ಆಂದೋಲಿಸುತ್ತಿದ್ದು ಗಡಿಯಾರ ವೇಗವಾಗಿ ಓಡುತ್ತಿದೆ. ಆಂದೋಲನ ಕಾಲವನ್ನು ಹೆಚ್ಚಿಸಲು ಯಾವ ಆಯ್ಕೆ ಅನುಸರಿಸಬೇಕು?", [["The mass of the bob should be increased", "ಬಾಬ್‌ನ ರಾಶಿಯನ್ನು ಹೆಚ್ಚಿಸಬೇಕು"], ["The length of the pendulum should be increased", "ಲೋಲಕದ ಉದ್ದವನ್ನು ಹೆಚ್ಚಿಸಬೇಕು"], ["The length of the pendulum should be decreased", "ಲೋಲಕದ ಉದ್ದವನ್ನು ಕಡಿಮೆ ಮಾಡಬೇಕು"], ["The mass of the bob should be decreased", "ಬಾಬ್‌ನ ರಾಶಿಯನ್ನು ಕಡಿಮೆ ಮಾಡಬೇಕು"]], 1, ["Time period T = 2π√(L/g) depends only on length, so increase the length to slow the clock.", "ಆವರ್ತ ಕಾಲ T = 2π√(L/g) ಉದ್ದವನ್ನು ಮಾತ್ರ ಅವಲಂಬಿಸಿದೆ; ಗಡಿಯಾರ ನಿಧಾನಗೊಳಿಸಲು ಉದ್ದ ಹೆಚ್ಚಿಸಿ."]], ["Paper-2 · 2017", "Khaira disease in rice is caused due to the deficiency of", "ಭತ್ತದಲ್ಲಿ ‘ಖೈರಾ’ ರೋಗ ಯಾವುದರ ಕೊರತೆಯಿಂದ ಉಂಟಾಗುತ್ತದೆ?", [["Molybdenum", "ಮಾಲಿಬ್ಡಿನಮ್"], ["Calcium", "ಕ್ಯಾಲ್ಸಿಯಂ"], ["Zinc", "ಸತು (ಝಿಂಕ್)"], ["Phosphorus", "ರಂಜಕ"]], 2, ["Khaira disease of paddy is due to zinc deficiency.", "ಭತ್ತದ ಖೈರಾ ರೋಗ ಸತುವಿನ ಕೊರತೆಯಿಂದ ಬರುತ್ತದೆ."]], ["Paper-2 · 2017", "According to the “Bureau of Indian Standards” the permissible “pH value” in drinking water should be in the range of", "ಭಾರತೀಯ ಮಾನಕ ಬ್ಯೂರೋ (BIS) ಪ್ರಕಾರ ಕುಡಿಯುವ ನೀರಿನಲ್ಲಿ ಅನುಮತಿಸಲಾದ “pH ಮೌಲ್ಯ” ಈ ವ್ಯಾಪ್ತಿಯಲ್ಲಿರಬೇಕು", [["4·5 to 6·5", "4.5 ರಿಂದ 6.5"], ["5·5 to 7·5", "5.5 ರಿಂದ 7.5"], ["6·5 to 8·5", "6.5 ರಿಂದ 8.5"], ["7·5 to 9·5", "7.5 ರಿಂದ 9.5"]], 2, ["BIS limits drinking-water pH to 6.5–8.5.", "BIS ಪ್ರಕಾರ ಕುಡಿಯುವ ನೀರಿನ pH 6.5–8.5 ನಡುವೆ ಇರಬೇಕು."]], ["Paper-2 · 2017", "Consider the following statements regarding launch of 104 satellites by PSLV C-37 in February 2017:\nA. India is the first country to launch 104 satellites on a single rocket.\nB. It also included India’s satellites namely earth-mapping Cartosat-2 satellite and nanosatellites INS-1A and INS-1B.\nC. Antrix Corporation Limited is the commercial arm of the Indian Space Research Organisation (ISRO).", "2017ರ ಫೆಬ್ರವರಿಯಲ್ಲಿ PSLV C-37 ಮೂಲಕ 104 ಉಪಗ್ರಹಗಳ ಉಡಾವಣೆಯ ಕುರಿತು:\nA. ಒಂದೇ ರಾಕೆಟ್‌ನಲ್ಲಿ 104 ಉಪಗ್ರಹ ಉಡಾಯಿಸಿದ ಮೊದಲ ದೇಶ ಭಾರತ.\nB. ಇದರಲ್ಲಿ ಭಾರತದ ಕಾರ್ಟೊಸ್ಯಾಟ್-2 ಮತ್ತು ನ್ಯಾನೋ ಉಪಗ್ರಹಗಳಾದ INS-1A, INS-1B ಸೇರಿದ್ದವು.\nC. ಆಂಟ್ರಿಕ್ಸ್ ಕಾರ್ಪೊರೇಷನ್ ಇಸ್ರೋದ ವಾಣಿಜ್ಯ ವಿಭಾಗ.", [["A and B only", "A ಮತ್ತು B ಮಾತ್ರ"], ["A and C only", "A ಮತ್ತು C ಮಾತ್ರ"], ["B and C only", "B ಮತ್ತು C ಮಾತ್ರ"], ["A, B and C", "A, B ಮತ್ತು C"]], 3, ["PSLV-C37 carried 104 satellites (a world record then), including Cartosat-2D, INS-1A and INS-1B; Antrix is ISRO’s commercial arm.", "PSLV-C37 104 ಉಪಗ್ರಹ ಉಡಾಯಿಸಿತು (ಆಗ ವಿಶ್ವ ದಾಖಲೆ); ಕಾರ್ಟೊಸ್ಯಾಟ್-2D, INS-1A, INS-1B ಇದ್ದವು; ಆಂಟ್ರಿಕ್ಸ್ ಇಸ್ರೋದ ವಾಣಿಜ್ಯ ವಿಭಾಗ."]], ["Paper-2 · Aug 2024", "Which of the following statements are correct with reference to ‘AdBlue’?\n(a) It is a diesel exhaust fluid used to reduce the amount of air pollution emitted by BS 6 diesel engine.\n(b) It is a mixture of demineralised water and pure urea.\n(c) It is blue colour toxic fluid with highly flammable properties.\n(d) It reduces the level of sulphur dioxide from the vehicle emission.", "‘AdBlue’ ಕುರಿತು ಯಾವ ಹೇಳಿಕೆಗಳು ಸರಿ?\n(a) ಇದು BS 6 ಡೀಸೆಲ್ ಎಂಜಿನ್ ಹೊರಸೂಸುವ ವಾಯು ಮಾಲಿನ್ಯ ಕಡಿಮೆ ಮಾಡಲು ಬಳಸುವ ಡೀಸೆಲ್ ಎಕ್ಸಾಸ್ಟ್ ದ್ರವ.\n(b) ಇದು ಡಿಮಿನರಲೈಸ್ಡ್ ನೀರು ಮತ್ತು ಶುದ್ಧ ಯೂರಿಯಾದ ಮಿಶ್ರಣ.\n(c) ಇದು ಅತ್ಯಂತ ಜ್ವಲನಶೀಲ ನೀಲಿ ಬಣ್ಣದ ವಿಷಕಾರಿ ದ್ರವ.\n(d) ಇದು ವಾಹನ ಹೊರಸೂಸುವಿಕೆಯಲ್ಲಿ ಸಲ್ಫರ್ ಡೈಆಕ್ಸೈಡ್ ಮಟ್ಟ ಕಡಿಮೆ ಮಾಡುತ್ತದೆ.", [["All statements are correct", "ಎಲ್ಲ ಹೇಳಿಕೆಗಳು ಸರಿ"], ["(a) and (b) only", "(a) ಮತ್ತು (b) ಮಾತ್ರ"], ["(a) and (d) only", "(a) ಮತ್ತು (d) ಮಾತ್ರ"], ["(b) and (d) only", "(b) ಮತ್ತು (d) ಮಾತ್ರ"]], 1, ["AdBlue (32.5% urea in demineralised water) cuts nitrogen oxides; it is non-toxic and non-flammable and does not reduce SO₂.", "AdBlue (ಡಿಮಿನರಲೈಸ್ಡ್ ನೀರಿನಲ್ಲಿ ಶೇ. 32.5 ಯೂರಿಯಾ) ನೈಟ್ರೋಜನ್ ಆಕ್ಸೈಡ್ ಕಡಿಮೆ ಮಾಡುತ್ತದೆ; ವಿಷಕಾರಿಯೂ ಜ್ವಲನಶೀಲವೂ ಅಲ್ಲ; SO₂ ಕಡಿಮೆ ಮಾಡುವುದಿಲ್ಲ."]], ["Paper-2 · Aug 2024", "Which of the following radioactive materials is having highest half-life?", "ಕೆಳಗಿನ ಯಾವ ವಿಕಿರಣಶೀಲ ವಸ್ತುವಿಗೆ ಅತಿ ಹೆಚ್ಚು ಅರ್ಧಾಯುಷ್ಯ (half-life) ಇದೆ?", [["Plutonium-239", "ಪ್ಲುಟೋನಿಯಂ-239"], ["Cobalt-60", "ಕೋಬಾಲ್ಟ್-60"], ["Uranium-235", "ಯುರೇನಿಯಂ-235"], ["Uranium-238", "ಯುರೇನಿಯಂ-238"]], 3, ["Half-lives: Co-60 ≈ 5.3 years, Pu-239 ≈ 24,100 years, U-235 ≈ 0.7 billion years, U-238 ≈ 4.5 billion years.", "ಅರ್ಧಾಯುಷ್ಯ: Co-60 ≈ 5.3 ವರ್ಷ, Pu-239 ≈ 24,100 ವರ್ಷ, U-235 ≈ 70 ಕೋಟಿ ವರ್ಷ, U-238 ≈ 450 ಕೋಟಿ ವರ್ಷ."]], ["Paper-2 · Aug 2024", "Statement : Energy flow in a food chain reduces at each trophic level.\nReason : At each trophic level energy is lost because organisms use them for their survival, growth and development.", "ಹೇಳಿಕೆ: ಆಹಾರ ಸರಪಳಿಯಲ್ಲಿ ಪ್ರತಿ ಪೋಷಣಾ ಹಂತದಲ್ಲಿ ಶಕ್ತಿ ಪ್ರವಾಹ ಕಡಿಮೆಯಾಗುತ್ತದೆ.\nಕಾರಣ: ಪ್ರತಿ ಪೋಷಣಾ ಹಂತದಲ್ಲಿ ಜೀವಿಗಳು ತಮ್ಮ ಬದುಕು, ಬೆಳವಣಿಗೆ ಮತ್ತು ಅಭಿವೃದ್ಧಿಗೆ ಶಕ್ತಿ ಬಳಸುವುದರಿಂದ ಶಕ್ತಿ ನಷ್ಟವಾಗುತ್ತದೆ.", [["Statement and Reason both are correct", "ಹೇಳಿಕೆ ಮತ್ತು ಕಾರಣ ಎರಡೂ ಸರಿ"], ["Statement is correct but Reason is not correct", "ಹೇಳಿಕೆ ಸರಿ ಆದರೆ ಕಾರಣ ಸರಿಯಿಲ್ಲ"], ["Only Reason is correct, Statement is not correct", "ಕಾರಣ ಮಾತ್ರ ಸರಿ, ಹೇಳಿಕೆ ಸರಿಯಿಲ್ಲ"], ["Both Statement and Reason are not correct", "ಹೇಳಿಕೆ ಮತ್ತು ಕಾರಣ ಎರಡೂ ಸರಿಯಿಲ್ಲ"]], 0, ["Only about 10% of energy passes to the next level; the rest is used in life processes and lost as heat.", "ಸುಮಾರು ಶೇ. 10 ಶಕ್ತಿ ಮಾತ್ರ ಮುಂದಿನ ಹಂತಕ್ಕೆ ಹೋಗುತ್ತದೆ; ಉಳಿದದ್ದು ಜೀವಕ್ರಿಯೆಗಳಿಗೆ ಬಳಕೆಯಾಗಿ ಶಾಖವಾಗಿ ನಷ್ಟವಾಗುತ್ತದೆ."]], ["Paper-2 · Aug 2024", "A number reduced by 25% becomes 225. What percent should it be increased so that it becomes 390?", "ಒಂದು ಸಂಖ್ಯೆಯನ್ನು ಶೇ. 25 ರಷ್ಟು ಕಡಿಮೆ ಮಾಡಿದಾಗ 225 ಆಗುತ್ತದೆ. ಅದು 390 ಆಗಲು ಅದನ್ನು ಶೇಕಡಾ ಎಷ್ಟು ಹೆಚ್ಚಿಸಬೇಕು?", [["30%", "ಶೇ. 30"], ["35%", "ಶೇ. 35"], ["46%", "ಶೇ. 46"], ["52%", "ಶೇ. 52"]], 0, ["Number = 225 ÷ 0.75 = 300; (390 − 300)/300 = 30%.", "ಸಂಖ್ಯೆ = 225 ÷ 0.75 = 300; (390 − 300)/300 = ಶೇ. 30."]], ["Paper-2 · Aug 2024", "When 15 is included in a list of natural numbers, their mean is increased by 2. When 1 is included in the new list, the mean of the numbers in the new list is decreased by 1. How many numbers were there in the original list?", "ನೈಸರ್ಗಿಕ ಸಂಖ್ಯೆಗಳ ಪಟ್ಟಿಗೆ 15 ಸೇರಿಸಿದಾಗ ಅವುಗಳ ಸರಾಸರಿ 2 ರಷ್ಟು ಹೆಚ್ಚುತ್ತದೆ. ಹೊಸ ಪಟ್ಟಿಗೆ 1 ಸೇರಿಸಿದಾಗ ಸರಾಸರಿ 1 ರಷ್ಟು ಕಡಿಮೆಯಾಗುತ್ತದೆ. ಮೂಲ ಪಟ್ಟಿಯಲ್ಲಿ ಎಷ್ಟು ಸಂಖ್ಯೆಗಳಿದ್ದವು?", [["8", "8"], ["7", "7"], ["5", "5"], ["4", "4"]], 3, ["With n numbers, mean m: m = 13 − 2n and 2m + n = 14 → n = 4.", "n ಸಂಖ್ಯೆ, ಸರಾಸರಿ m ಆದರೆ m = 13 − 2n ಮತ್ತು 2m + n = 14 → n = 4."]], ["Paper-2 · Aug 2024", "A box contains 20 articles, out of which 4 are defective. Two articles are drawn at random from this box. The probability that at least one of them is defective, is", "ಒಂದು ಪೆಟ್ಟಿಗೆಯಲ್ಲಿ 20 ವಸ್ತುಗಳಿದ್ದು ಅವುಗಳಲ್ಲಿ 4 ದೋಷಯುಕ್ತ. ಯಾದೃಚ್ಛಿಕವಾಗಿ ಎರಡು ವಸ್ತುಗಳನ್ನು ತೆಗೆದರೆ ಕನಿಷ್ಠ ಒಂದು ದೋಷಯುಕ್ತವಾಗಿರುವ ಸಂಭವನೀಯತೆ", [["4/19", "4/19"], ["7/19", "7/19"], ["9/19", "9/19"], ["5/19", "5/19"]], 1, ["1 − C(16,2)/C(20,2) = 1 − 120/190 = 70/190 = 7/19.", "1 − C(16,2)/C(20,2) = 1 − 120/190 = 7/19."]], ["Paper-2 · Aug 2024", "A box contains 2 white balls, 3 black balls and 4 red balls. In how many ways can 3 balls be drawn from the box, if at least one black ball is to be included in the draw?", "ಒಂದು ಪೆಟ್ಟಿಗೆಯಲ್ಲಿ 2 ಬಿಳಿ, 3 ಕಪ್ಪು ಮತ್ತು 4 ಕೆಂಪು ಚೆಂಡುಗಳಿವೆ. ಕನಿಷ್ಠ ಒಂದು ಕಪ್ಪು ಚೆಂಡು ಸೇರುವಂತೆ 3 ಚೆಂಡುಗಳನ್ನು ಎಷ್ಟು ವಿಧಗಳಲ್ಲಿ ತೆಗೆಯಬಹುದು?", [["32", "32"], ["64", "64"], ["48", "48"], ["96", "96"]], 1, ["Total C(9,3) = 84; with no black C(6,3) = 20; so 84 − 20 = 64.", "ಒಟ್ಟು C(9,3) = 84; ಕಪ್ಪು ಇಲ್ಲದೆ C(6,3) = 20; 84 − 20 = 64."]], ["Paper-2 · Aug 2024", "A man has some hens and cows. If the number of heads be 48 and the number of feet equals 140, then the number of hens will be", "ಒಬ್ಬ ವ್ಯಕ್ತಿಯಲ್ಲಿ ಕೆಲವು ಕೋಳಿಗಳು ಮತ್ತು ಹಸುಗಳಿವೆ. ತಲೆಗಳ ಸಂಖ್ಯೆ 48 ಮತ್ತು ಕಾಲುಗಳ ಸಂಖ್ಯೆ 140 ಆದರೆ ಕೋಳಿಗಳ ಸಂಖ್ಯೆ", [["22", "22"], ["23", "23"], ["24", "24"], ["26", "26"]], 3, ["h + c = 48 and 2h + 4c = 140 → c = 22, h = 26.", "h + c = 48 ಮತ್ತು 2h + 4c = 140 → c = 22, h = 26."]], ["Paper-2 · Aug 2024", "All oranges are bananas. No banana is fruit.\nConclusions :\n(a) Some bananas are oranges.\n(b) No fruit is banana.\n(c) All oranges are fruits.\n(d) Some fruits are oranges.", "ಎಲ್ಲ ಕಿತ್ತಳೆಗಳು ಬಾಳೆಹಣ್ಣುಗಳು. ಯಾವ ಬಾಳೆಹಣ್ಣೂ ಹಣ್ಣಲ್ಲ.\nತೀರ್ಮಾನಗಳು:\n(a) ಕೆಲವು ಬಾಳೆಹಣ್ಣುಗಳು ಕಿತ್ತಳೆಗಳು.\n(b) ಯಾವ ಹಣ್ಣೂ ಬಾಳೆಹಣ್ಣಲ್ಲ.\n(c) ಎಲ್ಲ ಕಿತ್ತಳೆಗಳು ಹಣ್ಣುಗಳು.\n(d) ಕೆಲವು ಹಣ್ಣುಗಳು ಕಿತ್ತಳೆಗಳು.", [["Only conclusion (c) and (d) follow", "(c) ಮತ್ತು (d) ತೀರ್ಮಾನಗಳು ಮಾತ್ರ ಅನುಸರಿಸುತ್ತವೆ"], ["Only conclusion (a) and (b) follow", "(a) ಮತ್ತು (b) ತೀರ್ಮಾನಗಳು ಮಾತ್ರ ಅನುಸರಿಸುತ್ತವೆ"], ["Only conclusion (a) and (c) follow", "(a) ಮತ್ತು (c) ತೀರ್ಮಾನಗಳು ಮಾತ್ರ ಅನುಸರಿಸುತ್ತವೆ"], ["None of the above", "ಮೇಲಿನ ಯಾವುದೂ ಅಲ್ಲ"]], 1, ["‘All A are B’ gives ‘some B are A’ (a); ‘No B is C’ gives ‘No C is B’ (b). (c) and (d) contradict the premise.", "‘ಎಲ್ಲ A ಗಳು B’ ಎಂದರೆ ‘ಕೆಲವು B ಗಳು A’ (a); ‘ಯಾವ B ಯೂ C ಅಲ್ಲ’ ಎಂದರೆ ‘ಯಾವ C ಯೂ B ಅಲ್ಲ’ (b). (c), (d) ಪೂರ್ವಾಪೇಕ್ಷೆಗೆ ವಿರುದ್ಧ."]], ["Paper-2 · Re-exam Dec 2024", "Rupesh introduces Poonam as the daughter of the only son of my father’s wife. How is Poonam related to Rupesh?", "ರೂಪೇಶ್ ಪೂನಂ ಅವರನ್ನು “ನನ್ನ ತಂದೆಯ ಪತ್ನಿಯ ಒಬ್ಬನೇ ಮಗನ ಮಗಳು” ಎಂದು ಪರಿಚಯಿಸುತ್ತಾನೆ. ಪೂನಂ ರೂಪೇಶ್‌ಗೆ ಯಾರಾಗಬೇಕು?", [["Cousin", "ಸೋದರಿ/ಸೋದರ ಸಂಬಂಧಿ"], ["Niece", "ಸೋದರ/ಸೋದರಿಯ ಮಗಳು"], ["Daughter", "ಮಗಳು"], ["Aunt", "ಚಿಕ್ಕಮ್ಮ/ಅತ್ತೆ"]], 2, ["Father’s wife = mother; her only son = Rupesh himself; so Poonam is his daughter.", "ತಂದೆಯ ಪತ್ನಿ = ತಾಯಿ; ಅವಳ ಒಬ್ಬನೇ ಮಗ = ರೂಪೇಶ್; ಆದ್ದರಿಂದ ಪೂನಂ ಅವನ ಮಗಳು."]], ["Paper-2 · Re-exam Dec 2024", "8 points lie on the circumference of a circle. How many more quadrilaterals can be formed by connecting these points compared to number of triangles?", "ವೃತ್ತದ ಪರಿಧಿಯ ಮೇಲೆ 8 ಬಿಂದುಗಳಿವೆ. ಈ ಬಿಂದುಗಳನ್ನು ಜೋಡಿಸಿ ತ್ರಿಭುಜಗಳಿಗಿಂತ ಎಷ್ಟು ಹೆಚ್ಚು ಚತುರ್ಭುಜಗಳನ್ನು ರಚಿಸಬಹುದು?", [["14", "14"], ["24", "24"], ["16", "16"], ["18", "18"]], 0, ["Quadrilaterals C(8,4) = 70; triangles C(8,3) = 56; difference = 14.", "ಚತುರ್ಭುಜಗಳು C(8,4) = 70; ತ್ರಿಭುಜಗಳು C(8,3) = 56; ವ್ಯತ್ಯಾಸ = 14."]], ["Paper-2 · Re-exam Dec 2024", "The James Webb Space Telescope (JWST) is a space telescope, launched in 2021, which conducts space astronomy in the ______ wavelength range of the electromagnetic spectrum.", "ಜೇಮ್ಸ್ ವೆಬ್ ಬಾಹ್ಯಾಕಾಶ ದೂರದರ್ಶಕ (JWST) 2021ರಲ್ಲಿ ಉಡಾವಣೆಯಾದ ದೂರದರ್ಶಕವಾಗಿದ್ದು ವಿದ್ಯುತ್ಕಾಂತೀಯ ವರ್ಣಪಟಲದ ______ ತರಂಗಾಂತರ ವ್ಯಾಪ್ತಿಯಲ್ಲಿ ಖಗೋಳ ಅಧ್ಯಯನ ಮಾಡುತ್ತದೆ.", [["Infrared", "ಅತಿಕೆಂಪು (ಇನ್‌ಫ್ರಾರೆಡ್)"], ["X-ray", "ಎಕ್ಸ್-ರೇ"], ["Microwave", "ಮೈಕ್ರೋವೇವ್"], ["Radiowave", "ರೇಡಿಯೋ ತರಂಗ"]], 0, ["JWST observes mainly in the infrared range.", "JWST ಮುಖ್ಯವಾಗಿ ಅತಿಕೆಂಪು (ಇನ್‌ಫ್ರಾರೆಡ್) ತರಂಗಾಂತರದಲ್ಲಿ ವೀಕ್ಷಿಸುತ್ತದೆ."]], ["Paper-2 · Re-exam Dec 2024", "Which of the following statement/statements are correct about the Indicator species?\nA. Crayfish can indicate the quality of freshwater, because changes in water acidity are stressful to them.\nB. The health of corals can indicate trends such as seawater rise and sea temperature fluctuation, which in turn are signals of climate change.\nC. Peregrine falcons are an indicator of pesticides.", "ಸೂಚಕ ಜಾತಿಗಳ (Indicator species) ಕುರಿತು ಯಾವ ಹೇಳಿಕೆ/ಹೇಳಿಕೆಗಳು ಸರಿ?\nA. ನೀರಿನ ಆಮ್ಲೀಯತೆಯ ಬದಲಾವಣೆ ಕ್ರೇಫಿಶ್‌ಗೆ ಒತ್ತಡ ತರುವುದರಿಂದ ಅದು ಸಿಹಿನೀರಿನ ಗುಣಮಟ್ಟವನ್ನು ಸೂಚಿಸುತ್ತದೆ.\nB. ಹವಳಗಳ ಆರೋಗ್ಯವು ಸಮುದ್ರ ಮಟ್ಟ ಏರಿಕೆ ಮತ್ತು ತಾಪಮಾನ ಏರಿಳಿತದಂತಹ ಹವಾಮಾನ ಬದಲಾವಣೆಯ ಸೂಚನೆಗಳನ್ನು ತೋರಿಸುತ್ತದೆ.\nC. ಪೆರೆಗ್ರಿನ್ ಫಾಲ್ಕನ್ ಕೀಟನಾಶಕಗಳ ಸೂಚಕ.", [["B only", "B ಮಾತ್ರ"], ["A and C", "A ಮತ್ತು C"], ["A and B", "A ಮತ್ತು B"], ["All of the above", "ಮೇಲಿನ ಎಲ್ಲವೂ"]], 3, ["Crayfish (acidity), corals (climate change) and peregrine falcons (pesticides like DDT) are all indicator species.", "ಕ್ರೇಫಿಶ್ (ಆಮ್ಲೀಯತೆ), ಹವಳ (ಹವಾಮಾನ ಬದಲಾವಣೆ), ಪೆರೆಗ್ರಿನ್ ಫಾಲ್ಕನ್ (DDT ಯಂತಹ ಕೀಟನಾಶಕ) ಎಲ್ಲವೂ ಸೂಚಕ ಜಾತಿಗಳು."]], ["Paper-2 · Re-exam Dec 2024", "Identify the tribal community: This tribal community worships their dairy-buffaloes with lots of veneration. They are seen as a pastoral tribe who herd buffaloes that roam the Nilgiri hills. Monogamy is an ideal norm. Residence after marriage is patrilocal. At the time of funeral rites, buffalo sacrifice is obligatory. Their distinctive Embroidery has got a GI Tag. The semi-barrel-shaped huts are very peculiar and have curious structures with no windows.", "ಬುಡಕಟ್ಟು ಸಮುದಾಯವನ್ನು ಗುರುತಿಸಿ: ಈ ಸಮುದಾಯ ತಮ್ಮ ಹಾಲಿನ ಎಮ್ಮೆಗಳನ್ನು ಅತ್ಯಂತ ಭಕ್ತಿಯಿಂದ ಪೂಜಿಸುತ್ತದೆ. ನೀಲಗಿರಿ ಬೆಟ್ಟಗಳಲ್ಲಿ ಎಮ್ಮೆ ಮೇಯಿಸುವ ಪಶುಪಾಲಕ ಬುಡಕಟ್ಟು. ಏಕಪತ್ನಿತ್ವ ಆದರ್ಶ ನಿಯಮ; ವಿವಾಹದ ನಂತರ ಪತಿಯ ಮನೆಯಲ್ಲಿ ವಾಸ; ಅಂತ್ಯಕ್ರಿಯೆಯಲ್ಲಿ ಎಮ್ಮೆ ಬಲಿ ಕಡ್ಡಾಯ. ಅವರ ವಿಶಿಷ್ಟ ಕಸೂತಿಗೆ GI ಟ್ಯಾಗ್ ಸಿಕ್ಕಿದೆ. ಅರ್ಧ ಬ್ಯಾರೆಲ್ ಆಕಾರದ, ಕಿಟಕಿಗಳಿಲ್ಲದ ಗುಡಿಸಲುಗಳು ಇವರ ವಿಶೇಷ.", [["Chenchu", "ಚೆಂಚು"], ["Hakkipikki", "ಹಕ್ಕಿಪಿಕ್ಕಿ"], ["Toda", "ತೋಡ"], ["Jenu Kuruba", "ಜೇನು ಕುರುಬ"]], 2, ["Todas of the Nilgiris are buffalo-herders known for Toda embroidery (GI) and barrel-shaped huts.", "ನೀಲಗಿರಿಯ ತೋಡರು ಎಮ್ಮೆ ಮೇಯಿಸುವವರು; ತೋಡ ಕಸೂತಿ (GI) ಮತ್ತು ಬ್ಯಾರೆಲ್ ಆಕಾರದ ಗುಡಿಸಲು ಇವರ ವಿಶೇಷ."]], ["Paper-2 · Re-exam Dec 2024", "Which of the following type of earthworm is a litter feeder?", "ಕೆಳಗಿನ ಯಾವ ವಿಧದ ಎರೆಹುಳು ಕಸ (ಎಲೆ ಕಸ) ತಿನ್ನುವಂಥದು?", [["Epigeic", "ಎಪಿಜಿಯಕ್ (ಮೇಲ್ಮೈ ವಾಸಿ)"], ["Endogeic", "ಎಂಡೋಜಿಯಕ್"], ["Aneceic", "ಅನೆಸಿಕ್"], ["None of the above", "ಮೇಲಿನ ಯಾವುದೂ ಅಲ್ಲ"]], 0, ["Epigeic worms live on the surface and feed on leaf litter.", "ಎಪಿಜಿಯಕ್ ಎರೆಹುಳುಗಳು ಮಣ್ಣಿನ ಮೇಲ್ಮೈಯಲ್ಲಿದ್ದು ಎಲೆ ಕಸ ತಿನ್ನುತ್ತವೆ."]], ["Paper-2 · Re-exam Dec 2024", "Match the following Ramsar site and the States:\nRamsar sites: A. Rudra Sagar Lake  B. Bakhira Wildlife Sanctuary  C. Sultanpur National Park  D. Pala Wetland\nStates: I. Haryana  II. Tripura  III. Uttar Pradesh  IV. Mizoram", "ರಾಮ್ಸರ್ ತಾಣಗಳನ್ನು ರಾಜ್ಯಗಳೊಂದಿಗೆ ಹೊಂದಿಸಿ:\nರಾಮ್ಸರ್ ತಾಣಗಳು: A. ರುದ್ರ ಸಾಗರ ಸರೋವರ  B. ಬಖಿರಾ ವನ್ಯಜೀವಿ ಧಾಮ  C. ಸುಲ್ತಾನ್‌ಪುರ ರಾಷ್ಟ್ರೀಯ ಉದ್ಯಾನ  D. ಪಾಲಾ ಜೌಗು ಪ್ರದೇಶ\nರಾಜ್ಯಗಳು: I. ಹರಿಯಾಣ  II. ತ್ರಿಪುರ  III. ಉತ್ತರ ಪ್ರದೇಶ  IV. ಮಿಜೋರಾಂ", [["A–IV, B–III, C–I, D–II", ""], ["A–III, B–II, C–I, D–IV", ""], ["A–II, B–III, C–I, D–IV", ""], ["A–II, B–IV, C–III, D–I", ""]], 2, ["Rudra Sagar – Tripura; Bakhira – Uttar Pradesh; Sultanpur – Haryana; Pala – Mizoram.", "ರುದ್ರ ಸಾಗರ – ತ್ರಿಪುರ; ಬಖಿರಾ – ಉತ್ತರ ಪ್ರದೇಶ; ಸುಲ್ತಾನ್‌ಪುರ – ಹರಿಯಾಣ; ಪಾಲಾ – ಮಿಜೋರಾಂ."]], ["Paper-2 · Re-exam Dec 2024", "Consider the following statements about Kelp Forest:\nA. They are montane forests that thrive well in cold temperatures.\nB. Pine (Pinus wallichiana), Deodar (Cedrus deodara) trees grow well in Kelp forest.\nWhich of the above statement/statements is/are correct?", "ಕೆಲ್ಪ್ ಅರಣ್ಯದ ಕುರಿತು ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ:\nA. ಇವು ತಂಪು ತಾಪಮಾನದಲ್ಲಿ ಚೆನ್ನಾಗಿ ಬೆಳೆಯುವ ಪರ್ವತ ಕಾಡುಗಳು.\nB. ಪೈನ್ (ಪೈನಸ್ ವಾಲಿಚಿಯಾನಾ) ಮತ್ತು ದೇವದಾರು ಮರಗಳು ಕೆಲ್ಪ್ ಅರಣ್ಯದಲ್ಲಿ ಚೆನ್ನಾಗಿ ಬೆಳೆಯುತ್ತವೆ.\nಮೇಲಿನ ಯಾವ ಹೇಳಿಕೆ/ಹೇಳಿಕೆಗಳು ಸರಿ?", [["A only", "A ಮಾತ್ರ"], ["B only", "B ಮಾತ್ರ"], ["Both A and B", "Both A ಮತ್ತು B"], ["None of the above", "ಮೇಲಿನ ಯಾವುದೂ ಅಲ್ಲ"]], 3, ["Kelp forests are underwater forests of large brown algae in cool coastal seas, not mountain forests.", "ಕೆಲ್ಪ್ ಅರಣ್ಯಗಳು ತಂಪಾದ ಕರಾವಳಿ ಸಮುದ್ರದ ಕಂದು ಪಾಚಿಗಳ ನೀರೊಳಗಿನ ಕಾಡುಗಳು, ಪರ್ವತ ಕಾಡುಗಳಲ್ಲ."]], ["Paper-2 · Re-exam Dec 2024", "During prolonged space missions, astronauts often experience muscle atrophy. This is primarily due to", "ದೀರ್ಘ ಬಾಹ್ಯಾಕಾಶ ಯಾನಗಳಲ್ಲಿ ಗಗನಯಾತ್ರಿಗಳಿಗೆ ಸ್ನಾಯು ಕ್ಷೀಣತೆ (muscle atrophy) ಆಗುತ್ತದೆ. ಇದಕ್ಕೆ ಮುಖ್ಯ ಕಾರಣ", [["Hyper gravity", "ಅತಿ ಗುರುತ್ವ"], ["Microgravity", "ಸೂಕ್ಷ್ಮ ಗುರುತ್ವ"], ["High caloric intake", "ಹೆಚ್ಚಿನ ಕ್ಯಾಲೊರಿ ಸೇವನೆ"], ["Increased radiation exposure", "ವಿಕಿರಣ ಒಡ್ಡುವಿಕೆ ಹೆಚ್ಚಳ"]], 1, ["In microgravity muscles bear little load and weaken.", "ಸೂಕ್ಷ್ಮ ಗುರುತ್ವದಲ್ಲಿ ಸ್ನಾಯುಗಳ ಮೇಲೆ ಭಾರ ಕಡಿಮೆಯಾಗಿ ಅವು ದುರ್ಬಲಗೊಳ್ಳುತ್ತವೆ."]], ["Paper-2 · Re-exam Dec 2024", "Which of the following research institutions centre are situated in Karnataka?\nA. National Centre for Biological Sciences\nB. Indian Institute of Horticultural Research\nC. Central Power Research Institute\nD. ICMR-National Institute of Epidemiology", "ಕೆಳಗಿನ ಯಾವ ಸಂಶೋಧನಾ ಸಂಸ್ಥೆಗಳು/ಕೇಂದ್ರಗಳು ಕರ್ನಾಟಕದಲ್ಲಿವೆ?\nA. ರಾಷ್ಟ್ರೀಯ ಜೀವವಿಜ್ಞಾನ ಕೇಂದ್ರ (NCBS)\nB. ಭಾರತೀಯ ತೋಟಗಾರಿಕೆ ಸಂಶೋಧನಾ ಸಂಸ್ಥೆ\nC. ಕೇಂದ್ರೀಯ ವಿದ್ಯುತ್ ಸಂಶೋಧನಾ ಸಂಸ್ಥೆ\nD. ICMR-ರಾಷ್ಟ್ರೀಯ ಸಾಂಕ್ರಾಮಿಕ ರೋಗಶಾಸ್ತ್ರ ಸಂಸ್ಥೆ", [["All of them", "ಎಲ್ಲವೂ"], ["Only three", "ಮೂರು ಮಾತ್ರ"], ["Only two", "ಎರಡು ಮಾತ್ರ"], ["Only one", "ಒಂದು ಮಾತ್ರ"]], 1, ["NCBS, IIHR and CPRI are in Bengaluru; ICMR-NIE is in Chennai.", "NCBS, IIHR, CPRI ಬೆಂಗಳೂರಿನಲ್ಲಿವೆ; ICMR-NIE ಚೆನ್ನೈನಲ್ಲಿದೆ."]], ["Paper-2 · Re-exam Dec 2024", "The Karnataka State Wildlife Board (SBWL) is headed by -", "ಕರ್ನಾಟಕ ರಾಜ್ಯ ವನ್ಯಜೀವಿ ಮಂಡಳಿಯ (SBWL) ಅಧ್ಯಕ್ಷರು -", [["Chief Minister of Karnataka", "ಕರ್ನಾಟಕದ ಮುಖ್ಯಮಂತ್ರಿ"], ["Forest Minister of Karnataka", "ಕರ್ನಾಟಕದ ಅರಣ್ಯ ಸಚಿವ"], ["Wildlife conservationist will be appointed by Governor of Karnataka", "ರಾಜ್ಯಪಾಲರು ನೇಮಿಸುವ ವನ್ಯಜೀವಿ ಸಂರಕ್ಷಕ"], ["None of the above are correct", "ಮೇಲಿನ ಯಾವುದೂ ಸರಿಯಲ್ಲ"]], 0, ["The State Board for Wildlife is chaired by the Chief Minister.", "ರಾಜ್ಯ ವನ್ಯಜೀವಿ ಮಂಡಳಿಗೆ ಮುಖ್ಯಮಂತ್ರಿ ಅಧ್ಯಕ್ಷರು."]], ["Paper-2 · Re-exam Dec 2024", "Why a cyclist can easily balance the cycle while cycling?", "ಸೈಕಲ್ ಸವಾರನು ಸೈಕಲ್ ಓಡಿಸುವಾಗ ಸುಲಭವಾಗಿ ಸಮತೋಲನ ಕಾಯ್ದುಕೊಳ್ಳಲು ಕಾರಣ ಏನು?", [["Due to the friction of the road", "ರಸ್ತೆಯ ಘರ್ಷಣೆಯಿಂದ"], ["Due to conservation of angular momentum", "ಕೋನೀಯ ಸಂವೇಗದ ಸಂರಕ್ಷಣೆಯಿಂದ"], ["Due to conservation of energy", "ಶಕ್ತಿ ಸಂರಕ್ಷಣೆಯಿಂದ"], ["Due to Earth’s gravitational pull", "ಭೂಮಿಯ ಗುರುತ್ವಾಕರ್ಷಣೆಯಿಂದ"]], 1, ["Spinning wheels keep their angular momentum, which resists tilting and helps balance.", "ತಿರುಗುವ ಚಕ್ರಗಳು ತಮ್ಮ ಕೋನೀಯ ಸಂವೇಗ ಉಳಿಸಿಕೊಳ್ಳುವುದರಿಂದ ವಾಲುವಿಕೆಗೆ ಪ್ರತಿರೋಧ ಸಿಕ್ಕಿ ಸಮತೋಲನ ಸಾಧ್ಯ."]]];
