<style>:root{--bg:#f4f6fb;--c:#fff;--t:#14213d;--m:#5a6478;--b:#d5dae6;--p:#14305f;--r:#c8102e;--ok:#1b8a4b;--no:#c8102e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

const Q=[[2014, "Which type of taxes help in reducing income disparities?", "ಆದಾಯ ಅಸಮಾನತೆಗಳನ್ನು ತಗ್ಗಿಸಲು ಯಾವ ರೀತಿಯ ತೆರಿಗೆಗಳು ಸಹಾಯ ಮಾಡುತ್ತವೆ?", ["Neutral Taxes", "Proportionate Taxes", "Progressive Taxes", "Regressive Taxes"], 2, ["Progressive taxes charge higher rates on higher incomes, reducing income inequality.", "ಪ್ರಗತಿಪರ ತೆರಿಗೆಗಳಲ್ಲಿ ಹೆಚ್ಚು ಆದಾಯಕ್ಕೆ ಹೆಚ್ಚು ತೆರಿಗೆ ವಿಧಿಸಿ ಅಸಮಾನತೆ ತಗ್ಗಿಸಲಾಗುತ್ತದೆ."]], [2017, "Consider the following statements regarding the Committee on Public Undertakings:\nA. The Committee consists of 22 members (15 from Lok Sabha and 7 from Rajya Sabha).\nB. The members of the Committee are elected by the Parliament every year.\nC. The Chairman of the Committee is appointed by the Speaker from amongst its members drawn from the Lok Sabha.\nD. The Chairmanship of the Committee is rotated among the members drawn from the Lok Sabha and the Rajya Sabha.", "ಸಾರ್ವಜನಿಕ ಉದ್ಯಮಗಳ ಸಮಿತಿಯ ಕುರಿತು ಈ ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ:\nA. ಸಮಿತಿಯಲ್ಲಿ 22 ಸದಸ್ಯರಿದ್ದಾರೆ (ಲೋಕಸಭೆಯಿಂದ 15, ರಾಜ್ಯಸಭೆಯಿಂದ 7).\nB. ಸಮಿತಿಯ ಸದಸ್ಯರನ್ನು ಸಂಸತ್ತು ಪ್ರತಿ ವರ್ಷ ಆಯ್ಕೆ ಮಾಡುತ್ತದೆ.\nC. ಲೋಕಸಭೆಯ ಸದಸ್ಯರಲ್ಲಿ ಒಬ್ಬರನ್ನು ಸ್ಪೀಕರ್ ಅಧ್ಯಕ್ಷರನ್ನಾಗಿ ನೇಮಿಸುತ್ತಾರೆ.\nD. ಅಧ್ಯಕ್ಷ ಸ್ಥಾನವು ಲೋಕಸಭೆ ಮತ್ತು ರಾಜ್ಯಸಭಾ ಸದಸ್ಯರ ನಡುವೆ ಸರದಿಯಂತೆ ಬದಲಾಗುತ್ತದೆ.\nಮೇಲಿನ ಯಾವ ಹೇಳಿಕೆಗಳು ಸರಿ?", ["A, B and C only", "B and D only", "A, B and D only", "A and B only"], 0, ["PUC has 22 members (15 LS + 7 RS) elected annually; the Speaker appoints a Lok Sabha member as Chairman — the post is not rotated.", "ಸಾರ್ವಜನಿಕ ಉದ್ಯಮಗಳ ಸಮಿತಿಯಲ್ಲಿ 22 ಸದಸ್ಯರು (15 ಲೋಕಸಭೆ + 7 ರಾಜ್ಯಸಭೆ); ಸ್ಪೀಕರ್ ಲೋಕಸಭಾ ಸದಸ್ಯರೊಬ್ಬರನ್ನು ಅಧ್ಯಕ್ಷರನ್ನಾಗಿ ನೇಮಿಸುತ್ತಾರೆ; ಸರದಿ ಇಲ್ಲ."]], [2014, "Which of the following Indus city has provided evidence for extensive water storage system?", "ವ್ಯಾಪಕ ಜಲಸಂಗ್ರಹಣೆ ವ್ಯವಸ್ಥೆಯ ಸಾಕ್ಷ್ಯ ನೀಡಿದ ಸಿಂಧೂ ನಗರ ಯಾವುದು?", ["Mohenjodaro", "Lothal", "Dholavira", "Kalibangan"], 2, ["Dholavira (Gujarat) is known for its elaborate water conservation and storage system.", "ಧೋಲಾವೀರ (ಗುಜರಾತ್) ವಿಸ್ತಾರವಾದ ಜಲ ಸಂರಕ್ಷಣೆ ಮತ್ತು ಸಂಗ್ರಹ ವ್ಯವಸ್ಥೆಗೆ ಹೆಸರಾಗಿದೆ."]], [2017, "Match the Articles of the Constitution (List I) with the Subjects (List II):\nList I: A. Article 155  B. Article 201  C. Article 213  D. Article 312\nList II: I. All India Services  II. President’s power to appoint the Governor  III. Instructions of the President required for the Governor to make ordinance relating to certain matters  IV. Bills reserved for consideration of the President by the Governor", "ಸಂವಿಧಾನದ ವಿಧಿಗಳನ್ನು (ಪಟ್ಟಿ I) ವಿಷಯಗಳೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. ವಿಧಿ 155  B. ವಿಧಿ 201  C. ವಿಧಿ 213  D. ವಿಧಿ 312\nಪಟ್ಟಿ II: I. ಅಖಿಲ ಭಾರತ ಸೇವೆಗಳು  II. ರಾಜ್ಯಪಾಲರನ್ನು ನೇಮಿಸುವ ರಾಷ್ಟ್ರಪತಿಯ ಅಧಿಕಾರ  III. ಕೆಲವು ವಿಷಯಗಳಲ್ಲಿ ಸುಗ್ರೀವಾಜ್ಞೆ ಹೊರಡಿಸಲು ರಾಜ್ಯಪಾಲರಿಗೆ ರಾಷ್ಟ್ರಪತಿಯ ಸೂಚನೆ ಅಗತ್ಯ  IV. ರಾಜ್ಯಪಾಲರು ರಾಷ್ಟ್ರಪತಿಯ ಪರಿಗಣನೆಗೆ ಕಾಯ್ದಿರಿಸಿದ ವಿಧೇಯಕಗಳು", ["A–I, B–II, C–III, D–IV", "A–II, B–III, C–I, D–IV", "A–II, B–IV, C–III, D–I", "A–IV, B–III, C–II, D–I"], 2, ["Art. 155 – Governor’s appointment; 201 – bills reserved for the President; 213 – ordinances needing Presidential instructions; 312 – All India Services.", "ವಿಧಿ 155 – ರಾಜ್ಯಪಾಲರ ನೇಮಕ; 201 – ರಾಷ್ಟ್ರಪತಿಗೆ ಕಾಯ್ದಿರಿಸಿದ ವಿಧೇಯಕ; 213 – ಸುಗ್ರೀವಾಜ್ಞೆಗೆ ರಾಷ್ಟ್ರಪತಿಯ ಸೂಚನೆ; 312 – ಅಖಿಲ ಭಾರತ ಸೇವೆಗಳು."]], [2017, "He was the Commander-in-chief of the army of Rani Chennamma. He fought with the British using guerrilla tactics. Who is this famous freedom fighter of Karnataka?", "ಇವರು ರಾಣಿ ಚೆನ್ನಮ್ಮನ ಸೇನಾಪತಿ. ಬ್ರಿಟಿಷರ ವಿರುದ್ಧ ಗೆರಿಲ್ಲಾ ತಂತ್ರದಿಂದ ಹೋರಾಡಿದ ಕರ್ನಾಟಕದ ಈ ಸ್ವಾತಂತ್ರ್ಯ ಹೋರಾಟಗಾರ ಯಾರು?", ["Muduvidu Krishnarao", "Aluru Venkata Rao", "Jogi Beeranna Nayak", "Sangolli Rayanna"], 3, ["Sangolli Rayanna was Rani Chennamma’s commander and kept up guerrilla warfare against the British.", "ಸಂಗೊಳ್ಳಿ ರಾಯಣ್ಣ ರಾಣಿ ಚೆನ್ನಮ್ಮನ ಸೇನಾಪತಿಯಾಗಿದ್ದು ಬ್ರಿಟಿಷರ ವಿರುದ್ಧ ಗೆರಿಲ್ಲಾ ಹೋರಾಟ ನಡೆಸಿದರು."]], [2014, "Assertion (A): Ozone layer protects the earth from excessive quantities of severely damaging Solar radiation.\nReason (R): Ozone hole has been discovered over the Continent of Antarctica.", "ಪ್ರತಿಪಾದನೆ (A): ಓಜೋನ್ ಪದರವು ಭೂಮಿಯನ್ನು ತೀವ್ರ ಹಾನಿಕರ ಸೌರ ವಿಕಿರಣದ ಹೆಚ್ಚಿನ ಪ್ರಮಾಣದಿಂದ ರಕ್ಷಿಸುತ್ತದೆ.\nಕಾರಣ (R): ಅಂಟಾರ್ಟಿಕಾ ಖಂಡದ ಮೇಲೆ ಓಜೋನ್ ರಂಧ್ರವನ್ನು ಪತ್ತೆ ಮಾಡಲಾಗಿದೆ.", ["Both (A) and (R) are correct and (R) explains (A).", "Both (A) and (R) are correct, but (R) does not explain (A).", "(A) is correct, but (R) is false.", "(A) is false, but (R) is true."], 1, ["Ozone absorbs harmful UV and an ozone hole exists over Antarctica, but the hole does not explain the layer’s protective role.", "ಓಜೋನ್ ಹಾನಿಕರ ನೇರಳಾತೀತ ಕಿರಣ ಹೀರುತ್ತದೆ; ಅಂಟಾರ್ಟಿಕಾದಲ್ಲಿ ರಂಧ್ರವೂ ಇದೆ; ಆದರೆ ರಂಧ್ರ ಪದರದ ರಕ್ಷಣಾ ಪಾತ್ರವನ್ನು ವಿವರಿಸುವುದಿಲ್ಲ."]], [2017, "“It shall be the duty of the Union to protect every State against external aggression and internal disturbance…” Which Article deals with the above statement?", "“ಪ್ರತಿ ರಾಜ್ಯವನ್ನು ಬಾಹ್ಯ ಆಕ್ರಮಣ ಮತ್ತು ಆಂತರಿಕ ಗೊಂದಲದಿಂದ ರಕ್ಷಿಸುವುದು ಕೇಂದ್ರದ ಕರ್ತವ್ಯ…” ಈ ಹೇಳಿಕೆ ಯಾವ ವಿಧಿಗೆ ಸಂಬಂಧಿಸಿದೆ?", ["Article 355", "Article 356", "Article 352", "Article 358"], 0, ["Art. 355 makes it the Union’s duty to protect States; Art. 356 is President’s Rule.", "ವಿಧಿ 355 ರಾಜ್ಯಗಳನ್ನು ರಕ್ಷಿಸುವುದು ಕೇಂದ್ರದ ಕರ್ತವ್ಯ ಎನ್ನುತ್ತದೆ; ವಿಧಿ 356 ರಾಷ್ಟ್ರಪತಿ ಆಳ್ವಿಕೆ."]], [2020, "Which Nayaka of Chitradurga fought against Hyder Ali?", "ಹೈದರ್ ಅಲಿಯ ವಿರುದ್ಧ ಹೋರಾಡಿದ ಚಿತ್ರದುರ್ಗದ ನಾಯಕ ಯಾರು?", ["Madakari Nayaka I", "Madakari Nayaka II", "Madakari Nayaka III", "Madakari Nayaka V"], 3, ["Madakari Nayaka V of Chitradurga fought Hyder Ali (as per the paper’s key).", "ಚಿತ್ರದುರ್ಗದ ಮದಕರಿ ನಾಯಕ V ಹೈದರ್ ಅಲಿಯ ವಿರುದ್ಧ ಹೋರಾಡಿದನು (ಅಧಿಕೃತ ಕೀ ಪ್ರಕಾರ)."]], [2017, "Match the types of mountains (List I) with the mountain (List II):\nList I: A. Fold mountains  B. Block mountains  C. Volcanic mountains  D. Residual mountains\nList II: I. Mount Mayon and Fuji  II. Rockies, Alps and Andes  III. Mount Monadnock  IV. Black Forest of Rhineland and Hunsruck mountains", "ಪರ್ವತ ಪ್ರಕಾರಗಳನ್ನು (ಪಟ್ಟಿ I) ಪರ್ವತಗಳೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. ಮಡಿಕೆ ಪರ್ವತಗಳು  B. ಭಂಗ (ಬ್ಲಾಕ್) ಪರ್ವತಗಳು  C. ಜ್ವಾಲಾಮುಖಿ ಪರ್ವತಗಳು  D. ಶೇಷ ಪರ್ವತಗಳು\nಪಟ್ಟಿ II: I. ಮೇಯಾನ್ ಮತ್ತು ಫ್ಯೂಜಿ  II. ರಾಕೀಸ್, ಆಲ್ಪ್ಸ್ ಮತ್ತು ಆಂಡೀಸ್  III. ಮೌಂಟ್ ಮೊನಾಡ್ನಾಕ್  IV. ರೈನ್‌ಲ್ಯಾಂಡ್‌ನ ಬ್ಲ್ಯಾಕ್ ಫಾರೆಸ್ಟ್ ಮತ್ತು ಹನ್ಸ್‌ರುಕ್ ಪರ್ವತಗಳು", ["A–I, B–II, C–IV, D–III", "A–II, B–IV, C–I, D–III", "A–III, B–II, C–I, D–IV", "A–II, B–III, C–I, D–IV"], 1, ["Fold – Rockies/Alps/Andes; Block – Black Forest & Hunsruck; Volcanic – Mayon & Fuji; Residual – Monadnock.", "ಮಡಿಕೆ – ರಾಕೀಸ್/ಆಲ್ಪ್ಸ್/ಆಂಡೀಸ್; ಭಂಗ – ಬ್ಲ್ಯಾಕ್ ಫಾರೆಸ್ಟ್; ಜ್ವಾಲಾಮುಖಿ – ಮೇಯಾನ್, ಫ್ಯೂಜಿ; ಶೇಷ – ಮೊನಾಡ್ನಾಕ್."]], [2017, "Match the following items of List I with List II:\nList I: A. Third Schedule  B. Eighth Schedule  C. Fourth Schedule  D. Tenth Schedule\nList II: I. Allocation of seats in Upper House  II. Disqualification on grounds of defection  III. Validation of certain acts  IV. Official Languages of the Republic of India  V. Forms of oaths and affirmations", "ಪಟ್ಟಿ I ರ ಅಂಶಗಳನ್ನು ಪಟ್ಟಿ II ರೊಂದಿಗೆ ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. ಮೂರನೇ ಅನುಸೂಚಿ  B. ಎಂಟನೇ ಅನುಸೂಚಿ  C. ನಾಲ್ಕನೇ ಅನುಸೂಚಿ  D. ಹತ್ತನೇ ಅನುಸೂಚಿ\nಪಟ್ಟಿ II: I. ಮೇಲ್ಮನೆಯಲ್ಲಿ ಸ್ಥಾನ ಹಂಚಿಕೆ  II. ಪಕ್ಷಾಂತರದ ಆಧಾರದ ಮೇಲೆ ಅನರ್ಹತೆ  III. ಕೆಲವು ಕೃತ್ಯಗಳ ಮಾನ್ಯತೆ  IV. ಭಾರತ ಗಣರಾಜ್ಯದ ಅಧಿಕೃತ ಭಾಷೆಗಳು  V. ಪ್ರಮಾಣ ವಚನ ಮತ್ತು ದೃಢೀಕರಣದ ನಮೂನೆಗಳು", ["A–I, B–III, C–IV, D–II", "A–V, B–IV, C–I, D–II", "A–V, B–IV, C–II, D–I", "A–I, B–IV, C–II, D–III"], 1, ["Third Schedule – oaths; Eighth – languages; Fourth – Rajya Sabha seats; Tenth – anti-defection.", "ಮೂರನೇ – ಪ್ರಮಾಣ ವಚನ; ಎಂಟನೇ – ಭಾಷೆಗಳು; ನಾಲ್ಕನೇ – ರಾಜ್ಯಸಭಾ ಸ್ಥಾನ ಹಂಚಿಕೆ; ಹತ್ತನೇ – ಪಕ್ಷಾಂತರ ನಿಷೇಧ."]], [2020, "Consider the following statements:\nA. Anthracite is the hardest coal.\nB. Bituminous is the most popular coal used for metallurgy.\nC. Bituminous is known as soft coal.\nD. Coke is prepared from bituminous.", "ಈ ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ:\nA. ಆಂಥ್ರಸೈಟ್ ಅತ್ಯಂತ ಗಟ್ಟಿ ಕಲ್ಲಿದ್ದಲು.\nB. ಲೋಹಶಾಸ್ತ್ರಕ್ಕೆ ಬಳಸುವ ಅತ್ಯಂತ ಜನಪ್ರಿಯ ಕಲ್ಲಿದ್ದಲು ಬಿಟುಮಿನಸ್.\nC. ಬಿಟುಮಿನಸ್ ಅನ್ನು ಮೃದು ಕಲ್ಲಿದ್ದಲು ಎನ್ನುತ್ತಾರೆ.\nD. ಬಿಟುಮಿನಸ್‌ನಿಂದ ಕೋಕ್ ತಯಾರಿಸಲಾಗುತ್ತದೆ.", ["A, B and C are correct", "A, C and D are correct", "B, C and D are correct", "A, B, C and D are correct"], 3, ["Anthracite is the hardest coal; bituminous (soft coal) is used for metallurgy and for making coke — all four are correct.", "ಆಂಥ್ರಸೈಟ್ ಅತ್ಯಂತ ಗಟ್ಟಿ; ಬಿಟುಮಿನಸ್ (ಮೃದು ಕಲ್ಲಿದ್ದಲು) ಲೋಹಶಾಸ್ತ್ರ ಮತ್ತು ಕೋಕ್ ತಯಾರಿಕೆಗೆ ಬಳಕೆ — ನಾಲ್ಕೂ ಸರಿ."]], [2020, "Consider the following statements:\nA. Corporation tax is levied on the income of both registered, unregistered companies and corporations.\nB. Corporation tax is levied on incomes of individuals and Hindu Undivided Family.\nC. Corporation tax is levied only on the incomes of registered companies and corporations.\nWhich of the above statements is/are true?", "ಈ ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ:\nA. ನೋಂದಾಯಿತ ಮತ್ತು ನೋಂದಾಯಿಸದ ಕಂಪನಿಗಳು ಹಾಗೂ ನಿಗಮಗಳ ಆದಾಯದ ಮೇಲೆ ನಿಗಮ ತೆರಿಗೆ ವಿಧಿಸಲಾಗುತ್ತದೆ.\nB. ವ್ಯಕ್ತಿಗಳು ಮತ್ತು ಹಿಂದೂ ಅವಿಭಜಿತ ಕುಟುಂಬದ ಆದಾಯದ ಮೇಲೆ ನಿಗಮ ತೆರಿಗೆ ವಿಧಿಸಲಾಗುತ್ತದೆ.\nC. ನೋಂದಾಯಿತ ಕಂಪನಿಗಳು ಮತ್ತು ನಿಗಮಗಳ ಆದಾಯದ ಮೇಲೆ ಮಾತ್ರ ನಿಗಮ ತೆರಿಗೆ ವಿಧಿಸಲಾಗುತ್ತದೆ.\nಮೇಲಿನ ಯಾವ ಹೇಳಿಕೆ/ಹೇಳಿಕೆಗಳು ಸರಿ?", ["A and B are true", "Only C is true", "Only B is true", "All of the above are true"], 1, ["Corporation tax applies only to registered companies and corporations; individuals and HUFs pay income tax.", "ನಿಗಮ ತೆರಿಗೆ ನೋಂದಾಯಿತ ಕಂಪನಿ/ನಿಗಮಗಳಿಗೆ ಮಾತ್ರ; ವ್ಯಕ್ತಿಗಳು ಮತ್ತು HUF ಆದಾಯ ತೆರಿಗೆ ಪಾವತಿಸುತ್ತಾರೆ."]], [2017, "Match the Committees of the Constituent Assembly (List I) with their Chairmen (List II):\nList I: A. House Committee  B. Order of Business Committee  C. Union Constitution Committee  D. Provincial Constitution Committee\nList II: I. K.M. Munshi  II. Pattabhi Sitaramayya  III. Sardar Patel  IV. Jawaharlal Nehru  V. Alladi Krishnaswamy Ayyar", "ಸಂವಿಧಾನ ರಚನಾ ಸಭೆಯ ಸಮಿತಿಗಳನ್ನು (ಪಟ್ಟಿ I) ಅವುಗಳ ಅಧ್ಯಕ್ಷರೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. ಹೌಸ್ ಕಮಿಟಿ  B. ಕಾರ್ಯಕಲಾಪ ಸಮಿತಿ  C. ಕೇಂದ್ರ ಸಂವಿಧಾನ ಸಮಿತಿ  D. ಪ್ರಾಂತೀಯ ಸಂವಿಧಾನ ಸಮಿತಿ\nಪಟ್ಟಿ II: I. ಕೆ.ಎಂ. ಮುನ್ಷಿ  II. ಪಟ್ಟಾಭಿ ಸೀತಾರಾಮಯ್ಯ  III. ಸರ್ದಾರ್ ಪಟೇಲ್  IV. ಜವಾಹರಲಾಲ್ ನೆಹರೂ  V. ಅಲ್ಲಾಡಿ ಕೃಷ್ಣಸ್ವಾಮಿ ಅಯ್ಯರ್", ["A–V, B–II, C–IV, D–I", "A–II, B–I, C–IV, D–III", "A–V, B–II, C–IV, D–III", "A–I, B–II, C–IV, D–III"], 1, ["House – Pattabhi Sitaramayya; Order of Business – K.M. Munshi; Union Constitution – Nehru; Provincial Constitution – Patel.", "ಹೌಸ್ ಕಮಿಟಿ – ಪಟ್ಟಾಭಿ ಸೀತಾರಾಮಯ್ಯ; ಕಾರ್ಯಕಲಾಪ – ಕೆ.ಎಂ. ಮುನ್ಷಿ; ಕೇಂದ್ರ ಸಂವಿಧಾನ – ನೆಹರೂ; ಪ್ರಾಂತೀಯ ಸಂವಿಧಾನ – ಪಟೇಲ್."]], [2020, "The main place for the wars between Vijayanagara and Bahamanis is ______.", "ವಿಜಯನಗರ ಮತ್ತು ಬಹಮನಿಗಳ ನಡುವಿನ ಯುದ್ಧಗಳ ಮುಖ್ಯ ಸ್ಥಳ ______.", ["The kingdom of Madurai", "Konkan region", "Goa region", "Raichur Doab region"], 3, ["The fertile Raichur Doab (between the Krishna and Tungabhadra) was the main battleground of the Vijayanagara–Bahmani wars.", "ಕೃಷ್ಣಾ–ತುಂಗಭದ್ರಾ ನಡುವಿನ ಫಲವತ್ತಾದ ರಾಯಚೂರು ದೋಆಬ್ ವಿಜಯನಗರ–ಬಹಮನಿ ಯುದ್ಧಗಳ ಮುಖ್ಯ ಕ್ಷೇತ್ರ."]], [2020, "Who described the Indian Constitution as Quasi federal?", "ಭಾರತದ ಸಂವಿಧಾನವನ್ನು ‘ಅರೆ-ಒಕ್ಕೂಟ’ (Quasi federal) ಎಂದು ವರ್ಣಿಸಿದವರು ಯಾರು?", ["Jennings", "K.C. Wheare", "Morris-Jones", "Dr. B. R. Ambedkar"], 1, ["K.C. Wheare called India’s Constitution ‘quasi-federal’ (federal in form, unitary in spirit).", "ಕೆ.ಸಿ. ವೀರ್ ಭಾರತದ ಸಂವಿಧಾನವನ್ನು ‘ಅರೆ-ಒಕ್ಕೂಟ’ ಎಂದು ಕರೆದರು."]], [2014, "Consider the following rights of citizens:\n1. Right to free legal aid.\n2. Right to equal pay for equal work.\n3. Right to establish and maintain institutions for religious and charitable purposes.\n4. Right to decent standard of living.\nWhich of the above right/s are non-justiciable?", "ನಾಗರಿಕರ ಈ ಕೆಳಗಿನ ಹಕ್ಕುಗಳನ್ನು ಪರಿಗಣಿಸಿ:\n1. ಉಚಿತ ಕಾನೂನು ನೆರವಿನ ಹಕ್ಕು.\n2. ಸಮಾನ ಕೆಲಸಕ್ಕೆ ಸಮಾನ ವೇತನದ ಹಕ್ಕು.\n3. ಧರ್ಮಾರ್ಥ ಮತ್ತು ಧಾರ್ಮಿಕ ಉದ್ದೇಶಗಳಿಗಾಗಿ ಸಂಸ್ಥೆಗಳನ್ನು ಸ್ಥಾಪಿಸಿ ನಡೆಸುವ ಹಕ್ಕು.\n4. ಉತ್ತಮ ಜೀವನ ಮಟ್ಟದ ಹಕ್ಕು.\nಮೇಲಿನ ಯಾವ ಹಕ್ಕುಗಳು ನ್ಯಾಯಿಕವಲ್ಲದವು (non-justiciable)?", ["1, 2 and 3", "2 and 4", "1, 2 and 4", "2, 3 and 4"], 2, ["Free legal aid, equal pay and a decent standard of living are Directive Principles (non-justiciable); the right to run religious institutions is a Fundamental Right (Art. 26).", "ಉಚಿತ ಕಾನೂನು ನೆರವು, ಸಮಾನ ವೇತನ, ಉತ್ತಮ ಜೀವನ ಮಟ್ಟ — ನಿರ್ದೇಶಕ ತತ್ವಗಳು (ನ್ಯಾಯಿಕವಲ್ಲ); ಧಾರ್ಮಿಕ ಸಂಸ್ಥೆ ನಡೆಸುವ ಹಕ್ಕು ಮೂಲಭೂತ ಹಕ್ಕು (ವಿಧಿ 26)."]], [2017, "Which Amendment Act is known as the Anti-Defection Act?", "ಯಾವ ತಿದ್ದುಪಡಿ ಕಾಯ್ದೆಯನ್ನು ಪಕ್ಷಾಂತರ ನಿಷೇಧ ಕಾಯ್ದೆ ಎಂದು ಕರೆಯಲಾಗುತ್ತದೆ?", ["Fifty-Second Amendment", "Sixty-Second Amendment", "Sixty-Ninth Amendment", "None of the above"], 0, ["The 52nd Amendment (1985) added the Tenth Schedule, the Anti-Defection law.", "52ನೇ ತಿದ್ದುಪಡಿ (1985) ಹತ್ತನೇ ಅನುಸೂಚಿ—ಪಕ್ಷಾಂತರ ನಿಷೇಧ ಕಾಯ್ದೆಯನ್ನು—ಸೇರಿಸಿತು."]], [2014, "‘Gagan Mahal’ is an Architectural Glory ascribed to", "‘ಗಗನ್ ಮಹಲ್’ ಯಾವ ಮನೆತನದ ವಾಸ್ತುಶಿಲ್ಪೀಯ ಸಾಧನೆ?", ["Adil Shahis", "Qutub Shahis", "Nizam Shahis", "Barid Shahis"], 0, ["Gagan Mahal in Bijapur was built by the Adil Shahis.", "ವಿಜಯಪುರದ ಗಗನ್ ಮಹಲ್ ಅನ್ನು ಆದಿಲ್ ಶಾಹಿಗಳು ಕಟ್ಟಿಸಿದರು."]], [2017, "Where are the headquarters of the Karnataka Bank Ltd.?", "ಕರ್ನಾಟಕ ಬ್ಯಾಂಕ್ ಲಿಮಿಟೆಡ್‌ನ ಪ್ರಧಾನ ಕಚೇರಿ ಎಲ್ಲಿದೆ?", ["Bangalore", "Mangalore", "Mysore", "Udupi"], 1, ["Karnataka Bank Ltd. has its headquarters in Mangaluru.", "ಕರ್ನಾಟಕ ಬ್ಯಾಂಕ್ ಲಿಮಿಟೆಡ್‌ನ ಪ್ರಧಾನ ಕಚೇರಿ ಮಂಗಳೂರಿನಲ್ಲಿದೆ."]], [2020, "Which among the following is not correct about UPSC?", "UPSC ಕುರಿತು ಕೆಳಗಿನವುಗಳಲ್ಲಿ ಯಾವುದು ಸರಿಯಲ್ಲ?", ["The Chairman and members of the Commission hold office for a term of 5 years.", "The President can remove the Chairman or any other member.", "It is a Central recruiting agency in India.", "It is an Independent Constitutional body."], 0, ["UPSC members hold office for 6 years or until age 65, whichever is earlier — not 5 years.", "UPSC ಸದಸ್ಯರ ಅವಧಿ 6 ವರ್ಷ ಅಥವಾ 65 ವಯಸ್ಸು (ಯಾವುದು ಮೊದಲೋ ಅದು) — 5 ವರ್ಷವಲ್ಲ."]], [2014, "Consider the following statements:\n1. ‘Habeas Corpus’ is in the nature of an order calling upon the person who has detained another to produce the latter before the Court.\n2. ‘Mandamus’ literally means a command.\n3. ‘Certiorari’ is issued to quash the order or decision of a lower court.\n4. ‘Quo Warranto’ is issued to prohibit the lower court from making an ultra vires order or decision.\nWhich of the above definition of writs is/are correct?", "ಈ ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ:\n1. ‘ಹೇಬಿಯಸ್ ಕಾರ್ಪಸ್’ ಎಂದರೆ ಇನ್ನೊಬ್ಬರನ್ನು ಬಂಧಿಸಿದ ವ್ಯಕ್ತಿಯನ್ನು ಅವರನ್ನು ನ್ಯಾಯಾಲಯದ ಮುಂದೆ ಹಾಜರುಪಡಿಸಲು ಆದೇಶಿಸುವ ಸ್ವರೂಪದ್ದು.\n2. ‘ಮ್ಯಾಂಡಮಸ್’ ಎಂದರೆ ಅಕ್ಷರಶಃ ಆದೇಶ.\n3. ಅಧೀನ ನ್ಯಾಯಾಲಯದ ಆದೇಶ/ನಿರ್ಧಾರವನ್ನು ರದ್ದುಗೊಳಿಸಲು ‘ಸರ್ಷಿಯೊರರಿ’ ಹೊರಡಿಸಲಾಗುತ್ತದೆ.\n4. ಅಧೀನ ನ್ಯಾಯಾಲಯವು ಅಧಿಕಾರಾತೀತ ಆದೇಶ/ನಿರ್ಧಾರ ಕೈಗೊಳ್ಳುವುದನ್ನು ನಿಷೇಧಿಸಲು ‘ಕೋ ವಾರೆಂಟೋ’ ಹೊರಡಿಸಲಾಗುತ್ತದೆ.\nರಿಟ್‌ಗಳ ಮೇಲಿನ ಯಾವ ವ್ಯಾಖ್ಯೆಗಳು ಸರಿ?", ["1, 2 and 3", "1, 2 and 4", "3 and 4", "1 and 2"], 0, ["Quo Warranto questions a person’s right to hold a public office; the writ that stops a lower court is Prohibition, so statement 4 is wrong.", "ಕೋ ವಾರೆಂಟೋ ಸಾರ್ವಜನಿಕ ಹುದ್ದೆ ಹೊಂದುವ ಹಕ್ಕನ್ನು ಪ್ರಶ್ನಿಸುತ್ತದೆ; ಅಧೀನ ನ್ಯಾಯಾಲಯವನ್ನು ತಡೆಯುವುದು ‘ಪ್ರೊಹಿಬಿಷನ್’; ಆದ್ದರಿಂದ 4 ತಪ್ಪು."]], [2017, "What was the average literacy rate of Karnataka in 2011 Census?", "2011ರ ಜನಗಣತಿಯಲ್ಲಿ ಕರ್ನಾಟಕದ ಸರಾಸರಿ ಸಾಕ್ಷರತಾ ಪ್ರಮಾಣ ಎಷ್ಟು?", ["75·36%", "57·63%", "66·65%", "81·14%"], 0, ["Karnataka’s literacy rate in Census 2011 was 75.36%.", "2011ರ ಜನಗಣತಿಯಲ್ಲಿ ಕರ್ನಾಟಕದ ಸಾಕ್ಷರತಾ ಪ್ರಮಾಣ 75.36%."]], [2014, "Match the following List-I with List-II:\nList-I: A. Cauvery  B. Malaprabha  C. Sharavati  D. Ghataprabha\nList-II: 1. Hidakal  2. Gerusoppa  3. KRS  4. Navilateertha", "ಪಟ್ಟಿ-I ಅನ್ನು ಪಟ್ಟಿ-II ರೊಂದಿಗೆ ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ-I: A. ಕಾವೇರಿ  B. ಮಲಪ್ರಭಾ  C. ಶರಾವತಿ  D. ಘಟಪ್ರಭಾ\nಪಟ್ಟಿ-II: 1. ಹಿಡಕಲ್  2. ಗೇರುಸೊಪ್ಪ  3. ಕೆಆರ್‌ಎಸ್  4. ನವಿಲುತೀರ್ಥ", ["A–2, B–1, C–3, D–4", "A–3, B–4, C–2, D–1", "A–4, B–1, C–3, D–2", "A–1, B–3, C–4, D–2"], 1, ["KRS – Cauvery; Navilateertha – Malaprabha; Gerusoppa – Sharavati; Hidkal – Ghataprabha.", "ಕೆಆರ್‌ಎಸ್ – ಕಾವೇರಿ; ನವಿಲುತೀರ್ಥ – ಮಲಪ್ರಭಾ; ಗೇರುಸೊಪ್ಪ – ಶರಾವತಿ; ಹಿಡಕಲ್ – ಘಟಪ್ರಭಾ."]], [2020, "Chola bronzes are known for their fine craftsmanship. These metal sculptures have been made of an alloy of how many metals?", "ಚೋಳರ ಕಂಚಿನ ಶಿಲ್ಪಗಳನ್ನು ಎಷ್ಟು ಲೋಹಗಳ ಮಿಶ್ರಲೋಹದಿಂದ ಮಾಡಲಾಗಿದೆ?", ["Four", "Five", "Six", "Eight"], 1, ["Chola bronzes are made of panchaloha, a five-metal alloy.", "ಚೋಳರ ಕಂಚಿನ ಶಿಲ್ಪಗಳು ಪಂಚಲೋಹ (ಐದು ಲೋಹಗಳ ಮಿಶ್ರಣ)ದಿಂದ ಮಾಡಲ್ಪಟ್ಟಿವೆ."]], [2020, "In the history of Indian coinage, Punch-Marked Coins (PMC) have a special place. Which of the following statements are true with reference to PMC?\nA. They are the earliest coinage in India.\nB. They were not in circulation in South India.\nC. We can notice symbols on one or both the sides of these coins.\nD. These coins are made of silver.", "ಭಾರತದ ನಾಣ್ಯ ಇತಿಹಾಸದಲ್ಲಿ ಆಹತ (ಪಂಚ್-ಮಾರ್ಕ್ಡ್) ನಾಣ್ಯಗಳಿಗೆ ವಿಶೇಷ ಸ್ಥಾನವಿದೆ. ಅವುಗಳ ಕುರಿತು ಯಾವ ಹೇಳಿಕೆಗಳು ಸರಿ?\nA. ಇವು ಭಾರತದ ಅತ್ಯಂತ ಹಳೆಯ ನಾಣ್ಯಗಳು.\nB. ಇವು ದಕ್ಷಿಣ ಭಾರತದಲ್ಲಿ ಚಲಾವಣೆಯಲ್ಲಿರಲಿಲ್ಲ.\nC. ಈ ನಾಣ್ಯಗಳ ಒಂದು ಅಥವಾ ಎರಡೂ ಬದಿಗಳಲ್ಲಿ ಚಿಹ್ನೆಗಳು ಕಾಣಬಹುದು.\nD. ಈ ನಾಣ್ಯಗಳು ಬೆಳ್ಳಿಯವು.", ["A and D only", "A and C only", "A, B, C and D", "A, C and D"], 3, ["Punch-marked coins were India’s earliest coins, mostly silver, with symbols on one or both sides; they also circulated in the South, so B is wrong.", "ಆಹತ ನಾಣ್ಯಗಳು ಭಾರತದ ಮೊದಲ ನಾಣ್ಯಗಳು, ಬೆಳ್ಳಿಯವು, ಚಿಹ್ನೆಗಳಿವೆ; ದಕ್ಷಿಣದಲ್ಲೂ ಚಲಾವಣೆಯಲ್ಲಿದ್ದವು, ಆದ್ದರಿಂದ B ತಪ್ಪು."]], [2017, "Which one of the following Amendments of the Constitution abolished the Privy Purses and Privileges of the rulers of the former Indian States?", "ಹಿಂದಿನ ಭಾರತೀಯ ಸಂಸ್ಥಾನಗಳ ರಾಜರ ರಾಜಧನ ಮತ್ತು ವಿಶೇಷಾಧಿಕಾರಗಳನ್ನು ರದ್ದುಪಡಿಸಿದ ಸಂವಿಧಾನ ತಿದ್ದುಪಡಿ ಯಾವುದು?", ["26th Amendment", "28th Amendment", "30th Amendment", "32nd Amendment"], 0, ["The 26th Amendment (1971) abolished privy purses and privileges of former rulers.", "26ನೇ ತಿದ್ದುಪಡಿ (1971) ಹಿಂದಿನ ರಾಜರ ರಾಜಧನ ಮತ್ತು ವಿಶೇಷಾಧಿಕಾರಗಳನ್ನು ರದ್ದುಪಡಿಸಿತು."]], [2017, "The President of India enjoys which of the following Veto powers?\nA. Absolute Veto that is withholding of assent to the Bill passed by the Legislature.\nB. Qualified Veto which can be overridden by the Legislature with a higher Majority.\nC. Suspensive Veto which can be overridden by the Legislature with an ordinary Majority.\nD. Pocket Veto that is taking no action on the Bill passed by the Legislature.", "ಭಾರತದ ರಾಷ್ಟ್ರಪತಿಗಳು ಈ ಕೆಳಗಿನ ಯಾವ ವೀಟೊ ಅಧಿಕಾರಗಳನ್ನು ಹೊಂದಿದ್ದಾರೆ?\nA. ಸಂಪೂರ್ಣ ವೀಟೊ – ಶಾಸಕಾಂಗ ಅಂಗೀಕರಿಸಿದ ವಿಧೇಯಕಕ್ಕೆ ಒಪ್ಪಿಗೆ ತಡೆಹಿಡಿಯುವುದು.\nB. ಅರ್ಹ ವೀಟೊ – ಶಾಸಕಾಂಗ ಹೆಚ್ಚಿನ ಬಹುಮತದಿಂದ ಮೀರಬಹುದು.\nC. ತಾತ್ಕಾಲಿಕ ವೀಟೊ – ಶಾಸಕಾಂಗ ಸಾಮಾನ್ಯ ಬಹುಮತದಿಂದ ಮೀರಬಹುದು.\nD. ಪಾಕೆಟ್ ವೀಟೊ – ಶಾಸಕಾಂಗ ಅಂಗೀಕರಿಸಿದ ವಿಧೇಯಕದ ಮೇಲೆ ಯಾವ ಕ್ರಮವನ್ನೂ ಕೈಗೊಳ್ಳದಿರುವುದು.", ["A and B only", "B and C only", "A, B and C only", "A, C and D only"], 3, ["India’s President has absolute, suspensive and pocket vetoes; the qualified veto belongs to the US President.", "ಭಾರತದ ರಾಷ್ಟ್ರಪತಿಗೆ ಸಂಪೂರ್ಣ, ತಾತ್ಕಾಲಿಕ ಮತ್ತು ಪಾಕೆಟ್ ವೀಟೊ ಇವೆ; ಅರ್ಹ ವೀಟೊ ಅಮೆರಿಕದ ಅಧ್ಯಕ್ಷರಿಗೆ ಇದೆ."]], [2020, "Who appoints the Attorney General of India?", "ಭಾರತದ ಅಟಾರ್ನಿ ಜನರಲ್ ಅವರನ್ನು ನೇಮಿಸುವವರು ಯಾರು?", ["The Prime Minister", "The Lok Sabha", "The President", "None of the above"], 2, ["Art. 76: the President appoints the Attorney General.", "ವಿಧಿ 76: ಅಟಾರ್ನಿ ಜನರಲ್ ಅವರನ್ನು ರಾಷ್ಟ್ರಪತಿ ನೇಮಿಸುತ್ತಾರೆ."]], [2020, "Which of the following factors are common to the coins issued by Indo-Greek and Kushana rulers?\nA. Effigies of Greek and Indian deities\nB. Bilingual coins\nC. Use of Gold and Copper\nD. Portraits of Kings", "ಇಂಡೋ-ಗ್ರೀಕ್ ಮತ್ತು ಕುಶಾಣ ದೊರೆಗಳ ನಾಣ್ಯಗಳಲ್ಲಿ ಸಾಮಾನ್ಯವಾಗಿರುವ ಅಂಶಗಳು ಯಾವುವು?\nA. ಗ್ರೀಕ್ ಮತ್ತು ಭಾರತೀಯ ದೇವತೆಗಳ ಚಿತ್ರಗಳು\nB. ದ್ವಿಭಾಷಾ ನಾಣ್ಯಗಳು\nC. ಚಿನ್ನ ಮತ್ತು ತಾಮ್ರದ ಬಳಕೆ\nD. ರಾಜರ ಭಾವಚಿತ್ರಗಳು", ["D only", "B and D only", "A, B and D only", "A, C and D only"], 2, ["Both series carried Greek and Indian deities, were bilingual and showed royal portraits; the gold–copper use (C) is not common to both.", "ಎರಡರಲ್ಲೂ ಗ್ರೀಕ್-ಭಾರತೀಯ ದೇವತೆಗಳು, ದ್ವಿಭಾಷಾ ಲಿಪಿ, ರಾಜರ ಭಾವಚಿತ್ರ ಇದ್ದವು; ಚಿನ್ನ–ತಾಮ್ರ ಬಳಕೆ (C) ಎರಡಕ್ಕೂ ಸಾಮಾನ್ಯವಲ್ಲ."]], [2020, "Among the following, which scholar argued that Rastrakutas were of Kannada origin?", "ರಾಷ್ಟ್ರಕೂಟರು ಕನ್ನಡ ಮೂಲದವರು ಎಂದು ವಾದಿಸಿದ ವಿದ್ವಾಂಸ ಯಾರು?", ["Dr. A.S. Altekar", "Dr. Fleet", "Dr. D.R. Bhandarkar", "K.V. Subrahmanya Aiyar"], 0, ["A.S. Altekar argued that the Rashtrakutas were of Kannada origin.", "ರಾಷ್ಟ್ರಕೂಟರು ಕನ್ನಡ ಮೂಲದವರು ಎಂದು ಎ.ಎಸ್. ಅಲ್ಟೇಕರ್ ವಾದಿಸಿದರು."]], [2017, "For the Census 2011, Census Town should have satisfied which of the following criteria?\nA. Minimum population of 5000.\nB. At least 50 percent of the male main working population engaged in non-agricultural pursuits.\nC. A density of population of at least 400 per sq. km.\nWhich of the above criteria are correct?", "2011ರ ಜನಗಣತಿಗೆ ‘ಜನಗಣತಿ ಪಟ್ಟಣ’ವು ಈ ಕೆಳಗಿನ ಯಾವ ಮಾನದಂಡಗಳನ್ನು ಪೂರೈಸಬೇಕಿತ್ತು?\nA. ಕನಿಷ್ಠ 5000 ಜನಸಂಖ್ಯೆ.\nB. ಪುರುಷ ಮುಖ್ಯ ಕಾರ್ಮಿಕರ ಕನಿಷ್ಠ ಶೇ. 50 ರಷ್ಟು ಜನರು ಕೃಷಿಯೇತರ ಕೆಲಸದಲ್ಲಿರುವುದು.\nC. ಪ್ರತಿ ಚ.ಕಿ.ಮೀ.ಗೆ ಕನಿಷ್ಠ 400 ಜನಸಾಂದ್ರತೆ.\nಮೇಲಿನ ಯಾವ ಮಾನದಂಡಗಳು ಸರಿ?", ["A and B only", "A and C only", "B and C only", "A, B and C"], 1, ["Census 2011 criteria: population ≥ 5000, at least 75% of male main workers in non-agriculture, density ≥ 400 per sq. km — so B (50%) is wrong.", "ಜನಗಣತಿ 2011: ಜನಸಂಖ್ಯೆ ≥ 5000, ಪುರುಷ ಮುಖ್ಯ ಕಾರ್ಮಿಕರ ಕನಿಷ್ಠ ಶೇ. 75 ಕೃಷಿಯೇತರ, ಸಾಂದ್ರತೆ ≥ 400; ಆದ್ದರಿಂದ B (ಶೇ. 50) ತಪ್ಪು."]], [2020, "Which of the following districts of Karnataka lie in North Eastern Transition Zone?", "ಕರ್ನಾಟಕದ ಯಾವ ಜಿಲ್ಲೆಗಳು ಈಶಾನ್ಯ ಪರಿವರ್ತನಾ ವಲಯದಲ್ಲಿ ಬರುತ್ತವೆ?", ["Kalaburagi and Yadgir", "Bidar and Kalaburagi", "Yadgir and Raichur", "Raichur and Bidar"], 1, ["Bidar and Kalaburagi form the North Eastern Transition Zone (as per the paper’s key).", "ಬೀದರ್ ಮತ್ತು ಕಲಬುರಗಿ ಈಶಾನ್ಯ ಪರಿವರ್ತನಾ ವಲಯದಲ್ಲಿವೆ (ಅಧಿಕೃತ ಕೀ ಪ್ರಕಾರ)."]], [2020, "Which one of the following Railway Zone and Headquarters is not correctly matched?", "ಕೆಳಗಿನ ಯಾವ ರೈಲ್ವೆ ವಲಯ ಮತ್ತು ಪ್ರಧಾನ ಕಚೇರಿ ಜೋಡಣೆ ಸರಿಯಾಗಿಲ್ಲ?", ["East Coast – Bhuvaneshwar", "North Central – Allahabad", "North Western – Jaipur", "South East Central – Raipur"], 3, ["South East Central Railway has its headquarters at Bilaspur, not Raipur.", "ಆಗ್ನೇಯ ಮಧ್ಯ ರೈಲ್ವೆಯ ಪ್ರಧಾನ ಕಚೇರಿ ಬಿಲಾಸ್‌ಪುರ, ರಾಯ್‌ಪುರ ಅಲ್ಲ."]], [2017, "Match the following coal deposit locations (List I) with their countries (List II):\nList I: A. Sichuan  B. Pennsylvania  C. Kizel  D. Ipswich  E. Talcher\nList II: I. U.S.A.  II. China  III. Australia  IV. India  V. Russia", "ಕಲ್ಲಿದ್ದಲು ನಿಕ್ಷೇಪ ಸ್ಥಳಗಳನ್ನು (ಪಟ್ಟಿ I) ಅವುಗಳ ದೇಶಗಳೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. ಸಿಚುವಾನ್  B. ಪೆನ್ಸಿಲ್ವೇನಿಯಾ  C. ಕಿಝೆಲ್  D. ಇಪ್ಸ್‌ವಿಚ್  E. ತಾಲ್ಚೇರ್\nಪಟ್ಟಿ II: I. ಯು.ಎಸ್.ಎ.  II. ಚೀನಾ  III. ಆಸ್ಟ್ರೇಲಿಯಾ  IV. ಭಾರತ  V. ರಷ್ಯಾ", ["A–I, B–II, C–III, D–V, E–IV", "A–II, B–III, C–IV, D–I, E–V", "A–II, B–I, C–V, D–III, E–IV", "A–I, B–III, C–II, D–V, E–IV"], 2, ["Sichuan – China; Pennsylvania – USA; Kizel – Russia; Ipswich – Australia; Talcher – India.", "ಸಿಚುವಾನ್ – ಚೀನಾ; ಪೆನ್ಸಿಲ್ವೇನಿಯಾ – ಅಮೆರಿಕ; ಕಿಝೆಲ್ – ರಷ್ಯಾ; ಇಪ್ಸ್‌ವಿಚ್ – ಆಸ್ಟ್ರೇಲಿಯಾ; ತಾಲ್ಚೇರ್ – ಭಾರತ."]], [2017, "Match the following animals (List I) with their wildlife sanctuaries (List II):\nList I: A. Chinkara  B. Blackbuck  C. Four-horned Antelope  D. Sloth Bear\nList II: I. Ranebennur  II. Daroji  III. Rangayyanadurga  IV. Yadahalli", "ಪ್ರಾಣಿಗಳನ್ನು (ಪಟ್ಟಿ I) ಅವುಗಳ ವನ್ಯಜೀವಿ ಧಾಮಗಳೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. ಚಿಂಕಾರ  B. ಕೃಷ್ಣಮೃಗ  C. ನಾಲ್ಕು ಕೊಂಬಿನ ಹರಿಣ  D. ಕರಡಿ (ಸ್ಲಾತ್ ಬೇರ್)\nಪಟ್ಟಿ II: I. ರಾಣೆಬೆನ್ನೂರು  II. ದರೋಜಿ  III. ರಂಗಯ್ಯನದುರ್ಗ  IV. ಯಡಹಳ್ಳಿ", ["A–II, B–III, C–I, D–IV", "A–IV, B–I, C–III, D–II", "A–IV, B–III, C–I, D–II", "A–IV, B–I, C–II, D–III"], 1, ["Chinkara – Yadahalli; Blackbuck – Ranebennur; Four-horned antelope – Rangayyanadurga; Sloth bear – Daroji.", "ಚಿಂಕಾರ – ಯಡಹಳ್ಳಿ; ಕೃಷ್ಣಮೃಗ – ರಾಣೆಬೆನ್ನೂರು; ನಾಲ್ಕು ಕೊಂಬಿನ ಹರಿಣ – ರಂಗಯ್ಯನದುರ್ಗ; ಕರಡಿ – ದರೋಜಿ."]], [2020, "The Doctrine of Fundamental Rights cannot be amended under Article 368 was propounded by the Supreme Court of India in", "“ಮೂಲಭೂತ ಹಕ್ಕುಗಳನ್ನು 368ನೇ ವಿಧಿಯಡಿ ತಿದ್ದುಪಡಿ ಮಾಡಲಾಗದು” ಎಂಬ ಸಿದ್ಧಾಂತವನ್ನು ಸರ್ವೋಚ್ಚ ನ್ಯಾಯಾಲಯ ಈ ಪ್ರಕರಣದಲ್ಲಿ ಪ್ರತಿಪಾದಿಸಿತು", ["Gopalan v/s State of Madras", "Keshavananda Bharati v/s State of Kerala", "Golaknath v/s State of Punjab", "Menaka v/s Union of India"], 2, ["In Golaknath (1967) the SC held Parliament cannot amend Fundamental Rights; Kesavananda Bharati (1973) later modified this.", "ಗೋಲಕ್‌ನಾಥ್ (1967) ಪ್ರಕರಣದಲ್ಲಿ ಮೂಲಭೂತ ಹಕ್ಕುಗಳನ್ನು ತಿದ್ದುಪಡಿ ಮಾಡಲಾಗದು ಎನ್ನಲಾಯಿತು; ನಂತರ ಕೇಶವಾನಂದ ಭಾರತಿ (1973) ಇದನ್ನು ಮಾರ್ಪಡಿಸಿತು."]], [2020, "The National Development Council was established in ______.", "ರಾಷ್ಟ್ರೀಯ ಅಭಿವೃದ್ಧಿ ಮಂಡಳಿಯನ್ನು ______ ರಲ್ಲಿ ಸ್ಥಾಪಿಸಲಾಯಿತು.", ["March, 1952", "June, 1952", "August, 1952", "October, 1952"], 2, ["The NDC was set up on 6 August 1952 by a Government resolution.", "ರಾಷ್ಟ್ರೀಯ ಅಭಿವೃದ್ಧಿ ಮಂಡಳಿ 1952ರ ಆಗಸ್ಟ್ 6ರಂದು ಸ್ಥಾಪನೆಯಾಯಿತು."]], [2014, "Who auctioned salt at Belgaum and broke the Salt law in April, 1930?", "1930ರ ಏಪ್ರಿಲ್‌ನಲ್ಲಿ ಬೆಳಗಾವಿಯಲ್ಲಿ ಉಪ್ಪು ಹರಾಜು ಮಾಡಿ ಉಪ್ಪಿನ ಕಾನೂನು ಮುರಿದವರು ಯಾರು?", ["Karnad Sadashiva Rao", "R.R. Diwakar", "Hanumantha Rao Kaujalagi", "Gangadhar Rao Deshpande"], 0, ["Karnad Sadashiva Rao auctioned salt at Belgaum in April 1930 during the Salt Satyagraha.", "1930ರ ಏಪ್ರಿಲ್‌ನಲ್ಲಿ ಉಪ್ಪಿನ ಸತ್ಯಾಗ್ರಹದ ವೇಳೆ ಕರ್ನಾಟಕ ಸದಾಶಿವರಾವ್ ಬೆಳಗಾವಿಯಲ್ಲಿ ಉಪ್ಪು ಹರಾಜು ಮಾಡಿದರು."]], [2017, "Match the travellers (List I) with the Kings of Vijayanagara empire (List II) during whose period they had visited:\nList I: A. Abdur Razzak  B. Nicolo Conti  C. Fernao Nuniz  D. Barbosa\nList II: I. Devaraya I  II. Devaraya II  III. Krishna Devaraya  IV. Achyuta Raya", "ಪ್ರವಾಸಿಗರನ್ನು (ಪಟ್ಟಿ I) ಅವರು ಭೇಟಿ ನೀಡಿದ ಕಾಲದ ವಿಜಯನಗರ ರಾಜರೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. ಅಬ್ದುರ್ ರಜಾಕ್  B. ನಿಕೋಲೋ ಕೊಂಟಿ  C. ಫರ್ನಾವೋ ನೂನಿಜ್  D. ಬಾರ್ಬೋಸಾ\nಪಟ್ಟಿ II: I. ಒಂದನೇ ದೇವರಾಯ  II. ಎರಡನೇ ದೇವರಾಯ  III. ಕೃಷ್ಣದೇವರಾಯ  IV. ಅಚ್ಯುತರಾಯ", ["A–I, B–II, C–IV, D–III", "A–II, B–I, C–IV, D–III", "A–I, B–II, C–III, D–IV", "A–I, B–IV, C–II, D–III"], 1, ["Conti – Devaraya I; Abdur Razzak – Devaraya II; Barbosa – Krishnadevaraya; Nuniz – Achyuta Raya.", "ಕೊಂಟಿ – ಒಂದನೇ ದೇವರಾಯ; ಅಬ್ದುರ್ ರಜಾಕ್ – ಎರಡನೇ ದೇವರಾಯ; ಬಾರ್ಬೋಸಾ – ಕೃಷ್ಣದೇವರಾಯ; ನೂನಿಜ್ – ಅಚ್ಯುತರಾಯ."]], [2014, "Consider the following statements:\n1. The basic structure doctrine is defined in the Constitution.\n2. There are certain basic features of the Constitution which cannot be altered in exercise of the power to amend under Article 368.\n3. The Parliament can amend all provisions of the Constitution and judicial review shall not apply to such amendments.\n4. The basic features of the Constitution have been listed by the Supreme Court, exhaustively in the Golak Nath case law.\nWhich of the above statement(s) is/are true in the context of the Basic Structure Doctrine?", "ಈ ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ:\n1. ಮೂಲ ರಚನಾ ಸಿದ್ಧಾಂತವನ್ನು ಸಂವಿಧಾನದಲ್ಲಿ ವ್ಯಾಖ್ಯಾನಿಸಲಾಗಿದೆ.\n2. 368ನೇ ವಿಧಿಯ ತಿದ್ದುಪಡಿ ಅಧಿಕಾರದಿಂದ ಬದಲಿಸಲಾಗದ ಕೆಲವು ಮೂಲಭೂತ ಲಕ್ಷಣಗಳು ಸಂವಿಧಾನದಲ್ಲಿವೆ.\n3. ಸಂಸತ್ತು ಸಂವಿಧಾನದ ಎಲ್ಲ ಉಪಬಂಧಗಳನ್ನು ತಿದ್ದುಪಡಿ ಮಾಡಬಹುದು ಮತ್ತು ಅಂತಹ ತಿದ್ದುಪಡಿಗಳಿಗೆ ನ್ಯಾಯಿಕ ಪರಿಶೀಲನೆ ಅನ್ವಯಿಸುವುದಿಲ್ಲ.\n4. ಸಂವಿಧಾನದ ಮೂಲಭೂತ ಲಕ್ಷಣಗಳನ್ನು ಸರ್ವೋಚ್ಚ ನ್ಯಾಯಾಲಯವು ಗೋಲಕ್‌ನಾಥ್ ಪ್ರಕರಣದಲ್ಲಿ ಸಂಪೂರ್ಣವಾಗಿ ಪಟ್ಟಿ ಮಾಡಿದೆ.\nಮೂಲ ರಚನಾ ಸಿದ್ಧಾಂತದ ಸಂದರ್ಭದಲ್ಲಿ ಯಾವ ಹೇಳಿಕೆ/ಗಳು ಸರಿ?", ["2 and 4 only", "1, 2 and 3 only", "Only 2", "1 and 4 only"], 2, ["The basic structure doctrine comes from court rulings (Kesavananda Bharati, 1973), not the Constitution’s text; basic features cannot be amended under Art. 368, and they were not exhaustively listed in Golaknath.", "ಮೂಲ ರಚನಾ ಸಿದ್ಧಾಂತ ನ್ಯಾಯಾಲಯದ ತೀರ್ಪುಗಳಿಂದ (ಕೇಶವಾನಂದ ಭಾರತಿ, 1973) ಬಂದದ್ದು, ಸಂವಿಧಾನದ ಪಠ್ಯದಲ್ಲಿಲ್ಲ; ಗೋಲಕ್‌ನಾಥ್‌ನಲ್ಲಿ ಪಟ್ಟಿ ಮಾಡಿಲ್ಲ."]], [2020, "Which of the following statement/s is true with reference to Nayanars?\nA. They were Sangam poets.\nB. They were Shaiva saints.\nC. They composed devotional poetry.\nD. Also known as Puratanas, they were 64 in number.", "ನಾಯನಾರರ ಕುರಿತು ಈ ಕೆಳಗಿನ ಯಾವ ಹೇಳಿಕೆ/ಹೇಳಿಕೆಗಳು ಸರಿ?\nA. ಅವರು ಸಂಗಂ ಕವಿಗಳು.\nB. ಅವರು ಶೈವ ಸಂತರು.\nC. ಅವರು ಭಕ್ತಿ ಕಾವ್ಯ ರಚಿಸಿದರು.\nD. ಪುರಾತನರೆಂದೂ ಕರೆಯಲ್ಪಡುವ ಇವರ ಸಂಖ್ಯೆ 64.", ["A only", "A and C only", "B, C and D", "B and C only"], 3, ["Nayanars were Shaiva saints who composed devotional hymns; they were 63 in number and not Sangam poets.", "ನಾಯನಾರರು ಭಕ್ತಿಗೀತೆ ರಚಿಸಿದ ಶೈವ ಸಂತರು; ಅವರ ಸಂಖ್ಯೆ 63; ಸಂಗಂ ಕವಿಗಳಲ್ಲ."]], [2014, "In terms of princely hierarchy in colonial India, the status of Mysore was of a", "ವಸಾಹತುಶಾಹಿ ಭಾರತದ ಸಂಸ್ಥಾನಗಳ ಶ್ರೇಣಿಯಲ್ಲಿ ಮೈಸೂರು ಸಂಸ್ಥಾನದ ಸ್ಥಾನ ಹೀಗಿತ್ತು:", ["Thirty-one-gun salute state", "Twenty-one-gun salute state", "Nineteen- gun salute state", "Seventeen-gun salute state"], 1, ["Mysore was among the 21-gun salute princely states, the highest rank.", "ಮೈಸೂರು 21-ಗನ್ ಸಲಾಮಿನ (ಅತ್ಯುನ್ನತ ಶ್ರೇಣಿ) ಸಂಸ್ಥಾನಗಳಲ್ಲಿ ಒಂದಾಗಿತ್ತು."]], [2020, "Growth of coffee was encouraged during the time of ________.", "ಕಾಫಿ ಬೆಳೆಯನ್ನು ______ ಅವರ ಕಾಲದಲ್ಲಿ ಪ್ರೋತ್ಸಾಹಿಸಲಾಯಿತು.", ["Bowring", "Hyder", "Tippu", "Cubbon"], 3, ["Coffee cultivation was encouraged under Mark Cubbon’s administration of Mysore (1834–61).", "ಮಾರ್ಕ್ ಕಬ್ಬನ್ ಅವರ ಆಡಳಿತದಲ್ಲಿ (1834–61) ಕಾಫಿ ಬೆಳೆಗೆ ಪ್ರೋತ್ಸಾಹ ದೊರೆಯಿತು."]], [2017, "Consider the following statements:\nA. Savanna climate is also known as Sudan type climate.\nB. The Savanna climate is a transitional type of climate found between the equatorial forests and the trade wind hot deserts.\nC. It is characterised by an alternate and distinct hot rainy season and cool dry season.\nD. The Savanna type of climate is also found in the south-western part of South America and southern part of Australia.\nWhich of the above statements are correct?", "ಈ ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ:\nA. ಸವನ್ನಾ ಹವಾಮಾನವನ್ನು ಸುಡಾನ್ ಮಾದರಿ ಹವಾಮಾನ ಎಂದೂ ಕರೆಯುತ್ತಾರೆ.\nB. ಸವನ್ನಾ ಹವಾಮಾನವು ಸಮಭಾಜಕ ಅರಣ್ಯಗಳು ಮತ್ತು ವ್ಯಾಪಾರ ಮಾರುತಗಳ ಬಿಸಿ ಮರುಭೂಮಿಗಳ ನಡುವೆ ಕಂಡುಬರುವ ಪರಿವರ್ತನಾ ಹವಾಮಾನ.\nC. ಇದರಲ್ಲಿ ಬಿಸಿ ಮಳೆಗಾಲ ಮತ್ತು ತಂಪು ಒಣಗಾಲ ಪರ್ಯಾಯವಾಗಿ ಸ್ಪಷ್ಟವಾಗಿರುತ್ತವೆ.\nD. ಸವನ್ನಾ ಹವಾಮಾನ ದಕ್ಷಿಣ ಅಮೆರಿಕದ ನೈಋತ್ಯ ಭಾಗ ಮತ್ತು ಆಸ್ಟ್ರೇಲಿಯಾದ ದಕ್ಷಿಣ ಭಾಗದಲ್ಲೂ ಇದೆ.\nಮೇಲಿನ ಯಾವ ಹೇಳಿಕೆಗಳು ಸರಿ?", ["A and C only", "B and C only", "A, B and C only", "A, B, C and D"], 2, ["Savanna (Sudan type) is transitional between equatorial forests and hot deserts with a hot rainy and a cool dry season; D describes a different climate, so it is wrong.", "ಸವನ್ನಾ (ಸುಡಾನ್ ಮಾದರಿ) ಸಮಭಾಜಕ ಅರಣ್ಯ ಮತ್ತು ಮರುಭೂಮಿಗಳ ನಡುವಿನ ಪರಿವರ್ತನಾ ಹವಾಮಾನ; D ಬೇರೆ ಹವಾಮಾನವನ್ನು ಹೇಳುತ್ತದೆ, ಆದ್ದರಿಂದ ತಪ್ಪು."]], [2020, "Which Article provides for Constitution of GST (Goods and Services Tax) Council by the President of India?", "ಭಾರತದ ರಾಷ್ಟ್ರಪತಿಗಳಿಂದ ಜಿಎಸ್‌ಟಿ ಮಂಡಳಿ ರಚನೆಗೆ ಅವಕಾಶ ನೀಡುವ ವಿಧಿ ಯಾವುದು?", ["Article 246A", "Article 269A", "Article 279A", "Article 268A"], 2, ["Art. 279A (101st Amendment) provides for the GST Council.", "101ನೇ ತಿದ್ದುಪಡಿಯ ವಿಧಿ 279A ಜಿಎಸ್‌ಟಿ ಮಂಡಳಿಗೆ ಅವಕಾಶ ನೀಡುತ್ತದೆ."]], [2020, "Which of the following is described as a “novel feature” in the Indian Constitution?", "ಭಾರತದ ಸಂವಿಧಾನದಲ್ಲಿ “ಹೊಸ ಲಕ್ಷಣ” ಎಂದು ವರ್ಣಿಸಲಾಗಿರುವುದು ಯಾವುದು?", ["Fundamental Rights", "Directive Principles of State Policy", "Fundamental Duties", "Right to Constitutional Remedies"], 1, ["Directive Principles are called a ‘novel feature’ of the Indian Constitution.", "ರಾಜ್ಯ ನೀತಿ ನಿರ್ದೇಶಕ ತತ್ವಗಳನ್ನು ಸಂವಿಧಾನದ ‘ಹೊಸ ಲಕ್ಷಣ’ ಎನ್ನಲಾಗಿದೆ."]], [2020, "Which among the following ports were associated with the Indo-Roman trade during the early centuries of the Current Era (Christian Era)?\nA. Bharuch\nB. Arikamedu\nC. Muziris\nD. Tamluk", "ಕ್ರಿಸ್ತಶಕದ ಆರಂಭಿಕ ಶತಮಾನಗಳಲ್ಲಿ ಇಂಡೋ-ರೋಮನ್ ವ್ಯಾಪಾರಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಬಂದರುಗಳು ಯಾವುವು?\nA. ಭರೂಚ್\nB. ಅರಿಕಮೇಡು\nC. ಮುಜಿರಿಸ್\nD. ತಾಮ್ರಲಿಪ್ತಿ (ತಾಮ್ಲುಕ್)", ["A and D only", "B and C only", "A, B and C only", "A, B, C and D"], 3, ["Bharuch, Arikamedu, Muziris and Tamluk were all ports linked with Indo-Roman trade.", "ಭರೂಚ್, ಅರಿಕಮೇಡು, ಮುಜಿರಿಸ್ ಮತ್ತು ತಾಮ್ರಲಿಪ್ತಿ ಎಲ್ಲವೂ ಇಂಡೋ-ರೋಮನ್ ವ್ಯಾಪಾರದ ಬಂದರುಗಳು."]], [2017, "Match the Name of the Shifting Cultivation (List I) with the Country (List II):\nList I: A. Huma/Ladang  B. Milpa  C. Ray  D. Roca\nList II: I. Brazil  II. Vietnam  III. Central America  IV. Indonesia", "ಸ್ಥಳಾಂತರ ಬೇಸಾಯದ ಹೆಸರನ್ನು (ಪಟ್ಟಿ I) ದೇಶದೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. ಹುಮಾ/ಲಾಡಂಗ್  B. ಮಿಲ್ಪಾ  C. ರೇ  D. ರೋಕಾ\nಪಟ್ಟಿ II: I. ಬ್ರೆಜಿಲ್  II. ವಿಯೆಟ್ನಾಂ  III. ಮಧ್ಯ ಅಮೆರಿಕ  IV. ಇಂಡೋನೇಷ್ಯಾ", ["A–IV, B–III, C–II, D–I", "A–IV, B–III, C–I, D–II", "A–III, B–IV, C–II, D–I", "A–III, B–IV, C–I, D–II"], 0, ["Ladang – Indonesia; Milpa – Central America; Ray – Vietnam; Roca – Brazil.", "ಲಾಡಂಗ್ – ಇಂಡೋನೇಷ್ಯಾ; ಮಿಲ್ಪಾ – ಮಧ್ಯ ಅಮೆರಿಕ; ರೇ – ವಿಯೆಟ್ನಾಂ; ರೋಕಾ – ಬ್ರೆಜಿಲ್."]], [2017, "Which one of the following writs is issued by the High Court to a lower court or a quasi-judicial body to stop proceedings in a particular case where it has no jurisdiction?", "ಅಧೀನ ನ್ಯಾಯಾಲಯ ಅಥವಾ ಅರೆ-ನ್ಯಾಯಿಕ ಸಂಸ್ಥೆಗೆ ತನ್ನ ವ್ಯಾಪ್ತಿಯಲ್ಲಿಲ್ಲದ ಪ್ರಕರಣದ ವಿಚಾರಣೆಯನ್ನು ನಿಲ್ಲಿಸಲು ಹೈಕೋರ್ಟ್ ಹೊರಡಿಸುವ ರಿಟ್ ಯಾವುದು?", ["Habeas Corpus", "Prohibition", "Quo Warranto", "Certiorari"], 1, ["Prohibition is issued to stop a lower court from acting beyond its jurisdiction.", "ಅಧೀ
