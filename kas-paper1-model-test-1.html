<script>
const Q=[["Polity", "Which Constitutional Amendment added the words ‘Socialist’ and ‘Secular’ to the Preamble?", "ಯಾವ ಸಂವಿಧಾನ ತಿದ್ದುಪಡಿಯು ಪೀಠಿಕೆಗೆ ‘ಸಮಾಜವಾದಿ’ ಮತ್ತು ‘ಜಾತ್ಯತೀತ’ ಪದಗಳನ್ನು ಸೇರಿಸಿತು?", [["24th Amendment", "24ನೇ ತಿದ್ದುಪಡಿ"], ["42nd Amendment", "42ನೇ ತಿದ್ದುಪಡಿ"], ["44th Amendment", "44ನೇ ತಿದ್ದುಪಡಿ"], ["52nd Amendment", "52ನೇ ತಿದ್ದುಪಡಿ"]], 1, ["The 42nd Amendment (1976) also added ‘Integrity’ to the Preamble.", "42ನೇ ತಿದ್ದುಪಡಿ (1976) ‘ಅಖಂಡತೆ’ ಪದವನ್ನೂ ಸೇರಿಸಿತು."]], ["Polity", "Fundamental Duties are contained in which Part of the Constitution?", "ಮೂಲಭೂತ ಕರ್ತವ್ಯಗಳು ಸಂವಿಧಾನದ ಯಾವ ಭಾಗದಲ್ಲಿವೆ?", [["Part III", "ಭಾಗ III"], ["Part IV", "ಭಾಗ IV"], ["Part IV-A", "ಭಾಗ IV-A"], ["Part V", "ಭಾಗ V"]], 2, ["Part IV-A (Article 51A) was added by the 42nd Amendment on the Swaran Singh Committee’s recommendation.", "ಭಾಗ IV-A (ವಿಧಿ 51A) ಅನ್ನು ಸ್ವರಣ್ ಸಿಂಗ್ ಸಮಿತಿಯ ಶಿಫಾರಸಿನಂತೆ 42ನೇ ತಿದ್ದುಪಡಿಯಿಂದ ಸೇರಿಸಲಾಯಿತು."]], ["Polity", "The Right to Education for children aged 6–14 years was inserted in the Constitution as", "6–14 ವರ್ಷದ ಮಕ್ಕಳ ಶಿಕ್ಷಣದ ಹಕ್ಕನ್ನು ಸಂವಿಧಾನದಲ್ಲಿ ಹೀಗೆ ಸೇರಿಸಲಾಗಿದೆ", [["Article 19A", "ವಿಧಿ 19A"], ["Article 21A", "ವಿಧಿ 21A"], ["Article 24A", "ವಿಧಿ 24A"], ["Article 29A", "ವಿಧಿ 29A"]], 1, ["Article 21A was inserted by the 86th Amendment Act, 2002.", "86ನೇ ತಿದ್ದುಪಡಿ ಕಾಯ್ದೆ 2002 ರ ಮೂಲಕ ವಿಧಿ 21A ಸೇರಿಸಲಾಯಿತು."]], ["Polity", "Consider the following statements:\nA. The Vice-President of India is the ex-officio Chairman of the Rajya Sabha.\nB. The Vice-President can vote in the Rajya Sabha in the first instance on any matter.\nC. The Rajya Sabha is a permanent House not subject to dissolution.\nWhich of the above statements is/are correct?", "ಈ ಕೆಳಗಿನ ಹೇಳಿಕೆಗಳನ್ನು ಪರಿಗಣಿಸಿ:\nA. ಭಾರತದ ಉಪರಾಷ್ಟ್ರಪತಿ ರಾಜ್ಯಸಭೆಯ ಪದನಿಮಿತ್ತ ಸಭಾಪತಿ.\nB. ಉಪರಾಷ್ಟ್ರಪತಿ ಯಾವುದೇ ವಿಷಯದಲ್ಲಿ ಮೊದಲ ಬಾರಿಗೇ ಮತ ಚಲಾಯಿಸಬಹುದು.\nC. ರಾಜ್ಯಸಭೆ ಶಾಶ್ವತ ಸದನವಾಗಿದ್ದು ವಿಸರ್ಜನೆಗೆ ಒಳಪಡುವುದಿಲ್ಲ.\nಮೇಲಿನ ಯಾವ ಹೇಳಿಕೆ/ಹೇಳಿಕೆಗಳು ಸರಿ?", [["A only", "A ಮಾತ್ರ"], ["A and B only", "A ಮತ್ತು B ಮಾತ್ರ"], ["B and C only", "B ಮತ್ತು C ಮಾತ್ರ"], ["A, B and C", "A, B ಮತ್ತು C"]], 1, ["The Vice-President votes only to break a tie (casting vote), so B is wrong.", "ಉಪರಾಷ್ಟ್ರಪತಿ ಸಮಬಲ ಮತ ಬಂದಾಗ ಮಾತ್ರ ಮತ ಚಲಾಯಿಸುತ್ತಾರೆ; ಆದ್ದರಿಂದ B ತಪ್ಪು."]], ["Polity", "A Money Bill is defined in which Article of the Constitution?", "ಹಣಕಾಸು ವಿಧೇಯಕವನ್ನು ಸಂವಿಧಾನದ ಯಾವ ವಿಧಿಯಲ್ಲಿ ವ್ಯಾಖ್ಯಾನಿಸಲಾಗಿದೆ?", [["Article 108", "ವಿಧಿ 108"], ["Article 109", "ವಿಧಿ 109"], ["Article 110", "ವಿಧಿ 110"], ["Article 112", "ವಿಧಿ 112"]], 2, ["Article 110 defines a Money Bill; it can be introduced only in the Lok Sabha.", "ವಿಧಿ 110 ಹಣಕಾಸು ವಿಧೇಯಕವನ್ನು ವ್ಯಾಖ್ಯಾನಿಸುತ್ತದೆ; ಇದನ್ನು ಲೋಕಸಭೆಯಲ್ಲಿ ಮಾತ್ರ ಮಂಡಿಸಬಹುದು."]], ["Polity", "Which Amendment replaced the words ‘internal disturbance’ with ‘armed rebellion’ as a ground for National Emergency?", "ರಾಷ್ಟ್ರೀಯ ತುರ್ತು ಪರಿಸ್ಥಿತಿಯ ಆಧಾರವಾಗಿ ‘ಆಂತರಿಕ ಗೊಂದಲ’ ಪದದ ಬದಲು ‘ಸಶಸ್ತ್ರ ದಂಗೆ’ ಪದವನ್ನು ಯಾವ ತಿದ್ದುಪಡಿ ಸೇರಿಸಿತು?", [["38th Amendment", "38ನೇ ತಿದ್ದುಪಡಿ"], ["42nd Amendment", "42ನೇ ತಿದ್ದುಪಡಿ"], ["44th Amendment", "44ನೇ ತಿದ್ದುಪಡಿ"], ["73rd Amendment", "73ನೇ ತಿದ್ದುಪಡಿ"]], 2, ["The 44th Amendment (1978) made this change in Article 352.", "44ನೇ ತಿದ್ದುಪಡಿ (1978) ವಿಧಿ 352 ರಲ್ಲಿ ಈ ಬದಲಾವಣೆ ಮಾಡಿತು."]], ["Polity", "Match the writs (List I) with their meanings (List II):\nList I: A. Habeas Corpus  B. Mandamus  C. Certiorari  D. Quo Warranto\nList II: I. We command  II. To have the body  III. By what authority  IV. To be certified", "ರಿಟ್‌ಗಳನ್ನು (ಪಟ್ಟಿ I) ಅವುಗಳ ಅರ್ಥಗಳೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. ಹೇಬಿಯಸ್ ಕಾರ್ಪಸ್  B. ಮ್ಯಾಂಡಮಸ್  C. ಸರ್ಷಿಯೊರರಿ  D. ಕೋ ವಾರೆಂಟೋ\nಪಟ್ಟಿ II: I. ನಾವು ಆದೇಶಿಸುತ್ತೇವೆ  II. ದೇಹವನ್ನು ಹಾಜರುಪಡಿಸು  III. ಯಾವ ಅಧಿಕಾರದಿಂದ  IV. ಪ್ರಮಾಣೀಕರಿಸಲು", [["A–II, B–I, C–IV, D–III", "A–II, B–I, C–IV, D–III"], ["A–I, B–II, C–III, D–IV", "A–I, B–II, C–III, D–IV"], ["A–II, B–I, C–III, D–IV", "A–II, B–I, C–III, D–IV"], ["A–IV, B–I, C–II, D–III", "A–IV, B–I, C–II, D–III"]], 0, ["Habeas Corpus – to have the body; Mandamus – we command; Certiorari – to be certified; Quo Warranto – by what authority.", "ಹೇಬಿಯಸ್ ಕಾರ್ಪಸ್ – ದೇಹ ಹಾಜರುಪಡಿಸು; ಮ್ಯಾಂಡಮಸ್ – ನಾವು ಆದೇಶಿಸುತ್ತೇವೆ; ಸರ್ಷಿಯೊರರಿ – ಪ್ರಮಾಣೀಕರಿಸಲು; ಕೋ ವಾರೆಂಟೋ – ಯಾವ ಅಧಿಕಾರದಿಂದ."]], ["Polity", "Arrange the following in chronological order:\nA. Adoption of the Constitution\nB. Moving of the Objectives Resolution\nC. Constitution came into force\nD. First meeting of the Constituent Assembly", "ಈ ಕೆಳಗಿನವುಗಳನ್ನು ಕಾಲಾನುಕ್ರಮದಲ್ಲಿ ಜೋಡಿಸಿ:\nA. ಸಂವಿಧಾನದ ಅಂಗೀಕಾರ\nB. ಧ್ಯೇಯೋದ್ದೇಶ ನಿರ್ಣಯ ಮಂಡನೆ\nC. ಸಂವಿಧಾನ ಜಾರಿಗೆ ಬಂದದ್ದು\nD. ಸಂವಿಧಾನ ರಚನಾ ಸಭೆಯ ಮೊದಲ ಸಭೆ", [["D, B, A, C", "D, B, A, C"], ["B, D, A, C", "B, D, A, C"], ["D, A, B, C", "D, A, B, C"], ["B, A, D, C", "B, A, D, C"]], 0, ["First meeting 9 Dec 1946 → Objectives Resolution 13 Dec 1946 → adoption 26 Nov 1949 → commencement 26 Jan 1950.", "ಮೊದಲ ಸಭೆ 9 ಡಿಸೆಂಬರ್ 1946 → ಧ್ಯೇಯೋದ್ದೇಶ ನಿರ್ಣಯ 13 ಡಿಸೆಂಬರ್ 1946 → ಅಂಗೀಕಾರ 26 ನವೆಂಬರ್ 1949 → ಜಾರಿ 26 ಜನವರಿ 1950."]], ["Polity", "Assertion (A): India is described as a ‘Union of States’ and not a federation of States.\nReason (R): The States have no right to secede from the Union.", "ಪ್ರತಿಪಾದನೆ (A): ಭಾರತವನ್ನು ‘ರಾಜ್ಯಗಳ ಒಕ್ಕೂಟ’ ಎನ್ನಲಾಗುತ್ತದೆ, ರಾಜ್ಯಗಳ ಒಪ್ಪಂದದ ಒಕ್ಕೂಟ ಅಲ್ಲ.\nಕಾರಣ (R): ರಾಜ್ಯಗಳಿಗೆ ಒಕ್ಕೂಟದಿಂದ ಬೇರ್ಪಡುವ ಹಕ್ಕಿಲ್ಲ.", [["Both (A) and (R) are true and (R) is the correct explanation of (A)", "(A) ಮತ್ತು (R) ಎರಡೂ ಸತ್ಯ ಮತ್ತು (R) ಯು (A) ಯ ಸರಿಯಾದ ವಿವರಣೆ"], ["Both (A) and (R) are true but (R) is not the correct explanation of (A)", "(A) ಮತ್ತು (R) ಎರಡೂ ಸತ್ಯ ಆದರೆ (R) ಯು (A) ಯ ಸರಿಯಾದ ವಿವರಣೆಯಲ್ಲ"], ["(A) is true but (R) is false", "(A) ಸತ್ಯ ಆದರೆ (R) ಸುಳ್ಳು"], ["(A) is false but (R) is true", "(A) ಸುಳ್ಳು ಆದರೆ (R) ಸತ್ಯ"]], 0, ["Article 1 calls India a Union; Dr. Ambedkar said the Union is indestructible, so states cannot secede.", "ವಿಧಿ 1 ಭಾರತವನ್ನು ಒಕ್ಕೂಟ ಎನ್ನುತ್ತದೆ; ಒಕ್ಕೂಟ ಅವಿನಾಶಿ, ರಾಜ್ಯಗಳು ಬೇರ್ಪಡುವಂತಿಲ್ಲ ಎಂದು ಅಂಬೇಡ್ಕರ್ ಹೇಳಿದರು."]], ["Polity", "Which of the following is NOT correct about the Governor of a State?", "ರಾಜ್ಯದ ರಾಜ್ಯಪಾಲರ ಕುರಿತು ಕೆಳಗಿನವುಗಳಲ್ಲಿ ಯಾವುದು ಸರಿಯಲ್ಲ?", [["He is appointed by the President of India", "ಅವರನ್ನು ಭಾರತದ ರಾಷ್ಟ್ರಪತಿ ನೇಮಿಸುತ್ತಾರೆ"], ["He holds office during the pleasure of the President", "ಅವರು ರಾಷ್ಟ್ರಪತಿಯ ಇಚ್ಛೆಯಿರುವವರೆಗೆ ಅಧಿಕಾರದಲ್ಲಿರುತ್ತಾರೆ"], ["He must have completed 35 years of age", "ಅವರು 35 ವರ್ಷ ಪೂರ್ಣಗೊಳಿಸಿರಬೇಕು"], ["He is elected by the State Legislative Assembly", "ಅವರನ್ನು ರಾಜ್ಯ ವಿಧಾನಸಭೆ ಚುನಾಯಿಸುತ್ತದೆ"]], 3, ["The Governor is appointed, not elected (Articles 153–155).", "ರಾಜ್ಯಪಾಲರನ್ನು ನೇಮಿಸಲಾಗುತ್ತದೆ, ಚುನಾಯಿಸುವುದಿಲ್ಲ (ವಿಧಿ 153–155)."]], ["Polity", "The Eleventh Schedule of the Constitution contains how many subjects for Panchayats?", "ಸಂವಿಧಾನದ ಹನ್ನೊಂದನೇ ಅನುಸೂಚಿಯಲ್ಲಿ ಪಂಚಾಯತ್‌ಗಳಿಗೆ ಎಷ್ಟು ವಿಷಯಗಳಿವೆ?", [["18", "18"], ["29", "29"], ["21", "21"], ["24", "24"]], 1, ["The 11th Schedule (73rd Amendment) lists 29 subjects; the 12th Schedule (municipalities) lists 18.", "11ನೇ ಅನುಸೂಚಿ (73ನೇ ತಿದ್ದುಪಡಿ) 29 ವಿಷಯಗಳನ್ನು ಪಟ್ಟಿ ಮಾಡುತ್ತದೆ; 12ನೇ ಅನುಸೂಚಿ (ನಗರಪಾಲಿಕೆ) 18."]], ["Polity", "Consider the following statements about the Election Commission of India:\nA. It is established under Article 324.\nB. The Chief Election Commissioner can be removed in the same manner as a Judge of the Supreme Court.\nC. It has been a multi-member body since 1993.\nWhich of the above statements are correct?", "ಭಾರತೀಯ ಚುನಾವಣಾ ಆಯೋಗದ ಕುರಿತು ಹೇಳಿಕೆಗಳು:\nA. ಇದನ್ನು ವಿಧಿ 324 ರ ಅಡಿಯಲ್ಲಿ ಸ್ಥಾಪಿಸಲಾಗಿದೆ.\nB. ಮುಖ್ಯ ಚುನಾವಣಾ ಆಯುಕ್ತರನ್ನು ಸರ್ವೋಚ್ಚ ನ್ಯಾಯಾಲಯದ ನ್ಯಾಯಾಧೀಶರನ್ನು ತೆಗೆಯುವ ರೀತಿಯಲ್ಲೇ ತೆಗೆಯಬಹುದು.\nC. 1993 ರಿಂದ ಇದು ಬಹು-ಸದಸ್ಯ ಸಂಸ್ಥೆಯಾಗಿದೆ.\nಮೇಲಿನ ಯಾವ ಹೇಳಿಕೆಗಳು ಸರಿ?", [["A only", "A ಮಾತ್ರ"], ["A and B only", "A ಮತ್ತು B ಮಾತ್ರ"], ["B and C only", "B ಮತ್ತು C ಮಾತ್ರ"], ["A, B and C", "A, B ಮತ್ತು C"]], 3, ["All three are correct.", "ಮೂರೂ ಹೇಳಿಕೆಗಳು ಸರಿ."]], ["Polity", "What is the minimum age required to become a member of the Rajya Sabha?", "ರಾಜ್ಯಸಭೆಯ ಸದಸ್ಯರಾಗಲು ಅಗತ್ಯವಾದ ಕನಿಷ್ಠ ವಯಸ್ಸು ಎಷ್ಟು?", [["25 years", "25 ವರ್ಷ"], ["30 years", "30 ವರ್ಷ"], ["35 years", "35 ವರ್ಷ"], ["21 years", "21 ವರ್ಷ"]], 1, ["Rajya Sabha: 30 years; Lok Sabha: 25 years.", "ರಾಜ್ಯಸಭೆ: 30 ವರ್ಷ; ಲೋಕಸಭೆ: 25 ವರ್ಷ."]], ["Polity", "Under which Article can Parliament legislate on a State List subject in the national interest?", "ರಾಷ್ಟ್ರೀಯ ಹಿತಾಸಕ್ತಿಯಲ್ಲಿ ರಾಜ್ಯ ಪಟ್ಟಿಯ ವಿಷಯದ ಮೇಲೆ ಸಂಸತ್ತು ಯಾವ ವಿಧಿಯಡಿ ಕಾನೂನು ಮಾಡಬಹುದು?", [["Article 248", "ವಿಧಿ 248"], ["Article 249", "ವಿಧಿ 249"], ["Article 250", "ವಿಧಿ 250"], ["Article 252", "ವಿಧಿ 252"]], 1, ["Article 249 needs a Rajya Sabha resolution by two-thirds majority.", "ವಿಧಿ 249 ಕ್ಕೆ ರಾಜ್ಯಸಭೆಯ ಮೂರನೇ ಎರಡರಷ್ಟು ಬಹುಮತದ ನಿರ್ಣಯ ಬೇಕು."]], ["Polity", "Article 148 of the Constitution deals with", "ಸಂವಿಧಾನದ ವಿಧಿ 148 ಯಾವುದರ ಕುರಿತಾಗಿದೆ?", [["UPSC", "ಯುಪಿಎಸ್‌ಸಿ"], ["Comptroller and Auditor General of India", "ಭಾರತದ ಮಹಾಲೇಖಪಾಲರು (CAG)"], ["Election Commission", "ಚುನಾವಣಾ ಆಯೋಗ"], ["Finance Commission", "ಹಣಕಾಸು ಆಯೋಗ"]], 1, ["Article 148 provides for the CAG of India.", "ವಿಧಿ 148 ಭಾರತದ ಮಹಾಲೇಖಪಾಲರ (CAG) ಕುರಿತಾಗಿದೆ."]], ["Polity", "Which Directive Principle is contained in Article 40?", "ವಿಧಿ 40 ರಲ್ಲಿರುವ ನಿರ್ದೇಶಕ ತತ್ವ ಯಾವುದು?", [["Uniform Civil Code", "ಏಕರೂಪ ನಾಗರಿಕ ಸಂಹಿತೆ"], ["Organisation of village panchayats", "ಗ್ರಾಮ ಪಂಚಾಯತ್‌ಗಳ ಸಂಘಟನೆ"], ["Equal pay for equal work", "ಸಮಾನ ಕೆಲಸಕ್ಕೆ ಸಮಾನ ವೇತನ"], ["Separation of judiciary from executive", "ನ್ಯಾಯಾಂಗವನ್ನು ಕಾರ್ಯಾಂಗದಿಂದ ಪ್ರತ್ಯೇಕಿಸುವುದು"]], 1, ["Article 40 – panchayats; 44 – UCC; 39(d) – equal pay; 50 – separation of judiciary.", "ವಿಧಿ 40 – ಪಂಚಾಯತ್; 44 – ಏಕರೂಪ ಸಂಹಿತೆ; 39(d) – ಸಮಾನ ವೇತನ; 50 – ನ್ಯಾಯಾಂಗ ಪ್ರತ್ಯೇಕತೆ."]], ["Polity", "Which Article of the Constitution guarantees equality before law and equal protection of the laws?", "ಕಾನೂನಿನ ಮುಂದೆ ಸಮಾನತೆ ಮತ್ತು ಕಾನೂನುಗಳ ಸಮಾನ ರಕ್ಷಣೆಯನ್ನು ಖಾತ್ರಿಪಡಿಸುವ ವಿಧಿ ಯಾವುದು?", [["Article 14", "ವಿಧಿ 14"], ["Article 15", "ವಿಧಿ 15"], ["Article 16", "ವಿಧಿ 16"], ["Article 17", "ವಿಧಿ 17"]], 0, ["Article 14 guarantees equality before law; 15 – no discrimination; 16 – public employment; 17 – abolition of untouchability.", "ವಿಧಿ 14 ಕಾನೂನಿನ ಮುಂದೆ ಸಮಾನತೆ; 15 – ತಾರತಮ್ಯ ನಿಷೇಧ; 16 – ಸರ್ಕಾರಿ ಉದ್ಯೋಗ; 17 – ಅಸ್ಪೃಶ್ಯತೆ ನಿರ್ಮೂಲನೆ."]], ["History", "Which Harappan site is located in present-day Haryana?", "ಇಂದಿನ ಹರಿಯಾಣದಲ್ಲಿರುವ ಹರಪ್ಪ ನಾಗರಿಕತೆಯ ತಾಣ ಯಾವುದು?", [["Lothal", "ಲೋಥಾಲ್"], ["Rakhigarhi", "ರಾಖಿಗಢಿ"], ["Dholavira", "ಧೋಲಾವೀರ"], ["Kalibangan", "ಕಾಲಿಬಂಗನ್"]], 1, ["Rakhigarhi (Hisar district, Haryana) is among the largest Harappan sites.", "ರಾಖಿಗಢಿ (ಹಿಸಾರ್ ಜಿಲ್ಲೆ, ಹರಿಯಾಣ) ಅತಿ ದೊಡ್ಡ ಹರಪ್ಪ ತಾಣಗಳಲ್ಲಿ ಒಂದು."]], ["History", "Consider the following statements about the Mauryan period:\nA. The Kalinga War was fought during Ashoka’s reign.\nB. The Arthashastra is attributed to Kautilya.\nC. Megasthenes, the Greek ambassador, wrote Indica.\nWhich of the above are correct?", "ಮೌರ್ಯರ ಕಾಲದ ಕುರಿತು ಹೇಳಿಕೆಗಳು:\nA. ಕಳಿಂಗ ಯುದ್ಧ ಅಶೋಕನ ಆಳ್ವಿಕೆಯಲ್ಲಿ ನಡೆಯಿತು.\nB. ಅರ್ಥಶಾಸ್ತ್ರ ಕೌಟಿಲ್ಯನಿಗೆ ಆರೋಪಿಸಲಾಗಿದೆ.\nC. ಗ್ರೀಕ್ ರಾಯಭಾರಿ ಮೆಗಾಸ್ತನೀಸ್ ‘ಇಂಡಿಕಾ’ ಬರೆದನು.\nಮೇಲಿನ ಯಾವುವು ಸರಿ?", [["A only", "A ಮಾತ್ರ"], ["A and B only", "A ಮತ್ತು B ಮಾತ್ರ"], ["B and C only", "B ಮತ್ತು C ಮಾತ್ರ"], ["A, B and C", "A, B ಮತ್ತು C"]], 3, ["All three statements are correct.", "ಮೂರೂ ಹೇಳಿಕೆಗಳು ಸರಿ."]], ["History", "Who wrote the play ‘Mudrarakshasa’?", "‘ಮುದ್ರಾರಾಕ್ಷಸ’ ನಾಟಕವನ್ನು ಬರೆದವರು ಯಾರು?", [["Kalidasa", "ಕಾಳಿದಾಸ"], ["Vishakhadatta", "ವಿಶಾಖದತ್ತ"], ["Bhasa", "ಭಾಸ"], ["Shudraka", "ಶೂದ್ರಕ"]], 1, ["Vishakhadatta wrote Mudrarakshasa, about Chanakya and Chandragupta Maurya.", "ವಿಶಾಖದತ್ತ ಚಾಣಕ್ಯ ಮತ್ತು ಚಂದ್ರಗುಪ್ತ ಮೌರ್ಯನ ಕುರಿತು ಮುದ್ರಾರಾಕ್ಷಸ ಬರೆದನು."]], ["History", "The Allahabad Pillar Inscription of Samudragupta was composed by", "ಸಮುದ್ರಗುಪ್ತನ ಅಲಹಾಬಾದ್ ಸ್ತಂಭ ಶಾಸನವನ್ನು ರಚಿಸಿದವರು", [["Harishena", "ಹರಿಷೇಣ"], ["Ravikirti", "ರವಿಕೀರ್ತಿ"], ["Banabhatta", "ಬಾಣಭಟ್ಟ"], ["Vishakhadatta", "ವಿಶಾಖದತ್ತ"]], 0, ["Harishena, the court poet, composed it; Ravikirti composed the Aihole inscription.", "ಆಸ್ಥಾನ ಕವಿ ಹರಿಷೇಣ ರಚಿಸಿದನು; ಐಹೊಳೆ ಶಾಸನ ರವಿಕೀರ್ತಿಯದು."]], ["History", "Match the Buddhist Councils (List I) with the places (List II):\nList I: A. First  B. Second  C. Third  D. Fourth\nList II: I. Vaishali  II. Rajagriha  III. Kundalvana (Kashmir)  IV. Pataliputra", "ಬೌದ್ಧ ಸಭೆಗಳನ್ನು (ಪಟ್ಟಿ I) ಸ್ಥಳಗಳೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. ಮೊದಲನೇ  B. ಎರಡನೇ  C. ಮೂರನೇ  D. ನಾಲ್ಕನೇ\nಪಟ್ಟಿ II: I. ವೈಶಾಲಿ  II. ರಾಜಗೃಹ  III. ಕುಂಡಲವನ (ಕಾಶ್ಮೀರ)  IV. ಪಾಟಲಿಪುತ್ರ", [["A–II, B–I, C–IV, D–III", "A–II, B–I, C–IV, D–III"], ["A–I, B–II, C–III, D–IV", "A–I, B–II, C–III, D–IV"], ["A–II, B–IV, C–I, D–III", "A–II, B–IV, C–I, D–III"], ["A–IV, B–I, C–II, D–III", "A–IV, B–I, C–II, D–III"]], 0, ["First – Rajagriha; Second – Vaishali; Third – Pataliputra (Ashoka); Fourth – Kundalvana (Kanishka).", "ಮೊದಲನೇ – ರಾಜಗೃಹ; ಎರಡನೇ – ವೈಶಾಲಿ; ಮೂರನೇ – ಪಾಟಲಿಪುತ್ರ (ಅಶೋಕ); ನಾಲ್ಕನೇ – ಕುಂಡಲವನ (ಕನಿಷ್ಕ)."]], ["History", "The Silappadikaram, a Tamil epic of the Sangam age, was written by", "ಸಂಗಂ ಯುಗದ ತಮಿಳು ಮಹಾಕಾವ್ಯ ‘ಶಿಲಪ್ಪದಿಕಾರಂ’ ಬರೆದವರು", [["Ilango Adigal", "ಇಳಂಗೋ ಅಡಿಗಳ್"], ["Tolkappiyar", "ತೊಲ್ಕಾಪ್ಪಿಯರ್"], ["Thiruvalluvar", "ತಿರುವಳ್ಳುವರ್"], ["Sittalai Sattanar", "ಶಿತ್ತಲೈ ಸಾತ್ತನಾರ್"]], 0, ["Ilango Adigal wrote Silappadikaram; Sattanar wrote Manimekalai.", "ಇಳಂಗೋ ಅಡಿಗಳ್ ಶಿಲಪ್ಪದಿಕಾರಂ ಬರೆದನು; ಸಾತ್ತನಾರ್ ಮಣಿಮೇಕಲೈ ಬರೆದನು."]], ["History", "The Shore Temple at Mahabalipuram was built by the Pallava king", "ಮಹಾಬಲಿಪುರಂನ ತೀರ ದೇವಾಲಯವನ್ನು ಕಟ್ಟಿಸಿದ ಪಲ್ಲವ ರಾಜ", [["Mahendravarman I", "ಒಂದನೇ ಮಹೇಂದ್ರವರ್ಮ"], ["Narasimhavarman I", "ಒಂದನೇ ನರಸಿಂಹವರ್ಮ"], ["Narasimhavarman II (Rajasimha)", "ಎರಡನೇ ನರಸಿಂಹವರ್ಮ (ರಾಜಸಿಂಹ)"], ["Nandivarman II", "ಎರಡನೇ ನಂದಿವರ್ಮ"]], 2, ["Rajasimha (Narasimhavarman II) built the structural Shore Temple.", "ರಾಜಸಿಂಹ (ಎರಡನೇ ನರಸಿಂಹವರ್ಮ) ತೀರ ದೇವಾಲಯವನ್ನು ಕಟ್ಟಿಸಿದನು."]], ["History", "The Vijayanagara Empire was founded in 1336 by", "ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯವನ್ನು 1336 ರಲ್ಲಿ ಸ್ಥಾಪಿಸಿದವರು", [["Krishnadevaraya", "ಕೃಷ್ಣದೇವರಾಯ"], ["Harihara I and Bukka I", "ಒಂದನೇ ಹರಿಹರ ಮತ್ತು ಒಂದನೇ ಬುಕ್ಕ"], ["Devaraya II", "ಎರಡನೇ ದೇವರಾಯ"], ["Achyuta Raya", "ಅಚ್ಯುತರಾಯ"]], 1, ["Harihara and Bukka founded the empire on the Tungabhadra’s banks (guided by Vidyaranya).", "ಹರಿಹರ ಮತ್ತು ಬುಕ್ಕ ತುಂಗಭದ್ರಾ ತೀರದಲ್ಲಿ ಸಾಮ್ರಾಜ್ಯ ಸ್ಥಾಪಿಸಿದರು (ವಿದ್ಯಾರಣ್ಯರ ಮಾರ್ಗದರ್ಶನ)."]], ["History", "The Alai Darwaza at Delhi was built by", "ದೆಹಲಿಯ ಅಲೈ ದರ್ವಾಜಾವನ್ನು ಕಟ್ಟಿಸಿದವರು", [["Iltutmish", "ಇಲ್ತುತ್ಮಿಷ್"], ["Alauddin Khilji", "ಅಲ್ಲಾವುದ್ದೀನ್ ಖಿಲ್ಜಿ"], ["Firuz Shah Tughlaq", "ಫಿರೋಜ್ ಷಾ ತುಘಲಕ್"], ["Shah Jahan", "ಷಹಜಹಾನ್"]], 1, ["Alauddin Khilji built it in 1311 as a gateway to the Qutb complex.", "ಅಲ್ಲಾವುದ್ದೀನ್ ಖಿಲ್ಜಿ 1311 ರಲ್ಲಿ ಕುತುಬ್ ಸಂಕೀರ್ಣದ ಹೆಬ್ಬಾಗಿಲಾಗಿ ಕಟ್ಟಿಸಿದನು."]], ["History", "Consider the following about Sher Shah Suri:\nA. He defeated Humayun at the Battle of Chausa.\nB. He introduced the silver coin called the ‘rupiya’.\nC. He reconstructed the Grand Trunk Road.\nWhich of the above are correct?", "ಷೇರ್ ಷಾ ಸೂರಿಯ ಕುರಿತು:\nA. ಚೌಸಾ ಕದನದಲ್ಲಿ ಹುಮಾಯೂನನನ್ನು ಸೋಲಿಸಿದನು.\nB. ‘ರೂಪಿಯಾ’ ಎಂಬ ಬೆಳ್ಳಿ ನಾಣ್ಯವನ್ನು ಪರಿಚಯಿಸಿದನು.\nC. ಗ್ರ್ಯಾಂಡ್ ಟ್ರಂಕ್ ರಸ್ತೆಯನ್ನು ಪುನರ್ನಿರ್ಮಿಸಿದನು.\nಮೇಲಿನ ಯಾವುವು ಸರಿ?", [["A only", "A ಮಾತ್ರ"], ["A and B only", "A ಮತ್ತು B ಮಾತ್ರ"], ["B and C only", "B ಮತ್ತು C ಮಾತ್ರ"], ["A, B and C", "A, B ಮತ್ತು C"]], 3, ["All three are correct.", "ಮೂರೂ ಸರಿ."]], ["History", "Arrange the following battles in chronological order:\nA. Battle of Khanwa\nB. Battle of Chausa\nC. Second Battle of Panipat\nD. First Battle of Panipat", "ಕೆಳಗಿನ ಕದನಗಳನ್ನು ಕಾಲಾನುಕ್ರಮದಲ್ಲಿ ಜೋಡಿಸಿ:\nA. ಖಾನ್ವಾ ಕದನ\nB. ಚೌಸಾ ಕದನ\nC. ಎರಡನೇ ಪಾಣಿಪತ್ ಕದನ\nD. ಮೊದಲನೇ ಪಾಣಿಪತ್ ಕದನ", [["D, A, B, C", "D, A, B, C"], ["A, D, B, C", "A, D, B, C"], ["D, B, A, C", "D, B, A, C"], ["D, A, C, B", "D, A, C, B"]], 0, ["Panipat I (1526) → Khanwa (1527) → Chausa (1539) → Panipat II (1556).", "ಪಾಣಿಪತ್ I (1526) → ಖಾನ್ವಾ (1527) → ಚೌಸಾ (1539) → ಪಾಣಿಪತ್ II (1556)."]], ["History", "‘Gita Govinda’, a Sanskrit lyric on Radha and Krishna, was composed by", "ರಾಧಾ–ಕೃಷ್ಣರ ಕುರಿತ ಸಂಸ್ಕೃತ ಗೀತಕಾವ್ಯ ‘ಗೀತ ಗೋವಿಂದ’ವನ್ನು ರಚಿಸಿದವರು", [["Jayadeva", "ಜಯದೇವ"], ["Surdas", "ಸೂರದಾಸ"], ["Tulsidas", "ತುಳಸೀದಾಸ"], ["Chaitanya", "ಚೈತನ್ಯ"]], 0, ["Jayadeva of Bengal composed Gita Govinda in the 12th century.", "ಬಂಗಾಳದ ಜಯದೇವ 12ನೇ ಶತಮಾನದಲ್ಲಿ ಗೀತ ಗೋವಿಂದ ರಚಿಸಿದನು."]], ["History", "The Permanent Settlement of Bengal (1793) was introduced by", "ಬಂಗಾಳದ ಶಾಶ್ವತ ಜಮೀನ್ದಾರಿ ಪದ್ಧತಿಯನ್ನು (1793) ಜಾರಿಗೆ ತಂದವರು", [["Warren Hastings", "ವಾರೆನ್ ಹೇಸ್ಟಿಂಗ್ಸ್"], ["Lord Cornwallis", "ಲಾರ್ಡ್ ಕಾರ್ನ್‌ವಾಲಿಸ್"], ["Lord Wellesley", "ಲಾರ್ಡ್ ವೆಲ್ಲೆಸ್ಲಿ"], ["Lord Dalhousie", "ಲಾರ್ಡ್ ಡಾಲ್‌ಹೌಸಿ"]], 1, ["Cornwallis fixed the land revenue permanently with zamindars.", "ಕಾರ್ನ್‌ವಾಲಿಸ್ ಜಮೀನ್ದಾರರೊಂದಿಗೆ ಭೂಕಂದಾಯವನ್ನು ಶಾಶ್ವತವಾಗಿ ನಿಗದಿಪಡಿಸಿದನು."]], ["History", "The Doctrine of Lapse was introduced by", "ಹಕ್ಕು ಚ್ಯುತಿ ನೀತಿ (Doctrine of Lapse) ಯನ್ನು ಜಾರಿಗೆ ತಂದವರು", [["Lord Dalhousie", "ಲಾರ್ಡ್ ಡಾಲ್‌ಹೌಸಿ"], ["Lord Curzon", "ಲಾರ್ಡ್ ಕರ್ಜನ್"], ["Lord Canning", "ಲಾರ್ಡ್ ಕ್ಯಾನಿಂಗ್"], ["Lord Bentinck", "ಲಾರ್ಡ್ ಬೆಂಟಿಂಕ್"]], 0, ["Dalhousie annexed Satara, Jhansi and Nagpur among others using this policy.", "ಈ ನೀತಿಯಿಂದ ಡಾಲ್‌ಹೌಸಿ ಸತಾರಾ, ಝಾನ್ಸಿ, ನಾಗಪುರ ಮೊದಲಾದವನ್ನು ವಶಪಡಿಸಿಕೊಂಡನು."]], ["History", "The first President of the Indian National Congress (1885) was", "ಭಾರತೀಯ ರಾಷ್ಟ್ರೀಯ ಕಾಂಗ್ರೆಸ್‌ನ (1885) ಮೊದಲ ಅಧ್ಯಕ್ಷರು", [["A.O. Hume", "ಎ.ಒ. ಹ್ಯೂಮ್"], ["W.C. Bonnerjee", "ಡಬ್ಲ್ಯು.ಸಿ. ಬ್ಯಾನರ್ಜಿ"], ["Dadabhai Naoroji", "ದಾದಾಭಾಯಿ ನವರೋಜಿ"], ["Surendranath Banerjee", "ಸುರೇಂದ್ರನಾಥ ಬ್ಯಾನರ್ಜಿ"]], 1, ["A.O. Hume founded the INC; W.C. Bonnerjee presided over its first session in Bombay.", "ಎ.ಒ. ಹ್ಯೂಮ್ ಕಾಂಗ್ರೆಸ್ ಸ್ಥಾಪಿಸಿದರು; ಮುಂಬೈ ಮೊದಲ ಅಧಿವೇಶನದ ಅಧ್ಯಕ್ಷತೆ ಡಬ್ಲ್ಯು.ಸಿ. ಬ್ಯಾನರ್ಜಿ ವಹಿಸಿದರು."]], ["History", "Match the movements (List I) with the years (List II):\nList I: A. Champaran Satyagraha  B. Non-Cooperation Movement  C. Dandi March  D. Quit India Movement\nList II: I. 1930  II. 1942  III. 1917  IV. 1920", "ಚಳವಳಿಗಳನ್ನು (ಪಟ್ಟಿ I) ವರ್ಷಗಳೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. ಚಂಪಾರಣ್ ಸತ್ಯಾಗ್ರಹ  B. ಅಸಹಕಾರ ಚಳವಳಿ  C. ದಂಡಿ ಯಾತ್ರೆ  D. ಭಾರತ ಬಿಟ್ಟು ತೊಲಗಿ ಚಳವಳಿ\nಪಟ್ಟಿ II: I. 1930  II. 1942  III. 1917  IV. 1920", [["A–III, B–IV, C–I, D–II", "A–III, B–IV, C–I, D–II"], ["A–IV, B–III, C–I, D–II", "A–IV, B–III, C–I, D–II"], ["A–III, B–IV, C–II, D–I", "A–III, B–IV, C–II, D–I"], ["A–I, B–II, C–III, D–IV", "A–I, B–II, C–III, D–IV"]], 0, ["Champaran 1917; Non-Cooperation 1920; Dandi March 1930; Quit India 1942.", "ಚಂಪಾರಣ್ 1917; ಅಸಹಕಾರ 1920; ದಂಡಿ ಯಾತ್ರೆ 1930; ಭಾರತ ಬಿಟ್ಟು ತೊಲಗಿ 1942."]], ["History", "The Jallianwala Bagh massacre (1919) was ordered by", "ಜಲಿಯನ್‌ವಾಲಾ ಬಾಗ್ ಹತ್ಯಾಕಾಂಡವನ್ನು (1919) ಆದೇಶಿಸಿದವರು", [["General Dyer", "ಜನರಲ್ ಡೈಯರ್"], ["Lord Chelmsford", "ಲಾರ್ಡ್ ಚೆಲ್ಮ್ಸ್‌ಫರ್ಡ್"], ["Michael O’Dwyer", "ಮೈಕೆಲ್ ಓ’ಡ್ವೈರ್"], ["Lord Irwin", "ಲಾರ್ಡ್ ಇರ್ವಿನ್"]], 0, ["General Reginald Dyer ordered firing at Amritsar; the Hunter Commission inquired into it.", "ಜನರಲ್ ರೆಜಿನಾಲ್ಡ್ ಡೈಯರ್ ಅಮೃತಸರದಲ್ಲಿ ಗುಂಡು ಹಾರಿಸಲು ಆದೇಶಿಸಿದನು; ಹಂಟರ್ ಆಯೋಗ ತನಿಖೆ ನಡೆಸಿತು."]], ["History", "Who among the following was NOT a member of the Cabinet Mission (1946)?", "ಕೆಳಗಿನವರಲ್ಲಿ ಕ್ಯಾಬಿನೆಟ್ ಮಿಷನ್ (1946) ಸದಸ್ಯರಲ್ಲದವರು ಯಾರು?", [["Pethick-Lawrence", "ಪೆಥಿಕ್-ಲಾರೆನ್ಸ್"], ["Stafford Cripps", "ಸ್ಟಾಫರ್ಡ್ ಕ್ರಿಪ್ಸ್"], ["A.V. Alexander", "ಎ.ವಿ. ಅಲೆಕ್ಸಾಂಡರ್"], ["Lord Mountbatten", "ಲಾರ್ಡ್ ಮೌಂಟ್‌ಬ್ಯಾಟನ್"]], 3, ["The mission had Pethick-Lawrence, Cripps and Alexander; Mountbatten came as Viceroy in 1947.", "ಮಿಷನ್‌ನಲ್ಲಿ ಪೆಥಿಕ್-ಲಾರೆನ್ಸ್, ಕ್ರಿಪ್ಸ್, ಅಲೆಕ್ಸಾಂಡರ್ ಇದ್ದರು; ಮೌಂಟ್‌ಬ್ಯಾಟನ್ 1947 ರಲ್ಲಿ ವೈಸರಾಯ್ ಆಗಿ ಬಂದರು."]], ["History", "Assertion (A): Gandhiji withdrew the Non-Cooperation Movement in 1922.\nReason (R): Violence occurred at Chauri Chaura where a mob burnt a police station.", "ಪ್ರತಿಪಾದನೆ (A): 1922 ರಲ್ಲಿ ಗಾಂಧೀಜಿ ಅಸಹಕಾರ ಚಳವಳಿಯನ್ನು ಹಿಂತೆಗೆದುಕೊಂಡರು.\nಕಾರಣ (R): ಚೌರಿ ಚೌರಾದಲ್ಲಿ ಗುಂಪೊಂದು ಪೊಲೀಸ್ ಠಾಣೆಗೆ ಬೆಂಕಿ ಹಚ್ಚಿ ಹಿಂಸೆ ನಡೆಯಿತು.", [["Both (A) and (R) are true and (R) is the correct explanation of (A)", "(A) ಮತ್ತು (R) ಎರಡೂ ಸತ್ಯ ಮತ್ತು (R) ಯು (A) ಯ ಸರಿಯಾದ ವಿವರಣೆ"], ["Both (A) and (R) are true but (R) is not the correct explanation of (A)", "(A) ಮತ್ತು (R) ಎರಡೂ ಸತ್ಯ ಆದರೆ (R) ಯು (A) ಯ ಸರಿಯಾದ ವಿವರಣೆಯಲ್ಲ"], ["(A) is true but (R) is false", "(A) ಸತ್ಯ ಆದರೆ (R) ಸುಳ್ಳು"], ["(A) is false but (R) is true", "(A) ಸುಳ್ಳು ಆದರೆ (R) ಸತ್ಯ"]], 0, ["The Chauri Chaura violence (Feb 1922) made Gandhiji call off the movement.", "ಚೌರಿ ಚೌರಾ ಹಿಂಸೆ (ಫೆಬ್ರವರಿ 1922) ಕಾರಣ ಗಾಂಧೀಜಿ ಚಳವಳಿ ನಿಲ್ಲಿಸಿದರು."]], ["History", "The Kadamba dynasty was founded by Mayurasharma with its capital at", "ಮಯೂರಶರ್ಮನು ಸ್ಥಾಪಿಸಿದ ಕದಂಬ ರಾಜವಂಶದ ರಾಜಧಾನಿ", [["Banavasi", "ಬನವಾಸಿ"], ["Badami", "ಬಾದಾಮಿ"], ["Manyakheta", "ಮಾನ್ಯಖೇಟ"], ["Dwarasamudra", "ದ್ವಾರಸಮುದ್ರ"]], 0, ["Banavasi (Uttara Kannada) was the Kadamba capital.", "ಬನವಾಸಿ (ಉತ್ತರ ಕನ್ನಡ) ಕದಂಬರ ರಾಜಧಾನಿ."]], ["History", "Chalukya king Pulakeshi II is known for defeating", "ಚಾಲುಕ್ಯ ದೊರೆ ಎರಡನೇ ಪುಲಕೇಶಿ ಯಾರನ್ನು ಸೋಲಿಸಿದ್ದಕ್ಕಾಗಿ ಪ್ರಸಿದ್ಧ?", [["Harshavardhana", "ಹರ್ಷವರ್ಧನ"], ["Ashoka", "ಅಶೋಕ"], ["Mahmud of Ghazni", "ಘಜ್ನಿಯ ಮಹಮೂದ್"], ["Prithviraj Chauhan", "ಪೃಥ್ವಿರಾಜ ಚೌಹಾಣ್"]], 0, ["Pulakeshi II stopped Harshavardhana on the Narmada; the Aihole inscription records it.", "ಎರಡನೇ ಪುಲಕೇಶಿ ನರ್ಮದಾ ತೀರದಲ್ಲಿ ಹರ್ಷನನ್ನು ತಡೆದನು; ಐಹೊಳೆ ಶಾಸನ ಇದನ್ನು ದಾಖಲಿಸಿದೆ."]], ["History", "‘Kavirajamarga’, the earliest available Kannada work on poetics, is associated with the reign of", "ಕನ್ನಡದ ಮೊದಲ ಲಭ್ಯ ಅಲಂಕಾರ ಗ್ರಂಥ ‘ಕವಿರಾಜಮಾರ್ಗ’ ಯಾವ ದೊರೆಯ ಕಾಲಕ್ಕೆ ಸಂಬಂಧಿಸಿದೆ?", [["Amoghavarsha I", "ಒಂದನೇ ಅಮೋಘವರ್ಷ"], ["Vishnuvardhana", "ವಿಷ್ಣುವರ್ಧನ"], ["Krishnadevaraya", "ಕೃಷ್ಣದೇವರಾಯ"], ["Pulakeshi II", "ಎರಡನೇ ಪುಲಕೇಶಿ"]], 0, ["Rashtrakuta king Amoghavarsha I (Nripatunga) is linked with Kavirajamarga.", "ರಾಷ್ಟ್ರಕೂಟ ದೊರೆ ಅಮೋಘವರ್ಷ (ನೃಪತುಂಗ) ಕವಿರಾಜಮಾರ್ಗಕ್ಕೆ ಸಂಬಂಧಿಸಿದವನು."]], ["History", "The Chennakeshava Temple at Belur was built by the Hoysala king", "ಬೇಲೂರಿನ ಚೆನ್ನಕೇಶವ ದೇವಾಲಯವನ್ನು ಕಟ್ಟಿಸಿದ ಹೊಯ್ಸಳ ದೊರೆ", [["Vishnuvardhana", "ವಿಷ್ಣುವರ್ಧನ"], ["Veera Ballala II", "ಎರಡನೇ ವೀರ ಬಲ್ಲಾಳ"], ["Narasimha I", "ಒಂದನೇ ನರಸಿಂಹ"], ["Ballala III", "ಮೂರನೇ ಬಲ್ಲಾಳ"]], 0, ["Vishnuvardhana built it around 1117 CE to mark his victory over the Cholas.", "ಚೋಳರ ಮೇಲಿನ ಜಯದ ಸ್ಮರಣೆಗೆ ವಿಷ್ಣುವರ್ಧನ ಸುಮಾರು 1117 ರಲ್ಲಿ ಇದನ್ನು ಕಟ್ಟಿಸಿದನು."]], ["History", "‘Amuktamalyada’, a Telugu work on the Vaishnava saint Andal, was written by", "ಆಂಡಾಳ್ ಕುರಿತ ತೆಲುಗು ಕೃತಿ ‘ಅಮುಕ್ತಮಾಲ್ಯದ’ ಬರೆದವರು", [["Krishnadevaraya", "ಕೃಷ್ಣದೇವರಾಯ"], ["Allasani Peddana", "ಅಲ್ಲಸಾನಿ ಪೆದ್ದನ"], ["Tenali Ramakrishna", "ತೆನಾಲಿ ರಾಮಕೃಷ್ಣ"], ["Nandi Timmana", "ನಂದಿ ತಿಮ್ಮನ"]], 0, ["Krishnadevaraya authored Amuktamalyada; Peddana was among his Ashtadiggajas.", "ಕೃಷ್ಣದೇವರಾಯ ಅಮುಕ್ತಮಾಲ್ಯದ ರಚಿಸಿದನು; ಪೆದ್ದನ ಅವನ ಅಷ್ಟದಿಗ್ಗಜರಲ್ಲಿ ಒಬ್ಬ."]], ["History", "Rani Chennamma of Kittur revolted against the British in the year", "ಕಿತ್ತೂರಿನ ರಾಣಿ ಚೆನ್ನಮ್ಮ ಬ್ರಿಟಿಷರ ವಿರುದ್ಧ ಬಂಡೆದ್ದ ವರ್ಷ", [["1799", "1799"], ["1824", "1824"], ["1831", "1831"], ["1857", "1857"]], 1, ["The Kittur revolt began in 1824 when the British refused to recognise Chennamma’s adopted heir.", "ಚೆನ್ನಮ್ಮನ ದತ್ತು ಪುತ್ರನನ್ನು ಬ್ರಿಟಿಷರು ಒಪ್ಪದ ಕಾರಣ 1824 ರಲ್ಲಿ ಕಿತ್ತೂರು ಬಂಡಾಯ ಆರಂಭವಾಯಿತು."]], ["History", "Tipu Sultan was killed in the Fourth Anglo-Mysore War at", "ನಾಲ್ಕನೇ ಆಂಗ್ಲೋ-ಮೈಸೂರು ಯುದ್ಧದಲ್ಲಿ ಟಿಪ್ಪು ಸುಲ್ತಾನ್ ಮರಣ ಹೊಂದಿದ ಸ್ಥಳ", [["Srirangapatna", "ಶ್ರೀರಂಗಪಟ್ಟಣ"], ["Mysuru", "ಮೈಸೂರು"], ["Bengaluru", "ಬೆಂಗಳೂರು"], ["Chitradurga", "ಚಿತ್ರದುರ್ಗ"]], 0, ["Tipu died defending Srirangapatna in 1799.", "1799 ರಲ್ಲಿ ಶ್ರೀರಂಗಪಟ್ಟಣ ರಕ್ಷಿಸುತ್ತ ಟಿಪ್ಪು ಮರಣ ಹೊಂದಿದನು."]], ["History", "The Mysore State was renamed ‘Karnataka’ in 1973 during the Chief Ministership of", "ಮೈಸೂರು ರಾಜ್ಯಕ್ಕೆ 1973 ರಲ್ಲಿ ‘ಕರ್ನಾಟಕ’ ಎಂದು ಮರುನಾಮಕರಣ ಮಾಡಿದಾಗ ಮುಖ್ಯಮಂತ್ರಿಯಾಗಿದ್ದವರು", [["S. Nijalingappa", "ಎಸ್. ನಿಜಲಿಂಗಪ್ಪ"], ["D. Devaraj Urs", "ಡಿ. ದೇವರಾಜ ಅರಸ್"], ["Veerendra Patil", "ವೀರೇಂದ್ರ ಪಾಟೀಲ್"], ["Ramakrishna Hegde", "ರಾಮಕೃಷ್ಣ ಹೆಗಡೆ"]], 1, ["The renaming took effect on 1 November 1973 under D. Devaraj Urs.", "1973 ನವೆಂಬರ್ 1 ರಂದು ಡಿ. ದೇವರಾಜ ಅರಸ್ ಅವರ ಅವಧಿಯಲ್ಲಿ ಮರುನಾಮಕರಣ ಜಾರಿಗೆ ಬಂತು."]], ["History", "The Bahmani Sultanate (1347) was founded at Gulbarga by", "ಬಹಮನಿ ಸುಲ್ತಾನರ ರಾಜ್ಯವನ್ನು (1347) ಗುಲ್ಬರ್ಗಾದಲ್ಲಿ ಸ್ಥಾಪಿಸಿದವರು", [["Alauddin Hasan Bahman Shah", "ಅಲ್ಲಾವುದ್ದೀನ್ ಹಸನ್ ಬಹಮನ್ ಷಾ"], ["Mahmud Gawan", "ಮಹಮೂದ್ ಗವಾನ್"], ["Yusuf Adil Shah", "ಯೂಸುಫ್ ಆದಿಲ್ ಷಾ"], ["Quli Qutb Shah", "ಕುಲಿ ಕುತುಬ್ ಷಾ"]], 0, ["Hasan Gangu took the title Alauddin Bahman Shah; Gulbarga was the first capital, later Bidar.", "ಹಸನ್ ಗಂಗೂ ಅಲ್ಲಾವುದ್ದೀನ್ ಬಹಮನ್ ಷಾ ಬಿರುದು ಧರಿಸಿದನು; ಗುಲ್ಬರ್ಗಾ ಮೊದಲ ರಾಜಧಾನಿ, ನಂತರ ಬೀದರ್."]], ["History", "The Brihadeeswara Temple at Thanjavur was built by", "ತಂಜಾವೂರಿನ ಬೃಹದೀಶ್ವರ ದೇವಾಲಯವನ್ನು ಕಟ್ಟಿಸಿದವರು", [["Rajaraja I", "ಒಂದನೇ ರಾಜರಾಜ"], ["Rajendra I", "ಒಂದನೇ ರಾಜೇಂದ್ರ"], ["Kulothunga I", "ಒಂದನೇ ಕುಲೋತ್ತುಂಗ"], ["Vijayalaya", "ವಿಜಯಾಲಯ"]], 0, ["Rajaraja I completed it around 1010 CE; it is a UNESCO World Heritage Site.", "ಒಂದನೇ ರಾಜರಾಜ ಸುಮಾರು 1010 ರಲ್ಲಿ ಇದನ್ನು ಪೂರ್ಣಗೊಳಿಸಿದನು; ಇದು ಯುನೆಸ್ಕೋ ವಿಶ್ವ ಪರಂಪರೆ ತಾಣ."]], ["Geography", "The Tropic of Cancer passes through how many Indian States?", "ಕರ್ಕಾಟಕ ಸಂಕ್ರಾಂತಿ ವೃತ್ತ ಭಾರತದ ಎಷ್ಟು ರಾಜ್ಯಗಳ ಮೂಲಕ ಹಾದುಹೋಗುತ್ತದೆ?", [["6", "6"], ["7", "7"], ["8", "8"], ["9", "9"]], 2, ["Gujarat, Rajasthan, Madhya Pradesh, Chhattisgarh, Jharkhand, West Bengal, Tripura and Mizoram.", "ಗುಜರಾತ್, ರಾಜಸ್ಥಾನ, ಮಧ್ಯಪ್ರದೇಶ, ಛತ್ತೀಸ್‌ಗಢ, ಜಾರ್ಖಂಡ್, ಪಶ್ಚಿಮ ಬಂಗಾಳ, ತ್ರಿಪುರ, ಮಿಜೋರಾಂ."]], ["Geography", "Which river is known as the ‘Sorrow of Bihar’?", "‘ಬಿಹಾರದ ಶೋಕ’ ಎಂದು ಕರೆಯಲ್ಪಡುವ ನದಿ ಯಾವುದು?", [["Gandak", "ಗಂಡಕ್"], ["Kosi", "ಕೋಸಿ"], ["Son", "ಸೋನ್"], ["Ghaghara", "ಘಾಘ್ರಾ"]], 1, ["The Kosi changes course and causes frequent floods in Bihar.", "ಕೋಸಿ ನದಿ ಪಥ ಬದಲಿಸಿ ಬಿಹಾರದಲ್ಲಿ ಪದೇಪದೇ ಪ್ರವಾಹ ಉಂಟುಮಾಡುತ್ತದೆ."]], ["Geography", "Consider the following statements about the Western Ghats:\nA. Anaimudi is the highest peak of the Western Ghats.\nB. The Palghat Gap lies between the Nilgiri Hills and the Anaimalai Hills.\nC. The Western Ghats were inscribed as a UNESCO World Heritage Site in 2012.\nWhich of the above are correct?", "ಪಶ್ಚಿಮ ಘಟ್ಟಗಳ ಕುರಿತು ಹೇಳಿಕೆಗಳು:\nA. ಆನೆಮುಡಿ ಪಶ್ಚಿಮ ಘಟ್ಟಗಳ ಅತಿ ಎತ್ತರದ ಶಿಖರ.\nB. ಪಾಲಕ್ಕಾಡ್ ಕಣಿವೆ ನೀಲಗಿರಿ ಮತ್ತು ಆನೆಮಲೈ ಬೆಟ್ಟಗಳ ನಡುವೆ ಇದೆ.\nC. ಪಶ್ಚಿಮ ಘಟ್ಟಗಳು 2012 ರಲ್ಲಿ ಯುನೆಸ್ಕೋ ವಿಶ್ವ ಪರಂಪರೆ ತಾಣವಾದವು.\nಮೇಲಿನ ಯಾವುವು ಸರಿ?", [["A only", "A ಮಾತ್ರ"], ["A and B only", "A ಮತ್ತು B ಮಾತ್ರ"], ["B and C only", "B ಮತ್ತು C ಮಾತ್ರ"], ["A, B and C", "A, B ಮತ್ತು C"]], 3, ["All three statements are correct.", "ಮೂರೂ ಹೇಳಿಕೆಗಳು ಸರಿ."]], ["Geography", "The highest peak of Karnataka is", "ಕರ್ನಾಟಕದ ಅತಿ ಎತ್ತರದ ಶಿಖರ", [["Mullayanagiri", "ಮುಳ್ಳಯ್ಯನಗಿರಿ"], ["Kudremukh", "ಕುದುರೆಮುಖ"], ["Kodachadri", "ಕೊಡಚಾದ್ರಿ"], ["Brahmagiri", "ಬ್ರಹ್ಮಗಿರಿ"]], 0, ["Mullayanagiri (Chikkamagaluru) is about 1,930 m high.", "ಮುಳ್ಳಯ್ಯನಗಿರಿ (ಚಿಕ್ಕಮಗಳೂರು) ಸುಮಾರು 1,930 ಮೀ ಎತ್ತರ."]], ["Geography", "Jog Falls (Gerusoppa Falls) is formed by which river?", "ಜೋಗ ಜಲಪಾತ (ಗೇರುಸೊಪ್ಪ) ಯಾವ ನದಿಯಿಂದ ರೂಪುಗೊಂಡಿದೆ?", [["Sharavathi", "ಶರಾವತಿ"], ["Kali", "ಕಾಳಿ"], ["Netravathi", "ನೇತ್ರಾವತಿ"], ["Aghanashini", "ಅಘನಾಶಿನಿ"]], 0, ["The Sharavathi plunges about 253 m at Jog.", "ಶರಾವತಿ ನದಿ ಜೋಗದಲ್ಲಿ ಸುಮಾರು 253 ಮೀ ಧುಮುಕುತ್ತದೆ."]], ["Geography", "Match the rivers (List I) with their places of origin (List II):\nList I: A. Kaveri  B. Krishna  C. Tunga  D. Sharavathi\nList II: I. Ambutirtha  II. Mahabaleshwar  III. Gangamoola  IV. Talakaveri", "ನದಿಗಳನ್ನು (ಪಟ್ಟಿ I) ಉಗಮ ಸ್ಥಳಗಳೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. ಕಾವೇರಿ  B. ಕೃಷ್ಣಾ  C. ತುಂಗಾ  D. ಶರಾವತಿ\nಪಟ್ಟಿ II: I. ಅಂಬುತೀರ್ಥ  II. ಮಹಾಬಲೇಶ್ವರ  III. ಗಂಗಾಮೂಲ  IV. ತಲಕಾವೇರಿ", [["A–IV, B–II, C–III, D–I", "A–IV, B–II, C–III, D–I"], ["A–II, B–IV, C–III, D–I", "A–II, B–IV, C–III, D–I"], ["A–IV, B–II, C–I, D–III", "A–IV, B–II, C–I, D–III"], ["A–III, B–II, C–IV, D–I", "A–III, B–II, C–IV, D–I"]], 0, ["Kaveri – Talakaveri; Krishna – Mahabaleshwar; Tunga – Gangamoola; Sharavathi – Ambutirtha.", "ಕಾವೇರಿ – ತಲಕಾವೇರಿ; ಕೃಷ್ಣಾ – ಮಹಾಬಲೇಶ್ವರ; ತುಂಗಾ – ಗಂಗಾಮೂಲ; ಶರಾವತಿ – ಅಂಬುತೀರ್ಥ."]], ["Geography", "Which soil is also known as ‘Regur’ and is best suited for cotton?", "‘ರೆಗುರ್’ ಎಂದೂ ಕರೆಯಲ್ಪಡುವ ಮತ್ತು ಹತ್ತಿಗೆ ಅತ್ಯಂತ ಸೂಕ್ತವಾದ ಮಣ್ಣು ಯಾವುದು?", [["Red soil", "ಕೆಂಪು ಮಣ್ಣು"], ["Black soil", "ಕಪ್ಪು ಮಣ್ಣು"], ["Laterite soil", "ಜಂಬಿಟ್ಟಿಗೆ ಮಣ್ಣು"], ["Alluvial soil", "ಮೆಕ್ಕಲು ಮಣ್ಣು"]], 1, ["Black soil is moisture-retentive and rich in lime, iron and magnesium.", "ಕಪ್ಪು ಮಣ್ಣು ತೇವಾಂಶ ಹಿಡಿದಿಡುತ್ತದೆ; ಸುಣ್ಣ, ಕಬ್ಬಿಣ, ಮೆಗ್ನೀಷಿಯಂ ಸಮೃದ್ಧ."]], ["Geography", "Winter rainfall in north-western India is mainly caused by", "ವಾಯವ್ಯ ಭಾರತದ ಚಳಿಗಾಲದ ಮಳೆಗೆ ಮುಖ್ಯ ಕಾರಣ", [["Western Disturbances", "ಪಶ್ಚಿಮ ವಿಕ್ಷೋಭೆಗಳು"], ["South-west Monsoon", "ನೈಋತ್ಯ ಮಾನ್ಸೂನ್"], ["Retreating Monsoon", "ನಿರ್ಗಮನ ಮಾನ್ಸೂನ್"], ["Cyclones of the Bay of Bengal", "ಬಂಗಾಳ ಕೊಲ್ಲಿಯ ಚಂಡಮಾರುತಗಳು"]], 0, ["Western Disturbances from the Mediterranean bring winter rain, useful for the rabi wheat crop.", "ಮೆಡಿಟರೇನಿಯನ್‌ನಿಂದ ಬರುವ ಪಶ್ಚಿಮ ವಿಕ್ಷೋಭೆಗಳು ಚಳಿಗಾಲದ ಮಳೆ ತರುತ್ತವೆ; ರಬಿ ಗೋಧಿಗೆ ಉಪಯುಕ್ತ."]], ["Geography", "Consider the following ocean currents:\nA. The Gulf Stream is a warm current.\nB. The Labrador Current is a cold current.\nC. The Kuroshio Current is a warm current.\nWhich of the above are correct?", "ಕೆಳಗಿನ ಸಾಗರ ಪ್ರವಾಹಗಳನ್ನು ಪರಿಗಣಿಸಿ:\nA. ಗಲ್ಫ್ ಸ್ಟ್ರೀಮ್ ಬೆಚ್ಚಗಿನ ಪ್ರವಾಹ.\nB. ಲ್ಯಾಬ್ರಡಾರ್ ಪ್ರವಾಹ ತಂಪು ಪ್ರವಾಹ.\nC. ಕುರೋಶಿಯೋ ಪ್ರವಾಹ ಬೆಚ್ಚಗಿನ ಪ್ರವಾಹ.\nಮೇಲಿನ ಯಾವುವು ಸರಿ?", [["A only", "A ಮಾತ್ರ"], ["A and B only", "A ಮತ್ತು B ಮಾತ್ರ"], ["B and C only", "B ಮತ್ತು C ಮಾತ್ರ"], ["A, B and C", "A, B ಮತ್ತು C"]], 3, ["All three are correct.", "ಮೂರೂ ಸರಿ."]], ["Geography", "The Bering Strait separates which two continents?", "ಬೇರಿಂಗ್ ಜಲಸಂಧಿ ಯಾವ ಎರಡು ಖಂಡಗಳನ್ನು ಬೇರ್ಪಡಿಸುತ್ತದೆ?", [["Asia and North America", "ಏಷ್ಯಾ ಮತ್ತು ಉತ್ತರ ಅಮೆರಿಕ"], ["Asia and Europe", "ಏಷ್ಯಾ ಮತ್ತು ಯುರೋಪ್"], ["Africa and Europe", "ಆಫ್ರಿಕಾ ಮತ್ತು ಯುರೋಪ್"], ["North and South America", "ಉತ್ತರ ಮತ್ತು ದಕ್ಷಿಣ ಅಮೆರಿಕ"]], 0, ["It lies between Russia’s Chukotka and Alaska.", "ಇದು ರಷ್ಯಾದ ಚುಕೊಟ್ಕಾ ಮತ್ತು ಅಲಾಸ್ಕಾ ನಡುವೆ ಇದೆ."]], ["Geography", "Which of the following is NOT a Himalayan river?", "ಕೆಳಗಿನವುಗಳಲ್ಲಿ ಹಿಮಾಲಯ ನದಿಯಲ್ಲದ್ದು ಯಾವುದು?", [["Ganga", "ಗಂಗಾ"], ["Brahmaputra", "ಬ್ರಹ್ಮಪುತ್ರ"], ["Indus", "ಸಿಂಧೂ"], ["Godavari", "ಗೋದಾವರಿ"]], 3, ["The Godavari is a Peninsular river rising at Trimbakeshwar.", "ಗೋದಾವರಿ ತ್ರ್ಯಂಬಕೇಶ್ವರದಲ್ಲಿ ಉಗಮಿಸುವ ಪರ್ಯಾಯ ದ್ವೀಪ ನದಿ."]], ["Geography", "Assertion (A): Mawsynram receives some of the highest annual rainfall in the world.\nReason (R): The funnel-shaped Khasi Hills trap the moisture-laden south-west monsoon winds.", "ಪ್ರತಿಪಾದನೆ (A): ಮಾವ್ಸಿನ್ರಾಂ ವಿಶ್ವದ ಅತಿ ಹೆಚ್ಚು ವಾರ್ಷಿಕ ಮಳೆ ಪಡೆಯುವ ಸ್ಥಳಗಳಲ್ಲೊಂದು.\nಕಾರಣ (R): ಕೊಳವೆ ಆಕಾರದ ಖಾಸಿ ಬೆಟ್ಟಗಳು ತೇವಭರಿತ ನೈಋತ್ಯ ಮಾನ್ಸೂನ್ ಗಾಳಿಯನ್ನು ಸಿಕ್ಕಿಹಾಕಿಕೊಳ್ಳುತ್ತವೆ.", [["Both (A) and (R) are true and (R) is the correct explanation of (A)", "(A) ಮತ್ತು (R) ಎರಡೂ ಸತ್ಯ ಮತ್ತು (R) ಯು (A) ಯ ಸರಿಯಾದ ವಿವರಣೆ"], ["Both (A) and (R) are true but (R) is not the correct explanation of (A)", "(A) ಮತ್ತು (R) ಎರಡೂ ಸತ್ಯ ಆದರೆ (R) ಯು (A) ಯ ಸರಿಯಾದ ವಿವರಣೆಯಲ್ಲ"], ["(A) is true but (R) is false", "(A) ಸತ್ಯ ಆದರೆ (R) ಸುಳ್ಳು"], ["(A) is false but (R) is true", "(A) ಸುಳ್ಳು ಆದರೆ (R) ಸತ್ಯ"]], 0, ["The windward funnel shape forces moist air to rise and release heavy rain.", "ಗಾಳಿಗೆ ಎದುರಾದ ಕೊಳವೆ ಆಕಾರ ತೇವ ಗಾಳಿಯನ್ನು ಮೇಲೇರಿಸಿ ಭಾರೀ ಮಳೆ ಸುರಿಸುತ್ತದೆ."]], ["Geography", "Which river has the largest catchment area in Karnataka?", "ಕರ್ನಾಟಕದಲ್ಲಿ ಅತಿ ದೊಡ್ಡ ಜಲಾನಯನ ಪ್ರದೇಶ ಹೊಂದಿರುವ ನದಿ ಯಾವುದು?", [["Krishna", "ಕೃಷ್ಣಾ"], ["Kaveri", "ಕಾವೇರಿ"], ["Tungabhadra", "ತುಂಗಭದ್ರಾ"], ["Godavari", "ಗೋದಾವರಿ"]], 0, ["The Krishna basin covers the largest area in the State, followed by the Kaveri.", "ರಾಜ್ಯದಲ್ಲಿ ಕೃಷ್ಣಾ ಜಲಾನಯನ ಅತಿ ದೊಡ್ಡದು; ನಂತರ ಕಾವೇರಿ."]], ["Geography", "Which is the northernmost district of Karnataka?", "ಕರ್ನಾಟಕದ ಉತ್ತರದ ತುದಿಯ ಜಿಲ್ಲೆ ಯಾವುದು?", [["Belagavi", "ಬೆಳಗಾವಿ"], ["Vijayapura", "ವಿಜಯಪುರ"], ["Bidar", "ಬೀದರ್"], ["Kalaburagi", "ಕಲಬುರಗಿ"]], 2, ["Bidar is at the northern tip of Karnataka.", "ಬೀದರ್ ಕರ್ನಾಟಕದ ಉತ್ತರ ತುದಿಯಲ್ಲಿದೆ."]], ["Geography", "The longest river of Peninsular India is", "ಪರ್ಯಾಯ ದ್ವೀಪ ಭಾರತದ ಅತಿ ಉದ್ದದ ನದಿ", [["Godavari", "ಗೋದಾವರಿ"], ["Krishna", "ಕೃಷ್ಣಾ"], ["Kaveri", "ಕಾವೇರಿ"], ["Mahanadi", "ಮಹಾನದಿ"]], 0, ["The Godavari (about 1,465 km) is the longest Peninsular river.", "ಗೋದಾವರಿ (ಸುಮಾರು 1,465 ಕಿ.ಮೀ) ಪರ್ಯಾಯ ದ್ವೀಪದ ಅತಿ ಉದ್ದದ ನದಿ."]], ["Economy", "The rate at which the RBI lends short-term money to commercial banks against securities is called", "ಭದ್ರತಾ ಪತ್ರಗಳ ವಿರುದ್ಧ RBI ವಾಣಿಜ್ಯ ಬ್ಯಾಂಕ್‌ಗಳಿಗೆ ಅಲ್ಪಾವಧಿ ಸಾಲ ನೀಡುವ ದರವನ್ನು ಹೀಗೆನ್ನುತ್ತಾರೆ", [["Repo Rate", "ರೆಪೊ ದರ"], ["Reverse Repo Rate", "ರಿವರ್ಸ್ ರೆಪೊ ದರ"], ["Bank Rate", "ಬ್ಯಾಂಕ್ ದರ"], ["CRR", "ನಗದು ಮೀಸಲು ಅನುಪಾತ (CRR)"]], 0, ["Repo Rate is the rate at which RBI lends to banks; reverse repo is what RBI pays on their deposits.", "ರೆಪೊ ದರ RBI ಬ್ಯಾಂಕ್‌ಗಳಿಗೆ ಸಾಲ ನೀಡುವ ದರ; ರಿವರ್ಸ್ ರೆಪೊ ಬ್ಯಾಂಕ್ ಠೇವಣಿಗಳ ಮೇಲೆ RBI ನೀಡುವ ದರ."]], ["Economy", "Consider the following about GST in India:\nA. It was introduced by the 101st Constitutional Amendment Act.\nB. The GST Council is provided for in Article 279A.\nC. GST was implemented from 1 July 2017.\nWhich of the above are correct?", "ಭಾರತದ ಜಿಎಸ್‌ಟಿ ಕುರಿತು:\nA. ಇದನ್ನು 101ನೇ ಸಂವಿಧಾನ ತಿದ್ದುಪಡಿ ಕಾಯ್ದೆಯಿಂದ ಜಾರಿಗೆ ತರಲಾಯಿತು.\nB. ಜಿಎಸ್‌ಟಿ ಮಂಡಳಿಗೆ ವಿಧಿ 279A ರಲ್ಲಿ ಅವಕಾಶವಿದೆ.\nC. ಜಿಎಸ್‌ಟಿ 1 ಜುಲೈ 2017 ರಿಂದ ಜಾರಿಯಾಯಿತು.\nಮೇಲಿನ ಯಾವುವು ಸರಿ?", [["A only", "A ಮಾತ್ರ"], ["A and B only", "A ಮತ್ತು B ಮಾತ್ರ"], ["B and C only", "B ಮತ್ತು C ಮಾತ್ರ"], ["A, B and C", "A, B ಮತ್ತು C"]], 3, ["All three statements are correct.", "ಮೂರೂ ಹೇಳಿಕೆಗಳು ಸರಿ."]], ["Economy", "NITI Aayog replaced the Planning Commission in the year", "ನೀತಿ ಆಯೋಗ ಯೋಜನಾ ಆಯೋಗದ ಸ್ಥಾನವನ್ನು ಪಡೆದ ವರ್ಷ", [["2013", "2013"], ["2014", "2014"], ["2015", "2015"], ["2017", "2017"]], 2, ["NITI Aayog was formed on 1 January 2015.", "ನೀತಿ ಆಯೋಗ 2015 ಜನವರಿ 1 ರಂದು ರಚನೆಯಾಯಿತು."]], ["Economy", "Fiscal Deficit is defined as", "ವಿತ್ತೀಯ ಕೊರತೆಯ ವ್ಯಾಖ್ಯಾನ", [["Total expenditure minus total receipts excluding borrowings", "ಒಟ್ಟು ವೆಚ್ಚ ಮೈನಸ್ ಸಾಲ ಹೊರತುಪಡಿಸಿದ ಒಟ್ಟು ಸ್ವೀಕೃತಿಗಳು"], ["Revenue expenditure minus revenue receipts", "ಆದಾಯ ವೆಚ್ಚ ಮೈನಸ್ ಆದಾಯ ಸ್ವೀಕೃತಿ"], ["Total receipts minus total expenditure", "ಒಟ್ಟು ಸ್ವೀಕೃತಿ ಮೈನಸ್ ಒಟ್ಟು ವೆಚ್ಚ"], ["Capital expenditure minus capital receipts", "ಬಂಡವಾಳ ವೆಚ್ಚ ಮೈನಸ್ ಬಂಡವಾಳ ಸ್ವೀಕೃತಿ"]], 0, ["Fiscal deficit shows the total borrowing requirement of the government.", "ವಿತ್ತೀಯ ಕೊರತೆ ಸರ್ಕಾರದ ಒಟ್ಟು ಸಾಲದ ಅಗತ್ಯವನ್ನು ತೋರಿಸುತ್ತದೆ."]], ["Economy", "Match the events (List I) with the years (List II):\nList I: A. Nationalisation of the RBI  B. Formation of the State Bank of India  C. Nationalisation of 14 banks  D. Nationalisation of 6 more banks\nList II: I. 1969  II. 1955  III. 1949  IV. 1980", "ಘಟನೆಗಳನ್ನು (ಪಟ್ಟಿ I) ವರ್ಷಗಳೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. RBI ರಾಷ್ಟ್ರೀಕರಣ  B. ಭಾರತೀಯ ಸ್ಟೇಟ್ ಬ್ಯಾಂಕ್ ರಚನೆ  C. 14 ಬ್ಯಾಂಕ್‌ಗಳ ರಾಷ್ಟ್ರೀಕರಣ  D. ಇನ್ನೂ 6 ಬ್ಯಾಂಕ್‌ಗಳ ರಾಷ್ಟ್ರೀಕರಣ\nಪಟ್ಟಿ II: I. 1969  II. 1955  III. 1949  IV. 1980", [["A–III, B–II, C–I, D–IV", "A–III, B–II, C–I, D–IV"], ["A–II, B–III, C–I, D–IV", "A–II, B–III, C–I, D–IV"], ["A–III, B–II, C–IV, D–I", "A–III, B–II, C–IV, D–I"], ["A–I, B–II, C–III, D–IV", "A–I, B–II, C–III, D–IV"]], 0, ["RBI nationalised 1949; SBI formed 1955; 14 banks 1969; 6 banks 1980.", "RBI 1949; SBI 1955; 14 ಬ್ಯಾಂಕ್ 1969; 6 ಬ್ಯಾಂಕ್ 1980."]], ["Economy", "Which index is used to measure retail inflation in India?", "ಭಾರತದಲ್ಲಿ ಚಿಲ್ಲರೆ ಹಣದುಬ್ಬರವನ್ನು ಅಳೆಯಲು ಬಳಸುವ ಸೂಚ್ಯಂಕ ಯಾವುದು?", [["Wholesale Price Index (WPI)", "ಸಗಟು ಬೆಲೆ ಸೂಚ್ಯಂಕ (WPI)"], ["Consumer Price Index (CPI)", "ಗ್ರಾಹಕ ಬೆಲೆ ಸೂಚ್ಯಂಕ (CPI)"], ["Index of Industrial Production", "ಕೈಗಾರಿಕಾ ಉತ್ಪಾದನಾ ಸೂಚ್ಯಂಕ"], ["Human Development Index", "ಮಾನವ ಅಭಿವೃದ್ಧಿ ಸೂಚ್ಯಂಕ"]], 1, ["CPI tracks retail prices and is the RBI’s inflation-targeting anchor.", "CPI ಚಿಲ್ಲರೆ ಬೆಲೆಗಳನ್ನು ಗಮನಿಸುತ್ತದೆ; RBI ಹಣದುಬ್ಬರ ಗುರಿಯ ಆಧಾರ."]], ["Economy", "Which of the following is NOT a direct tax?", "ಕೆಳಗಿನವುಗಳಲ್ಲಿ ನೇರ ತೆರಿಗೆಯಲ್ಲದ್ದು ಯಾವುದು?", [["Income Tax", "ಆದಾಯ ತೆರಿಗೆ"], ["Corporation Tax", "ನಿಗಮ ತೆರಿಗೆ"], ["Capital Gains Tax", "ಬಂಡವಾಳ ಲಾಭ ತೆರಿಗೆ"], ["Goods and Services Tax", "ಸರಕು ಮತ್ತು ಸೇವಾ ತೆರಿಗೆ (GST)"]], 3, ["GST is an indirect tax whose burden can be passed on to consumers.", "GST ಪರೋಕ್ಷ ತೆರಿಗೆ; ಹೊರೆಯನ್ನು ಗ್ರಾಹಕರಿಗೆ ವರ್ಗಾಯಿಸಬಹುದು."]], ["Economy", "NABARD, the apex institution for agriculture and rural credit, was established in", "ಕೃಷಿ ಮತ್ತು ಗ್ರಾಮೀಣ ಸಾಲದ ಉನ್ನತ ಸಂಸ್ಥೆ ನಬಾರ್ಡ್ ಸ್ಥಾಪನೆಯಾದ ವರ್ಷ", [["1969", "1969"], ["1975", "1975"], ["1982", "1982"], ["1991", "1991"]], 2, ["NABARD was set up on 12 July 1982.", "ನಬಾರ್ಡ್ 1982 ಜುಲೈ 12 ರಂದು ಸ್ಥಾಪನೆಯಾಯಿತು."]], ["Economy", "Consider the following about planning in India:\nA. The Planning Commission was set up in 1950.\nB. The First Five Year Plan emphasised agriculture.\nC. The Second Five Year Plan, based on the Mahalanobis model, emphasised heavy industry.\nWhich of the above are correct?", "ಭಾರತದ ಯೋಜನೆಗಳ ಕುರಿತು:\nA. ಯೋಜನಾ ಆಯೋಗ 1950 ರಲ್ಲಿ ರಚನೆಯಾಯಿತು.\nB. ಮೊದಲ ಪಂಚವಾರ್ಷಿಕ ಯೋಜನೆ ಕೃಷಿಗೆ ಒತ್ತು ನೀಡಿತು.\nC. ಮಹಾಲನೋಬಿಸ್ ಮಾದರಿಯ ಎರಡನೇ ಯೋಜನೆ ಭಾರೀ ಕೈಗಾರಿಕೆಗೆ ಒತ್ತು ನೀಡಿತು.\nಮೇಲಿನ ಯಾವುವು ಸರಿ?", [["A only", "A ಮಾತ್ರ"], ["A and B only", "A ಮತ್ತು B ಮಾತ್ರ"], ["B and C only", "B ಮತ್ತು C ಮಾತ್ರ"], ["A, B and C", "A, B ಮತ್ತು C"]], 3, ["All three are correct.", "ಮೂರೂ ಸರಿ."]], ["Economy", "MGNREGA guarantees how many days of wage employment per rural household in a financial year?", "MGNREGA ಪ್ರತಿ ಗ್ರಾಮೀಣ ಕುಟುಂಬಕ್ಕೆ ಒಂದು ಆರ್ಥಿಕ ವರ್ಷದಲ್ಲಿ ಎಷ್ಟು ದಿನಗಳ ವೇತನ ಉದ್ಯೋಗ ಖಾತ್ರಿಪಡಿಸುತ್ತದೆ?", [["50 days", "50 ದಿನ"], ["100 days", "100 ದಿನ"], ["150 days", "150 ದಿನ"], ["200 days", "200 ದಿನ"]], 1, ["The Act guarantees 100 days of unskilled manual work.", "ಕಾಯ್ದೆ 100 ದಿನಗಳ ಕೌಶಲ್ಯರಹಿತ ಕೈಕೆಲಸ ಖಾತ್ರಿಪಡಿಸುತ್ತದೆ."]], ["Economy", "Assertion (A): Inflation hurts persons with fixed incomes.\nReason (R): With rising prices, the purchasing power of money falls.", "ಪ್ರತಿಪಾದನೆ (A): ಹಣದುಬ್ಬರ ನಿಶ್ಚಿತ ಆದಾಯದ ವ್ಯಕ್ತಿಗಳಿಗೆ ಹಾನಿ ಮಾಡುತ್ತದೆ.\nಕಾರಣ (R): ಬೆಲೆ ಏರಿದಂತೆ ಹಣದ ಕೊಳ್ಳುವ ಶಕ್ತಿ ಕುಸಿಯುತ್ತದೆ.", [["Both (A) and (R) are true and (R) is the correct explanation of (A)", "(A) ಮತ್ತು (R) ಎರಡೂ ಸತ್ಯ ಮತ್ತು (R) ಯು (A) ಯ ಸರಿಯಾದ ವಿವರಣೆ"], ["Both (A) and (R) are true but (R) is not the correct explanation of (A)", "(A) ಮತ್ತು (R) ಎರಡೂ ಸತ್ಯ ಆದರೆ (R) ಯು (A) ಯ ಸರಿಯಾದ ವಿವರಣೆಯಲ್ಲ"], ["(A) is true but (R) is false", "(A) ಸತ್ಯ ಆದರೆ (R) ಸುಳ್ಳು"], ["(A) is false but (R) is true", "(A) ಸುಳ್ಳು ಆದರೆ (R) ಸತ್ಯ"]], 0, ["Fixed incomes buy less when prices rise, so R explains A.", "ಬೆಲೆ ಏರಿದಾಗ ನಿಶ್ಚಿತ ಆದಾಯದಿಂದ ಕಡಿಮೆ ಖರೀದಿ ಸಾಧ್ಯ; ಆದ್ದರಿಂದ R ಯು A ಯನ್ನು ವಿವರಿಸುತ್ತದೆ."]], ["Economy", "The Reserve Bank of India was established in the year", "ಭಾರತೀಯ ರಿಸರ್ವ್ ಬ್ಯಾಂಕ್ ಸ್ಥಾಪನೆಯಾದ ವರ್ಷ", [["1935", "1935"], ["1947", "1947"], ["1949", "1949"], ["1955", "1955"]], 0, ["RBI began operations on 1 April 1935 under the RBI Act, 1934.", "RBI ಕಾಯ್ದೆ 1934 ರ ಅಡಿ 1935 ಏಪ್ರಿಲ್ 1 ರಂದು ಕಾರ್ಯಾರಂಭ ಮಾಡಿತು."]], ["Karnataka", "Who became the first Chief Minister of the unified Mysore State after its formation on 1 November 1956?", "1956 ನವೆಂಬರ್ 1 ರಂದು ಏಕೀಕೃತ ಮೈಸೂರು ರಾಜ್ಯ ರಚನೆಯಾದ ನಂತರ ಮೊದಲ ಮುಖ್ಯಮಂತ್ರಿಯಾದವರು", [["S. Nijalingappa", "ಎಸ್. ನಿಜಲಿಂಗಪ್ಪ"], ["Kengal Hanumanthaiah", "ಕೆಂಗಲ್ ಹನುಮಂತಯ್ಯ"], ["K. Chengalaraya Reddy", "ಕೆ. ಚೆಂಗಲರಾಯ ರೆಡ್ಡಿ"], ["B.D. Jatti", "ಬಿ.ಡಿ. ಜತ್ತಿ"]], 0, ["Nijalingappa headed the unified State from 1956 to 1958.", "ನಿಜಲಿಂಗಪ್ಪ 1956–58 ರಲ್ಲಿ ಏಕೀಕೃತ ರಾಜ್ಯದ ನೇತೃತ್ವ ವಹಿಸಿದರು."]], ["Karnataka", "Vidhana Soudha in Bengaluru was built under the initiative of Chief Minister", "ಬೆಂಗಳೂರಿನ ವಿಧಾನ ಸೌಧವನ್ನು ಯಾವ ಮುಖ್ಯಮಂತ್ರಿಯ ಉಪಕ್ರಮದಲ್ಲಿ ನಿರ್ಮಿಸಲಾಯಿತು?", [["Kengal Hanumanthaiah", "ಕೆಂಗಲ್ ಹನುಮಂತಯ್ಯ"], ["D. Devaraj Urs", "ಡಿ. ದೇವರಾಜ ಅರಸ್"], ["S.M. Krishna", "ಎಸ್.ಎಂ. ಕೃಷ್ಣ"], ["Ramakrishna Hegde", "ರಾಮಕೃಷ್ಣ ಹೆಗಡೆ"]], 0, ["Kengal Hanumanthaiah conceived it; it was completed in 1956.", "ಕೆಂಗಲ್ ಹನುಮಂತಯ್ಯ ಇದನ್ನು ಕಲ್ಪಿಸಿದರು; 1956 ರಲ್ಲಿ ಪೂರ್ಣಗೊಂಡಿತು."]], ["Karnataka", "How many districts does Karnataka have at present?", "ಕರ್ನಾಟಕದಲ್ಲಿ ಪ್ರಸ್ತುತ ಎಷ್ಟು ಜಿಲ್ಲೆಗಳಿವೆ?", [["29", "29"], ["30", "30"], ["31", "31"], ["32", "32"]], 2, ["Vijayanagara district (2021) took the count to 31.", "ವಿಜಯನಗರ ಜಿಲ್ಲೆ (2021) ರಚನೆಯಿಂದ ಜಿಲ್ಲೆಗಳ ಸಂಖ್ಯೆ 31 ಆಯಿತು."]], ["Karnataka", "Hampi was inscribed as a UNESCO World Heritage Site in the year", "ಹಂಪಿ ಯುನೆಸ್ಕೋ ವಿಶ್ವ ಪರಂಪರೆ ತಾಣವಾದ ವರ್ಷ", [["1980", "1980"], ["1986", "1986"], ["1992", "1992"], ["2004", "2004"]], 1, ["Hampi’s Group of Monuments was listed in 1986.", "ಹಂಪಿಯ ಸ್ಮಾರಕ ಸಮೂಹ 1986 ರಲ್ಲಿ ಪಟ್ಟಿಗೆ ಸೇರಿತು."]], ["Karnataka", "Consider the following dams of Karnataka:\nA. Tungabhadra Dam is near Hosapete.\nB. Krishnaraja Sagara (KRS) Dam is across the Kaveri.\nC. Almatti Dam is across the Krishna.\nWhich of the above are correct?", "ಕರ್ನಾಟಕದ ಅಣೆಕಟ್ಟುಗಳ ಕುರಿತು:\nA. ತುಂಗಭದ್ರಾ ಅಣೆಕಟ್ಟು ಹೊಸಪೇಟೆ ಬಳಿ ಇದೆ.\nB. ಕೃಷ್ಣರಾಜ ಸಾಗರ (KRS) ಅಣೆಕಟ್ಟು ಕಾವೇರಿ ನದಿಗೆ ಅಡ್ಡಲಾಗಿದೆ.\nC. ಆಲಮಟ್ಟಿ ಅಣೆಕಟ್ಟು ಕೃಷ್ಣಾ ನದಿಗೆ ಅಡ್ಡಲಾಗಿದೆ.\nಮೇಲಿನ ಯಾವುವು ಸರಿ?", [["A only", "A ಮಾತ್ರ"], ["A and B only", "A ಮತ್ತು B ಮಾತ್ರ"], ["B and C only", "B ಮತ್ತು C ಮಾತ್ರ"], ["A, B and C", "A, B ಮತ್ತು C"]], 3, ["All three are correct.", "ಮೂರೂ ಸರಿ."]], ["Karnataka", "Match the places (List I) with their significance (List II):\nList I: A. Sravanabelagola  B. Pattadakal  C. Belur  D. Hampi\nList II: I. Hoysala Chennakeshava Temple  II. Monolithic statue of Gommateshwara  III. Virupaksha Temple  IV. Group of Chalukyan temples", "ಸ್ಥಳಗಳನ್ನು (ಪಟ್ಟಿ I) ಅವುಗಳ ಮಹತ್ವದೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. ಶ್ರವಣಬೆಳಗೊಳ  B. ಪಟ್ಟದಕಲ್ಲು  C. ಬೇಲೂರು  D. ಹಂಪಿ\nಪಟ್ಟಿ II: I. ಹೊಯ್ಸಳರ ಚೆನ್ನಕೇಶವ ದೇವಾಲಯ  II. ಗೊಮ್ಮಟೇಶ್ವರನ ಏಕಶಿಲಾ ಮೂರ್ತಿ  III. ವಿರೂಪಾಕ್ಷ ದೇವಾಲಯ  IV. ಚಾಲುಕ್ಯರ ದೇವಾಲಯ ಸಮೂಹ", [["A–II, B–IV, C–I, D–III", "A–II, B–IV, C–I, D–III"], ["A–IV, B–II, C–I, D–III", "A–IV, B–II, C–I, D–III"], ["A–II, B–I, C–IV, D–III", "A–II, B–I, C–IV, D–III"], ["A–II, B–IV, C–III, D–I", "A–II, B–IV, C–III, D–I"]], 0, ["Sravanabelagola – Gommateshwara; Pattadakal – Chalukyan temples; Belur – Chennakeshava; Hampi – Virupaksha.", "ಶ್ರವಣಬೆಳಗೊಳ – ಗೊಮ್ಮಟೇಶ್ವರ; ಪಟ್ಟದಕಲ್ಲು – ಚಾಲುಕ್ಯ ದೇವಾಲಯಗಳು; ಬೇಲೂರು – ಚೆನ್ನಕೇಶವ; ಹಂಪಿ – ವಿರೂಪಾಕ್ಷ."]], ["Karnataka", "Kannada was accorded the status of a Classical Language by the Government of India in", "ಕನ್ನಡಕ್ಕೆ ಭಾರತ ಸರ್ಕಾರ ಶಾಸ್ತ್ರೀಯ ಭಾಷೆಯ ಸ್ಥಾನಮಾನ ನೀಡಿದ ವರ್ಷ", [["2004", "2004"], ["2006", "2006"], ["2008", "2008"], ["2013", "2013"]], 2, ["Kannada and Telugu received classical status in 2008.", "ಕನ್ನಡ ಮತ್ತು ತೆಲುಗು 2008 ರಲ್ಲಿ ಶಾಸ್ತ್ರೀಯ ಸ್ಥಾನಮಾನ ಪಡೆದವು."]], ["Karnataka", "How many Kannada writers have been awarded the Jnanpith Award so far?", "ಇದುವರೆಗೆ ಎಷ್ಟು ಕನ್ನಡ ಸಾಹಿತಿಗಳಿಗೆ ಜ್ಞಾನಪೀಠ ಪ್ರಶಸ್ತಿ ಲಭಿಸಿದೆ?", [["6", "6"], ["7", "7"], ["8", "8"], ["9", "9"]], 2, ["Kuvempu, Bendre, Karanth, Masti, Gokak, U.R. Ananthamurthy, Girish Karnad and Chandrashekhar Kambar.", "ಕುವೆಂಪು, ಬೇಂದ್ರೆ, ಕಾರಂತ, ಮಾಸ್ತಿ, ಗೋಕಾಕ್, ಯು.ಆರ್. ಅನಂತಮೂರ್ತಿ, ಗಿರೀಶ್ ಕಾರ್ನಾಡ್, ಚಂದ್ರಶೇಖರ ಕಂಬಾರ."]], ["Karnataka", "The Vachanas signed with the ankita ‘Kudalasangama Deva’ were composed by", "‘ಕೂಡಲಸಂಗಮದೇವ’ ಅಂಕಿತದ ವಚನಗಳನ್ನು ರಚಿಸಿದವರು", [["Basavanna", "ಬಸವಣ್ಣ"], ["Allama Prabhu", "ಅಲ್ಲಮಪ್ರಭು"], ["Akka Mahadevi", "ಅಕ್ಕಮಹಾದೇವಿ"], ["Channabasavanna", "ಚೆನ್ನಬಸವಣ್ಣ"]], 0, ["Basavanna used ‘Kudalasangama Deva’; Allama used ‘Guheshwara’; Akka used ‘Chennamallikarjuna’.", "ಬಸವಣ್ಣ ‘ಕೂಡಲಸಂಗಮದೇವ’; ಅಲ್ಲಮ ‘ಗುಹೇಶ್ವರ’; ಅಕ್ಕ ‘ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನ’ ಅಂಕಿತ ಬಳಸಿದರು."]], ["Karnataka", "Yakshagana, a traditional theatre form, is mainly associated with which region of Karnataka?", "ಸಾಂಪ್ರದಾಯಿಕ ರಂಗಕಲೆ ಯಕ್ಷಗಾನ ಕರ್ನಾಟಕದ ಯಾವ ಪ್ರದೇಶಕ್ಕೆ ಮುಖ್ಯವಾಗಿ ಸಂಬಂಧಿಸಿದೆ?", [["Coastal Karnataka", "ಕರಾವಳಿ ಕರ್ನಾಟಕ"], ["Hyderabad Karnataka", "ಹೈದರಾಬಾದ್ ಕರ್ನಾಟಕ"], ["Old Mysore", "ಹಳೆ ಮೈಸೂರು"], ["Bombay Karnataka", "ಮುಂಬೈ ಕರ್ನಾಟಕ"]], 0, ["Yakshagana is popular in Dakshina Kannada, Udupi and Uttara Kannada.", "ಯಕ್ಷಗಾನ ದಕ್ಷಿಣ ಕನ್ನಡ, ಉಡುಪಿ, ಉತ್ತರ ಕನ್ನಡದಲ್ಲಿ ಪ್ರಸಿದ್ಧ."]], ["Science & Environment", "The Montreal Protocol (1987) is related to the control of", "ಮಾಂಟ್ರಿಯಲ್ ಪ್ರೋಟೋಕಾಲ್ (1987) ಯಾವುದರ ನಿಯಂತ್ರಣಕ್ಕೆ ಸಂಬಂಧಿಸಿದೆ?", [["Ozone-depleting substances", "ಓಜೋನ್ ಪದರ ಕ್ಷೀಣಿಸುವ ವಸ್ತುಗಳು"], ["Greenhouse gas emissions", "ಹಸಿರುಮನೆ ಅನಿಲ ಹೊರಸೂಸುವಿಕೆ"], ["Trade in endangered species", "ಅಳಿವಿನಂಚಿನ ಜಾತಿಗಳ ವ್ಯಾಪಾರ"], ["Hazardous waste movement", "ಅಪಾಯಕಾರಿ ತ್ಯಾಜ್ಯ ಸಾಗಣೆ"]], 0, ["It phases out ozone-depleting substances such as CFCs.", "ಇದು CFC ಯಂತಹ ಓಜೋನ್ ಕ್ಷೀಣಕಾರಿ ವಸ್ತುಗಳನ್ನು ಹಂತಹಂತವಾಗಿ ನಿಲ್ಲಿಸುತ್ತದೆ."]], ["Science & Environment", "Which was the first Biosphere Reserve of India, established in 1986?", "1986 ರಲ್ಲಿ ಸ್ಥಾಪನೆಯಾದ ಭಾರತದ ಮೊದಲ ಜೀವಗೋಳ ಮೀಸಲು ಪ್ರದೇಶ ಯಾವುದು?", [["Nilgiri", "ನೀಲಗಿರಿ"], ["Sundarbans", "ಸುಂದರಬನ"], ["Nanda Devi", "ನಂದಾದೇವಿ"], ["Gulf of Mannar", "ಮನ್ನಾರ್ ಕೊಲ್ಲಿ"]], 0, ["The Nilgiri Biosphere Reserve covers parts of Karnataka, Kerala and Tamil Nadu.", "ನೀಲಗಿರಿ ಜೀವಗೋಳ ಮೀಸಲು ಕರ್ನಾಟಕ, ಕೇರಳ, ತಮಿಳುನಾಡಿನ ಭಾಗಗಳನ್ನು ಒಳಗೊಂಡಿದೆ."]], ["Science & Environment", "Acid rain is mainly caused by which pair of gases?", "ಆಮ್ಲ ಮಳೆ ಮುಖ್ಯವಾಗಿ ಯಾವ ಜೋಡಿ ಅನಿಲಗಳಿಂದ ಉಂಟಾಗುತ್ತದೆ?", [["Sulphur dioxide and nitrogen oxides", "ಸಲ್ಫರ್ ಡೈಆಕ್ಸೈಡ್ ಮತ್ತು ನೈಟ್ರೋಜನ್ ಆಕ್ಸೈಡ್‌ಗಳು"], ["Carbon monoxide and methane", "ಕಾರ್ಬನ್ ಮಾನಾಕ್ಸೈಡ್ ಮತ್ತು ಮೀಥೇನ್"], ["Ozone and hydrogen", "ಓಜೋನ್ ಮತ್ತು ಹೈಡ್ರೋಜನ್"], ["Argon and helium", "ಆರ್ಗಾನ್ ಮತ್ತು ಹೀಲಿಯಂ"]], 0, ["SO₂ and NOx form sulphuric and nitric acids in the atmosphere.", "SO₂ ಮತ್ತು NOx ವಾತಾವರಣದಲ್ಲಿ ಸಲ್ಫ್ಯೂರಿಕ್ ಮತ್ತು ನೈಟ್ರಿಕ್ ಆಮ್ಲ ರೂಪಿಸುತ್ತವೆ."]], ["Science & Environment", "Scurvy is caused by the deficiency of which vitamin?", "ಸ್ಕರ್ವಿ ರೋಗ ಯಾವ ಜೀವಸತ್ವದ ಕೊರತೆಯಿಂದ ಬರುತ್ತದೆ?", [["Vitamin A", "ಜೀವಸತ್ವ A"], ["Vitamin B1", "ಜೀವಸತ್ವ B1"], ["Vitamin C", "ಜೀವಸತ್ವ C"], ["Vitamin D", "ಜೀವಸತ್ವ D"]], 2, ["Vitamin C (ascorbic acid) deficiency causes scurvy.", "ಜೀವಸತ್ವ C (ಆಸ್ಕಾರ್ಬಿಕ್ ಆಮ್ಲ) ಕೊರತೆ ಸ್ಕರ್ವಿ ಉಂಟುಮಾಡುತ್ತದೆ."]], ["Science & Environment", "Arrange the following Indian space missions in chronological order of launch:\nA. Chandrayaan-3\nB. Aryabhata\nC. Mangalyaan (Mars Orbiter Mission)\nD. Chandrayaan-1", "ಕೆಳಗಿನ ಭಾರತೀಯ ಬಾಹ್ಯಾಕಾಶ ಯೋಜನೆಗಳನ್ನು ಉಡಾವಣೆಯ ಕಾಲಾನುಕ್ರಮದಲ್ಲಿ ಜೋಡಿಸಿ:\nA. ಚಂದ್ರಯಾನ-3\nB. ಆರ್ಯಭಟ\nC. ಮಂಗಳಯಾನ\nD. ಚಂದ್ರಯಾನ-1", [["B, D, C, A", "B, D, C, A"], ["B, C, D, A", "B, C, D, A"], ["D, B, C, A", "D, B, C, A"], ["B, D, A, C", "B, D, A, C"]], 0, ["Aryabhata 1975 → Chandrayaan-1 2008 → Mangalyaan 2013 → Chandrayaan-3 2023.", "ಆರ್ಯಭಟ 1975 → ಚಂದ್ರಯಾನ-1 2008 → ಮಂಗಳಯಾನ 2013 → ಚಂದ್ರಯಾನ-3 2023."]], ["Science & Environment", "Match the scientists (List I) with their contributions (List II):\nList I: A. C.V. Raman  B. J.C. Bose  C. Homi Bhabha  D. Vikram Sarabhai\nList II: I. Father of the Indian space programme  II. Raman Effect  III. Founder of the Indian nuclear programme  IV. Crescograph", "ವಿಜ್ಞಾನಿಗಳನ್ನು (ಪಟ್ಟಿ I) ಅವರ ಕೊಡುಗೆಯೊಂದಿಗೆ (ಪಟ್ಟಿ II) ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ I: A. ಸಿ.ವಿ. ರಾಮನ್  B. ಜೆ.ಸಿ. ಬೋಸ್  C. ಹೋಮಿ ಭಾಭಾ  D. ವಿಕ್ರಮ್ ಸಾರಾಭಾಯ್\nಪಟ್ಟಿ II: I. ಭಾರತೀಯ ಬಾಹ್ಯಾಕಾಶ ಕಾರ್ಯಕ್ರಮದ ಪಿತಾಮಹ  II. ರಾಮನ್ ಪರಿಣಾಮ  III. ಭಾರತದ ಪರಮಾಣು ಕಾರ್ಯಕ್ರಮದ ಸ್ಥಾಪಕ  IV. ಕ್ರೆಸ್ಕೋಗ್ರಾಫ್", [["A–II, B–IV, C–III, D–I", "A–II, B–IV, C–III, D–I"], ["A–IV, B–II, C–III, D–I", "A–IV, B–II, C–III, D–I"], ["A–II, B–IV, C–I, D–III", "A–II, B–IV, C–I, D–III"], ["A–III, B–IV, C–II, D–I", "A–III, B–IV, C–II, D–I"]], 0, ["Raman – Raman Effect; Bose – crescograph; Bhabha – nuclear programme; Sarabhai – space programme.", "ರಾಮನ್ – ರಾಮನ್ ಪರಿಣಾಮ; ಬೋಸ್ – ಕ್ರೆಸ್ಕೋಗ್ರಾಫ್; ಭಾಭಾ – ಪರಮಾಣು ಕಾರ್ಯಕ್ರಮ; ಸಾರಾಭಾಯ್ – ಬಾಹ್ಯಾಕಾಶ ಕಾರ್ಯಕ್ರಮ."]], ["Science & Environment", "Which of the following is NOT a greenhouse gas?", "ಕೆಳಗಿನವುಗಳಲ್ಲಿ ಹಸಿರುಮನೆ ಅನಿಲವಲ್ಲದ್ದು ಯಾವುದು?", [["Carbon dioxide", "ಕಾರ್ಬನ್ ಡೈಆಕ್ಸೈಡ್"], ["Methane", "ಮೀಥೇನ್"], ["Nitrous oxide", "ನೈಟ್ರಸ್ ಆಕ್ಸೈಡ್"], ["Argon", "ಆರ್ಗಾನ್"]], 3, ["Argon is an inert gas that does not trap heat significantly.", "ಆರ್ಗಾನ್ ನಿಷ್ಕ್ರಿಯ ಅನಿಲ; ಶಾಖವನ್ನು ಗಮನಾರ್ಹವಾಗಿ ಹಿಡಿದಿಡುವುದಿಲ್ಲ."]], ["Science & Environment", "Who was the first Indian to travel into space (1984)?", "ಬಾಹ್ಯಾಕಾಶಕ್ಕೆ ಪ್ರಯಾಣಿಸಿದ ಮೊದಲ ಭಾರತೀಯ (1984) ಯಾರು?", [["Rakesh Sharma", "ರಾಕೇಶ್ ಶರ್ಮಾ"], ["Kalpana Chawla", "ಕಲ್ಪನಾ ಚಾವ್ಲಾ"], ["Ravish Malhotra", "ರವೀಶ್ ಮಲ್ಹೋತ್ರ"], ["Sunita Williams", "ಸುನೀತಾ ವಿಲಿಯಮ್ಸ್"]], 0, ["Rakesh Sharma flew aboard Soyuz T-11 in April 1984.", "ರಾಕೇಶ್ ಶರ್ಮಾ 1984 ಏಪ್ರಿಲ್‌ನಲ್ಲಿ ಸೋಯುಜ್ T-11 ನಲ್ಲಿ ಹಾರಿದರು."]], ["Science & Environment", "Consider the following about the Sustainable Development Goals (SDGs):\nA. There are 17 goals.\nB. They were adopted by the UN in 2015.\nC. The target year to achieve them is 2030.\nWhich of the above are correct?", "ಸುಸ್ಥಿರ ಅಭಿವೃದ್ಧಿ ಗುರಿಗಳ (SDG) ಕುರಿತು:\nA. ಒಟ್ಟು 17 ಗುರಿಗಳಿವೆ.\nB. ಇವನ್ನು 2015 ರಲ್ಲಿ ವಿಶ್ವಸಂಸ್ಥೆ ಅಂಗೀಕರಿಸಿತು.\nC. ಇವನ್ನು ಸಾಧಿಸುವ ಗುರಿ ವರ್ಷ 2030.\nಮೇಲಿನ ಯಾವುವು ಸರಿ?", [["A only", "A ಮಾತ್ರ"], ["A and B only", "A ಮತ್ತು B ಮಾತ್ರ"], ["B and C only", "B ಮತ್ತು C ಮಾತ್ರ"], ["A, B and C", "A, B ಮತ್ತು C"]], 3, ["All three are correct.", "ಮೂರೂ ಸರಿ."]], ["Science & Environment", "Assertion (A): Mangroves protect coastlines from storms and erosion.\nReason (R): Their dense roots reduce the energy of waves and trap sediments.", "ಪ್ರತಿಪಾದನೆ (A): ಮ್ಯಾಂಗ್ರೋವ್‌ಗಳು ಚಂಡಮಾರುತ ಮತ್ತು ಸವೆತದಿಂದ ಕರಾವಳಿಯನ್ನು ರಕ್ಷಿಸುತ್ತವೆ.\nಕಾರಣ (R): ಅವುಗಳ ದಟ್ಟ ಬೇರುಗಳು ಅಲೆಗಳ ಶಕ್ತಿ ಕುಗ್ಗಿಸಿ ಕೆಸರನ್ನು ಹಿಡಿದಿಡುತ್ತವೆ.", [["Both (A) and (R) are true and (R) is the correct explanation of (A)", "(A) ಮತ್ತು (R) ಎರಡೂ ಸತ್ಯ ಮತ್ತು (R) ಯು (A) ಯ ಸರಿಯಾದ ವಿವರಣೆ"], ["Both (A) and (R) are true but (R) is not the correct explanation of (A)", "(A) ಮತ್ತು (R) ಎರಡೂ ಸತ್ಯ ಆದರೆ (R) ಯು (A) ಯ ಸರಿಯಾದ ವಿವರಣೆಯಲ್ಲ"], ["(A) is true but (R) is false", "(A) ಸತ್ಯ ಆದರೆ (R) ಸುಳ್ಳು"], ["(A) is false but (R) is true", "(A) ಸುಳ್ಳು ಆದರೆ (R) ಸತ್ಯ"]], 0, ["Root systems dampen waves and stabilise sediment, so R explains A.", "ಬೇರಿನ ವ್ಯವಸ್ಥೆ ಅಲೆಗಳನ್ನು ತಗ್ಗಿಸಿ ಕೆಸರನ್ನು ಸ್ಥಿರಗೊಳಿಸುತ್ತದೆ; ಆದ್ದರಿಂದ R ಯು A ಯನ್ನು ವಿವರಿಸುತ್ತದೆ."]], ["General Knowledge", "The headquarters of UNESCO is located in", "ಯುನೆಸ್ಕೋದ ಪ್ರಧಾನ ಕಚೇರಿ ಇರುವುದು", [["Paris", "ಪ್ಯಾರಿಸ್"], ["Geneva", "ಜಿನೀವಾ"], ["New York", "ನ್ಯೂಯಾರ್ಕ್"], ["Vienna", "ವಿಯೆನ್ನಾ"]], 0, ["UNESCO is headquartered in Paris, France.", "ಯುನೆಸ್ಕೋ ಪ್ರಧಾನ ಕಚೇರಿ ಫ್ರಾನ್ಸ್‌ನ ಪ್ಯಾರಿಸ್‌ನಲ್ಲಿದೆ."]], ["General Knowledge", "Which of the following was among the first recipients of the Bharat Ratna in 1954?", "1954 ರಲ್ಲಿ ಭಾರತ ರತ್ನ ಪಡೆದ ಮೊದಲ ಗೌರವಾನ್ವಿತರಲ್ಲಿ ಒಬ್ಬರು ಯಾರು?", [["Jawaharlal Nehru", "ಜವಾಹರಲಾಲ್ ನೆಹರೂ"], ["C.V. Raman", "ಸಿ.ವಿ. ರಾಮನ್"], ["Lal Bahadur Shastri", "ಲಾಲ್ ಬಹದ್ದೂರ್ ಶಾಸ್ತ್ರಿ"], ["Sardar Patel", "ಸರ್ದಾರ್ ಪಟೇಲ್"]], 1, ["1954: C. Rajagopalachari, S. Radhakrishnan and C.V. Raman; Nehru got it in 1955, Patel in 1991.", "1954: ಸಿ. ರಾಜಗೋಪಾಲಾಚಾರಿ, ಎಸ್. ರಾಧಾಕೃಷ್ಣನ್, ಸಿ.ವಿ. ರಾಮನ್; ನೆಹರೂ 1955 ರಲ್ಲಿ, ಪಟೇಲ್ 1991 ರಲ್ಲಿ."]], ["General Knowledge", "The G20 Leaders’ Summit of 2023 under India’s presidency was held in", "ಭಾರತದ ಅಧ್ಯಕ್ಷತೆಯಲ್ಲಿ 2023 ರ ಜಿ20 ನಾಯಕರ ಶೃಂಗಸಭೆ ನಡೆದ ಸ್ಥಳ", [["New Delhi", "ನವದೆಹಲಿ"], ["Mumbai", "ಮುಂಬೈ"], ["Bengaluru", "ಬೆಂಗಳೂರು"], ["Goa", "ಗೋವಾ"]], 0, ["The 18th G20 Summit was held at Bharat Mandapam, New Delhi, in September 2023.", "18ನೇ ಜಿ20 ಶೃಂಗಸಭೆ 2023 ಸೆಪ್ಟೆಂಬರ್‌ನಲ್ಲಿ ನವದೆಹಲಿಯ ಭಾರತ ಮಂಟಪದಲ್ಲಿ ನಡೆಯಿತು."]], ["General Knowledge", "Which State has the highest literacy rate as per Census 2011?", "2011ರ ಜನಗಣತಿ ಪ್ರಕಾರ ಅತಿ ಹೆಚ್ಚು ಸಾಕ್ಷರತೆ ಹೊಂದಿರುವ ರಾಜ್ಯ ಯಾವುದು?", [["Kerala", "ಕೇರಳ"], ["Mizoram", "ಮಿಜೋರಾಂ"], ["Goa", "ಗೋವಾ"], ["Tripura", "ತ್ರಿಪುರ"]], 0, ["Kerala had about 94% literacy in Census 2011.", "2011ರ ಜನಗಣತಿಯಲ್ಲಿ ಕೇರಳದ ಸಾಕ್ಷರತೆ ಸುಮಾರು ಶೇ. 94."]], ["General Knowledge", "The State bird of Karnataka is", "ಕರ್ನಾಟಕದ ರಾಜ್ಯ ಪಕ್ಷಿ", [["Indian Roller (Neelakanta)", "ನೀಲಕಂಠ (ಇಂಡಿಯನ್ ರೋಲರ್)"], ["Peacock", "ನವಿಲು"], ["Hornbill", "ಟೊಣಪ (ಹಾರ್ನ್‌ಬಿಲ್)"], ["Sarus Crane", "ಸಾರಸ್ ಕೊಕ್ಕರೆ"]], 0, ["The Indian Roller (Neelakanta) is Karnataka’s State bird.", "ನೀಲಕಂಠ (ಇಂಡಿಯನ್ ರೋಲರ್) ಕರ್ನಾಟಕದ ರಾಜ್ಯ ಪಕ್ಷಿ."]], ["General Knowledge", "Which of the following pairs of classical dance and State is NOT correctly matched?", "ಕೆಳಗಿನ ಶಾಸ್ತ್ರೀಯ ನೃತ್ಯ–ರಾಜ್ಯ ಜೋಡಿಗಳಲ್ಲಿ ಸರಿಯಾಗಿ ಹೊಂದದಿರುವುದು ಯಾವುದು?", [["Kuchipudi – Andhra Pradesh", "ಕೂಚಿಪುಡಿ – ಆಂಧ್ರ ಪ್ರದೇಶ"], ["Kathakali – Kerala", "ಕಥಕ್ಕಳಿ – ಕೇರಳ"], ["Bharatanatyam – Tamil Nadu", "ಭರತನಾಟ್ಯ – ತಮಿಳುನಾಡು"], ["Odissi – West Bengal", "ಒಡಿಸ್ಸಿ – ಪಶ್ಚಿಮ ಬಂಗಾಳ"]], 3, ["Odissi belongs to Odisha, not West Bengal.", "ಒಡಿಸ್ಸಿ ಒಡಿಶಾದ ನೃತ್ಯ, ಪಶ್ಚಿಮ ಬಂಗಾಳದ್ದಲ್ಲ."]], ["General Knowledge", "Consider the following about the United Nations:\nA. It was founded in 1945.\nB. It has 193 member states.\nC. The Security Council has five permanent members.\nWhich of the above are correct?", "ವಿಶ್ವಸಂಸ್ಥೆಯ ಕುರಿತು:\nA. ಇದು 1945 ರಲ್ಲಿ ಸ್ಥಾಪನೆಯಾಯಿತು.\nB. ಇದಕ್ಕೆ 193 ಸದಸ್ಯ ರಾಷ್ಟ್ರಗಳಿವೆ.\nC. ಭದ್ರತಾ ಮಂಡಳಿಗೆ ಐದು ಖಾಯಂ ಸದಸ್ಯರಿದ್ದಾರೆ.\nಮೇಲಿನ ಯಾವುವು ಸರಿ?", [["A only", "A ಮಾತ್ರ"], ["A and B only", "A ಮತ್ತು B ಮಾತ್ರ"], ["B and C only", "B ಮತ್ತು C ಮಾತ್ರ"], ["A, B and C", "A, B ಮತ್ತು C"]], 3, ["All three are correct.", "ಮೂರೂ ಸರಿ."]]];const LOGO="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCACgAKADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6looooAKKKWgApDgAk8AVxvxH+I+g+AbESatP5t7IuYLKEgyye+P4V/2j+teBtqPxL+OFw8enKdI8NFtrFWaODHoz/elPsOPYVrCi5Lme const fmt=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return [h,m,x].map(n=>String(n).padStart(2,'0')).join(':')};
function tick(){const e=document.getElementById('tm');if(e){e.textContent=fmt(left);e.className='tm'+(left<600?' lo':'')}}
function pal(){return `<div class="pal">${Q.map((q,j)=>`<button class="${M[j]?'mk':A[j]!=null?'an':V[j]?'vi':''}${j===i?' cur':''}" onclick="go(${j})">${j+1}</button>`).join('')}</div><div class="lg m" style="margin-top:8px"><span>🟩 Answered</span><span>🟥 Not answered</span><span>🟪 Marked</span><span>⬜ Not visited</span></div>`}
function go(j){i=j;V[j]=true;draw()}
function sel(j){A[i]=A[i]===j?null:j;draw()}
function mark(){M[i]=!M[i];draw()}
function draw(){const q=Q[i],ans=A.filter(x=>x!=null).length;
a.innerHTML=`<div class="top"><span class="m">Q ${i+1}/100 · Answered ${ans}</span><span class="tm${left<600?' lo':''}" id="tm">${fmt(left)}</span><button class="n r" onclick="confirmSubmit()">Submit</button></div>
<div class="card"><div class="yr">${q[0]} · Q${i+1}</div><p class="q"><b>${q[1]}</b></p><p class="q k">${q[2]}</p>${q[3].map((o,j)=>`<button class="o${A[i]===j?' s':''}" onclick="sel(${j})">(${L[j]}) ${o[0]}${o[1]?`<br><span class="k">${o[1]}</span>`:''}</button>`).join('')}
<div class="bar"><button class="n a" onclick="go(Math.max(0,i-1))">← Prev</button><button class="n mk" onclick="mark()">${M[i]?'Unmark':'Mark for review'}</button><button class="n a" onclick="A[i]=null;draw()">Clear</button><button class="n" onclick="go(Math.min(99,i+1))">Next →</button></div></div>
<div class="card"><div class="m" style="margin-bottom:6px">${SECS.map(s=>`<a href="#" onclick="go(${Q.findIndex(x=>x[0]==s)});return false">${s}</a>`).join(' · ')}</div>${pal()}</div>`}
function confirmSubmit(){const ans=A.filter(x=>x!=null).length;if(confirm(`You have answered ${ans} of 100 questions. Submit the test?\nನೀವು 100 ರಲ್ಲಿ ${ans} ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿದ್ದೀರಿ. ಸಲ್ಲಿಸಬೇಕೇ?`))submit(false)}
let filt='all';
function submit(auto){if(done)return;done=true;clearInterval(T);result(DUR-left)}
function result(used){let c=0,w=0;const S={};Q.forEach((q,j)=>{S[q[0]]=S[q[0]]||[0,0,0];if(A[j]==null)S[q[0]][2]++;else if(A[j]===q[4]){c++;S[q[0]][0]++}else{w++;S[q[0]][1]++}});
const sc=c*2-w*0.5,sk=100-c-w,acc=c+w?Math.round(c/(c+w)*100):0;
a.innerHTML=`<header><img src="${LOGO}" alt="logo" style="width:64px;height:64px"><h1>Result / ಫಲಿತಾಂಶ</h1></header><div class="card" style="text-align:center"><div class="sc">${sc.toFixed(2)} <small>/ 200</small></div><p>Correct ${c} (+${c*2}) · Wrong ${w} (−${(w*0.5).toFixed(2)}) · Skipped ${sk}<br>Accuracy ${acc}% · Time used ${fmt(used)}</p></div>
<div class="card"><table><tr><th>Section / ವಿಭಾಗ</th><th>✔</th><th>✘</th><th>–</th><th>Marks</th></tr>${SECS.map(s=>`<tr><td>${s}</td><td>${S[s][0]}</td><td>${S[s][1]}</td><td>${S[s][2]}</td><td>${(S[s][0]*2-S[s][1]*0.5).toFixed(1)}</td></tr>`).join('')}</table></div>
<a class="tg" href="${TG}">Join our Telegram for more tests</a><div class="bar" id="fl"></div><div id="rv"></div><button class="n" onclick="location.reload()">Retry / ಮರುಪ್ರಯತ್ನ</button>`;review();window.scrollTo(0,0)}
function review(){document.getElementById('fl').innerHTML=[['all','All'],['wrong','Wrong'],['skip','Skipped'],['right','Correct']].map(f=>`<button class="n${filt==f[0]?'':' a'}" onclick="filt='${f[0]}';review()">${f[1]}</button>`).join('');
document.getElementById('rv').innerHTML=Q.map((q,j)=>{const st=A[j]==null?'skip':A[j]===q[4]?'right':'wrong';if(filt!='all'&&filt!=st)return'';
return `<div class="card"><div class="yr">${q[0]} · Q${j+1} · ${st=='right'?'✔ Correct':st=='wrong'?'✘ Wrong':'– Skipped'}</div><p class="q"><b>${q[1]}</b></p><p class="q k">${q[2]}</p>${q[3].map((o,k)=>`<div class="o ${k===q[4]?'g':A[j]===k?'x':''}">(${L[k]}) ${o[0]}${k===q[4]?' ✓':''}${o[1]?`<br><span class="k">${o[1]}</span>`:''}</div>`).join('')}<div class="ex">💡 ${q[5][0]}<br><span class="k">${q[5][1]}</span></div></div>`}).join('')}
intro();
</script></body></html>
