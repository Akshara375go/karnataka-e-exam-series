<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Karnataka VAO Paper 2 — Full Length Mock Test — CBT Examination</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy:#1F3A5F; --navy-dark:#16283F;
    --gold:#B08D57;
    --cream:#F4F1E8;
    --ink:#2A2622; --ink-soft:#5A4F3A; --ink-mute:#7A6F5C;
    --border:#D9D2BE; --border-soft:#E3DCC8;
    --white:#FFFFFF;
    --green:#2F6F4E; --green-bg:#E4EFE7;
    --red:#B23A2E; --red-bg:#F6E6E4;
    --amber:#8A6D1F; --amber-bg:#F5E7B2; --amber-border:#C9A227;
    --topicbg:#EFEADA;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:Georgia,'Tinos',serif;color:var(--ink);background:var(--cream)}
  button{font-family:inherit}
  #app{min-height:100vh;display:flex;flex-direction:column}

  /* ---------- START SCREEN ---------- */
  .start-wrap{max-width:640px;margin:40px auto;background:var(--white);border:1px solid var(--border);border-radius:8px;padding:30px 32px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .start-logo{display:block;margin:0 auto 18px;width:120px;height:120px;border-radius:50%}
  .start-wrap h1{font-size:19px;color:var(--navy);margin:0 0 4px;text-align:center}
  .start-wrap h2{text-align:center}
  .start-wrap h2{font-size:14px;font-weight:normal;color:var(--ink-soft);margin:0 0 22px}
  .start-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
  .start-card{background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:12px 14px}
  .start-card .lbl{font-family:'Courier New',monospace;font-size:11px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.5px}
  .start-card .val{font-size:16px;color:var(--navy);margin-top:4px}
  .instructions{font-size:13.5px;line-height:1.7;color:var(--ink-soft);margin-bottom:22px}
  .instructions li{margin-bottom:4px}
  .toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:22px;font-size:13.5px}
  .btn-primary{font-family:Georgia,serif;font-size:15px;background:var(--navy);color:var(--cream);border:none;padding:12px 26px;border-radius:5px;cursor:pointer}
  .btn-primary:hover{background:var(--navy-dark)}
  .btn-secondary{font-family:Georgia,serif;font-size:14px;background:var(--gold);color:var(--ink);border:none;padding:9px 20px;border-radius:5px;cursor:pointer}
  .btn-ghost{font-family:Georgia,serif;font-size:13.5px;background:transparent;color:var(--navy);border:1px solid var(--navy);padding:8px 16px;border-radius:5px;cursor:pointer}

  /* ---------- EXAM HEADER ---------- */
  .exam-header{background:var(--navy);color:var(--cream);padding:10px 18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
  .exam-header .titles h1{font-size:14.5px;font-weight:normal;margin:0;letter-spacing:.2px}
  .exam-header .titles h2{font-size:12px;font-weight:normal;margin:2px 0 0;color:#D8CBA9}
  .exam-header .mid{display:flex;align-items:center;gap:16px;font-family:'Courier New',monospace;font-size:12.5px}
  .exam-header .timer{background:#16283F;padding:5px 12px;border-radius:4px;font-size:14px;letter-spacing:.5px}
  .exam-header .timer.low{background:var(--red)}
  .palette-toggle{display:none;background:var(--gold);color:var(--ink);border:none;padding:7px 12px;border-radius:4px;font-size:12.5px;cursor:pointer}
  .progress-track{height:4px;background:var(--border)}
  .progress-fill{height:100%;background:var(--gold);transition:width .25s}

  /* ---------- MAIN EXAM LAYOUT ---------- */
  .exam-body{flex:1;display:flex;gap:0;align-items:flex-start}
  .qcol{flex:1;padding:22px 26px;max-width:760px}
  .qmeta{font-family:'Courier New',monospace;font-size:11.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .qmeta .qtopic{background:var(--topicbg);color:var(--ink-soft);padding:2px 8px;border-radius:3px;text-transform:none;letter-spacing:0}
  .qmeta .qstatus{padding:2px 8px;border-radius:3px}
  .qtext{font-size:15.5px;line-height:1.6;margin:0 0 18px;white-space:pre-line;background:var(--white);border:1px solid var(--border);border-radius:6px;padding:16px 18px}
  .opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:11px 14px;margin-bottom:9px;background:var(--white);border:1px solid var(--border);border-radius:5px;font-family:Georgia,serif;font-size:14px;color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
  .opt:hover{border-color:var(--navy);background:var(--topicbg)}
  .opt .oletter{font-family:'Courier New',monospace;font-weight:bold;color:var(--navy);flex-shrink:0}
  .opt.selected{background:#E9EEF4;border-color:var(--navy)}
  .opt.selected .oletter{color:var(--navy)}

  .bottom-bar{display:flex;flex-wrap:wrap;gap:8px;padding:14px 26px;border-top:1px solid var(--border);background:var(--white)}
  .bottom-bar button{font-size:13.5px;padding:9px 16px;border-radius:5px;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--ink)}
  .bottom-bar .bb-primary{background:var(--navy);color:var(--cream);border-color:var(--navy)}
  .bottom-bar .bb-primary:hover{background:var(--navy-dark)}
  .bottom-bar .bb-warn{background:var(--amber-bg);border-color:var(--amber-border);color:var(--amber)}
  .bottom-bar .bb-clear{color:var(--red);border-color:var(--red)}
  .bottom-bar .bb-submit{background:var(--red);border-color:var(--red);color:var(--white);margin-left:auto}
  .bottom-bar button:disabled{opacity:.4;cursor:default}

  /* ---------- PALETTE ---------- */
  .palette{width:270px;flex-shrink:0;background:var(--white);border-left:1px solid var(--border);padding:16px;height:100%}
  .palette h3{font-size:12.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11.5px;margin-bottom:14px;color:var(--ink-soft)}
  .legend span.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;border:1px solid var(--border)}
  .pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .pnum{aspect-ratio:1;border:1px solid var(--border);border-radius:4px;background:var(--white);font-family:'Courier New',monospace;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
  .pnum.notvisited{background:var(--white);color:var(--ink)}
  .pnum.visited{background:var(--red-bg);border-color:var(--red);color:var(--red)}
  .pnum.answered{background:var(--green-bg);border-color:var(--green);color:var(--green)}
  .pnum.marked{background:var(--amber-bg);border-color:var(--amber-border);color:var(--amber)}
  .pnum.current{outline:2px solid var(--navy);outline-offset:1px}
  .palette-summary{margin-top:14px;font-size:12px;color:var(--ink-soft);border-top:1px dashed var(--border-soft);padding-top:10px}
  .palette-summary div{display:flex;justify-content:space-between;padding:2px 0}

  /* ---------- MODAL ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(42,38,34,.55);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal-box{background:var(--white);border-radius:8px;padding:24px 26px;max-width:420px;width:90%;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .modal-box p{font-size:14.5px;line-height:1.6;margin:0 0 18px;color:var(--ink)}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px}

  /* ---------- RESULT DASHBOARD ---------- */
  .result-wrap{max-width:920px;margin:0 auto;padding:24px 20px 60px}
  .result-head{text-align:center;padding:18px 0 8px}
  .result-head .big{font-family:'Courier New',monospace;font-size:44px;color:var(--navy);margin:6px 0}
  .result-head p{color:var(--ink-soft);font-size:14px;margin:2px 0}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
  .stat-card{background:var(--white);border:1px solid var(--border);border-radius:6px;padding:14px;text-align:center}
  .stat-card .n{font-family:'Courier New',monospace;font-size:22px;color:var(--navy)}
  .stat-card .l{font-size:11.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.4px;margin-top:4px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:24px 0 14px;border-bottom:1px solid var(--border)}
  .tab-btn{background:transparent;border:none;border-bottom:3px solid transparent;padding:9px 14px;font-size:13.5px;color:var(--ink-soft);cursor:pointer}
  .tab-btn.active{color:var(--navy);border-color:var(--navy);font-weight:bold}
  .tab-panel{display:none}
  .tab-panel.active{display:block}
  .abar-row{margin-bottom:14px;background:var(--white);border:1px solid var(--border);border-radius:6px;padding:12px 14px}
  .abar-top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
  .abar-top b{color:var(--navy)}
  .abar-track{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
  .abar-fill{height:100%;background:var(--green)}
  .review-item{background:var(--white);border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:12px}
  .review-item .rmeta{font-family:'Courier New',monospace;font-size:11px;color:var(--ink-mute);text-transform:uppercase;margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .review-item .rq{font-size:14.5px;white-space:pre-line;margin-bottom:10px}
  .review-item .ropt{padding:7px 10px;border-radius:4px;font-size:13.5px;margin-bottom:6px;border:1px solid var(--border)}
  .review-item .ropt.correctopt{background:var(--green-bg);border-color:var(--green);color:var(--green)}
  .review-item .ropt.wrongopt{background:var(--red-bg);border-color:var(--red);color:var(--red)}
  .tag{padding:2px 8px;border-radius:3px;font-size:11px}
  .tag.correct{background:var(--green-bg);color:var(--green)}
  .tag.wrong{background:var(--red-bg);color:var(--red)}
  .tag.skip{background:var(--border-soft);color:var(--ink-soft)}
  .explain{font-size:12.5px;color:var(--ink-mute);border-top:1px dashed var(--border-soft);margin-top:8px;padding-top:8px}
  .perf-block{background:var(--white);border:1px solid var(--border);border-radius:6px;padding:16px 18px;margin-bottom:14px}
  .perf-block h4{margin:0 0 8px;font-size:13.5px;color:var(--navy)}
  .perf-block ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7;color:var(--ink)}
  .smart-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
  .filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .filter-btn{background:var(--white);border:1px solid var(--border);padding:6px 12px;border-radius:14px;font-size:12px;cursor:pointer;color:var(--ink-soft)}
  .filter-btn.active{background:var(--navy);color:var(--cream);border-color:var(--navy)}
  .practice-banner{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);padding:8px 14px;border-radius:5px;font-size:12.5px;text-align:center}

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:900px){
    .palette-toggle{display:inline-block}
    .palette{position:fixed;top:0;right:0;height:100%;width:82%;max-width:320px;transform:translateX(100%);transition:transform .25s;z-index:40;box-shadow:-4px 0 16px rgba(0,0,0,.15)}
    .palette.open{transform:translateX(0)}
    .stat-grid{grid-template-columns:repeat(2,1fr)}
    .qcol{padding:16px}
  }
  @media (max-width:520px){
    .exam-header .mid{font-size:11px;gap:10px}
    .bottom-bar{padding:10px 12px}
    .bottom-bar button{flex:1 1 auto;font-size:12.5px;padding:9px 10px}
    .bottom-bar .bb-submit{margin-left:0;order:99;flex-basis:100%}
    .result-wrap{padding:16px 10px 50px}
    .stat-grid{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>

var kannadaFontLoadPromise = null;
function ensureKannadaFontLoaded(){
  if (kannadaFontLoadPromise) return kannadaFontLoadPromise;
  try {
    var fontFace = new FontFace('KannadaPDF', 'url(data:font/truetype;charset=utf-8;base64,' + KANNADA_FONT_BASE64 + ')');
    kannadaFontLoadPromise = fontFace.load().then(function(loaded){
      document.fonts.add(loaded);
      return true;
    }).catch(function(err){
      console.error('Kannada PDF font failed to load; Kannada text in downloaded PDFs may not render correctly.', err);
      return false;
    });
  } catch (e) {
    console.error('FontFace API unavailable; Kannada text in downloaded PDFs may not render correctly.', e);
    kannadaFontLoadPromise = Promise.resolve(false);
  }
  return kannadaFontLoadPromise;
}
// Kick off loading as soon as the script runs, so it is very
// likely already resolved by the time the user clicks download.
ensureKannadaFontLoaded();

var KANNADA_RANGE_RE = /[\u0C80-\u0CFF]/;
function isKannadaText(s){ return KANNADA_RANGE_RE.test(String(s || '')); }

var _kannadaMeasureCanvas = null;
function kannadaMeasureCtx(){
  if (!_kannadaMeasureCanvas) _kannadaMeasureCanvas = document.createElement('canvas');
  return _kannadaMeasureCanvas.getContext('2d');
}

function kannadaFontSpec(fontSizePt, bold, italic){
  var weight = bold ? 'bold' : 'normal';
  var style = italic ? 'italic' : 'normal';
  return style + ' ' + weight + ' ' + fontSizePt + 'px KannadaPDF, "Noto Sans Kannada", sans-serif';
}

function measureKannadaWidthPt(text, fontSizePt, bold, italic){
  var ctx = kannadaMeasureCtx();
  ctx.font = kannadaFontSpec(fontSizePt, bold, italic);
  return ctx.measureText(text).width;
}

// Word-wrap (by spaces, honoring explicit \n breaks already in
// the source text) sized against the real Kannada font metrics,
// mirroring what doc.splitTextToSize does for Latin text.
function wrapKannadaText(text, fontSizePt, bold, italic, maxWidthPt){
  var paragraphs = String(text == null ? '' : text).split('\n');
  var lines = [];
  paragraphs.forEach(function(para){
    if (para === '') { lines.push(''); return; }
    var words = para.split(' ');
    var current = '';
    for (var i = 0; i < words.length; i++){
      var word = words[i];
      var test = current ? (current + ' ' + word) : word;
      if (!current || measureKannadaWidthPt(test, fontSizePt, bold, italic) <= maxWidthPt){
        current = test;
      } else {
        lines.push(current);
        current = word;
      }
    }
    if (current || lines.length === 0) lines.push(current);
  });
  return lines;
}

// Rasterize a single line of (possibly mixed Kannada+ASCII) text
// to a PNG at higher-than-1x resolution for crisp output, then
// report back the size to use when placing it into the PDF (in
// the same pt units jsPDF already uses for this page).
function kannadaLineToImage(text, fontSizePt, bold, italic, colorHex){
  var scale = 3;
  var ctx = kannadaMeasureCtx();
  ctx.font = kannadaFontSpec(fontSizePt * scale, bold, italic);
  var safeText = text === '' ? ' ' : text;
  var metrics = ctx.measureText(safeText);
  var ascent = metrics.actualBoundingBoxAscent || (fontSizePt * scale * 0.82);
  var descent = metrics.actualBoundingBoxDescent || (fontSizePt * scale * 0.24);
  var width = Math.max(1, Math.ceil(metrics.width) + 4 * scale);
  var height = Math.max(1, Math.ceil(ascent + descent) + 4 * scale);

  var canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  var dctx = canvas.getContext('2d');
  dctx.font = kannadaFontSpec(fontSizePt * scale, bold, italic);
  dctx.fillStyle = colorHex || '#000000';
  dctx.textBaseline = 'alphabetic';
  dctx.fillText(safeText, 2 * scale, ascent + 2 * scale);

  return {
    dataUrl: canvas.toDataURL('image/png'),
    widthPt: width / scale,
    heightPt: height / scale,
    ascentPt: ascent / scale
  };
}

var Q = [["ಕನ್ನಡ: ಸಂಧಿ", "'ದೇವ + ಆಲಯ = ದೇವಾಲಯ' ಈ ಪದದಲ್ಲಿ ಆಗಿರುವ ಸಂಧಿಯನ್ನು ಗುರುತಿಸಿ.", ["ಲೋಪ ಸಂಧಿ", "ಸವರ್ಣದೀರ್ಘ ಸಂಧಿ", "ಗುಣ ಸಂಧಿ", "ಆಗಮ ಸಂಧಿ"], 1, "Medium", "When two similar (savarna) vowels of the same class combine to form a single long vowel of that class (here 'a'+'a' -> long 'aa'), it is called Savarnadeergha Sandhi -- as in ದೇವ+ಆಲಯ = ದೇವಾಲಯ."], ["ಕನ್ನಡ: ಸಂಧಿ", "'ಸೂರ್ಯ + ಉದಯ = ಸೂರ್ಯೋದಯ' ಈ ಪದದಲ್ಲಿ ಆಗಿರುವ ಸಂಧಿ ಯಾವುದು?", ["ಯಣ್ ಸಂಧಿ", "ವೃದ್ಧಿ ಸಂಧಿ", "ಗುಣ ಸಂಧಿ", "ಆದೇಶ ಸಂಧಿ"], 2, "Hard", "In Guna Sandhi, 'a'/'aa' followed by 'u'/'oo' combines to give 'o' -- here ಸೂರ್ಯ (ending in 'a') + ಉದಯ (beginning with 'u') becomes ಸೂರ್ಯೋದಯ, a classic example of Guna Sandhi."], ["ಕನ್ನಡ: ಸಂಧಿ", "'ಗುರು + ಅನ್ನು = ಗುರುವನ್ನು' ಈ ಪದದಲ್ಲಿ ಕಂಡುಬರುವ ಸಂಧಿಯನ್ನು ಗುರುತಿಸಿ.", ["ಲೋಪ ಸಂಧಿ", "ಆದೇಶ ಸಂಧಿ", "ಆಗಮ ಸಂಧಿ", "ವೃದ್ಧಿ ಸಂಧಿ"], 2, "Medium", "In Agama Sandhi, a new consonant ('ಯ್' or 'ವ್') is inserted between two vowels while joining two words. Here, ಗುರು+ಅನ್ನು becomes ಗುರುವನ್ನು with the insertion of 'ವ'."], ["ಕನ್ನಡ: ಸಂಧಿ", "'ಮಳೆ + ಕಾಲ = ಮಳೆಗಾಲ' ಈ ಪದದಲ್ಲಿ 'ಕ' ಕಾರವು 'ಗ' ಕಾರವಾಗಿ ಬದಲಾಗುವುದನ್ನು ಯಾವ ಸಂಧಿ ಎನ್ನುತ್ತಾರೆ?", ["ಆದೇಶ ಸಂಧಿ", "ಲೋಪ ಸಂಧಿ", "ಆಗಮ ಸಂಧಿ", "ಗುಣ ಸಂಧಿ"], 0, "Medium", "In Adesha Sandhi, a hard consonant (ಕ, ಚ, ತ, ಪ) at the start of the second word changes to its corresponding soft consonant (ಗ, ಜ, ದ, ಬ) when joined with a preceding word ending in certain sounds -- as in ಮಳೆ+ಕಾಲ = ಮಳೆಗಾಲ."], ["ಕನ್ನಡ: ಸಮಾಸ", "'ಹೆಮ್ಮರ' (ಹಿರಿದಾದ ಮರ) ಈ ಪದ ಯಾವ ಸಮಾಸಕ್ಕೆ ಉದಾಹರಣೆಯಾಗಿದೆ?", ["ದ್ವಂದ್ವ ಸಮಾಸ", "ಕರ್ಮಧಾರಯ ಸಮಾಸ", "ದ್ವಿಗು ಸಮಾಸ", "ಬಹುವ್ರೀಹಿ ಸಮಾಸ"], 1, "Medium", "In Karmadharaya Samasa, the first word (Purvapada) is an adjective describing the quality of the second word (Uttarapada), which is the principal word. Here 'ಹಿರಿದು' (great) describes 'ಮರ' (tree), giving ಕರ್ಮಧಾರಯ ಸಮಾಸ."], ["ಕನ್ನಡ: ಸಮಾಸ", "'ಮುಕ್ಕಣ್ಣ' (ಮೂರು ಕಣ್ಣುಗಳುಳ್ಳವನು) ಈ ಪದ ಯಾವ ಸಮಾಸಕ್ಕೆ ಉದಾಹರಣೆ?", ["ದ್ವಿಗು ಸಮಾಸ", "ಬಹುವ್ರೀಹಿ ಸಮಾಸ", "ಅಂಶಿ ಸಮಾಸ", "ತತ್ಪುರುಷ ಸಮಾಸ"], 1, "Hard", "'ಮುಕ್ಕಣ್ಣ' ಎಂಬ ಪದದಲ್ಲಿ 'ಮೂರು ಕಣ್ಣುಗಳುಳ್ಳವನು' ಎಂಬ ಅರ್ಥ ಬರುವುದು ಆ ಪದಗಳಿಗಿಂತ ಬೇರೆಯಾದ ಮೂರನೇ ಪದದ (ಶಿವನ) ಅರ್ಥವನ್ನು ಸೂಚಿಸುತ್ತದೆ -- ಇಂತಹ 'ಅನ್ಯಪದಪ್ರಧಾನ' ಸಮಾಸವನ್ನು ಬಹುವ್ರೀಹಿ ಸಮಾಸ ಎನ್ನುತ್ತಾರೆ."], ["ಕನ್ನಡ: ಸಮಾಸ", "'ಅಪ್ಪ-ಅಮ್ಮ' ಎಂಬ ಪದದಂತೆ, ಈ ಕೆಳಗಿನ ಯಾವ ಪದವು ದ್ವಂದ್ವ ಸಮಾಸಕ್ಕೆ ಉದಾಹರಣೆಯಾಗಿದೆ?", ["ಕೈಕಾಲು", "ಕಣ್ಣೀರು", "ಮನೆಗೆಲಸ", "ನೀಲಾಕಾಶ"], 0, "Medium", "ದ್ವಂದ್ವ ಸಮಾಸದಲ್ಲಿ ಎರಡು ಅಥವಾ ಹೆಚ್ಚು ನಾಮಪದಗಳು ಸಮಾನ ಪ್ರಾಧಾನ್ಯತೆ ಪಡೆದು 'ಮತ್ತು' ಎಂಬ ಅರ್ಥದಲ್ಲಿ ಸೇರುತ್ತವೆ. 'ಕೈ ಮತ್ತು ಕಾಲು' ಎಂಬ ಅರ್ಥ ಬರುವ 'ಕೈಕಾಲು' ಇದಕ್ಕೆ ಸೂಕ್ತ ಉದಾಹರಣೆ."], ["ಕನ್ನಡ: ಸಮಾಸ", "'ಮನೆಗೆಲಸ' (ಮನೆಯ ಕೆಲಸ) ಎಂಬ ಪದ ಯಾವ ಸಮಾಸಕ್ಕೆ ಸೇರಿದೆ?", ["ಗಮಕ ಸಮಾಸ", "ತತ್ಪುರುಷ ಸಮಾಸ", "ದ್ವಿಗು ಸಮಾಸ", "ಕ್ರಿಯಾ ಸಮಾಸ"], 1, "Medium", "ತತ್ಪುರುಷ ಸಮಾಸದಲ್ಲಿ ಉತ್ತರಪದವು ಪ್ರಧಾನವಾಗಿದ್ದು, ಎರಡು ಪದಗಳ ನಡುವಿನ ವಿಭಕ್ತಿ ಪ್ರತ್ಯಯ ಲೋಪವಾಗುತ್ತದೆ. 'ಮನೆಯ ಕೆಲಸ' ಎಂಬಲ್ಲಿ ಷಷ್ಠಿ ವಿಭಕ್ತಿ ಪ್ರತ್ಯಯ 'ಅ' ಲೋಪವಾಗಿ 'ಮನೆಗೆಲಸ' ಆಗುವುದು ತತ್ಪುರುಷ ಸಮಾಸಕ್ಕೆ ಉದಾಹರಣೆ."], ["ಕನ್ನಡ: ವಿಭಕ್ತಿ ಪ್ರತ್ಯಯ", "ಹೊಂದಿಸಿ ಬರೆಯಿರಿ:\nಪಟ್ಟಿ I | ಪಟ್ಟಿ II\na. ಚತುರ್ಥೀ ವಿಭಕ್ತಿ | i. ಅಪಾದಾನಾರ್ಥ\nb. ಪಂಚಮೀ ವಿಭಕ್ತಿ | ii. ಸಂಪ್ರದಾನಾರ್ಥ\nc. ಷಷ್ಠೀ ವಿಭಕ್ತಿ | iii. ಅಧಿಕರಣಾರ್ಥ\nd. ಸಪ್ತಮೀ ವಿಭಕ್ತಿ | iv. ಸಂಬಂಧಾರ್ಥ\nಸರಿಯಾದ ಜೋಡಣೆಯನ್ನು ಆಯ್ಕೆಮಾಡಿ:", ["a-ii, b-i, c-iv, d-iii", "a-i, b-ii, c-iii, d-iv", "a-iii, b-iv, c-i, d-ii", "a-ii, b-iv, c-i, d-iii"], 0, "Medium", "ಚತುರ್ಥೀ ವಿಭಕ್ತಿ ('ಗೆ/ಇಗೆ') ಸಂಪ್ರದಾನಾರ್ಥವನ್ನೂ, ಪಂಚಮೀ ವಿಭಕ್ತಿ ('ದೆಸೆಯಿಂದ/ಗಿಂತ') ಅಪಾದಾನಾರ್ಥವನ್ನೂ, ಷಷ್ಠೀ ವಿಭಕ್ತಿ ('ಅ') ಸಂಬಂಧಾರ್ಥವನ್ನೂ, ಸಪ್ತಮೀ ವಿಭಕ್ತಿ ('ಅಲ್ಲಿ') ಅಧಿಕರಣಾರ್ಥವನ್ನೂ ಸೂಚಿಸುತ್ತವೆ -- ಆದ್ದರಿಂದ ಸರಿಯಾದ ಜೋಡಣೆ a-ii, b-i, c-iv, d-iii."], ["ಕನ್ನಡ: ಲಿಂಗ", "ಈ ಕೆಳಗಿನ ಪದಗಳಲ್ಲಿ ನಪುಂಸಕಲಿಂಗ ಪದವನ್ನು ಗುರುತಿಸಿ.", ["ಗಂಡ", "ಹೆಣ್ಣು", "ಮರ", "ಮಗ"], 2, "Easy", "ಸ್ತ್ರೀ ಅಥವಾ ಪುರುಷ ಜಾತಿಗೆ ಸೇರದ, ನಿರ್ಜೀವ ವಸ್ತುಗಳನ್ನು ಸೂಚಿಸುವ ಪದಗಳು ನಪುಂಸಕಲಿಂಗಕ್ಕೆ ಸೇರುತ್ತವೆ. 'ಮರ' ಒಂದು ನಿರ್ಜೀವ ವಸ್ತುವಾಗಿರುವುದರಿಂದ ನಪುಂಸಕಲಿಂಗ ಪದ; ಉಳಿದವು ಪುಲ್ಲಿಂಗ/ಸ್ತ್ರೀಲಿಂಗ ಪದಗಳು."], ["ಕನ್ನಡ: ವಚನ", "'ಕುದುರೆ' ಪದದ ಬಹುವಚನ ರೂಪ ಯಾವುದು?", ["ಕುದುರೆಗಳು", "ಕುದುರೆಯರು", "ಕುದುರೆಗೆ", "ಕುದುರಿಗಳು"], 0, "Easy", "ಕನ್ನಡದಲ್ಲಿ ನಿರ್ಜೀವ/ಪ್ರಾಣಿವಾಚಕ ನಾಮಪದಗಳ ಬಹುವಚನ ರೂಪ ಸಾಮಾನ್ಯವಾಗಿ 'ಗಳು' ಪ್ರತ್ಯಯ ಸೇರಿಸುವ ಮೂಲಕ ಆಗುತ್ತದೆ -- 'ಕುದುರೆ' + 'ಗಳು' = 'ಕುದುರೆಗಳು'."], ["ಕನ್ನಡ: ಕ್ರಿಯಾಪದ", "'ಅವನು ಶಾಲೆಗೆ ಹೋಗುತ್ತಿದ್ದನು' ಎಂಬ ವಾಕ್ಯದಲ್ಲಿರುವ ಕ್ರಿಯಾಪದದ ಕಾಲ ಯಾವುದು?", ["ವರ್ತಮಾನ ಕಾಲ", "ಭೂತ ಕಾಲ", "ಭವಿಷ್ಯತ್ ಕಾಲ", "ಸಂಭಾವನಾರ್ಥ"], 1, "Medium", "'ಹೋಗುತ್ತಿದ್ದನು' ಎಂಬ ಕ್ರಿಯಾಪದ ರೂಪವು ಈಗಾಗಲೇ ಮುಗಿದುಹೋದ ಕ್ರಿಯೆಯನ್ನು (ಹಿಂದೆ ನಡೆಯುತ್ತಿದ್ದ ಕ್ರಿಯೆಯನ್ನು) ಸೂಚಿಸುವುದರಿಂದ ಇದು ಭೂತ ಕಾಲದ ಕ್ರಿಯಾಪದ."], ["ಕನ್ನಡ: ವಿಶೇಷಣ-ವಿಶೇಷ್ಯ", "'ಎತ್ತರವಾದ ಮನುಷ್ಯ ನಡೆದು ಬಂದನು' ಎಂಬ ವಾಕ್ಯದಲ್ಲಿ ವಿಶೇಷ್ಯ ಪದ ಯಾವುದು?", ["ಎತ್ತರವಾದ", "ಮನುಷ್ಯ", "ನಡೆದು", "ಬಂದನು"], 1, "Medium", "ವಿಶೇಷ್ಯ ಎಂದರೆ ವಿಶೇಷಣದಿಂದ ವಿವರಿಸಲ್ಪಡುವ ನಾಮಪದ. ಇಲ್ಲಿ 'ಎತ್ತರವಾದ' ಎಂಬ ವಿಶೇಷಣವು 'ಮನುಷ್ಯ' ಎಂಬ ನಾಮಪದವನ್ನು ವಿವರಿಸುತ್ತಿರುವುದರಿಂದ 'ಮನುಷ್ಯ' ವಿಶೇಷ್ಯ ಪದವಾಗಿದೆ."], ["ಕನ್ನಡ: ಕಾರಕ", "'ರಾಮನು ಬಾಣದಿಂದ ರಾವಣನನ್ನು ಕೊಂದನು' ಎಂಬ ವಾಕ್ಯದಲ್ಲಿ 'ಬಾಣ' ಪದವು ಯಾವ ಕಾರಕಕ್ಕೆ ಸೇರುತ್ತದೆ?", ["ಕರ್ತೃ ಕಾರಕ", "ಕರ್ಮ ಕಾರಕ", "ಕರಣ ಕಾರಕ", "ಸಂಪ್ರದಾನ ಕಾರಕ"], 2, "Medium", "ಕ್ರಿಯೆಯನ್ನು ನೆರವೇರಿಸಲು ಬಳಸಲ್ಪಡುವ ಸಾಧನ ಅಥವಾ ಉಪಕರಣವನ್ನು ಕರಣ ಕಾರಕ ಎನ್ನುತ್ತಾರೆ. ಇಲ್ಲಿ 'ಬಾಣ' ಎಂಬುದು ಕೊಲ್ಲುವ ಕ್ರಿಯೆಗೆ ಬಳಸಿದ ಸಾಧನವಾಗಿರುವುದರಿಂದ ಕರಣ ಕಾರಕ."], ["ಕನ್ನಡ: ವಾಕ್ಯ ತಿದ್ದುಪಡಿ", "ಈ ಕೆಳಗಿನ ವಾಕ್ಯಗಳಲ್ಲಿ ವ್ಯಾಕರಣ ದೃಷ್ಟಿಯಿಂದ ತಪ್ಪಾಗಿರುವ ವಾಕ್ಯವನ್ನು ಗುರುತಿಸಿ.", ["ಹುಡುಗಿಯರು ಶಾಲೆಗೆ ಹೋದರು", "ಹುಡುಗರು ಆಟವಾಡಿದರು", "ಅವಳು ಪುಸ್ತಕವನ್ನು ಓದಿದನು", "ಅವನು ಪತ್ರ ಬರೆದನು"], 2, "Medium", "ಕರ್ತೃ ಮತ್ತು ಕ್ರಿಯಾಪದದ ಲಿಂಗ ಹೊಂದಾಣಿಕೆ ಸರಿಯಾಗಿರಬೇಕು. 'ಅವಳು' (ಸ್ತ್ರೀಲಿಂಗ ಕರ್ತೃ) ಇದ್ದಾಗ ಕ್ರಿಯಾಪದವೂ ಸ್ತ್ರೀಲಿಂಗ ರೂಪದಲ್ಲಿರಬೇಕು ('ಓದಿದಳು'), ಆದರೆ ಇಲ್ಲಿ ಪುಲ್ಲಿಂಗ ರೂಪ 'ಓದಿದನು' ಬಳಸಿರುವುದರಿಂದ ಈ ವಾಕ್ಯ ತಪ್ಪಾಗಿದೆ."], ["ಕನ್ನಡ: ವಾಕ್ಯ ರಚನೆ", "ಈ ಕೆಳಗಿನ ಪದಗಳನ್ನು ಸರಿಯಾದ ಕ್ರಮದಲ್ಲಿ ಜೋಡಿಸಿ ಅರ್ಥಪೂರ್ಣ ವಾಕ್ಯ ರಚಿಸಿ:\na. ಶಾಲೆಗೆ\nb. ಮಕ್ಕಳು\nc. ಹೋದರು\nd. ಬೆಳಿಗ್ಗೆ\nಸರಿಯಾದ ಕ್ರಮವನ್ನು ಆಯ್ಕೆಮಾಡಿ:", ["d-b-a-c", "b-a-d-c", "a-b-c-d", "d-a-b-c"], 0, "Medium", "ಕನ್ನಡ ವಾಕ್ಯ ರಚನೆಯ ಸಾಮಾನ್ಯ ಕ್ರಮ ಕಾಲ-ಕರ್ತೃ-ಸ್ಥಳ-ಕ್ರಿಯಾಪದ ಆಗಿರುವುದರಿಂದ, 'ಬೆಳಿಗ್ಗೆ ಮಕ್ಕಳು ಶಾಲೆಗೆ ಹೋದರು' (d-b-a-c) ಎಂಬುದು ಅರ್ಥಪೂರ್ಣ ಮತ್ತು ವ್ಯಾಕರಣಬದ್ಧವಾದ ವಾಕ್ಯ."], ["ಕನ್ನಡ: ಖಾಲಿ ಜಾಗ", "ಸೂಕ್ತ ಪದವನ್ನು ಆಯ್ಕೆಮಾಡಿ ಖಾಲಿ ಜಾಗ ತುಂಬಿರಿ:\n'ಅವನು ಕಷ್ಟಪಟ್ಟು ಓದಿದ ಕಾರಣ ______ ಉತ್ತೀರ್ಣನಾದನು.'", ["ಪರೀಕ್ಷೆಯಲ್ಲಿ", "ಪರೀಕ್ಷೆಗೆ", "ಪರೀಕ್ಷೆಯಿಂದ", "ಪರೀಕ್ಷೆಯ"], 0, "Medium", "'ಉತ್ತೀರ್ಣನಾಗು' ಎಂಬ ಕ್ರಿಯಾಪದದೊಂದಿಗೆ ಸಾಮಾನ್ಯವಾಗಿ ಸಪ್ತಮೀ ವಿಭಕ್ತಿ ಪ್ರತ್ಯಯ 'ಅಲ್ಲಿ' ಬಳಕೆಯಾಗುತ್ತದೆ -- 'ಪರೀಕ್ಷೆಯಲ್ಲಿ ಉತ್ತೀರ್ಣನಾದನು' ಎಂಬುದು ಸೂಕ್ತ ಬಳಕೆ."], ["ಕನ್ನಡ: ಪರ್ಯಾಯ ಪದಗಳು", "'ಸಮುದ್ರ' ಪದಕ್ಕೆ ಪರ್ಯಾಯ ಪದವಲ್ಲದ್ದನ್ನು ಗುರುತಿಸಿ.", ["ಸಾಗರ", "ಜಲಧಿ", "ವಾರಿಧಿ", "ಸರೋವರ"], 3, "Medium", "ಸಾಗರ, ಜಲಧಿ ಮತ್ತು ವಾರಿಧಿ ಇವೆಲ್ಲವೂ 'ಸಮುದ್ರ'ಕ್ಕೆ ಪರ್ಯಾಯ ಪದಗಳಾಗಿವೆ. ಆದರೆ 'ಸರೋವರ' ಎಂದರೆ ಸಣ್ಣ ಜಲಾಶಯ/ಕೆರೆ ಎಂಬ ಅರ್ಥ ಬರುವುದರಿಂದ ಇದು ಸಮುದ್ರದ ಪರ್ಯಾಯ ಪದವಲ್ಲ."], ["ಕನ್ನಡ: ವಿರುದ್ಧಾರ್ಥಕ ಪದ", "'ಉದಾರ' ಪದಕ್ಕೆ ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಯಾವುದು?", ["ಜಿಪುಣ", "ಶ್ರೀಮಂತ", "ದಾನಿ", "ಔದಾರ್ಯ"], 0, "Medium", "'ಉದಾರ' ಎಂದರೆ ಧಾರಾಳವಾಗಿ ಕೊಡುವ ಗುಣವುಳ್ಳವನು; ಇದಕ್ಕೆ ವಿರುದ್ಧಾರ್ಥಕ ಪದ 'ಜಿಪುಣ' (ಕಂಜೂಸ್), ಅಂದರೆ ಹಣ/ವಸ್ತು ಕೊಡಲು ಹಿಂಜರಿಯುವವನು."], ["ಕನ್ನಡ: ತತ್ಸಮ-ತದ್ಭವ", "'ಪುಸ್ತಕ' ಎಂಬ ತತ್ಸಮ ಪದಕ್ಕೆ ಸರಿಯಾದ ತದ್ಭವ ರೂಪ ಯಾವುದು?", ["ಪೊತ್ತಗೆ", "ಪುಸ್ತಗ", "ಪೊತ್ತಿಗೆ", "ಪುಸ್ತಿಕೆ"], 0, "Hard", "ಸಂಸ್ಕೃತದಿಂದ ಕನ್ನಡಕ್ಕೆ ಬಂದು ಧ್ವನಿ ಬದಲಾವಣೆ ಹೊಂದಿದ ಪದಗಳನ್ನು ತದ್ಭವ ಪದಗಳೆನ್ನುತ್ತಾರೆ. 'ಪುಸ್ತಕ' ಎಂಬ ತತ್ಸಮ ಪದದ ಪ್ರಚಲಿತ ತದ್ಭವ ರೂಪ 'ಪೊತ್ತಗೆ' ಆಗಿದೆ."], ["ಕನ್ನಡ: ತತ್ಸಮ-ತದ್ಭವ", "ಈ ಕೆಳಗಿನ ಜೋಡಿಗಳಲ್ಲಿ ತಪ್ಪಾಗಿ ಹೊಂದಿಸಲಾದ ತತ್ಸಮ-ತದ್ಭವ ಜೋಡಿಯನ್ನು ಗುರುತಿಸಿ.", ["ಅಗ್ನಿ - ಅಗ್ಗಿ", "ಸ್ತಂಭ - ಕಂಬ", "ರಾತ್ರಿ - ಇರುಳು", "ಆಶ್ಚರ್ಯ - ಅಚ್ಚರಿ"], 2, "Hard", "'ಇರುಳು' ಎಂಬುದು ಅಚ್ಚಗನ್ನಡ (ದೇಶ್ಯ) ಪದವೇ ಹೊರತು 'ರಾತ್ರಿ' ಎಂಬ ಸಂಸ್ಕೃತ ತತ್ಸಮ ಪದದ ತದ್ಭವ ರೂಪವಲ್ಲ. ಉಳಿದ ಮೂರು ಜೋಡಿಗಳು (ಅಗ್ನಿ-ಅಗ್ಗಿ, ಸ್ತಂಭ-ಕಂಬ, ಆಶ್ಚರ್ಯ-ಅಚ್ಚರಿ) ಸರಿಯಾದ ತತ್ಸಮ-ತದ್ಭವ ಜೋಡಿಗಳಾಗಿವೆ."], ["ಕನ್ನಡ: ಗಾದೆ", "'ಆರಂಭಶೂರತ್ವ' ಎಂಬ ನುಡಿಗಟ್ಟು ಯಾವ ಗುಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ?", ["ಕೆಲಸವನ್ನು ಉತ್ಸಾಹದಿಂದ ಆರಂಭಿಸಿ ಮಧ್ಯದಲ್ಲೇ ಕೈಬಿಡುವುದು", "ಕೆಲಸವನ್ನು ಕೊನೆಯವರೆಗೂ ಶ್ರದ್ಧೆಯಿಂದ ಮಾಡುವುದು", "ಇತರರ ಸಹಾಯ ಪಡೆದು ಕೆಲಸ ಮಾಡುವುದು", "ಕೆಲಸ ಮಾಡುವ ಮೊದಲೇ ಯೋಜನೆ ರೂಪಿಸುವುದು"], 0, "Medium", "'ಆರಂಭಶೂರತ್ವ' ಎಂದರೆ ಕೆಲಸವನ್ನು ಬಹಳ ಉತ್ಸಾಹ ಮತ್ತು ಆಡಂಬರದಿಂದ ಆರಂಭಿಸಿ, ಆದರೆ ಅದನ್ನು ಪೂರ್ಣಗೊಳಿಸದೆ ಮಧ್ಯದಲ್ಲೇ ಕೈಬಿಡುವ ಪ್ರವೃತ್ತಿಯನ್ನು ಟೀಕಿಸುವ ನುಡಿಗಟ್ಟು."], ["ಕನ್ನಡ: ನುಡಿಗಟ್ಟು", "'ಕೈ ಕೆಸರಾದರೆ ಬಾಯಿ ಮೊಸರು' ಎಂಬ ಗಾದೆಯ ತಾತ್ಪರ್ಯವೇನು?", ["ಶ್ರಮಪಟ್ಟು ದುಡಿದರೆ ಮಾತ್ರ ಫಲ ಸಿಗುತ್ತದೆ", "ಎಲ್ಲ ಕೆಲಸಗಳೂ ಸುಲಭವಾಗಿ ಆಗುತ್ತವೆ", "ಇತರರ ಸಹಾಯದಿಂದ ಮಾತ್ರ ಜೀವನ ಸಾಗುತ್ತದೆ", "ಕೆಲಸ ಮಾಡದೆ ಇರುವುದೇ ಒಳ್ಳೆಯದು"], 0, "Medium", "ಈ ಗಾದೆ, ಕೈಗಳು ಕೊಳೆಯಾಗುವಷ್ಟು (ಕೆಸರಾಗುವಷ್ಟು) ಶ್ರಮಪಟ್ಟು ದುಡಿದಾಗ ಮಾತ್ರ ಒಳ್ಳೆಯ ಫಲ (ಬಾಯಿಗೆ ಮೊಸರು) ದೊರೆಯುತ್ತದೆ ಎಂಬ ಅರ್ಥದಲ್ಲಿ ಶ್ರಮದ ಮಹತ್ವವನ್ನು ಸಾರುತ್ತದೆ."], ["ಕನ್ನಡ: ಶಬ್ದಸಂಪತ್ತು", "'ಅಜ್ಞಾತ' ಪದದ ಅರ್ಥವೇನು?", ["ತಿಳಿಯದಿರುವ", "ತಿಳಿದಿರುವ", "ವಿದ್ವಾಂಸ", "ಮೂಢ"], 0, "Medium", "'ಅಜ್ಞಾತ' ಎಂದರೆ ತಿಳಿಯದಿರುವ ಅಥವಾ ಅಪರಿಚಿತವಾದುದು ಎಂಬ ಅರ್ಥ; 'ಜ್ಞಾತ' ಎಂದರೆ ತಿಳಿದಿರುವುದು ಎಂಬರ್ಥ ಬರುತ್ತದೆ, 'ಅ' ಎಂಬ ನಿಷೇಧಾರ್ಥಕ ಉಪಸರ್ಗ ಸೇರಿ 'ಅಜ್ಞಾತ' ಆಗುತ್ತದೆ."], ["ಕನ್ನಡ: ಸೂಕ್ತ ಪದದ ಆಯ್ಕೆ", "ಸೂಕ್ತ ಪದವನ್ನು ಆಯ್ಕೆಮಾಡಿ:\n'ಈ ಸಮಸ್ಯೆಗೆ ______ ಪರಿಹಾರ ಕಂಡುಹಿಡಿಯಬೇಕು.'", ["ಶಾಶ್ವತವಾದ", "ಶಾಶ್ವತ", "ಶಶ್ವತ", "ಶಾಶತ"], 0, "Medium", "'ಶಾಶ್ವತವಾದ' ಎಂಬುದು ಸರಿಯಾದ ವಿಶೇಷಣ ರೂಪ ('ಪರಿಹಾರ' ಎಂಬ ನಾಮಪದವನ್ನು ವಿವರಿಸಲು); ಉಳಿದ ಪದಗಳು ಒಂದೋ ತಪ್ಪಾದ ಕಾಗುಣಿತ ಅಥವಾ ಈ ಸಂದರ್ಭಕ್ಕೆ ಸೂಕ್ತವಲ್ಲದ ರೂಪಗಳಾಗಿವೆ."], ["ಕನ್ನಡ: ಸಾಹಿತ್ಯ", "ಆಧುನಿಕ ಕನ್ನಡ ಸಾಹಿತ್ಯದಲ್ಲಿ 'ರಾಷ್ಟ್ರಕವಿ' ಎಂಬ ಬಿರುದಿಗೆ ಪಾತ್ರರಾದ ಕುವೆಂಪು ಅವರಿಗೆ ಜ್ಞಾನಪೀಠ ಪ್ರಶಸ್ತಿ ಯಾವ ಕೃತಿಗಾಗಿ ಲಭಿಸಿತು?", ["ಮಲೆಗಳಲ್ಲಿ ಮದುಮಗಳು", "ಶ್ರೀ ರಾಮಾಯಣ ದರ್ಶನಂ", "ಕಾನೂರು ಹೆಗ್ಗಡತಿ", "ಚಂದ್ರಹಾಸ"], 1, "Medium", "ಕುವೆಂಪು ಅವರ ಮಹಾಕಾವ್ಯ 'ಶ್ರೀ ರಾಮಾಯಣ ದರ್ಶನಂ' ಕೃತಿಗಾಗಿ 1968ರಲ್ಲಿ ಅವರಿಗೆ ಜ್ಞಾನಪೀಠ ಪ್ರಶಸ್ತಿ ಲಭಿಸಿತು -- ಕನ್ನಡಕ್ಕೆ ಈ ಪ್ರಶಸ್ತಿ ಬಂದ ಮೊದಲ ಸಂದರ್ಭವಿದು."], ["ಕನ್ನಡ: ಸಾಹಿತ್ಯ", "'ಚೋಮನ ದುಡಿ' ಮತ್ತು 'ಮರಳಿ ಮಣ್ಣಿಗೆ' ಕಾದಂಬರಿಗಳ ಕರ್ತೃ ಯಾರು?", ["ಶಿವರಾಮ ಕಾರಂತ", "ಎಸ್.ಎಲ್. ಭೈರಪ್ಪ", "ದ.ರಾ. ಬೇಂದ್ರೆ", "ಗಿರೀಶ್ ಕಾರ್ನಾಡ್"], 0, "Medium", "ಶಿವರಾಮ ಕಾರಂತರು ಬಹುಮುಖ ಪ್ರತಿಭೆಯ ಕನ್ನಡ ಸಾಹಿತಿಯಾಗಿದ್ದು, 'ಚೋಮನ ದುಡಿ' ಮತ್ತು 'ಮರಳಿ ಮಣ್ಣಿಗೆ' ಇವರ ಪ್ರಸಿದ್ಧ ಕಾದಂಬರಿಗಳಾಗಿವೆ; ಅವರಿಗೆ 1977ರಲ್ಲಿ ಜ್ಞಾನಪೀಠ ಪ್ರಶಸ್ತಿ ಲಭಿಸಿತು."], ["ಕನ್ನಡ: ಸಾಹಿತ್ಯ", "ಕನ್ನಡದ ಆದಿಕವಿ ಎಂದು ಪ್ರಸಿದ್ಧರಾದ ಪಂಪ ಯಾವ ಅರಸನ ಆಸ್ಥಾನ ಕವಿಯಾಗಿದ್ದರು?", ["ಎರಡನೇ ಚಾಳುಕ್ಯ ಅರಿಕೇಸರಿ", "ಒಂದನೇ ಚಾಲುಕ್ಯ ಪುಲಕೇಶಿ", "ಅಮೋಘವರ್ಷ ನೃಪತುಂಗ", "ಇಮ್ಮಡಿ ಪುಲಿಕೇಶಿ"], 0, "Hard", "ಪಂಪ ಚಾಲುಕ್ಯ ವಂಶದ ಎರಡನೇ ಅರಿಕೇಸರಿಯ ಆಸ್ಥಾನ ಕವಿಯಾಗಿದ್ದು, ಅವನ ಗೌರವಾರ್ಥ 'ವಿಕ್ರಮಾರ್ಜುನ ವಿಜಯ' (ಪಂಪಭಾರತ) ಎಂಬ ಕೃತಿಯನ್ನು ರಚಿಸಿದನು."], ["ಕನ್ನಡ: ಸಾಹಿತ್ಯ", "ಈ ಕೆಳಗಿನ ಕೃತಿ ಮತ್ತು ಕರ್ತೃಗಳ ಜೋಡಿಗಳಲ್ಲಿ ತಪ್ಪಾಗಿ ಹೊಂದಿಸಿರುವುದನ್ನು ಗುರುತಿಸಿ.", ["ಸಂಸ್ಕಾರ - ಯು.ಆರ್. ಅನಂತಮೂರ್ತಿ", "ಪರ್ವ - ಎಸ್.ಎಲ್. ಭೈರಪ್ಪ", "ನಾಕುತಂತಿ - ದ.ರಾ. ಬೇಂದ್ರೆ", "ಕಾನೂರು ಹೆಗ್ಗಡತಿ - ಶಿವರಾಮ ಕಾರಂತ"], 3, "Hard", "'ಕಾನೂರು ಹೆಗ್ಗಡತಿ' ಕಾದಂಬರಿಯ ಕರ್ತೃ ಕುವೆಂಪು ಅವರೇ ಹೊರತು ಶಿವರಾಮ ಕಾರಂತರಲ್ಲ; ಉಳಿದ ಮೂರು ಜೋಡಿಗಳಾದ ಸಂಸ್ಕಾರ (ಯು.ಆರ್. ಅನಂತಮೂರ್ತಿ), ಪರ್ವ (ಎಸ್.ಎಲ್. ಭೈರಪ್ಪ) ಮತ್ತು ನಾಕುತಂತಿ (ದ.ರಾ. ಬೇಂದ್ರೆ) ಸರಿಯಾಗಿ ಹೊಂದಿಕೆಯಾಗಿವೆ."], ["ಕನ್ನಡ: ವ್ಯಾಕರಣ", "'ಸೂರ್ಯ ಉದಯಿಸಿದನು ಮತ್ತು ಪಕ್ಷಿಗಳು ಹಾಡತೊಡಗಿದವು' ಈ ವಾಕ್ಯ ಯಾವ ಬಗೆಯ ವಾಕ್ಯ?", ["ಸರಳ ವಾಕ್ಯ", "ಸಂಯುಕ್ತ ವಾಕ್ಯ", "ಮಿಶ್ರ ವಾಕ್ಯ", "ಆಶ್ಚರ್ಯಸೂಚಕ ವಾಕ್ಯ"], 1, "Medium", "'ಮತ್ತು' ಎಂಬ ಸಮುಚ್ಚಯ ಅವ್ಯಯದಿಂದ ಎರಡು ಸ್ವತಂತ್ರ, ಸಮಾನ ಪ್ರಾಮುಖ್ಯತೆಯ ವಾಕ್ಯಗಳು ಜೋಡಣೆಗೊಂಡಾಗ ಅದನ್ನು ಸಂಯುಕ್ತ ವಾಕ್ಯ ಎನ್ನುತ್ತಾರೆ."], ["ಕನ್ನಡ: ವ್ಯಾಕರಣ", "ಈ ಕೆಳಗಿನವುಗಳಲ್ಲಿ ಸರ್ವನಾಮವನ್ನು ಗುರುತಿಸಿ.", ["ಸುಂದರ", "ಅವನು", "ಓಡಿದನು", "ಮನೆ"], 1, "Easy", "ನಾಮಪದದ ಬದಲಿಗೆ ಬಳಸಲ್ಪಡುವ ಪದವನ್ನು ಸರ್ವನಾಮ ಎನ್ನುತ್ತಾರೆ. 'ಅವನು' ಎಂಬುದು ಒಬ್ಬ ವ್ಯಕ್ತಿಯ ಹೆಸರಿನ ಬದಲಿಗೆ ಬಳಸುವ ಸರ್ವನಾಮ ಪದ; ಉಳಿದವು ವಿಶೇಷಣ, ಕ್ರಿಯಾಪದ ಮತ್ತು ನಾಮಪದಗಳಾಗಿವೆ."], ["ಕನ್ನಡ: ಅವಗಾಹನೆ", "ಈ ಕೆಳಗಿನ ಗದ್ಯಭಾಗವನ್ನು ಓದಿ ಪ್ರಶ್ನೆಗೆ ಉತ್ತರಿಸಿ:\n'ಗ್ರಾಮೀಣ ಪ್ರದೇಶಗಳಲ್ಲಿ ಇಂದಿಗೂ ನೀರಿನ ಸಮಸ್ಯೆ ಗಂಭೀರವಾಗಿದೆ. ಬೇಸಿಗೆಯಲ್ಲಿ ಮಹಿಳೆಯರು ಮತ್ತು ಮಕ್ಕಳು ದೂರದ ಊರುಗಳಿಂದ ನೀರು ಹೊತ್ತು ತರುವ ದೃಶ್ಯಗಳು ಸಾಮಾನ್ಯವಾಗಿವೆ. ಸರ್ಕಾರ ಕುಡಿಯುವ ನೀರಿನ ಯೋಜನೆಗಳನ್ನು ಜಾರಿಗೆ ತಂದರೂ, ಅವುಗಳ ಸಮರ್ಪಕ ನಿರ್ವಹಣೆ ಕೊರತೆಯಿಂದಾಗಿ ಸಮಸ್ಯೆ ಮುಂದುವರೆದಿದೆ.'\nಈ ಪ್ಯಾರಾಗ್ರಾಫ್‌ನ ಮುಖ್ಯ ಆಶಯ ಏನು?", ["ಗ್ರಾಮೀಣ ಪ್ರದೇಶಗಳಲ್ಲಿ ಶಿಕ್ಷಣದ ಕೊರತೆ", "ಗ್ರಾಮೀಣ ಪ್ರದೇಶಗಳ ನೀರಿನ ಸಮಸ್ಯೆ ಮತ್ತು ಯೋಜನೆಗಳ ನಿರ್ವಹಣಾ ಕೊರತೆ", "ನಗರ ಪ್ರದೇಶಗಳ ಸಂಚಾರ ದಟ್ಟಣೆ", "ಮಹಿಳೆಯರ ಉದ್ಯೋಗಾವಕಾಶಗಳ ಕೊರತೆ"], 1, "Medium", "ಗದ್ಯಭಾಗವು ಗ್ರಾಮೀಣ ಪ್ರದೇಶಗಳಲ್ಲಿ ಇನ್ನೂ ಮುಂದುವರೆದಿರುವ ಕುಡಿಯುವ ನೀರಿನ ಸಮಸ್ಯೆಯ ಬಗ್ಗೆಯೂ ಮತ್ತು ಸರ್ಕಾರಿ ಯೋಜನೆಗಳ ನಿರ್ವಹಣಾ ಕೊರತೆಯ ಬಗ್ಗೆಯೂ ಕೇಂದ್ರೀಕರಿಸಿದೆ."], ["ಕನ್ನಡ: ಅವಗಾಹನೆ", "ಮೇಲಿನ ಗದ್ಯಭಾಗದ ಪ್ರಕಾರ, ನೀರಿನ ಸಮಸ್ಯೆ ಮುಂದುವರೆಯಲು ಮುಖ್ಯ ಕಾರಣ ಏನು?", ["ಮಳೆಯ ಸಂಪೂರ್ಣ ಕೊರತೆ", "ಸರ್ಕಾರಿ ಯೋಜನೆಗಳ ಸಮರ್ಪಕ ನಿರ್ವಹಣೆಯ ಕೊರತೆ", "ಜನಸಂಖ್ಯೆ ಹೆಚ್ಚಳ", "ಅರಣ್ಯ ನಾಶ"], 1, "Medium", "ಗದ್ಯಭಾಗದ ಪ್ರಕಾರ, ಸರ್ಕಾರ ಕುಡಿಯುವ ನೀರಿನ ಯೋಜನೆಗಳನ್ನು ಜಾರಿಗೆ ತಂದರೂ ಅವುಗಳ ಸಮರ್ಪಕ ನಿರ್ವಹಣೆಯ ಕೊರತೆಯೇ ಸಮಸ್ಯೆ ಮುಂದುವರೆಯಲು ಪ್ರಮುಖ ಕಾರಣವಾಗಿದೆ ಎಂದು ಸ್ಪಷ್ಟವಾಗಿ ಹೇಳಲಾಗಿದೆ."], ["ಕನ್ನಡ: ಗಾದೆ", "'ಹಾಸಿಗೆ ಇದ್ದಷ್ಟು ಕಾಲು ಚಾಚು' ಎಂಬ ಗಾದೆಯ ತಾತ್ಪರ್ಯ ಏನು?", ["ಇರುವ ಸಂಪನ್ಮೂಲಕ್ಕೆ ಅನುಗುಣವಾಗಿ ಜೀವನ ನಡೆಸಬೇಕು", "ಎಷ್ಟು ಬೇಕಾದರೂ ಖರ್ಚು ಮಾಡಬಹುದು", "ಇತರರ ಸಂಪತ್ತನ್ನು ಅವಲಂಬಿಸಬೇಕು", "ಎಂದೂ ಆಸೆ ಪಡಬಾರದು"], 0, "Medium", "ಈ ಗಾದೆ, ಒಬ್ಬ ವ್ಯಕ್ತಿ ತನ್ನ ಆದಾಯ ಅಥವಾ ಸಂಪನ್ಮೂಲಕ್ಕೆ ಅನುಗುಣವಾಗಿಯೇ ಖರ್ಚು-ವೆಚ್ಚಗಳನ್ನು ಯೋಜಿಸಿಕೊಂಡು ಜೀವನ ನಡೆಸಬೇಕೇ ಹೊರತು ಮಿತಿಮೀರಿ ಖರ್ಚು ಮಾಡಬಾರದು ಎಂಬುದನ್ನು ಸೂಚಿಸುತ್ತದೆ."], ["English: Tenses", "Choose the correctly formed sentence in the Past Perfect Continuous tense:", ["He had been working on the project since morning.", "He has been working on the project since morning.", "He was working on the project since morning.", "He is working on the project since morning."], 0, "Medium", "The Past Perfect Continuous tense ('had been' + verb-ing) describes an action that had been continuing before another point in the past, and is correctly formed as 'He had been working...'"], ["English: Articles", "Fill in the blank with the correct article: '___ MLA visited ___ orphanage located near ___ Bengaluru airport.'", ["An; an; the", "A; an; the", "An; an; a", "A; an; a"], 0, "Hard", "The article depends on the initial SOUND, not the letter. 'MLA' is pronounced starting with the vowel sound 'em', so it takes 'An'. 'Orphanage' begins with the vowel sound 'or-', also taking 'an'. 'Bengaluru airport' refers to one particular, specific airport, so it takes the definite article 'the'."], ["English: Subject-Verb Agreement", "Choose the grammatically correct sentence:", ["Neither the manager nor the employees was informed about the change.", "Neither the manager nor the employees were informed about the change.", "Neither the manager nor the employees is informed about the change.", "Neither the manager nor the employees has been informed about the change."], 1, "Hard", "When a subject is joined by 'neither...nor', the verb agrees with the noun nearer to it. Since 'employees' (plural) is nearer to the verb here, the plural verb 'were' is correct."], ["English: Voice", "Choose the correct passive voice of: 'They have completed the survey.'", ["The survey has been completed by them.", "The survey was completed by them.", "The survey is completed by them.", "The survey had been completed by them."], 0, "Medium", "Since the active sentence is in the Present Perfect tense ('have completed'), the passive voice must also be in the Present Perfect tense: 'has been completed'."], ["English: Narration", "Choose the correct indirect speech for: The teacher said to the students, 'Do not make noise in the class.'", ["The teacher told the students not to make noise in the class.", "The teacher told the students that do not make noise in the class.", "The teacher said the students not making noise in the class.", "The teacher requested the students not to made noise in the class."], 0, "Medium", "When converting a negative imperative sentence to indirect speech, the reporting verb typically changes to 'told/ordered/advised' followed by 'not to' + base verb -- giving 'told the students not to make noise in the class.'"], ["English: Conditionals", "Choose the correct sentence using the Second Conditional:", ["If I win the lottery, I will buy a house.", "If I won the lottery, I would buy a house.", "If I had won the lottery, I would have bought a house.", "If I win the lottery, I would buy a house."], 1, "Medium", "The Second Conditional describes an unreal or unlikely present/future situation and is formed as 'If + past simple, would + base verb' -- giving 'If I won the lottery, I would buy a house.'"], ["English: Prepositions", "Choose the correct preposition: 'The committee is divided ___ the issue of fee hike.'", ["in", "on", "of", "for"], 1, "Medium", "The correct idiomatic collocation is 'divided on an issue', meaning having differing opinions regarding it -- the other prepositions do not fit this fixed usage."], ["English: Error Spotting", "Identify the segment with an error in the following sentence:\n'Each of the candidates / were given / a copy of the / question paper.'", ["Each of the candidates", "were given", "a copy of the", "question paper"], 1, "Medium", "'Each' is a singular indefinite pronoun and must be followed by a singular verb form; the correct form is 'was given', not 'were given', regardless of the plural noun 'candidates' that follows 'of'."], ["English: Sentence Improvement", "Improve the underlined part of the sentence: 'She is one of the students who has passed the exam with distinction.'", ["has passed", "have passed", "had passed", "having passed"], 1, "Hard", "In the pattern 'one of the [plural noun] who...', the relative pronoun 'who' refers back to the plural noun ('students'), so the verb must agree in the plural: 'have passed', not 'has passed'."], ["English: Cloze Test", "Choose the most appropriate word for the blank:\n'Despite ______ preparation, he could not clear the interview.'", ["thorough", "through", "threw", "thoroughly"], 0, "Medium", "'Thorough' means complete and careful, correctly modifying the noun 'preparation'. 'Through' is a preposition, 'threw' is the past tense of 'throw', and 'thoroughly' is an adverb, none of which fit grammatically before a noun in this context."], ["English: Jumbled Sentences", "Rearrange the following parts to form a meaningful sentence:\nP. despite repeated warnings\nQ. continued to dump waste\nR. into the river\nS. the factory\nSelect the correct sequence:", ["S-Q-R-P", "P-S-Q-R", "S-P-Q-R", "Q-S-P-R"], 0, "Medium", "The logically ordered sentence is: 'The factory (S) continued to dump waste (Q) into the river (R) despite repeated warnings (P)', giving the sequence S-Q-R-P."], ["English: Vocabulary", "Choose the word most nearly SIMILAR in meaning to 'METICULOUS':", ["Careless", "Painstaking", "Hasty", "Indifferent"], 1, "Medium", "'Meticulous' means showing great attention to detail and being very careful and precise; 'Painstaking' is its closest synonym, while 'Careless' and 'Hasty' are closer to its opposites."], ["English: Vocabulary", "Choose the word most nearly OPPOSITE in meaning to 'RETICENT':", ["Reserved", "Talkative", "Silent", "Shy"], 1, "Medium", "'Reticent' means reluctant to speak or reveal one's thoughts; its opposite is 'Talkative', meaning inclined to talk a great deal. 'Reserved', 'Silent' and 'Shy' are closer in meaning to reticent, not opposite."], ["English: One Word Substitution", "Choose the one word that means 'a person who looks on the bright side of things':", ["Optimist", "Pessimist", "Cynic", "Realist"], 0, "Medium", "An 'Optimist' is a person who tends to expect the best possible outcome and looks on the bright/hopeful side of situations, as opposed to a 'Pessimist' who expects the worst."], ["English: Idioms", "The idiom 'to leave no stone unturned' means:", ["To make every possible effort", "To destroy something completely", "To give up on a task", "To hide important information"], 0, "Medium", "'To leave no stone unturned' means to try every possible way of achieving something, i.e., making every possible effort to succeed at a task."], ["English: Phrasal Verbs", "Choose the correct meaning of the phrasal verb 'call off' in the sentence: 'The organisers had to call off the event due to heavy rain.'", ["Postpone the event to a later date", "Cancel the event", "Rename the event", "Relocate the event to another venue"], 1, "Medium", "'Call off' means to cancel a planned event or activity -- in this context, the heavy rain forced the organisers to cancel the event altogether, not merely postpone or relocate it."], ["English: Spelling", "Identify the correctly spelled word:", ["Neccessary", "Necessary", "Nesessary", "Neccesary"], 1, "Medium", "The correct spelling is 'Necessary' -- with a single 'c', a double 's', and no double 'c' before the 'e'."], ["English: Vocabulary in Context", "In the sentence 'The minister's speech was full of platitudes and lacked any real substance', the word 'platitudes' most nearly means:", ["Deeply original ideas", "Trite, overused remarks", "Statistical data", "Personal anecdotes"], 1, "Medium", "A 'platitude' is a remark or statement, especially one with a moral content, that has been used too often to be interesting or thoughtful -- i.e., a trite or overused comment, which fits the critical tone of the sentence."], ["English: Error Spotting", "In the following sentence, find the part which has an error. If there is no error, select 'No error'.\n'The manager along with his team / were present / at the annual meeting / held last week. / No error'", ["The manager along with his team", "were present", "at the annual meeting held last week.", "No error"], 1, "Hard", "When a subject is followed by phrases like 'along with', 'as well as', or 'together with', the verb agrees with the main subject ('the manager', singular), not with the noun in the accompanying phrase -- so the correct form is 'was present', not 'were present'."], ["English: Comprehension", "Read the following passage and answer the questions that follow:\n'Renewable energy sources such as solar and wind power are increasingly being adopted across the world as concerns over climate change intensify. Unlike fossil fuels, these sources do not deplete over time and produce significantly lower greenhouse gas emissions. However, challenges such as high initial investment costs and the intermittent nature of sunlight and wind continue to limit their widespread adoption, especially in developing economies.'\nWhat is the main idea of the passage?", ["Fossil fuels are cheaper than renewable energy in all circumstances", "Renewable energy is being adopted due to climate concerns, but faces adoption challenges", "Solar and wind power have completely replaced fossil fuels worldwide", "Developing economies have banned the use of renewable energy"], 1, "Medium", "The passage explains that renewable energy adoption is rising due to climate change concerns and the advantages of these sources over fossil fuels, but it also highlights the challenges (cost, intermittency) that still limit their widespread use -- making option 2 the accurate summary."], ["English: Comprehension", "With reference to the same passage on renewable energy, which of the following is stated as a challenge limiting the widespread adoption of solar and wind power?", ["Lack of public awareness about climate change", "High initial investment costs and intermittency of sunlight/wind", "Excessive greenhouse gas emissions from these sources", "Depletion of solar and wind resources over time"], 1, "Medium", "The passage explicitly mentions 'high initial investment costs and the intermittent nature of sunlight and wind' as challenges limiting the widespread adoption of renewable energy, particularly in developing economies."], ["English: Grammar", "Choose the correct question tag for the sentence: 'You have never been to Mysuru before, ___?'", ["haven't you", "have you", "hadn't you", "don't you"], 1, "Medium", "When the main clause contains a negative word ('never'), the question tag must be positive. Since the sentence is in the Present Perfect tense ('have been'), the correct tag is 'have you'."], ["English: Prepositions", "Fill in the blank with the correct preposition: 'The new policy will come ___ effect from the first of next month.'", ["into", "in", "with", "by"], 0, "Medium", "The correct idiomatic collocation is 'come into effect', meaning to begin to apply or operate -- the other prepositions do not fit this fixed phrase."], ["English: Sentence Correction", "Choose the grammatically correct sentence:", ["She is senior than me in the department.", "She is senior to me in the department.", "She is more senior than me in the department.", "She is most senior than me in the department."], 1, "Medium", "Comparative adjectives ending in '-ior' (such as senior, junior, superior, inferior) are followed by 'to', not 'than' -- making 'senior to me' the grammatically correct form."], ["English: Fill in the Blanks", "Fill in the blank: '___ the heavy traffic, we managed to reach the airport on time.'", ["Because", "Despite", "Since", "So that"], 1, "Medium", "'Despite' is used to introduce a contrast, showing that something happened even though there was an obstacle (heavy traffic) -- correctly conveying that they reached on time in spite of the traffic."], ["English: Vocabulary", "Choose the correct meaning of the word 'ephemeral':", ["Lasting for a very short time", "Extremely powerful", "Deeply emotional", "Highly intelligent"], 0, "Medium", "'Ephemeral' means lasting for a very short time; something that is fleeting or transient, such as a rainbow or a mayfly's life."], ["English: Idioms", "Choose the alternative that best expresses the meaning of the idiom 'to hit the nail on the head':", ["To make a serious mistake", "To say or do exactly the right thing", "To cause an injury accidentally", "To waste time on unimportant tasks"], 1, "Medium", "'To hit the nail on the head' means to describe or identify a situation or problem exactly and accurately, i.e., to say or do precisely the right thing."], ["English: Direct-Indirect Speech", "Change the following into Reported Speech: She said, 'I will finish the report by tomorrow.'", ["She said that she will finish the report by tomorrow.", "She said that she would finish the report by the next day.", "She said that she would finish the report by tomorrow.", "She says that she would finish the report by tomorrow."], 1, "Medium", "When converting to indirect speech with a past reporting verb ('said'), 'will' shifts to 'would', and the time expression 'tomorrow' changes to 'the next day' (since the reference point moves to the past) -- giving 'she would finish the report by the next day.'"], ["English: Vocabulary", "Choose the word that is the correct one-word substitute for 'a place where birds are kept':", ["Aviary", "Apiary", "Aquarium", "Sanctuary"], 0, "Medium", "An 'Aviary' is a large enclosure or cage for keeping birds. An 'Apiary' is a place where bees are kept, an 'Aquarium' houses aquatic creatures, and a 'Sanctuary' is a broader protected area for wildlife in general."], ["English: Sentence Rearrangement", "In the following question, six sentences are given. S1 and S6 are fixed. Arrange P, Q, R, S in the correct order:\nS1: The Chief Minister inaugurated the new hospital yesterday.\nP: It is equipped with modern diagnostic facilities.\nQ: The hospital will serve over two lakh residents of the district.\nR: He praised the efforts of the health department in completing the project on time.\nS: Doctors said patient care would improve significantly with the new equipment.\nS6: The hospital is expected to reduce the burden on the district's older facilities.", ["R-P-Q-S", "P-Q-R-S", "R-Q-P-S", "Q-P-S-R"], 0, "Medium", "The most logical sequence is: after the inauguration (S1), the CM praises the department (R), then the hospital's facilities are described (P), followed by the population it will serve (Q), and finally doctors' comments on patient care (S), leading into S6 about reducing the burden -- giving R-P-Q-S."], ["English: Grammar", "Choose the correctly punctuated and grammatically sound sentence:", ["Its raining heavily, so we're staying indoors.", "It's raining heavily, so were staying indoors.", "It's raining heavily, so we're staying indoors.", "Its raining heavily, so were staying indoors."], 2, "Medium", "'It's' is the correct contraction for 'it is', and 'we're' is the correct contraction for 'we are' -- both correctly used with apostrophes in the third option, unlike 'its' (possessive) and 'were' (past tense of 'be'), which are used incorrectly in the other options."], ["English: Vocabulary in Context", "In the sentence 'The negotiations reached an impasse after both parties refused to compromise', the word 'impasse' most nearly means:", ["A quick resolution", "A situation with no way out or progress", "A joyful celebration", "A minor disagreement"], 1, "Medium", "An 'impasse' refers to a situation in which no progress is possible, often because the parties involved will not change their positions -- fitting the context of failed negotiations."], ["English: Error Spotting", "Identify the segment with an error in the following sentence:\n'The number of students who / has enrolled for the / course this year / are quite impressive.'", ["The number of students who", "has enrolled for the", "course this year", "are quite impressive"], 3, "Hard", "'The number of' takes a singular verb ('is'), since 'the number' itself is the subject -- so the correct form is 'is quite impressive', not 'are quite impressive'. (Note: 'A number of students' would instead take a plural verb.)"], ["Computer: Fundamentals", "Which generation of computers is characterised by the use of Integrated Circuits (ICs) in place of transistors?", ["First Generation", "Second Generation", "Third Generation", "Fourth Generation"], 2, "Medium", "Third Generation computers (mid-1960s to early 1970s) used Integrated Circuits (ICs), which replaced the individual transistors used in Second Generation computers, leading to smaller, faster and more reliable machines."], ["Computer: Fundamentals", "Which of the following best distinguishes a 'Supercomputer' from a 'Mainframe computer'?", ["Supercomputers are used only for personal computing tasks", "Supercomputers are designed for extremely high-speed, complex scientific computations, while mainframes are designed for bulk data processing and multi-user transaction handling", "Mainframes are physically smaller than supercomputers", "Supercomputers cannot be networked, unlike mainframes"], 1, "Medium", "Supercomputers are built for extremely intensive, high-speed computations (such as weather modelling or scientific simulations), while mainframe computers are designed for reliable, large-scale processing of bulk transactional and business data for many simultaneous users."], ["Computer: Hardware", "Which component of the CPU is primarily responsible for performing arithmetic and logical operations?", ["Control Unit", "Arithmetic Logic Unit (ALU)", "Cache Memory", "Register File"], 1, "Medium", "The Arithmetic Logic Unit (ALU) is the component of the CPU responsible for performing all arithmetic operations (addition, subtraction, etc.) and logical operations (AND, OR, comparisons, etc.), while the Control Unit manages and coordinates the operations of the entire processor."], ["Computer: Hardware", "Which of the following statements about RAM (Random Access Memory) is correct?", ["RAM is a non-volatile memory that retains data even when power is switched off", "RAM is a volatile memory that loses its stored data when the computer is switched off", "RAM is used exclusively for permanent storage of the operating system", "RAM has a slower access speed than a Hard Disk Drive (HDD)"], 1, "Medium", "RAM is a volatile form of memory, meaning its contents are lost when the power supply is switched off, unlike non-volatile secondary storage such as HDDs or SSDs. RAM is also significantly faster to access than an HDD."], ["Computer: Hardware", "With reference to storage devices, which of the following statements is correct?", ["An SSD (Solid State Drive) has moving mechanical parts, unlike an HDD", "An HDD (Hard Disk Drive) stores data on rotating magnetic platters, while an SSD stores data electronically on flash memory chips with no moving parts", "HDDs are generally faster than SSDs for data access", "SSDs cannot be used as a computer's primary storage device"], 1, "Medium", "An HDD stores data magnetically on spinning platters using a moving read/write head, whereas an SSD stores data electronically on flash memory chips with no moving mechanical parts, making SSDs generally faster and more durable than HDDs."], ["Computer: Hardware", "Which of the following is an example of an input device?", ["Monitor", "Printer", "Scanner", "Speaker"], 2, "Easy", "A Scanner is an input device that converts physical documents or images into digital form for the computer to process. Monitors, Printers and Speakers are all output devices."], ["Computer: Software", "Which of the following correctly distinguishes System Software from Application Software?", ["System software directly performs user-specific tasks like word processing, while application software manages hardware resources", "System software manages and controls computer hardware and provides a platform for other software to run, while application software is designed to perform specific user tasks", "Application software always runs before system software during boot-up", "System software cannot be updated once installed"], 1, "Medium", "System software (such as the operating system) manages and controls the computer's hardware resources and provides a platform on which application software runs; application software (such as MS Word or a browser) is designed to help users perform specific tasks."], ["Computer: Operating System", "In a typical Windows operating system, which utility allows a user to view and manage currently running processes, monitor CPU/memory usage, and forcibly close unresponsive applications?", ["File Explorer", "Control Panel", "Task Manager", "Disk Cleanup"], 2, "Medium", "Task Manager in Windows provides real-time information about running processes, applications, and system resource usage (CPU, memory, disk), and allows users to end tasks that have become unresponsive."], ["Computer: Operating System", "Which of the following file extensions correctly represents a Microsoft Excel workbook in modern (post-2007) versions of MS Office?", [".doc", ".xlsx", ".pptx", ".txt"], 1, "Easy", "'.xlsx' is the file extension used for Microsoft Excel workbooks in the modern XML-based Office Open XML format, introduced from MS Office 2007 onwards, replacing the older '.xls' format."], ["Computer: Operating System", "Consider the following statements regarding a computer's Control Panel in Windows:\n1. It allows users to change system settings such as date/time, user accounts, and network configurations.\n2. It is used exclusively for installing new application software and cannot modify existing system settings.\nWhich of the statements given above is/are correct?", ["Only 1", "Only 2", "Both 1 and 2", "Neither 1 nor 2"], 0, "Medium", "The Control Panel allows users to view and change a wide range of system settings, including date/time, user accounts, hardware and network configurations, making statement 1 correct. However, it is not used exclusively for installing new software, and it certainly can modify existing settings, making statement 2 incorrect."], ["Computer: MS Word", "Which feature in MS Word allows a user to send a personalised copy of the same letter to multiple recipients by merging a main document with a data source?", ["Track Changes", "Mail Merge", "AutoCorrect", "Find and Replace"], 1, "Medium", "Mail Merge allows a user to combine a main document (such as a letter template) with a data source (such as a list of names and addresses) to automatically generate multiple personalised copies of the document."], ["Computer: MS Word", "In MS Word, which keyboard shortcut is used to apply 'Bold' formatting to selected text?", ["Ctrl + I", "Ctrl + U", "Ctrl + B", "Ctrl + P"], 2, "Easy", "Ctrl + B is the standard keyboard shortcut in MS Word (and most word processors) to apply or remove Bold formatting to selected text. Ctrl+I is for Italic, Ctrl+U for Underline, and Ctrl+P for Print."], ["Computer: MS Excel", "In MS Excel, which of the following formulas would correctly calculate the average of the values in cells B2 through B10?", ["=AVERAGE(B2:B10)", "=SUM(B2:B10)/9", "=AVERAGE(B2,B10)", "=MEAN(B2:B10)"], 0, "Medium", "The AVERAGE function directly computes the arithmetic mean of a specified range of cells; '=AVERAGE(B2:B10)' correctly calculates the average of all values from B2 to B10. 'MEAN' is not a valid Excel function name, and '=AVERAGE(B2,B10)' would only average the two endpoint cells, not the entire range."], ["Computer: MS Excel", "In MS Excel, what does the cell reference '$B$5' represent?", ["A relative cell reference that changes when copied to another cell", "An absolute cell reference that remains fixed to column B, row 5, even when copied", "A reference to an entire column B", "A reference that is invalid in Excel"], 1, "Medium", "The dollar signs ('$') before both the column letter and row number make '$B$5' an absolute cell reference, meaning it will always refer to column B, row 5, regardless of where the formula containing it is copied."], ["Computer: MS PowerPoint", "In MS PowerPoint, the visual effect applied when moving from one slide to the next during a presentation is called a:", ["Animation", "Transition", "Template", "Master Slide"], 1, "Medium", "A 'Transition' in PowerPoint is the visual effect (such as fade, wipe, or dissolve) that occurs when moving from one slide to the next, whereas 'Animation' refers to effects applied to individual objects within a single slide."], ["Computer: Internet", "Which of the following statements about the World Wide Web (WWW) is correct?", ["The WWW and the Internet are exactly the same thing", "The WWW is a system of interlinked hypertext documents accessed via the Internet, using protocols such as HTTP", "The WWW was invented before the Internet", "The WWW requires no internet connectivity to function"], 1, "Medium", "The World Wide Web (WWW) is a specific information system of interlinked hypertext documents and resources, accessed over the Internet using protocols like HTTP/HTTPS. The Internet itself is the broader underlying network infrastructure that the Web (along with email, etc.) runs on -- so the WWW and the Internet are not identical, and the WWW (invented by Tim Berners-Lee in 1989) came after the Internet."], ["Computer: Internet", "Which of the following best describes the difference between HTTP and HTTPS?", ["HTTP and HTTPS are identical in every respect", "HTTPS is an encrypted, more secure version of HTTP that uses SSL/TLS to protect data transmitted between browser and server", "HTTP is used only for email, while HTTPS is used only for web browsing", "HTTPS is a search engine, while HTTP is a web browser"], 1, "Medium", "HTTPS (HyperText Transfer Protocol Secure) is essentially HTTP with an added layer of encryption (via SSL/TLS), ensuring that data exchanged between a user's browser and a website is protected from interception -- unlike plain HTTP, which transmits data without encryption."], ["Computer: Internet", "A 'URL' (Uniform Resource Locator) primarily serves the purpose of:", ["Encrypting data sent over a network", "Specifying the address of a resource on the Internet", "Storing a user's browsing history", "Scanning a computer for viruses"], 1, "Easy", "A URL is the address used to locate and access a specific resource (such as a webpage, image, or file) on the Internet, typically including the protocol (e.g. https), domain name, and path to the resource."], ["Computer: Cybersecurity", "Which of the following best describes 'Phishing'?", ["A technique used to physically damage computer hardware", "A fraudulent attempt to obtain sensitive information by disguising oneself as a trustworthy entity, typically via email or fake websites", "A method of compressing large files to save storage space", "A legitimate method used by banks to verify customer identity in person"], 1, "Medium", "Phishing is a cyber attack technique in which attackers send fraudulent communications (often emails or fake websites) that appear to come from a reputable source, in order to trick victims into revealing sensitive information such as passwords or bank details."], ["Computer: Cybersecurity", "Consider the following statements regarding a Firewall:\n1. A Firewall monitors and controls incoming and outgoing network traffic based on predetermined security rules.\n2. A Firewall guarantees complete protection against all types of malware, making antivirus software unnecessary.\nWhich of the statements given above is/are correct?", ["Only 1", "Only 2", "Both 1 and 2", "Neither 1 nor 2"], 0, "Medium", "A Firewall does monitor and control network traffic based on security rules, acting as a barrier between a trusted internal network and untrusted external networks, making statement 1 correct. However, a firewall does not guarantee complete protection against all malware (such as viruses arriving via infected files) and should be used alongside antivirus software, making statement 2 incorrect."], ["Computer: Cybersecurity", "Which of the following is considered a good practice for password security?", ["Using the same simple password across all online accounts", "Using a long password combining uppercase, lowercase, numbers and special characters, and enabling two-factor authentication where possible", "Sharing passwords with colleagues over unencrypted chat for convenience", "Writing down all passwords on a sticky note attached to the monitor"], 1, "Easy", "Good password hygiene includes using long, complex passwords with a mix of character types, avoiding reuse of the same password across multiple accounts, and enabling two-factor authentication for an additional layer of security."], ["Computer: Cybersecurity", "Regular 'data backup' is primarily important because it:", ["Increases the speed of the computer's processor", "Provides a copy of important data that can be restored in case of accidental deletion, hardware failure, or a ransomware attack", "Automatically removes viruses from a computer", "Reduces the amount of storage space used on a device"], 1, "Medium", "Regular data backup ensures that a recent copy of important files is available for restoration in situations such as accidental deletion, hardware failure, theft, or a ransomware attack that encrypts or destroys the original data."], ["Computer: Networking", "Which of the following best describes a 'LAN' (Local Area Network)?", ["A network that connects computers across different countries", "A network that connects computers and devices within a limited geographical area, such as an office or a single building", "A network exclusively used for satellite communication", "A type of computer virus that spreads through email"], 1, "Medium", "A Local Area Network (LAN) connects computers and devices within a limited geographical area, such as a single office, building, or campus, as opposed to a Wide Area Network (WAN), which spans larger geographical distances such as cities or countries."], ["Computer: Networking", "An IP address such as '192.168.1.1' is an example of which version of the Internet Protocol?", ["IPv6", "IPv4", "IPv2", "IPv8"], 1, "Easy", "An address like '192.168.1.1', written as four decimal numbers (each 0-255) separated by dots, is the standard format for IPv4 (Internet Protocol version 4) addresses; IPv6 addresses use a longer hexadecimal format instead."], ["Computer: Digital Literacy", "Under the 'Digital India' initiative of the Government of India, which of the following is a primary objective?", ["Reducing the use of computers in government offices", "Providing digital infrastructure, digital services and universal digital literacy to citizens", "Restricting internet access in rural areas", "Eliminating the use of mobile phones for government services"], 1, "Medium", "The Digital India programme aims to transform India into a digitally empowered society by improving digital infrastructure, delivering government services electronically, and promoting digital literacy across the country, particularly in rural areas."], ["Computer: Abbreviations", "Expand the abbreviation 'URL'.", ["Universal Reference Link", "Uniform Resource Locator", "United Resource Link", "Universal Resource Language"], 1, "Easy", "'URL' stands for Uniform Resource Locator, which is the address used to access a specific resource on the Internet."], ["Computer: Abbreviations", "Expand the abbreviation 'HTTP'.", ["HyperText Transfer Protocol", "High Transfer Text Protocol", "HyperText Translation Protocol", "Host Transfer Text Program"], 0, "Easy", "'HTTP' stands for HyperText Transfer Protocol, the foundational protocol used for transmitting web pages and other resources over the World Wide Web."], ["Computer: File Management", "Which of the following file extensions is associated with a Portable Document Format file, commonly used for sharing formatted documents that preserve their layout across devices?", [".docx", ".pdf", ".xlsx", ".pptx"], 1, "Easy", "'.pdf' (Portable Document Format) files are widely used because they preserve the exact formatting and layout of a document regardless of the device, operating system, or software used to open them."], ["Computer: File Management", "In Windows File Explorer, which of the following actions would you use to permanently delete a file, bypassing the Recycle Bin?", ["Press Delete key alone", "Press Shift + Delete", "Right-click and select Copy", "Press Ctrl + C"], 1, "Medium", "Pressing 'Shift + Delete' in Windows permanently deletes a selected file or folder, bypassing the Recycle Bin, unlike pressing the Delete key alone, which moves the item to the Recycle Bin for possible later recovery."], ["Computer: Practical Awareness", "A user notices that their computer has suddenly become very slow, several unfamiliar pop-up advertisements keep appearing, and unknown programs are running without their permission. This is most likely a sign of:", ["A hardware upgrade in progress", "A malware infection", "A scheduled Windows update", "An electricity power surge"], 1, "Medium", "Symptoms such as sudden slowdown, unexpected pop-up advertisements, and unfamiliar programs running without permission are classic warning signs of a malware infection, and the user should run a full antivirus scan and avoid entering sensitive information until the issue is resolved."], ["Computer: Practical Awareness", "While composing an important official email, which of the following is the most appropriate practice regarding attachments?", ["Attach files of any format and size without checking, since email servers can handle everything", "Compress large files where possible, use clear and relevant file names, and verify the correct files are attached before sending", "Always attach password-protected files and never share the password", "Avoid using the 'Subject' field to save time"], 1, "Medium", "Good email etiquette and digital hygiene include compressing large attachments when appropriate, using clear and descriptive file names, and double-checking that the correct files are attached before sending -- helping ensure smooth and professional communication."], ["Computer: Networking", "Which of the following best describes 'bandwidth' in the context of computer networks?", ["The physical length of a network cable", "The maximum rate of data transfer across a given network path, usually measured in bits per second", "The number of computers connected to a network", "The brand name of a networking device"], 1, "Medium", "Bandwidth refers to the maximum capacity of a network connection to transmit data, typically measured in bits per second (bps) or its multiples (Mbps, Gbps) -- higher bandwidth generally allows faster data transfer."], ["Computer: Fundamentals", "Which of the following is an example of Application Software?", ["Windows Operating System", "Device Driver", "MS PowerPoint", "BIOS"], 2, "Easy", "MS PowerPoint is an application software designed to help users create presentations, whereas the Windows Operating System, Device Drivers, and BIOS are all examples of system software that manage the computer's hardware and provide a platform for applications to run."]];

   STATE
========================================================= */
var app = document.getElementById('app');
var status = {};          // per-question status, keyed by qId (index in Q)
var activeIndices = [];    // ordered list of qIds in the current run
var currentPos = 0;        // position within activeIndices
var timerInterval = null;
var remainingSeconds = 0;
var examStartTs = null;
var questionStartTs = null;
var screen = 'start';      // start | exam | result
var isPractice = false;    // true when running a retry/practice subset
var practiceLabel = '';
var resultData = null;     // cached computed results after submission
var activeTab = 'summary';
var reviewFilter = 'all';

function freshStatus(){
  return { selected:null, visited:false, answered:false, marked:false, timeSpent:0, attempts:0 };
}

function initStatuses(){
  status = {};
  for(var i=0;i<Q.length;i++){ status[i] = freshStatus(); }
}

/* =========================================================
   DIFFICULTY CLASSIFIER (derived at runtime from question
   wording — the question database itself is never altered)
========================================================= */
function classifyDifficulty(item){
  return item[4] || 'Medium';
}

/* =========================================================
   RANDOMIZATION — shuffles question order and, within each
   question, the option order (remapping the correct index so
   scoring stays accurate). Runs fresh each time a full test is
   started, so every attempt sees a different arrangement.
========================================================= */
function shuffleArray(arr){
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  }
  return arr;
}
function shuffleQuestionOptions(){
  Q.forEach(function(item){
    var opts = item[2], correct = item[3];
    var order = opts.map(function(_,i){return i;});
    shuffleArray(order);
    item[2] = order.map(function(i){return opts[i];});
    item[3] = order.indexOf(correct);
  });
}

/* =========================================================
   UTIL
========================================================= */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function el(html){
  var d=document.createElement('div');
  d.innerHTML=html.trim();
  return d.firstChild;
}

  app.innerHTML =

function startFullExam(){
  shuffleQuestionOptions();
  initStatuses();
  activeIndices = shuffleArray(Q.map(function(_,i){return i;}));
  currentPos = 0;
  isPractice = false;
  practiceLabel = '';
  remainingSeconds = CONFIG.durationMinutes*60;
  examStartTs = Date.now();
  startTimer();
  renderExamScreen();
}

/* =========================================================
   TIMER
========================================================= */
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  if(isPractice) return; // practice/retry mode is untimed
  timerInterval = setInterval(function(){
    remainingSeconds--;
    updateTimerDisplay();
    if(remainingSeconds<=0){
      clearInterval(timerInterval);
      submitTest(true);
    }
  },1000);
}
function stopTimer(){ if(timerInterval) clearInterval(timerInterval); }
function updateTimerDisplay(){
  var t = document.getElementById('timer-display');
  if(!t) return;
  t.textContent = isPractice ? 'PRACTICE (untimed)' : fmtTime(remainingSeconds);
  t.classList.toggle('low', !isPractice && remainingSeconds<=120);
}

/* =========================================================
   EXAM SCREEN
========================================================= */
function currentQid(){ return activeIndices[currentPos]; }

function commitTimeSpent(){
  if(questionStartTs!==null){
    var qid = currentQid();
    if(qid!==undefined && status[qid]){
      status[qid].timeSpent += (Date.now()-questionStartTs)/1000;
    }
  }
  questionStartTs = Date.now();
}

function renderExamScreen(){
  screen='exam';
  var qid = currentQid();
  status[qid].visited = true;
  questionStartTs = Date.now();

  var answeredCount=0, visitedCount=0, markedCount=0, notVisited=0;
  activeIndices.forEach(function(id){
    var st=status[id];
    if(st.marked) markedCount++;
    else if(st.answered) answeredCount++;
    else if(st.visited) visitedCount++;
    else notVisited++;
  });

  var html = '';
  html += '<div class="exam-header">';
  html +=   '<div class="titles"><h1>'+esc(CONFIG.examName)+'</h1><h2>'+esc(CONFIG.subjectName)+(isPractice?(' — '+esc(practiceLabel)):'')+'</h2></div>';
  html +=   '<div class="mid">';
  html +=     '<span>Question <b>'+(currentPos+1)+'</b> / '+activeIndices.length+'</span>';
  html +=     '<span class="timer" id="timer-display">'+(isPractice?'PRACTICE (untimed)':fmtTime(remainingSeconds))+'</span>';
  html +=     '<button class="palette-toggle" id="palette-toggle-btn">Palette</button>';
  html +=   '</div>';
  html += '</div>';
  html += '<div class="progress-track"><div class="progress-fill" style="width:'+Math.round(((currentPos+1)/activeIndices.length)*100)+'%"></div></div>';
  if(isPractice){
    html += '<div class="practice-banner">Practice mode — '+esc(practiceLabel)+'. This run is untimed and separate from your main result.</div>';
  }
  html += '<div class="exam-body">';
  html +=   '<div class="qcol" id="qcol"></div>';
  html +=   '<div class="palette" id="palette"></div>';
  html += '</div>';
  html += '<div class="bottom-bar">';
  html +=   '<button id="btn-prev" '+(currentPos===0?'disabled':'')+'>Previous</button>';
  html +=   '<button id="btn-clear" class="bb-clear">Clear Response</button>';
  html +=   '<button id="btn-mark" class="bb-warn">Mark for Review</button>';
  html +=   '<button id="btn-save" class="bb-primary">Save &amp; Next</button>';
  html +=   '<button id="btn-next" '+(currentPos===activeIndices.length-1?'disabled':'')+'>Next</button>';
  html +=   '<button id="btn-submit" class="bb-submit">Submit Test</button>';
  html += '</div>';

  app.innerHTML = html;
  renderQuestion();
  renderPalette();

  document.getElementById('btn-prev').addEventListener('click', goPrev);
  document.getElementById('btn-next').addEventListener('click', goNext);
  document.getElementById('btn-save').addEventListener('click', goNext);
  document.getElementById('btn-clear').addEventListener('click', clearResponse);
  document.getElementById('btn-mark').addEventListener('click', markForReview);
  document.getElementById('btn-submit').addEventListener('click', requestSubmit);
  var pt = document.getElementById('palette-toggle-btn');
  if(pt) pt.addEventListener('click', function(){
    document.getElementById('palette').classList.toggle('open');
  });
}

function renderQuestion(){
  var qid = currentQid();
  var item = Q[qid];
  var st = status[qid];
  var qcol = document.getElementById('qcol');

  var statusLabel = st.marked ? '<span class="qstatus" style="background:var(--amber-bg);color:var(--amber)">Marked for review</span>'
    : st.answered ? '<span class="qstatus" style="background:var(--green-bg);color:var(--green)">Answered</span>'
    : '<span class="qstatus" style="background:var(--red-bg);color:var(--red)">Not answered</span>';

  var html = '<div class="qmeta">Question '+(currentPos+1)+' of '+activeIndices.length+'<span class="qtopic">'+esc(item[0])+'</span>'+statusLabel+'</div>';
  html += '<div class="qtext">'+esc(item[1])+'</div>';
  item[2].forEach(function(optText,i){
    var sel = (st.selected===i) ? ' selected' : '';
    html += '<button class="opt'+sel+'" data-i="'+i+'"><span class="oletter">'+LETTERS[i]+'.</span><span>'+esc(optText)+'</span></button>';
  });
  qcol.innerHTML = html;

  qcol.querySelectorAll('.opt').forEach(function(btn){
    btn.addEventListener('click', function(){
      selectOption(parseInt(btn.getAttribute('data-i'),10));
    });
  });
}

function renderPalette(){
  var pal = document.getElementById('palette');
  if(!pal) return;
  var answeredCount=0, visitedCount=0, markedCount=0, notVisited=0;
  var html = '<h3>Question Palette</h3>';
  html += '<div class="legend">'+
    '<div><span class="sw" style="background:var(--white)"></span>Not visited</div>'+
    '<div><span class="sw" style="background:var(--red-bg);border-color:var(--red)"></span>Not answered</div>'+
    '<div><span class="sw" style="background:var(--green-bg);border-color:var(--green)"></span>Answered</div>'+
    '<div><span class="sw" style="background:var(--amber-bg);border-color:var(--amber-border)"></span>Marked</div>'+
  '</div>';
  html += '<div class="pgrid">';
  activeIndices.forEach(function(id,pos){
    var st = status[id];
    var cls = 'notvisited';
    if(st.marked){ cls='marked'; markedCount++; }
    else if(st.answered){ cls='answered'; answeredCount++; }
    else if(st.visited){ cls='visited'; visitedCount++; }
    else { notVisited++; }
    var cur = (pos===currentPos) ? ' current' : '';
    html += '<button class="pnum '+cls+cur+'" data-pos="'+pos+'">'+(pos+1)+'</button>';
  });
  html += '</div>';
  html += '<div class="palette-summary">'+
    '<div><span>Answered</span><span>'+answeredCount+'</span></div>'+
    '<div><span>Not answered</span><span>'+visitedCount+'</span></div>'+
    '<div><span>Marked</span><span>'+markedCount+'</span></div>'+
    '<div><span>Not visited</span><span>'+notVisited+'</span></div>'+
  '</div>';
  pal.innerHTML = html;
  pal.querySelectorAll('.pnum').forEach(function(btn){
    btn.addEventListener('click', function(){
      goToPosition(parseInt(btn.getAttribute('data-pos'),10));
      pal.classList.remove('open');
    });
  });
}

function selectOption(i){
  var qid = currentQid();
  var st = status[qid];
  st.selected = i;
  st.answered = true;
  st.attempts++;
  renderQuestion();
  renderPalette();
}

function clearResponse(){
  var qid = currentQid();
  var st = status[qid];
  st.selected = null;
  st.answered = false;
  renderQuestion();
  renderPalette();
}

function markForReview(){
  var qid = currentQid();
  status[qid].marked = !status[qid].marked;
  goNext(true);
}

function goToPosition(pos){
  if(pos<0 || pos>=activeIndices.length) return;
  commitTimeSpent();
  currentPos = pos;
  renderExamScreen();
}

function goNext(fromMark){
  commitTimeSpent();
  if(currentPos < activeIndices.length-1){
    currentPos++;
    renderExamScreen();
  } else if(!fromMark){
    renderExamScreen();
  } else {
    renderExamScreen();
  }
}

function goPrev(){
  commitTimeSpent();
  if(currentPos>0){
    currentPos--;
    renderExamScreen();
  }
}

   MODAL
========================================================= */
function showModal(message, onConfirm, confirmLabel, cancelLabel){
  var overlay = el('<div class="modal-overlay"><div class="modal-box"><p></p><div class="modal-actions"><button class="btn-ghost" id="modal-cancel">'+esc(cancelLabel||'Cancel')+'</button><button class="btn-primary" id="modal-confirm">'+esc(confirmLabel||'Confirm')+'</button></div></div></div>');
  overlay.querySelector('p').textContent = message;
  document.body.appendChild(overlay);
  overlay.querySelector('#modal-cancel').addEventListener('click', function(){ document.body.removeChild(overlay); });
  overlay.querySelector('#modal-confirm').addEventListener('click', function(){
    document.body.removeChild(overlay);
    onConfirm();
  });
}

/* =========================================================
   SUBMISSION
========================================================= */
function countUnanswered(){
  var n=0;
  activeIndices.forEach(function(id){ if(!status[id].answered) n++; });
  return n;
}

function requestSubmit(){
  var unanswered = countUnanswered();
  var msg = unanswered>0
    ? ('You still have '+unanswered+' unanswered question'+(unanswered===1?'':'s')+'. Do you want to submit the test now?')
    : 'All questions are answered. Submit the test now?';
  showModal(msg, function(){ submitTest(false); }, 'Submit Test', 'Continue Test');
}

function submitTest(auto){
  commitTimeSpent();
  stopTimer();
  resultData = computeResults();
  if(isPractice){
    renderPracticeResult();
  } else {
    activeTab = 'summary';
    reviewFilter = 'all';
    renderResultDashboard();
  }
}

/* =========================================================
   RESULTS COMPUTATION
========================================================= */
function computeResults(){
  var total = activeIndices.length;
  var correct=0, wrong=0, attempted=0, timeTotal=0;
  var topicStats = {};
  var diffStats = { Easy:{c:0,w:0,t:0}, Medium:{c:0,w:0,t:0}, Hard:{c:0,w:0,t:0} };

  activeIndices.forEach(function(id){
    var item = Q[id], st = status[id];
    var topic = item[0];
    if(!topicStats[topic]) topicStats[topic] = {c:0,w:0,t:0};
    topicStats[topic].t++;
    var diff = classifyDifficulty(item);
    diffStats[diff].t++;
    timeTotal += st.timeSpent;
    if(st.answered){
      attempted++;
      if(st.selected===item[3]){
        correct++; topicStats[topic].c++; diffStats[diff].c++;
      } else {
        wrong++; topicStats[topic].w++; diffStats[diff].w++;
      }
    }
  });

  var unattempted = total - attempted;
  var rawScore = correct*CONFIG.marksPerQuestion - (CONFIG.negativeMarking.enabled ? wrong*CONFIG.negativeMarking.value : 0);
  var maxScore = total*CONFIG.marksPerQuestion;
  var percentage = maxScore>0 ? (rawScore/maxScore*100) : 0;
  var accuracy = attempted>0 ? (correct/attempted*100) : 0;
  var timeTakenSec = isPractice ? timeTotal : Math.max(0, CONFIG.durationMinutes*60 - remainingSeconds);
  var avgTimePerQ = attempted>0 ? (timeTakenSec/attempted) : 0;

  return {
    total: total, correct: correct, wrong: wrong, attempted: attempted, unattempted: unattempted,
    rawScore: rawScore, maxScore: maxScore, percentage: percentage, accuracy: accuracy,
    timeTakenSec: timeTakenSec, avgTimePerQ: avgTimePerQ,
    topicStats: topicStats, diffStats: diffStats
  };
}

function tabBtn(key,label){

}

function summaryPanelHtml(r){

    '<li>'+negNote+'</li>'+

function topicPanelHtml(r){

function difficultyPanelHtml(r){
