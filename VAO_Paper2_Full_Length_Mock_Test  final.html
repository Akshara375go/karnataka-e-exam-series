function reviewPanelHtml(){
  var html = '<div class="filter-row">'+
    filterBtn('all','All')+filterBtn('correct','Correct')+filterBtn('wrong','Wrong')+filterBtn('unattempted','Unattempted')+filterBtn('marked','Marked')+
  '</div><div id="review-list">'+reviewListHtml()+'</div>';
  return html;
}
function filterBtn(key,label){
  return '<button class="filter-btn'+(reviewFilter===key?' active':'')+'" data-filter="'+key+'">'+esc(label)+'</button>';
}
function reviewListHtml(){
  var html='';
  activeIndices.forEach(function(id,pos){
    var item=Q[id], st=status[id];
    var wasCorrect = st.answered && st.selected===item[3];
    var wasWrong = st.answered && st.selected!==item[3];
    var unattempted = !st.answered;
    if(reviewFilter==='correct' && !wasCorrect) return;
    if(reviewFilter==='wrong' && !wasWrong) return;
    if(reviewFilter==='unattempted' && !unattempted) return;
    if(reviewFilter==='marked' && !st.marked) return;

    var tag = wasCorrect ? '<span class="tag correct">Correct</span>' : wasWrong ? '<span class="tag wrong">Wrong</span>' : '<span class="tag skip">Not attempted</span>';
    html += '<div class="review-item">';
    html += '<div class="rmeta"><span class="qtopic" style="background:var(--topicbg);padding:2px 8px;border-radius:3px">'+esc(item[0])+'</span>Q'+(pos+1)+tag+(st.marked?'<span class="tag" style="background:var(--amber-bg);color:var(--amber)">Marked</span>':'')+'</div>';
    html += '<div class="rq">'+esc(item[1])+'</div>';
    item[2].forEach(function(opt,i){
      var cls='';
      if(i===item[3]) cls='correctopt';
      else if(i===st.selected) cls='wrongopt';
      html += '<div class="ropt'+(cls?(' '+cls):'')+'">'+LETTERS[i]+'. '+esc(opt)+(i===st.selected?' (Your answer)':'')+(i===item[3]?' (Correct answer)':'')+'</div>';
    });
    html += '<div class="explain">Explanation: '+esc(item[5]||'')+'</div>';
    html += '</div>';
  });
  return html || '<p style="color:var(--ink-mute)">No questions match this filter.</p>';
}
function wireReviewFilters(){
  document.querySelectorAll('.filter-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      reviewFilter = btn.getAttribute('data-filter');
      document.getElementById('review-list').innerHTML = reviewListHtml();
      document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.toggle('active', b===btn); });
    });
  });
}

function performancePanelHtml(r){
  var topics = Object.keys(r.topicStats).map(function(t){
    var s=r.topicStats[t];
    return { topic:t, pct: s.t>0?(s.c/s.t*100):0, total:s.t };
  });
  var strong = topics.filter(function(t){return t.pct>=75;}).sort(function(a,b){return b.pct-a.pct;});
  var weak = topics.filter(function(t){return t.pct<50;}).sort(function(a,b){return a.pct-b.pct;});
  var revisionOrder = weak.slice();

  var html='';
  html += '<div class="perf-block"><h4>Strong Areas</h4><ul>'+(strong.length?strong.map(function(t){return '<li>'+esc(t.topic)+' — '+Math.round(t.pct)+'%</li>';}).join(''):'<li>None yet — accuracy across topics is still developing.</li>')+'</ul></div>';
  html += '<div class="perf-block"><h4>Weak Areas</h4><ul>'+(weak.length?weak.map(function(t){return '<li>'+esc(t.topic)+' — '+Math.round(t.pct)+'%</li>';}).join(''):'<li>No topic fell below 50% — solid overall performance.</li>')+'</ul></div>';
  html += '<div class="perf-block"><h4>Topics To Revise</h4><ul>'+(weak.length?weak.map(function(t){return '<li>'+esc(t.topic)+'</li>';}).join(''):'<li>No specific topic flagged for urgent revision.</li>')+'</ul></div>';
  html += '<div class="perf-block"><h4>Accuracy Analysis</h4><ul><li>Overall accuracy on attempted questions: '+r.accuracy.toFixed(1)+'%</li><li>Overall percentage (of full paper): '+r.percentage.toFixed(1)+'%</li></ul></div>';
  html += '<div class="perf-block"><h4>Suggested Revision Order</h4><ul>'+(revisionOrder.length?revisionOrder.map(function(t,i){return '<li>'+(i+1)+'. '+esc(t.topic)+' ('+Math.round(t.pct)+'%)</li>';}).join(''):'<li>No priority order needed — no weak topics detected.</li>')+'</ul></div>';
  html += '<div class="perf-block"><h4>Estimated Readiness</h4><ul><li>'+readinessLabel(r.percentage)+'</li></ul></div>';
  return html;
}

function actionsPanelHtml(r){
  var wrongCount = 0, unansCount = 0;
  activeIndices.forEach(function(id){
    var item=Q[id], st=status[id];
    if(st.answered && st.selected!==item[3]) wrongCount++;
    if(!st.answered) unansCount++;
  });
  return '<div class="perf-block"><h4>Smart Actions</h4>'+
    '<div class="smart-row">'+
      '<button class="btn-secondary" id="retry-wrong" '+(wrongCount===0?'disabled':'')+'>Retry Wrong Questions ('+wrongCount+')</button>'+
      '<button class="btn-secondary" id="retry-unanswered" '+(unansCount===0?'disabled':'')+'>Retry Unanswered Questions ('+unansCount+')</button>'+
      '<button class="btn-ghost" id="restart-test">Restart Full Test</button>'+
    '</div></div>';
}

function wireActionButtons(r){
  var rw = document.getElementById('retry-wrong');
  var ru = document.getElementById('retry-unanswered');
  var rt = document.getElementById('restart-test');
  if(rw) rw.addEventListener('click', function(){
    var ids = activeIndices.filter(function(id){
      var item=Q[id], st=status[id];
      return st.answered && st.selected!==item[3];
    });
    startPracticeRun(ids, 'Retry — Wrong Questions');
  });
  if(ru) ru.addEventListener('click', function(){
    var ids = activeIndices.filter(function(id){ return !status[id].answered; });
    startPracticeRun(ids, 'Retry — Unanswered Questions');
  });
  if(rt) rt.addEventListener('click', function(){
    renderStart();
  });
}

/* =========================================================
   PDF DOWNLOAD — QUESTION PAPER + ANSWER KEY
   Generated entirely client-side (jsPDF, loaded via CDN),
   so it works on a static GitHub Pages deployment with no
   backend, login or database. Pulls straight from the Q
   array in its original section order (not the shuffled
   in-exam order), and never includes the student's answers.
========================================================= */
// styleOpts (only consulted for lines containing Kannada text —
// plain ASCII lines are untouched and keep using doc.text/doc.setFont
// exactly as before): { fontSize, bold, italic, color }
function pdfWrapText(doc, text, x, y, maxWidth, lineHeight, pageHeight, marginBottom, styleOpts){
  if (isKannadaText(text)) {
    var opts = styleOpts || {};
    var fontSize = opts.fontSize || 10.5;
    var bold = !!opts.bold;
    var italic = !!opts.italic;
    var color = opts.color || '#000000';
    var lines = wrapKannadaText(text, fontSize, bold, italic, maxWidth);
    for (var i = 0; i < lines.length; i++){
      if (y > pageHeight - marginBottom){
        doc.addPage();
        y = 20;
      }
      var img = kannadaLineToImage(lines[i], fontSize, bold, italic, color);
      doc.addImage(img.dataUrl, 'PNG', x, y - img.ascentPt, img.widthPt, img.heightPt);
      y += lineHeight;
    }
    return y;
  }
  var lines = doc.splitTextToSize(text, maxWidth);
  for(var i=0;i<lines.length;i++){
    if(y > pageHeight - marginBottom){
      doc.addPage();
      y = 20;
    }
    doc.text(lines[i], x, y);
    y += lineHeight;
  }
  return y;
}

function downloadQuestionPaperPdf(){
  if(typeof window.jspdf === 'undefined'){
    alert('PDF library is still loading — please try again in a moment.');
    return;
  }
  // Kannada questions are rendered onto the PDF as rasterized
  // images using this embedded webfont (see notes above
  // pdfWrapText), so we wait for it to finish loading first —
  // in practice this resolves almost immediately since the font
  // is embedded as a data URI, not fetched over the network.
  ensureKannadaFontLoaded().then(function(){
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ unit: 'pt', format: 'a4' });
  var pageWidth = doc.internal.pageSize.getWidth();
  var pageHeight = doc.internal.pageSize.getHeight();
  var margin = 40;
  var maxWidth = pageWidth - margin*2;
  var y = 60;

  doc.setFont('helvetica','bold');
  doc.setFontSize(18);
  doc.text(CONFIG.examName, pageWidth/2, y, {align:'center'}); y += 24;
  doc.setFontSize(14);
  doc.text(CONFIG.subjectName, pageWidth/2, y, {align:'center'}); y += 20;
  doc.setFont('helvetica','normal');
  doc.setFontSize(11);
  doc.text(Q.length+' MCQs  |  '+CONFIG.durationMinutes+' Minutes', pageWidth/2, y, {align:'center'}); y += 14;
  doc.text('Question Paper & Answer Key (for revision — does not show your responses)', pageWidth/2, y, {align:'center'});

  PDF_SECTIONS.forEach(function(section){
    doc.addPage();
    y = 50;
    doc.setFont('helvetica','bold');
    doc.setFontSize(14);
    y = pdfWrapText(doc, section.title, margin, y, maxWidth, 18, pageHeight, 40, {fontSize:14, bold:true});
    doc.setFontSize(10.5);
    doc.setFont('helvetica','normal');
    doc.text('Questions '+(section.start+1)+'–'+section.end, margin, y); y += 20;

    for(var i=section.start; i<section.end; i++){
      var item = Q[i];
      var qNum = i+1;

      if(y > pageHeight - 90){ doc.addPage(); y = 50; }

      doc.setFont('helvetica','bold');
      doc.setFontSize(11);
      y = pdfWrapText(doc, qNum+'. '+item[1], margin, y, maxWidth, 14, pageHeight, 40, {fontSize:11, bold:true});
      y += 2;

      doc.setFont('helvetica','normal');
      doc.setFontSize(10.5);
      item[2].forEach(function(optText, oi){
        y = pdfWrapText(doc, LETTERS[oi]+'. '+optText, margin+14, y, maxWidth-14, 13, pageHeight, 40, {fontSize:10.5});
      });
      y += 2;

      doc.setFont('helvetica','bold');
      y = pdfWrapText(doc, 'Correct Answer: '+LETTERS[item[3]], margin, y, maxWidth, 13, pageHeight, 40, {fontSize:10.5, bold:true});

      doc.setFont('helvetica','italic');
      doc.setFontSize(9.5);
      y = pdfWrapText(doc, 'Explanation: '+(item[5]||''), margin, y, maxWidth, 12, pageHeight, 40, {fontSize:9.5, italic:true});
      doc.setFont('helvetica','normal');

      y += 12;
    }
  });

  doc.save('Karnataka_Computer_Awareness_QuestionPaper_AnswerKey.pdf');
  });
}

/* =========================================================
   PDF DOWNLOAD — RESULT REPORT (post-test)
   Generated client-side after submission. Includes the
   student's name (if entered), score summary, and a full
   question-wise review with the student's own answers and
   explanations for every question.
========================================================= */
function downloadResultReportPdf(r){
  if(typeof window.jspdf === 'undefined'){
    alert('PDF library is still loading — please try again in a moment.');
    return;
  }
  // See notes above pdfWrapText / downloadQuestionPaperPdf:
  // Kannada lines are drawn via a rasterized embedded webfont,
  // so we wait for it to be ready before building the PDF.
  ensureKannadaFontLoaded().then(function(){
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ unit: 'pt', format: 'a4' });
  var pageWidth = doc.internal.pageSize.getWidth();
  var pageHeight = doc.internal.pageSize.getHeight();
  var margin = 40;
  var maxWidth = pageWidth - margin*2;
  var y = 60;

  doc.setFont('helvetica','bold');
  doc.setFontSize(18);
  doc.text(CONFIG.examName, pageWidth/2, y, {align:'center'}); y += 24;
  doc.setFontSize(14);
  doc.text(CONFIG.subjectName+' — Result Report', pageWidth/2, y, {align:'center'}); y += 22;

  doc.setFont('helvetica','normal');
  doc.setFontSize(11);
  if(studentName && studentName.trim()){
    doc.text('Student Name: '+studentName.trim(), margin, y); y += 16;
  }
  doc.text('Total Questions: '+Q.length, margin, y); y += 16;
  doc.text('Score: '+r.rawScore.toFixed(2)+' / '+r.maxScore+'   ('+Math.round(r.percentage)+'%)', margin, y); y += 16;
  doc.text('Correct: '+r.correct+'   Wrong: '+r.wrong+'   Unattempted: '+r.unattempted, margin, y); y += 16;
  doc.text('Time Taken: '+fmtTime(r.timeTakenSec), margin, y); y += 20;

  doc.setDrawColor(180,180,180);
  doc.line(margin, y, pageWidth-margin, y); y += 24;

  doc.setFont('helvetica','bold');
  doc.setFontSize(14);
  doc.text('Question-wise Review', margin, y); y += 22;

  activeIndices.forEach(function(qid, pos){
    var item = Q[qid];
    var st = status[qid];
    var qNum = pos+1;

    if(y > pageHeight - 130){ doc.addPage(); y = 50; }

    doc.setFont('helvetica','bold');
    doc.setFontSize(11);
    y = pdfWrapText(doc, qNum+'. '+item[1], margin, y, maxWidth, 14, pageHeight, 50, {fontSize:11, bold:true});
    y += 2;

    doc.setFont('helvetica','normal');
    doc.setFontSize(10.5);
    item[2].forEach(function(optText, oi){
      var prefix = LETTERS[oi]+'. '+optText;
      if(oi===item[3]) prefix += '  (Correct answer)';
      if(oi===st.selected && oi!==item[3]) prefix += '  (Your answer)';
      if(oi===st.selected && oi===item[3]) prefix += '  (Your answer — Correct)';
      y = pdfWrapText(doc, prefix, margin+14, y, maxWidth-14, 13, pageHeight, 50, {fontSize:10.5});
    });
    if(!st.answered){
      doc.setFont('helvetica','italic');
      y = pdfWrapText(doc, 'Your answer: Not attempted', margin+14, y, maxWidth-14, 13, pageHeight, 50, {fontSize:10.5, italic:true});
      doc.setFont('helvetica','normal');
    }
    y += 2;

    doc.setFont('helvetica','italic');
    doc.setFontSize(9.5);
    y = pdfWrapText(doc, 'Explanation: '+(item[5]||''), margin, y, maxWidth, 12, pageHeight, 50, {fontSize:9.5, italic:true});
    doc.setFont('helvetica','normal');

    y += 14;
  });

  var fname = (studentName && studentName.trim()) ? studentName.trim().replace(/[^a-z0-9]+/gi,'_') : 'Student';
  doc.save('Karnataka_Computer_Awareness_ResultReport_'+fname+'.pdf');
  });
}

/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */
document.addEventListener('keydown', function(e){
  if(screen!=='exam') return;
  var tag = (e.target && e.target.tagName) || '';
  if(tag==='INPUT' || tag==='TEXTAREA') return;

  if(e.key>='1' && e.key<='4'){
    var i = parseInt(e.key,10)-1;
    var item = Q[currentQid()];
    if(i < item[2].length){ selectOption(i); }
  } else if(e.key==='ArrowRight'){
    goNext();
  } else if(e.key==='ArrowLeft'){
    goPrev();
  } else if(e.key==='n' || e.key==='N'){
    goNext();
  } else if(e.key==='p' || e.key==='P'){
    goPrev();
  } else if(e.key==='m' || e.key==='M'){
    markForReview();
  }
});

/* =========================================================
   BOOT
========================================================= */
renderStart();

})();
</script>
