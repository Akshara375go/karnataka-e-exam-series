<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Karnataka Competitive Exams — Computer Awareness Master Test — CBT Examination</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy:#1F3A5F; --navy-dark:#16283F;
    --gold:#B08D57;
    --cream:#F4F1E8;
    --ink:#2A2622; --ink-soft:#5A4F3A; --ink-mute:#7A6F5C;
    --border:#D9D2BE; --border-soft:#E3DCC8;
    --white:#FFFFFF;
    --green:#2F6F4E; --green-bg:#E4EFE7;
    --red:#B23A2E; --red-bg:#F6E6E4;
    --amber:#8A6D1F; --amber-bg:#F5E7B2; --amber-border:#C9A227;
    --topicbg:#EFEADA;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:Georgia,'Tinos',serif;color:var(--ink);background:var(--cream)}
  button{font-family:inherit}
  #app{min-height:100vh;display:flex;flex-direction:column}

  /* ---------- START SCREEN ---------- */
  .start-wrap{max-width:640px;margin:40px auto;background:var(--white);border:1px solid var(--border);border-radius:8px;padding:30px 32px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .start-logo{display:block;margin:0 auto 18px;width:120px;height:120px;border-radius:50%}
  .start-wrap h1{font-size:19px;color:var(--navy);margin:0 0 4px;text-align:center}
  .start-wrap h2{text-align:center}
  .start-wrap h2{font-size:14px;font-weight:normal;color:var(--ink-soft);margin:0 0 22px}
  .start-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
  .start-card{background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:12px 14px}
  .start-card .lbl{font-family:'Courier New',monospace;font-size:11px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.5px}
  .start-card .val{font-size:16px;color:var(--navy);margin-top:4px}
  .instructions{font-size:13.5px;line-height:1.7;color:var(--ink-soft);margin-bottom:22px}
  .instructions li{margin-bottom:4px}
  .toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:22px;font-size:13.5px}
  .btn-primary{font-family:Georgia,serif;font-size:15px;background:var(--navy);color:var(--cream);border:none;padding:12px 26px;border-radius:5px;cursor:pointer}
  .btn-primary:hover{background:var(--navy-dark)}
  .btn-secondary{font-family:Georgia,serif;font-size:14px;background:var(--gold);color:var(--ink);border:none;padding:9px 20px;border-radius:5px;cursor:pointer}
  .btn-ghost{font-family:Georgia,serif;font-size:13.5px;background:transparent;color:var(--navy);border:1px solid var(--navy);padding:8px 16px;border-radius:5px;cursor:pointer}

  /* ---------- EXAM HEADER ---------- */
  .exam-header{background:var(--navy);color:var(--cream);padding:10px 18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
  .exam-header .titles h1{font-size:14.5px;font-weight:normal;margin:0;letter-spacing:.2px}
  .exam-header .titles h2{font-size:12px;font-weight:normal;margin:2px 0 0;color:#D8CBA9}
  .exam-header .mid{display:flex;align-items:center;gap:16px;font-family:'Courier New',monospace;font-size:12.5px}
  .exam-header .timer{background:#16283F;padding:5px 12px;border-radius:4px;font-size:14px;letter-spacing:.5px}
  .exam-header .timer.low{background:var(--red)}
  .palette-toggle{display:none;background:var(--gold);color:var(--ink);border:none;padding:7px 12px;border-radius:4px;font-size:12.5px;cursor:pointer}
  .progress-track{height:4px;background:var(--border)}
  .progress-fill{height:100%;background:var(--gold);transition:width .25s}

  /* ---------- MAIN EXAM LAYOUT ---------- */
  .exam-body{flex:1;display:flex;gap:0;align-items:flex-start}
  .qcol{flex:1;padding:22px 26px;max-width:760px}
  .qmeta{font-family:'Courier New',monospace;font-size:11.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .qmeta .qtopic{background:var(--topicbg);color:var(--ink-soft);padding:2px 8px;border-radius:3px;text-transform:none;letter-spacing:0}
  .qmeta .qstatus{padding:2px 8px;border-radius:3px}
  .qtext{font-size:15.5px;line-height:1.6;margin:0 0 18px;white-space:pre-line;background:var(--white);border:1px solid var(--border);border-radius:6px;padding:16px 18px}
  .opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:11px 14px;margin-bottom:9px;background:var(--white);border:1px solid var(--border);border-radius:5px;font-family:Georgia,serif;font-size:14px;color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
  .opt:hover{border-color:var(--navy);background:var(--topicbg)}
  .opt .oletter{font-family:'Courier New',monospace;font-weight:bold;color:var(--navy);flex-shrink:0}
  .opt.selected{background:#E9EEF4;border-color:var(--navy)}
  .opt.selected .oletter{color:var(--navy)}

  .bottom-bar{display:flex;flex-wrap:wrap;gap:8px;padding:14px 26px;border-top:1px solid var(--border);background:var(--white)}
  .bottom-bar button{font-size:13.5px;padding:9px 16px;border-radius:5px;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--ink)}
  .bottom-bar .bb-primary{background:var(--navy);color:var(--cream);border-color:var(--navy)}
  .bottom-bar .bb-primary:hover{background:var(--navy-dark)}
  .bottom-bar .bb-warn{background:var(--amber-bg);border-color:var(--amber-border);color:var(--amber)}
  .bottom-bar .bb-clear{color:var(--red);border-color:var(--red)}
  .bottom-bar .bb-submit{background:var(--red);border-color:var(--red);color:var(--white);margin-left:auto}
  .bottom-bar button:disabled{opacity:.4;cursor:default}

  /* ---------- PALETTE ---------- */
  .palette{width:270px;flex-shrink:0;background:var(--white);border-left:1px solid var(--border);padding:16px;height:100%}
  .palette h3{font-size:12.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11.5px;margin-bottom:14px;color:var(--ink-soft)}
  .legend span.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;border:1px solid var(--border)}
  .pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .pnum{aspect-ratio:1;border:1px solid var(--border);border-radius:4px;background:var(--white);font-family:'Courier New',monospace;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
  .pnum.notvisited{background:var(--white);color:var(--ink)}
  .pnum.visited{background:var(--red-bg);border-color:var(--red);color:var(--red)}
  .pnum.answered{background:var(--green-bg);border-color:var(--green);color:var(--green)}
  .pnum.marked{background:var(--amber-bg);border-color:var(--amber-border);color:var(--amber)}
  .pnum.current{outline:2px solid var(--navy);outline-offset:1px}
  .palette-summary{margin-top:14px;font-size:12px;color:var(--ink-soft);border-top:1px dashed var(--border-soft);padding-top:10px}
  .palette-summary div{display:flex;justify-content:space-between;padding:2px 0}

  /* ---------- MODAL ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(42,38,34,.55);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal-box{background:var(--white);border-radius:8px;padding:24px 26px;max-width:420px;width:90%;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .modal-box p{font-size:14.5px;line-height:1.6;margin:0 0 18px;color:var(--ink)}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px}

  /* ---------- RESULT DASHBOARD ---------- */
  .result-wrap{max-width:920px;margin:0 auto;padding:24px 20px 60px}
  .result-head{text-align:center;padding:18px 0 8px}
  .result-head .big{font-family:'Courier New',monospace;font-size:44px;color:var(--navy);margin:6px 0}
  .result-head p{color:var(--ink-soft);font-size:14px;margin:2px 0}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
  .stat-card{background:var(--white);border:1px solid var(--border);border-radius:6px;padding:14px;text-align:center}
  .stat-card .n{font-family:'Courier New',monospace;font-size:22px;color:var(--navy)}
  .stat-card .l{font-size:11.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.4px;margin-top:4px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:24px 0 14px;border-bottom:1px solid var(--border)}
  .tab-btn{background:transparent;border:none;border-bottom:3px solid transparent;padding:9px 14px;font-size:13.5px;color:var(--ink-soft);cursor:pointer}
  .tab-btn.active{color:var(--navy);border-color:var(--navy);font-weight:bold}
  .tab-panel{display:none}
  .tab-panel.active{display:block}
  .abar-row{margin-bottom:14px;background:var(--white);border:1px solid var(--border);border-radius:6px;padding:12px 14px}
  .abar-top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
  .abar-top b{color:var(--navy)}
  .abar-track{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
  .abar-fill{height:100%;background:var(--green)}
  .review-item{background:var(--white);border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:12px}
  .review-item .rmeta{font-family:'Courier New',monospace;font-size:11px;color:var(--ink-mute);text-transform:uppercase;margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .review-item .rq{font-size:14.5px;white-space:pre-line;margin-bottom:10px}
  .review-item .ropt{padding:7px 10px;border-radius:4px;font-size:13.5px;margin-bottom:6px;border:1px solid var(--border)}
  .review-item .ropt.correctopt{background:var(--green-bg);border-color:var(--green);color:var(--green)}
  .review-item .ropt.wrongopt{background:var(--red-bg);border-color:var(--red);color:var(--red)}
  .tag{padding:2px 8px;border-radius:3px;font-size:11px}
  .tag.correct{background:var(--green-bg);color:var(--green)}
  .tag.wrong{background:var(--red-bg);color:var(--red)}
  .tag.skip{background:var(--border-soft);color:var(--ink-soft)}
  .explain{font-size:12.5px;color:var(--ink-mute);border-top:1px dashed var(--border-soft);margin-top:8px;padding-top:8px}
  .perf-block{background:var(--white);border:1px solid var(--border);border-radius:6px;padding:16px 18px;margin-bottom:14px}
  .perf-block h4{margin:0 0 8px;font-size:13.5px;color:var(--navy)}
  .perf-block ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7;color:var(--ink)}
  .smart-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
  .filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .filter-btn{background:var(--white);border:1px solid var(--border);padding:6px 12px;border-radius:14px;font-size:12px;cursor:pointer;color:var(--ink-soft)}
  .filter-btn.active{background:var(--navy);color:var(--cream);border-color:var(--navy)}
  .practice-banner{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);padding:8px 14px;border-radius:5px;font-size:12.5px;text-align:center}

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:900px){
    .palette-toggle{display:inline-block}
    .palette{position:fixed;top:0;right:0;height:100%;width:82%;max-width:320px;transform:translateX(100%);transition:transform .25s;z-index:40;box-shadow:-4px 0 16px rgba(0,0,0,.15)}
    .palette.open{transform:translateX(0)}
    .stat-grid{grid-template-columns:repeat(2,1fr)}
    .qcol{padding:16px}
  }
  @media (max-width:520px){
    .exam-header .mid{font-size:11px;gap:10px}
    .bottom-bar{padding:10px 12px}
    .bottom-bar button{flex:1 1 auto;font-size:12.5px;padding:9px 10px}
    .bottom-bar .bb-submit{margin-left:0;order:99;flex-basis:100%}
    .result-wrap{padding:16px 10px 50px}
    .stat-grid{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>

var Q = [["Polity: Preamble","Consider the following words in the Preamble to the Constitution of India:\n1. Sovereign\n2. Socialist\n3. Secular\n4. Integrity\nWhich of the above were inserted by the 42nd Constitutional Amendment Act, 1976?",["1 and 2 only","2, 3 and 4","1, 2 and 3","2 and 3 only"],1,"Medium","The original Preamble (1950) already described India as a 'Sovereign Democratic Republic'. The 42nd Amendment Act, 1976 inserted the words 'Socialist' and 'Secular', and changed 'unity of the nation' to 'unity and integrity of the nation' -- so Socialist, Secular and Integrity were all added, while Sovereign was already present."],["Polity: Fundamental Rights","Consider the following statements regarding Article 21 of the Constitution:\n1. It guarantees the right to life and personal liberty only to citizens of India.\n2. The Supreme Court has interpreted 'life' under Article 21 to include the right to a clean environment and livelihood.\nWhich of the statements given above is/are correct?",["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],1,"Hard","Article 21 uses the word 'person', not 'citizen', so it protects citizens and foreigners alike, making statement 1 incorrect. Through judicial interpretation (starting with Maneka Gandhi v. Union of India), the Supreme Court has expansively read Article 21 to include a clean environment, livelihood, privacy and dignity, making statement 2 correct."],["Polity: Constitutional Parts","Match the following provisions of the Constitution with their correct Part:\nList-I | List-II\nA. Fundamental Rights | 1. Part IV\nB. Directive Principles of State Policy | 2. Part IVA\nC. Fundamental Duties | 3. Part III\nSelect the correct answer:",["A-3, B-1, C-2","A-1, B-2, C-3","A-3, B-2, C-1","A-2, B-1, C-3"],0,"Medium","Fundamental Rights are contained in Part III, Directive Principles of State Policy in Part IV, and Fundamental Duties in Part IVA of the Constitution -- giving the mapping A-3, B-1, C-2."],["Polity: Fundamental Duties","Which Constitutional Amendment Act added the Fundamental Duties to the Indian Constitution, and how many duties were originally listed?",["42nd Amendment; 10 duties","44th Amendment; 11 duties","42nd Amendment; 11 duties","86th Amendment; 10 duties"],0,"Medium","The 42nd Amendment Act, 1976, based on the recommendations of the Swaran Singh Committee, inserted Part IVA (Article 51A) containing 10 Fundamental Duties. The 86th Amendment Act, 2002 later added an 11th duty relating to parents providing educational opportunities to their children."],["Polity: President","The Electoral College for the election of the President of India consists of the elected members of Parliament and the elected members of:",["Only the Legislative Assemblies of States","Legislative Assemblies of States and the Union Territories of Delhi and Puducherry","All Union Territories of India","Legislative Councils of States"],1,"Hard","The Presidential Electoral College comprises elected members of both Houses of Parliament and elected members of the Legislative Assemblies of States. The 70th Constitutional Amendment Act extended this to include the elected members of the Legislative Assemblies of the Union Territories of Delhi and Puducherry, which otherwise would not have been part of the college as UTs."],["Polity: Emergency Provisions","Match the type of emergency with the relevant Article:\nList-I | List-II\nA. National Emergency | 1. Article 356\nB. President's Rule | 2. Article 360\nC. Financial Emergency | 3. Article 352\nSelect the correct combination:",["A-3, B-1, C-2","A-1, B-2, C-3","A-2, B-3, C-1","A-3, B-2, C-1"],0,"Medium","National Emergency is proclaimed under Article 352, President's Rule (failure of State constitutional machinery) under Article 356, and Financial Emergency under Article 360 -- giving A-3, B-1, C-2."],["Polity: Council of Ministers","The principle of collective responsibility of the Council of Ministers to the Lok Sabha is provided under which Article of the Constitution?",["Article 74","Article 75(3)","Article 78","Article 356"],1,"Medium","Article 75(3) explicitly states that the Council of Ministers shall be collectively responsible to the House of the People (Lok Sabha), meaning the entire ministry resigns if it loses the confidence of the Lok Sabha."],["Polity: Judiciary","Which of the following statements about Judicial Review in India is correct?",["Judicial review is expressly and exhaustively defined in a single Article of the Constitution","Judicial review empowers courts to examine the constitutionality of legislative and executive actions","Judicial review can be exercised only by the Supreme Court and not by any High Court","Judicial review was first introduced in India by the 42nd Constitutional Amendment"],1,"Hard","Judicial review -- the power of courts to examine whether laws and executive actions conform to the Constitution -- flows from several provisions (Articles 13, 32, 226, 227, 245 etc.) rather than one single article, is exercised by both the Supreme Court (Article 32) and High Courts (Article 226), and has been an inherent feature of the Constitution since 1950, not something introduced by the 42nd Amendment."],["Polity: Federalism","Which of the following subjects is included in the Concurrent List of the Seventh Schedule to the Constitution?",["Defence","Police","Education","Foreign Affairs"],2,"Medium","Education was originally in the State List but was shifted to the Concurrent List by the 42nd Constitutional Amendment Act, 1976, allowing both Parliament and State Legislatures to legislate on it. Defence and Foreign Affairs remain in the Union List, and Police remains in the State List."],["Polity: Constitutional Bodies","Which one of the following is a Constitutional body, established directly by a provision of the Constitution?",["National Human Rights Commission","Finance Commission","Central Vigilance Commission","Lokpal"],1,"Hard","The Finance Commission is a Constitutional body set up under Article 280. The National Human Rights Commission, Central Vigilance Commission and Lokpal are all statutory bodies created by Acts of Parliament (the Protection of Human Rights Act, the CVC Act, and the Lokpal and Lokayuktas Act respectively), not by the Constitution itself."],["Polity: Constitutional Provisions","Which of the following pairs is INCORRECTLY matched?",["Article 32 - Right to Constitutional Remedies","Article 143 - Advisory Jurisdiction of the Supreme Court","Article 280 - Union Public Service Commission","Article 324 - Election Commission of India"],2,"Hard","Article 280 actually deals with the constitution and functions of the Finance Commission, not the Union Public Service Commission (which is covered under Articles 315-323). The other three pairs -- Article 32 (right to constitutional remedies), Article 143 (Presidential reference/advisory jurisdiction of the SC), and Article 324 (Election Commission) -- are all correctly matched."],["Polity: Emergency Provisions","The 44th Constitutional Amendment Act, 1978 replaced the term 'internal disturbance' with which term as a ground for proclaiming a National Emergency under Article 352?",["External aggression","Armed rebellion","Financial instability","Failure of constitutional machinery"],1,"Medium","In the wake of the Emergency of 1975-77, the 44th Amendment Act replaced the vague ground of 'internal disturbance' with the narrower and more precise term 'armed rebellion', making it harder to misuse Article 352 for purely political purposes."],["Polity: Constitutional Amendment","Amendments to the Indian Constitution under the formal procedure of Article 368 can be made by which of the following methods?\n1. Simple majority of Parliament\n2. Special majority of Parliament\n3. Special majority of Parliament with ratification by at least half of the State Legislatures\nWhich of the above genuinely fall under the Article 368 amendment procedure?",["Only 2","Only 3","2 and 3 only","1, 2 and 3"],2,"Hard","Article 368 itself recognises two categories of amendment: those passed by a special majority of Parliament alone, and those requiring a special majority plus ratification by at least half the State Legislatures (for federal provisions). Changes made by a simple majority (like creating new states under Article 4) are technically outside the Article 368 procedure, even though they alter the Constitution's text."],["Polity: Local Government","The 73rd Constitutional Amendment Act, 1992 established a three-tier Panchayati Raj system consisting of the Gram Panchayat, the Panchayat Samiti (block/taluk level) and which body at the district level?",["Zilla Parishad","Nagar Palika","Municipal Corporation","District Collectorate"],0,"Medium","The three tiers of rural local self-government created by the 73rd Amendment are the Gram Panchayat (village level), Panchayat Samiti/Taluk Panchayat (intermediate level), and Zilla Parishad/Zilla Panchayat (district level). Nagar Palikas and Municipal Corporations belong to urban local government under the 74th Amendment."],["Polity: Elections","The Anti-Defection Law, dealing with disqualification of members of Parliament and State Legislatures on grounds of defection, is contained in which Schedule of the Constitution?",["Ninth Schedule","Tenth Schedule","Eighth Schedule","Second Schedule"],1,"Medium","The Anti-Defection Law was inserted as the Tenth Schedule by the 52nd Constitutional Amendment Act, 1985, to curb political defections motivated by lure of office or other similar considerations."],["Polity: Schedules","As of the current constitutional position, how many languages are listed in the Eighth Schedule of the Constitution?",["18","21","22","24"],2,"Hard","The Eighth Schedule originally listed 14 languages. Sindhi was added by the 21st Amendment, Konkani/Manipuri/Nepali by the 71st Amendment, and Bodo, Dogri, Maithili and Santhali by the 92nd Amendment (2003), bringing the total to 22 officially recognised languages."],["Polity: Landmark Judgments","The doctrine that Parliament cannot amend the Constitution so as to alter its 'basic structure' was propounded by the Supreme Court in which case?",["Golaknath v. State of Punjab","Kesavananda Bharati v. State of Kerala","Minerva Mills v. Union of India","Maneka Gandhi v. Union of India"],1,"Medium","The landmark 1973 case of Kesavananda Bharati v. State of Kerala is where a 13-judge Bench of the Supreme Court propounded the Basic Structure Doctrine, holding that while Parliament has wide powers to amend the Constitution under Article 368, it cannot alter its basic structure or framework."],["Polity: Parliament","A Bill is deemed to be a Money Bill under Article 110 of the Constitution if it deals exclusively with matters such as:",["Imposition, abolition, remission, alteration or regulation of any tax","Declaration of a National Emergency","Amendment of the Constitution","Creation of a new All India Service"],0,"Medium","Article 110 defines a Money Bill as one containing provisions dealing only with matters such as taxation, borrowing by the government, custody of the Consolidated Fund/Contingency Fund, or expenditure charged on the Consolidated Fund -- not emergency proclamations, constitutional amendments, or creation of services."],["Polity: Rajya Sabha","Under Article 249 of the Constitution, the Rajya Sabha can empower Parliament to legislate on a matter in the State List in the national interest, provided the resolution is passed by:",["A simple majority of members present and voting","Not less than two-thirds of members present and voting","A majority of the total membership of the House","Unanimous consent of all members"],1,"Hard","Article 249 allows the Rajya Sabha, if satisfied it is necessary in the national interest, to pass a resolution supported by not less than two-thirds of the members present and voting, empowering Parliament to make laws on a State List subject for a period of one year at a time."],["Polity: Writs","Match the Writ with its purpose:\nList-I (Writ) | List-II (Purpose)\nA. Habeas Corpus | 1. To command a public official to perform a public duty\nB. Mandamus | 2. To secure the release of a person illegally detained\nC. Quo Warranto | 3. To question the legal authority of a person holding a public office\nSelect the correct combination:",["A-2, B-1, C-3","A-1, B-2, C-3","A-2, B-3, C-1","A-3, B-1, C-2"],0,"Medium","Habeas Corpus ('you may have the body') secures the release of a person illegally detained; Mandamus commands a public authority to perform a duty it is obligated to perform; Quo Warranto ('by what authority') questions the legality of a person's claim to a public office -- giving A-2, B-1, C-3."],["History: Indus Valley Civilization","Which of the following statements about the Indus Valley Civilization is correct?",["Its script has been fully deciphered by historians","It had a highly developed system of urban drainage and town planning","Iron tools were extensively used by its people","It was primarily a Vedic, fire-worshipping culture"],1,"Medium","The Indus Valley Civilization is especially noted for its advanced urban planning, including covered drains and a grid-pattern street layout. Its script remains undeciphered to this day, it belonged to the Bronze Age (iron came later, with the Vedic culture), and it is distinct from the fire-worshipping Vedic culture that followed it."],["History: Vedic Period","Which of the following Vedic texts is considered the oldest?",["Samaveda","Yajurveda","Rigveda","Atharvaveda"],2,"Medium","The Rigveda, a collection of hymns praising various deities, is the oldest of the four Vedas and one of the oldest religious texts in the world, generally dated to around 1500-1200 BCE."],["History: Mauryan Empire","The Kalinga War, which led Emperor Ashoka to renounce warfare and adopt the policy of Dhamma, was fought in which year?",["321 BCE","261 BCE","232 BCE","185 BCE"],1,"Medium","The Kalinga War is traditionally dated to 261 BCE, in the 8th regnal year of Ashoka. The immense bloodshed described in his 13th Major Rock Edict is said to have caused deep remorse, leading him to embrace Buddhism and the policy of Dhamma."],["History: Gupta Empire","Chandragupta II, one of the greatest rulers of the Gupta dynasty, is also known by which title?",["Devanampiya","Vikramaditya","Chakravartin","Samrat Ashoka"],1,"Medium","Chandragupta II adopted the title 'Vikramaditya' after his decisive victories, notably over the Shakas of western India. 'Devanampiya' (beloved of the gods) was a title used by Ashoka, and 'Chakravartin' is a generic term for a universal/paramount ruler."],["History: Delhi Sultanate","Arrange the following dynasties of the Delhi Sultanate in chronological order of their establishment:\n1. Tughlaq\n2. Khalji\n3. Mamluk (Slave) dynasty\n4. Lodi\nSelect the correct sequence:",["3-2-1-4","2-3-1-4","3-1-2-4","4-3-2-1"],0,"Hard","The correct chronological order is: the Mamluk/Slave dynasty (established 1206 by Qutb-ud-din Aibak), followed by the Khalji dynasty (1290), the Tughlaq dynasty (1320), and finally the Lodi dynasty (1451) -- giving the sequence 3-2-1-4."],["History: Bhakti Movement","Which of the following pairs of Bhakti saints and their tradition is correctly matched?",["Kabir - Nirguna Bhakti tradition of North India","Chaitanya Mahaprabhu - Veerashaiva tradition of Karnataka","Basaveshwara - Vaishnava tradition of Bengal","Meera Bai - Sufi tradition of Punjab"],0,"Medium","Kabir was a prominent saint of the Nirguna (formless/attribute-less God) Bhakti tradition of North India. Chaitanya Mahaprabhu actually belonged to the Vaishnava Bhakti movement of Bengal, Basaveshwara founded the Veerashaiva/Lingayat movement in Karnataka, and Meera Bai was a Krishna-devotee poet-saint of Rajasthan, not a Sufi."],["History: Mughal Empire","Akbar's syncretic religious order, which attempted to blend elements of various religions and had himself at its head, was known as:",["Sulh-i-Kul","Din-i-Ilahi","Ibadat Khana","Mansabdari System"],1,"Medium","Din-i-Ilahi ('Divine Faith') was the eclectic religious order founded by Akbar in 1582, drawing selectively from Islam, Hinduism, Zoroastrianism, and other faiths. Sulh-i-Kul was Akbar's broader policy of universal tolerance, the Ibadat Khana was the hall he built at Fatehpur Sikri for interfaith religious debates, and the Mansabdari System was an administrative/military ranking system."],["History: Vijayanagara Empire","The Vijayanagara Empire was founded in 1336 CE by which two brothers, traditionally said to have been guided by the sage Vidyaranya?",["Krishnadevaraya and Achyutaraya","Harihara and Bukka","Deva Raya I and Deva Raya II","Bukka and Krishnadevaraya"],1,"Medium","The Vijayanagara Empire was founded by the brothers Harihara I and Bukka Raya I, traditionally associated with the sage-scholar Vidyaranya, marking the beginning of one of South India's most powerful Hindu empires."],["History: Revolt of 1857","Consider the following as causes of the Revolt of 1857:\n1. Introduction of Enfield rifle cartridges greased with animal fat\n2. The Doctrine of Lapse\n3. Racial discrimination against Indian sepoys\nHow many of the above are correctly identified as causes of the revolt?",["Only one","Only two","All three","None"],2,"Medium","All three factors contributed to the discontent leading up to 1857: the greased cartridges were the immediate trigger offending both Hindu and Muslim sepoys, Dalhousie's Doctrine of Lapse annexed several princely states and alienated Indian rulers, and racial discrimination in pay, promotion and treatment fuelled resentment among sepoys."],["History: Indian National Congress","The Indian National Congress was founded in 1885. Who served as its first President?",["Allan Octavian Hume","Dadabhai Naoroji","Womesh Chandra Bonnerjee","Surendranath Banerjee"],2,"Medium","While Allan Octavian Hume, a retired British civil servant, was the principal organiser/founder behind the formation of the Congress, Womesh Chandra Bonnerjee (also spelt Banerjee) presided as its first President at the inaugural session held in Bombay in December 1885."],["History: Partition of Bengal","The Partition of Bengal in 1905, which sparked the Swadeshi Movement, was carried out during the viceroyalty of:",["Lord Curzon","Lord Minto","Lord Hardinge","Lord Ripon"],0,"Medium","Lord Curzon, Viceroy of India from 1899 to 1905, effected the Partition of Bengal in 1905 ostensibly for administrative convenience, but it was widely seen as a 'divide and rule' tactic and triggered the Swadeshi and Boycott movements."],["History: Freedom Movement Chronology","Arrange the following movements led by Mahatma Gandhi in chronological order:\n1. Quit India Movement\n2. Non-Cooperation Movement\n3. Champaran Satyagraha\n4. Civil Disobedience Movement\nSelect the correct sequence:",["3-2-4-1","2-3-4-1","3-4-2-1","1-2-3-4"],0,"Hard","The correct chronology is: Champaran Satyagraha (1917) -- Gandhi's first major civil disobedience movement in India, followed by the Non-Cooperation Movement (1920-22), the Civil Disobedience Movement (1930, including the Dandi March), and finally the Quit India Movement (1942) -- giving 3-2-4-1."],["History: Congress Sessions","The resolution demanding 'Purna Swaraj' (Complete Independence) as the goal of the Indian National Congress was passed at the ________ session in December 1929, presided over by ________.",["Lahore session; Jawaharlal Nehru","Karachi session; Mahatma Gandhi","Lucknow session; Motilal Nehru","Calcutta session; Subhas Chandra Bose"],0,"Medium","At the Lahore session of the INC in December 1929, presided over by Jawaharlal Nehru, the Congress formally adopted 'Purna Swaraj' (complete independence) as its goal, and 26 January 1930 was observed as the first Independence Day / Purna Swaraj Day."],["History: Government of India Act 1935","Which of the following was a feature of the Government of India Act, 1935?",["It granted complete independence to India","It introduced provincial autonomy and proposed an All-India Federation","It abolished the office of the Viceroy","It introduced universal adult franchise"],1,"Medium","The Government of India Act, 1935 introduced provincial autonomy (with elected ministries responsible to provincial legislatures) and proposed (though never fully implemented) an All-India Federation combining British provinces and princely states. It did not grant independence, retained the Viceroy's office, and did not introduce universal adult franchise, which came only with the Constitution of 1950."],["History: Simon Commission","The Simon Commission, which visited India in 1928, was widely boycotted primarily because:",["It proposed to partition India","It did not include a single Indian member","It recommended abolishing the Indian National Congress","It was appointed to investigate the Jallianwala Bagh massacre"],1,"Medium","The Simon Commission, set up to review the working of the Government of India Act, 1919, consisted entirely of British members with no Indian representation, which was seen as a grave insult and led to nationwide protests with the slogan 'Simon Go Back'."],["History: Round Table Conferences","Mahatma Gandhi attended which of the three Round Table Conferences held in London, as the sole representative of the Indian National Congress?",["First Round Table Conference (1930)","Second Round Table Conference (1931)","Third Round Table Conference (1932)","He attended all three"],1,"Medium","Gandhi attended only the Second Round Table Conference (1931) as the Congress's sole representative, following the Gandhi-Irwin Pact which led to the suspension of the Civil Disobedience Movement. The Congress boycotted both the First (1930) and Third (1932) conferences."],["History: Quit India Movement","The Quit India Movement, launched by Gandhi in August 1942, is associated with which famous call to the nation?",["Do or Die","Swaraj is my birthright","Inquilab Zindabad","Back to the Vedas"],0,"Medium","At the launch of the Quit India Movement on 8 August 1942 at the Bombay session of the AICC, Gandhi gave the historic call 'Do or Die' (Karo ya Maro), urging Indians to either achieve freedom or die trying."],["History: Indian National Army","Which of the following slogans is most closely associated with Subhas Chandra Bose and the Indian National Army?",["Vande Mataram","Delhi Chalo","Simon Go Back","Do or Die"],1,"Medium","'Delhi Chalo' (On to Delhi) was the rallying call given by Subhas Chandra Bose to the Indian National Army (INA/Azad Hind Fauj) as it advanced towards India through Burma, aiming to liberate the country from British rule."],["History: Poona Pact","The Poona Pact of 1932, signed between Mahatma Gandhi and Dr. B.R. Ambedkar, was primarily concerned with:",["Replacing separate electorates for the Depressed Classes with reserved seats in joint electorates","Granting complete independence to India","Establishing a federal structure for India","Ending the Non-Cooperation Movement"],0,"Hard","The Poona Pact was signed after Gandhi's fast against the Communal Award's provision of separate electorates for the Depressed Classes. It replaced separate electorates with a system of reserved seats for the Depressed Classes within joint (general) electorates."],["History: Independence","The Indian Independence Act, 1947, which provided for the partition of British India into India and Pakistan, was based on the plan announced by which Viceroy?",["Lord Wavell","Lord Mountbatten","Lord Linlithgow","Lord Irwin"],1,"Medium","Lord Mountbatten, the last Viceroy of British India, announced the plan for partition (the Mountbatten Plan / June 3rd Plan, 1947), which was subsequently enacted by the British Parliament as the Indian Independence Act, 1947."],["Karnataka History: Kadambas","The Kadamba dynasty, regarded as one of the earliest native dynasties of Karnataka, was founded by Mayurasharma with its capital at:",["Badami","Banavasi","Manyakheta","Talakadu"],1,"Medium","Mayurasharma founded the Kadamba dynasty in the 4th century CE with Banavasi (in present-day Uttara Kannada district) as its capital, making it one of the earliest indigenous ruling dynasties of Karnataka."],["Karnataka History: Chalukyas of Badami","Who is generally credited with founding the Chalukya dynasty of Badami?",["Pulakeshin I","Pulakeshin II","Vikramaditya I","Kirtivarman I"],0,"Medium","Pulakeshin I is credited with founding the Badami Chalukya dynasty around 543 CE, establishing Badami (Vatapi) as the capital. His grandson Pulakeshin II later became the dynasty's most celebrated ruler, notably defeating Harshavardhana of Kanauj."],["Karnataka History: Rashtrakutas","The Rashtrakuta dynasty, whose capital was at Manyakheta, produced the celebrated ruler Amoghavarsha I, traditionally credited with which important early work on Kannada poetics?",["Vikramarjuna Vijaya","Kavirajamarga","Adipurana","Gadayuddha"],1,"Hard","Kavirajamarga, the earliest available treatise on Kannada poetics and grammar, is traditionally attributed to Amoghavarsha I (Nripatunga) of the Rashtrakuta dynasty, whose capital was Manyakheta (modern Malkhed). Vikramarjuna Vijaya and Gadayuddha are works of the poet Pampa and Ranna respectively."],["Karnataka History: Hoysalas","The Hoysala dynasty, known for its magnificent temple architecture, had its capital at:",["Halebidu (Dwarasamudra)","Hampi","Badami","Gulbarga"],0,"Medium","The Hoysala capital was Dwarasamudra, present-day Halebidu, where the famous Hoysaleswara temple is located. Hampi was the Vijayanagara capital, Badami the Chalukya capital, and Gulbarga was a Bahmani Sultanate capital."],["Karnataka History: Vijayanagara","The city of Vijayanagara, capital of the empire of the same name, was located on the banks of which river?",["Krishna","Tungabhadra","Kaveri","Malaprabha"],1,"Medium","The ruins of Vijayanagara, near modern Hampi, lie on the southern bank of the Tungabhadra river, whose natural defences and fertile surroundings made it an ideal site for the empire's capital."],["Karnataka History: Battle of Talikota","The Battle of Talikota (1565), which led to the decline of the Vijayanagara Empire, was fought against a confederacy of:",["Maratha kingdoms","Deccan Sultanates","Mughal Empire","Portuguese forces"],1,"Medium","The Battle of Talikota (also called Rakkasa-Tangadi) was fought between the Vijayanagara Empire and an allied confederacy of the Deccan Sultanates -- Bijapur, Ahmadnagar, Golconda and Bidar -- resulting in a decisive defeat for Vijayanagara and the destruction of its capital city."],["Karnataka History: Kittur Chennamma","Rani Chennamma of Kittur led an armed uprising against the British East India Company's policy of Doctrine of Lapse in the year:",["1799","1824","1857","1885"],1,"Medium","Rani Chennamma of Kittur led a rebellion against the British in 1824, after the Company refused to recognise her adopted son as heir and sought to annex Kittur -- one of the earliest armed resistances by an Indian ruler against British colonial rule, predating the 1857 revolt by over three decades."],["Karnataka History: Sangolli Rayanna","Sangolli Rayanna, a trusted commander who continued the resistance against the British after Rani Chennamma's death, was executed at:",["Kittur","Nandagad","Belagavi","Bidar"],1,"Medium","Sangolli Rayanna, who continued to lead guerrilla resistance against the British after the fall of Kittur, was captured and hanged at Nandagad (near Belagavi) in 1831."],["Karnataka History: Mysore Kingdom","Hyder Ali rose to power in the Kingdom of Mysore by:",["Overthrowing the Wodeyar administration while retaining the Wodeyar as nominal ruler","Directly annexing Mysore into the Vijayanagara Empire","Being appointed by the Maratha Peshwas","Being installed by the British East India Company"],0,"Medium","Hyder Ali, originally a military commander in the Mysore army, gradually seized effective control of the administration and military from the Wodeyar dynasty, while allowing the Wodeyar ruler to remain as a nominal figurehead -- becoming the de facto ruler of Mysore by the 1760s."],["Karnataka History: Tipu Sultan","Tipu Sultan, the 'Tiger of Mysore', was killed in 1799 during the Fourth Anglo-Mysore War while defending:",["Bangalore Fort","Srirangapatna","Chitradurga Fort","Bidanur"],1,"Medium","Tipu Sultan died fighting the British at the fall of his capital, Srirangapatna, on 4 May 1799, marking the end of the Fourth Anglo-Mysore War and effectively ending Mysore's independence as a major power."],["Karnataka History: Unification of Karnataka","Karnataka Rajyotsava, commemorating the unification of Kannada-speaking regions into a single state, is celebrated on:",["26 January","15 August","1 November","1 May"],2,"Medium","Karnataka Rajyotsava is celebrated on 1 November every year, marking the day in 1956 when the various Kannada-speaking regions were unified into the state of Mysore (renamed Karnataka in 1973) under the States Reorganisation Act."],["Karnataka History: Kannada Inscriptions","The Halmidi inscription, considered the earliest available epigraphic record in the Kannada language, is dated to approximately which century?",["3rd century CE","5th century CE (c. 450 CE)","8th century CE","12th century CE"],1,"Hard","The Halmidi inscription, discovered in Halmidi village in Hassan district, is generally dated to around 450 CE (5th century CE) and is regarded as the oldest available inscription substantially in the Kannada language, issued during the Kadamba period."],["Karnataka History: Kannada Literature","The 'Ratnatraya' (Three Gems) of early Kannada literature refers to which three poets?",["Pampa, Ponna and Ranna","Basaveshwara, Allama Prabhu and Akka Mahadevi","Kumaravyasa, Lakshmisha and Chamarasa","Nagavarma, Kesiraja and Nagachandra"],0,"Medium","Pampa, Ponna and Ranna, who flourished during the 10th century under Chalukya/Rashtrakuta patronage, are together known as the 'Three Gems' (Ratnatraya) of early Kannada literature, celebrated for classic works such as Vikramarjuna Vijaya, Shantipurana and Gadayuddha respectively."],["Karnataka History: Basaveshwara","Basaveshwara, the 12th-century social reformer and founder of the Lingayat (Veerashaiva) movement, established a unique assembly for spiritual and social discourse known as:",["Anubhava Mantapa","Sringeri Peetha","Dharmasabha","Vachana Sabha"],0,"Medium","Basaveshwara established the Anubhava Mantapa ('Hall of Spiritual Experience') at Kalyana (present-day Basavakalyan) as a democratic forum where people of all castes and both genders could discuss spiritual and social matters, and where the Vachana literature flourished."],["Karnataka History: Chalukyas of Kalyani","The Chalukyas of Kalyani (Later Chalukyas), who revived Chalukya power in the Deccan around the 10th century, had their capital at:",["Kalyani (Basavakalyan)","Badami","Vatapi","Aihole"],0,"Medium","The Later/Western Chalukyas, who rose to power under Tailapa II after overthrowing Rashtrakuta rule, made Kalyani (modern Basavakalyan in Bidar district) their capital, distinguishing them from the earlier Badami Chalukyas."],["Karnataka History: Western Gangas","The Western Ganga dynasty, which ruled parts of southern Karnataka for several centuries, had its early capital at:",["Talakadu","Srirangapatna","Kolar","Mysuru"],0,"Medium","The Western Ganga dynasty, an important early ruling power in southern Karnataka, established its capital at Talakadu on the banks of the Kaveri river (in present-day Mysuru district)."],["Karnataka History: Hoysala Architecture","The Chennakeshava Temple, a masterpiece of Hoysala architecture built by King Vishnuvardhana, is located at:",["Halebidu","Belur","Somanathapura","Hampi"],1,"Medium","The Chennakeshava Temple was built by the Hoysala king Vishnuvardhana at Belur in 1117 CE, commemorating his victory over the Cholas, and is celebrated for its intricate stone carvings. The Hoysaleswara temple is at Halebidu, and the Keshava temple is at Somanathapura."],["Karnataka History: Foreign Travellers","The Portuguese traveller Domingo Paes, who left a detailed account of the splendour of Vijayanagara city, visited it during the reign of:",["Krishnadevaraya","Harihara I","Achyuta Deva Raya","Sadashiva Raya"],0,"Medium","Domingo Paes visited Vijayanagara around 1520-22, during the reign of Krishnadevaraya, considered the empire's greatest ruler, and his vivid eyewitness account is one of the most valuable sources on the city's prosperity and grandeur at its peak."],["Karnataka History: Badami Cave Temples","The rock-cut cave temples at Badami, dedicated to Hindu and Jain deities, were primarily excavated during the reign of the:",["Kadambas","Chalukyas of Badami","Hoysalas","Rashtrakutas"],1,"Medium","The famous Badami cave temples, carved out of sandstone cliffs and dedicated to Vishnu, Shiva and Jain Tirthankaras, were excavated primarily during the reign of the Chalukyas of Badami in the 6th century CE, reflecting the religious tolerance and artistic achievements of the dynasty."],["Karnataka History: Mysore Administration","Which Diwan of Mysore is particularly credited with laying the foundations of modern administration in the princely state after the restoration of Wodeyar rule in 1799?",["Purnaiah (Dewan Purnaiah)","Mirza Ismail","M. Visvesvaraya","T. Ananda Rao"],0,"Hard","Following Tipu Sultan's defeat in 1799, Purnaiah served as the Diwan (chief minister) for the young Krishnaraja Wodeyar III and is credited with efficiently reorganising the revenue and administrative systems of Mysore in the early 19th century. Visvesvaraya and Mirza Ismail were notable Diwans of Mysore in the early 20th century."],["Current Affairs: Oscars 2026","Consider the following statements regarding the 98th Academy Awards (Oscars 2026), held on 15 March 2026:\n1. The ceremony was held at the Dolby Theatre, Los Angeles.\n2. 'One Battle After Another' won the Best Picture award.\n3. Michael B. Jordan won the Best Actor award for his role in 'Sinners'.\nHow many of the above statements are correct?",["Only one","Only two","All three","None"],2,"Medium","The 98th Academy Awards were held on 15 March 2026 at the Dolby Theatre in Los Angeles, hosted by Conan O'Brien. 'One Battle After Another' won Best Picture (and Best Director for Paul Thomas Anderson), while Michael B. Jordan won Best Actor for 'Sinners' -- making all three statements correct."],["Current Affairs: Karnataka Budget","The Karnataka State Budget for 2026-27, presented in March 2026 by Chief Minister Siddaramaiah (who also holds the Finance portfolio), had an approximate total expenditure outlay of:",["₹2,48,004 crore","₹3,48,004 crore","₹4,48,004 crore","₹5,48,004 crore"],2,"Medium","The Karnataka State Budget for 2026-27, presented by CM Siddaramaiah in the Legislative Assembly in March 2026, proposed a total expenditure of about ₹4,48,004 crore, with a revenue deficit of roughly ₹22,957 crore, making it a deficit budget focused on welfare guarantees and infrastructure."],["Current Affairs: Dam Safety Conference","The International Conference on Dam Safety 2026 (ICDS 2026) was held in February 2026 at which venue in Karnataka?",["Indian Institute of Science (IISc), Bengaluru","Vidhana Soudha, Bengaluru","University of Mysore","Karnataka Science and Technology Academy"],0,"Medium","ICDS 2026 was held on 13-14 February 2026 at the J.N. Tata Auditorium, Indian Institute of Science (IISc), Bengaluru, under the Dam Rehabilitation and Improvement Project (DRIP) Phase II and III, and was inaugurated by Karnataka CM Siddaramaiah."],["Current Affairs: Indian Navy","'Krishna', India's first indigenously designed and built Cadet Training Ship for the Indian Navy, was launched in February 2026 at the L&T Shipyard located at:",["Kattupalli, Chennai","Kochi, Kerala","Visakhapatnam, Andhra Pradesh","Mazagon, Mumbai"],0,"Medium","'Krishna', the first of three indigenous Cadet Training Ships being built for the Indian Navy by Larsen & Toubro, was launched at the L&T Shipyard in Kattupalli, near Chennai, in February 2026. It is named after the Krishna river and can accommodate about 150 cadets and officers."],["Current Affairs: PMO Complex","'Seva Teerth', the new complex inaugurated by the Prime Minister in February 2026 to house the Prime Minister's Office, replaced which historic building as the PMO's location?",["North Block","South Block","Rashtrapati Bhavan","Parliament House"],1,"Medium","Seva Teerth was inaugurated in New Delhi in February 2026 as the new complex housing the Prime Minister's Office, with the PMO shifting there from the historic South Block as part of the broader Central Vista redevelopment project; Kartavya Bhavan was simultaneously inaugurated to house key Union Ministries."],["Current Affairs: International Affairs","Rob Jetten, who was sworn in as Prime Minister of the Netherlands in February 2026, became notable for being:",["The oldest person to hold the office","The youngest Prime Minister in Dutch history and the first openly gay leader of the country","The first woman Prime Minister of the Netherlands","A leader who formed a single-party majority government"],1,"Medium","Rob Jetten, leader of the centrist D66 party, was sworn in as Dutch PM in February 2026 at age 38, becoming both the youngest Prime Minister in Dutch history and the first openly gay person to lead the country. He heads a three-party minority coalition of D66, CDA and VVD."],["Current Affairs: Karnataka Policy","In its 2026-27 budget, the Karnataka government proposed to become the first Indian state to:",["Ban the use of plastic bags entirely","Restrict social media use for children below the age of 16","Make Kannada compulsory in all private schools","Introduce free electricity for all households"],1,"Medium","In the 2026-27 state budget, the Karnataka government proposed restricting social media use for children under 16 to address digital addiction and protect children's mental health and privacy, which would make it the first Indian state to attempt such a legislative move."],["Current Affairs: Technology","IBM launched its first Infrastructure Innovation Center in India, named the 'Sangam Infrastructure Innovation Center', in which Karnataka city, focused on AI and hybrid cloud infrastructure?",["Mysuru","Bengaluru","Mangaluru","Hubballi"],1,"Medium","IBM's first Infrastructure Innovation Center in India, the Sangam Infrastructure Innovation Center, was launched in Bengaluru, focusing on AI development, hybrid cloud infrastructure and advanced computing technologies, aiming to position India as a hub for AI innovation."],["Current Affairs: Awards","Dr. Kirti Karanth, a wildlife conservation scientist from Karnataka, became the first Indian to receive which international honour in 2026, awarded jointly with UK scientist Alexander Antonelli, for contributions to wildlife and biodiversity conservation?",["Stockholm Water Prize","A Royal Geographical Society honour","Whitley Award","Tyler Prize for Environmental Achievement"],1,"Hard","In 2026, Dr. Kirti Karanth from Karnataka became the first Indian to receive an honour from the UK's Royal Geographical Society, awarded jointly with UK scientist Alexander Antonelli, recognising her contributions to wildlife and biodiversity conservation."],["Current Affairs: Governance","In the Governor/Lieutenant Governor reshuffle announced on 6 March 2026, R.N. Ravi was transferred from Tamil Nadu and appointed as Governor of:",["Telangana","West Bengal","Bihar","Himachal Pradesh"],1,"Hard","In a major Governor/Lt. Governor reshuffle announced by President Droupadi Murmu on 6 March 2026, R.N. Ravi was transferred from Tamil Nadu and appointed Governor of West Bengal, while Taranjit Singh Sandhu was appointed Lieutenant Governor of Delhi and Shiv Pratap Shukla was moved to Telangana."],["English: Error Detection","Identify the segment with an error in the following sentence:\n'Neither of the two candidates / have submitted / their application / on time.'",["Neither of the two candidates","have submitted","their application","on time"],1,"Medium","'Neither' is a singular indefinite pronoun and must be followed by a singular verb; the correct form is 'has submitted', not 'have submitted'."],["English: Vocabulary","Choose the word most nearly SIMILAR in meaning to 'AUDACIOUS':",["Timid","Bold","Cautious","Humble"],1,"Medium","'Audacious' means showing a willingness to take surprisingly bold risks; 'Bold' is its closest synonym here, while 'Timid' and 'Cautious' are closer to its opposites."],["English: Vocabulary","Choose the word most nearly OPPOSITE in meaning to 'FRUGAL':",["Thrifty","Extravagant","Economical","Modest"],1,"Medium","'Frugal' means being sparing or economical, especially with money; its opposite is 'Extravagant', meaning spending resources lavishly. 'Thrifty' and 'Economical' are actually synonyms of frugal, not antonyms."],["English: One Word Substitution","Choose the one word that means 'a person who is unable to read or write':",["Illiterate","Ignorant","Amateur","Novice"],0,"Medium","'Illiterate' precisely means a person unable to read or write. 'Ignorant' refers to lack of knowledge generally, an 'Amateur' engages in an activity for pleasure rather than as a profession, and a 'Novice' is simply a beginner."],["English: Idioms","The idiom 'to bury the hatchet' means:",["To hide evidence of a crime","To make peace and end a quarrel","To start a new project","To retire from active work"],1,"Medium","'To bury the hatchet' is an idiom meaning to make peace or end a conflict/quarrel, derived from a Native American custom of literally burying weapons as a sign of a truce."],["English: Voice","Choose the correct passive voice of the sentence: 'The committee will announce the results tomorrow.'",["The results will be announced by the committee tomorrow.","The results were announced by the committee tomorrow.","The results are being announced by the committee tomorrow.","The results had been announced by the committee tomorrow."],0,"Medium","Since the active sentence is in the simple future tense ('will announce'), the passive voice must also be in the simple future tense: 'will be announced' -- ruling out the past, present continuous, and past perfect forms in the other options."],["English: Narration","Choose the correct indirect (reported) speech for: She said, 'I am writing a letter now.'",["She said that she is writing a letter then.","She said that she was writing a letter then.","She said that she had been writing a letter now.","She says that she was writing a letter now."],1,"Hard","When converting direct to indirect speech with a past reporting verb ('said'), the present continuous tense ('am writing') shifts to past continuous ('was writing'), and the time expression 'now' changes to 'then' -- giving 'She said that she was writing a letter then.'"],["English: Articles","Fill in the blank with the correct article: '___ European traveller stayed at ___ one-star hotel near ___ Vidhana Soudha.'",["A; a; the","An; a; the","A; an; the","An; an; the"],1,"Hard","The article depends on the initial SOUND, not the letter: 'European' begins with a consonant sound (yoo-), so it takes 'a'; 'one-star' begins with a 'w' sound (won-), so it also takes 'a'; and 'Vidhana Soudha' is a unique, specific named place, which takes the definite article 'the'."],["English: Prepositions","Choose the correct preposition: 'The Karnataka VAO examination consists ___ two papers.'",["in","of","with","for"],1,"Medium","The correct idiomatic collocation is 'consists of', meaning 'is made up of' -- the other prepositions do not fit this fixed usage."],["English: Subject-Verb Agreement","Choose the grammatically correct sentence:",["Each of the candidates have to submit their hall ticket.","Each of the candidates has to submit his or her hall ticket.","Each of the candidate have to submit their hall ticket.","Each of the candidates were submitting his hall ticket."],1,"Medium","'Each' is a singular indefinite pronoun and takes a singular verb ('has') and singular pronoun reference ('his or her'), regardless of the plural noun that follows 'of'."],["English: Tenses","Choose the correctly formed sentence in the Present Perfect Continuous tense:",["She has been studying for the VAO exam since six months.","She has been studying for the VAO exam for six months.","She had been studying for the VAO exam since six months.","She is studying for the VAO exam since six months."],1,"Hard","'For' is used with a duration or period of time (e.g. 'for six months'), while 'since' is used with a specific starting point in time (e.g. 'since June'). Since 'six months' expresses duration, the correct preposition is 'for', giving the correct Present Perfect Continuous sentence."],["English: Sentence Arrangement","Rearrange the following parts to form a meaningful sentence:\nP. before appearing\nQ. candidates must read\nR. the instructions carefully\nS. for the examination\nSelect the correct sequence:",["Q-R-P-S","P-S-Q-R","Q-P-R-S","R-Q-P-S"],0,"Medium","The logically ordered sentence is: 'Candidates must read (Q) the instructions carefully (R) before appearing (P) for the examination (S)', giving the sequence Q-R-P-S."],["English: Spelling","Identify the correctly spelled word:",["Occurance","Ocurrence","Occurrence","Occurrance"],2,"Medium","The correct spelling is 'Occurrence' -- with a double 'c', a double 'r', and ending in '-ence', not '-ance'."],["English: Conjunctions","Choose the correct conjunction to fill the blank: 'She did not attend the interview ___ she was unwell.'",["so","because","although","unless"],1,"Medium","'Because' correctly introduces the reason for her not attending the interview. 'So' would reverse the cause-effect logic, 'although' implies a contrast that doesn't fit, and 'unless' introduces a condition, none of which suit this sentence's meaning."],["English: Vocabulary in Context","In the sentence 'The Governor's address to the Assembly was marked by remarkable candour', the word 'candour' most nearly means:",["Frankness and honesty","Anger and hostility","Confusion and vagueness","Formality and stiffness"],0,"Medium","'Candour' means the quality of being open, honest and straightforward in speech, i.e., frankness -- none of the other options capture this meaning."],["ಕನ್ನಡ: ಸಂಧಿ","'ಮಳೆ + ಇಲ್ಲ = ಮಳೆಯಿಲ್ಲ' ಎಂಬ ಪದದಲ್ಲಿ ಯಾವ ಸಂಧಿ ಕಾರ್ಯವಾಗಿದೆ?",["ಲೋಪ ಸಂಧಿ","ಆಗಮ ಸಂಧಿ","ಆದೇಶ ಸಂಧಿ","ಉತ್ವ ಸಂಧಿ"],1,"Medium","In Kannada Sandhi, when the consonant 'ಯ್' (or 'ವ್') is newly inserted between two vowels while joining two words, it is called ಆಗಮ ಸಂಧಿ (Agama Sandhi). Here, ಮಳೆ + ಇಲ್ಲ becomes ಮಳೆಯಿಲ್ಲ with the insertion of 'ಯ' between the two vowels."],["ಕನ್ನಡ: ಸಂಧಿ","'ಮಾತು + ಆಡು = ಮಾತಾಡು' ಈ ಪದದಲ್ಲಿ ಕಂಡುಬರುವ ಸಂಧಿಯನ್ನು ಗುರುತಿಸಿ.",["ಆಗಮ ಸಂಧಿ","ಆದೇಶ ಸಂಧಿ","ಲೋಪ ಸಂಧಿ","ಗುಣ ಸಂಧಿ"],2,"Medium","ಲೋಪ ಸಂಧಿಯಲ್ಲಿ ಸ್ವರದ ಮುಂದೆ ಸ್ವರ ಬಂದಾಗ ಮೊದಲನೆಯ ಸ್ವರ (ಇಲ್ಲಿ 'ಮಾತು' ಪದದ ಕೊನೆಯ 'ಉ') ಲೋಪವಾಗುತ್ತದೆ. ಆದ್ದರಿಂದ 'ಮಾತು+ಆಡು' ಎಂಬುದು 'ಮಾತಾಡು' ಆಗಿ ಲೋಪ ಸಂಧಿಗೆ ಉದಾಹರಣೆಯಾಗಿದೆ."],["ಕನ್ನಡ: ಸಮಾಸ","'ಕೆಂದಾವರೆ' (ಕೆಂಪು + ತಾವರೆ) ಈ ಪದ ಯಾವ ಸಮಾಸಕ್ಕೆ ಉದಾಹರಣೆಯಾಗಿದೆ?",["ದ್ವಂದ್ವ ಸಮಾಸ","ಕರ್ಮಧಾರಯ ಸಮಾಸ","ಬಹುವ್ರೀಹಿ ಸಮಾಸ","ದ್ವಿಗು ಸಮಾಸ"],1,"Hard","ಕರ್ಮಧಾರಯ ಸಮಾಸದಲ್ಲಿ ಪೂರ್ವಪದವು ವಿಶೇಷಣವಾಗಿದ್ದು ಉತ್ತರಪದದ ಗುಣವನ್ನು ಸೂಚಿಸುತ್ತದೆ. 'ಕೆಂಪು' ಎಂಬ ಗುಣವಾಚಕ ಪದವು 'ತಾವರೆ' ಎಂಬ ನಾಮಪದದ ಬಣ್ಣವನ್ನು ಸೂಚಿಸುವುದರಿಂದ ಇದು ಕರ್ಮಧಾರಯ ಸಮಾಸಕ್ಕೆ ಉದಾಹರಣೆ."],["ಕನ್ನಡ: ಸಮಾಸ","'ಅಪ್ಪ-ಅಮ್ಮ' ಎಂಬ ಪದವು ಯಾವ ಸಮಾಸಕ್ಕೆ ಉದಾಹರಣೆ?",["ತತ್ಪುರುಷ ಸಮಾಸ","ದ್ವಂದ್ವ ಸಮಾಸ","ಗಮಕ ಸಮಾಸ","ಅಂಶಿ ಸಮಾಸ"],1,"Medium","ದ್ವಂದ್ವ ಸಮಾಸದಲ್ಲಿ ಎರಡು ಅಥವಾ ಹೆಚ್ಚು ನಾಮಪದಗಳು ಸಮಾನ ಪ್ರಾಧಾನ್ಯತೆ ಪಡೆದು 'ಮತ್ತು' ಎಂಬ ಅರ್ಥದಲ್ಲಿ ಸೇರುತ್ತವೆ. 'ಅಪ್ಪ ಮತ್ತು ಅಮ್ಮ' ಎಂಬ ಅರ್ಥ ಬರುವುದರಿಂದ ಇದು ದ್ವಂದ್ವ ಸಮಾಸಕ್ಕೆ ಉದಾಹರಣೆ."],["ಕನ್ನಡ: ತತ್ಸಮ-ತದ್ಭವ","ಕೆಳಗಿನ ಪದಗಳಲ್ಲಿ 'ಕಾರ್ಯ' ಎಂಬ ತತ್ಸಮ ಪದಕ್ಕೆ ಸರಿಯಾದ ತದ್ಭವ ರೂಪ ಯಾವುದು?",["ಕಜ್ಜ","ಕಾರ್ಯಂ","ಕಜ್ಜಾ","ಕಾರ್ಜ"],0,"Hard","ಸಂಸ್ಕೃತದಿಂದ ಕನ್ನಡಕ್ಕೆ ಬಂದು ಧ್ವನಿ ಬದಲಾವಣೆ ಹೊಂದಿದ ಪದಗಳನ್ನು ತದ್ಭವ ಪದಗಳೆನ್ನುತ್ತಾರೆ. 'ಕಾರ್ಯ' ಎಂಬ ತತ್ಸಮ ಪದದ ತದ್ಭವ ರೂಪ 'ಕಜ್ಜ' ಆಗಿದೆ."],["ಕನ್ನಡ: ಸಮಾನಾರ್ಥಕ ಪದ","'ಸೂರ್ಯ' ಪದಕ್ಕೆ ಸಮಾನಾರ್ಥಕ ಪದವಲ್ಲದ್ದನ್ನು ಗುರುತಿಸಿ.",["ರವಿ","ಭಾನು","ಚಂದ್ರ","ದಿನಕರ"],2,"Medium","ರವಿ, ಭಾನು ಮತ್ತು ದಿನಕರ ಇವೆಲ್ಲವೂ 'ಸೂರ್ಯ' ಪದದ ಸಮಾನಾರ್ಥಕ ಪದಗಳಾಗಿವೆ. ಆದರೆ 'ಚಂದ್ರ' ಎಂದರೆ ಚಂದ್ರ (ಚಂದಿರ), ಇದು 'ಸೂರ್ಯ'ನ ಸಮಾನಾರ್ಥಕ ಪದವಲ್ಲ."],["ಕನ್ನಡ: ವಿರುದ್ಧಾರ್ಥಕ ಪದ","'ಸುಖ' ಪದಕ್ಕೆ ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಯಾವುದು?",["ಆನಂದ","ದುಃಖ","ನೆಮ್ಮದಿ","ಸಂತೋಷ"],1,"Medium","'ಸುಖ' ಎಂಬುದಕ್ಕೆ ವಿರುದ್ಧಾರ್ಥಕ ಪದ 'ದುಃಖ'. ಆನಂದ, ನೆಮ್ಮದಿ ಮತ್ತು ಸಂತೋಷ ಇವೆಲ್ಲವೂ ಸುಖಕ್ಕೆ ಹತ್ತಿರವಾದ ಅರ್ಥ ಕೊಡುವ ಪದಗಳೇ ಹೊರತು ವಿರುದ್ಧಾರ್ಥಕ ಪದಗಳಲ್ಲ."],["ಕನ್ನಡ: ನುಡಿಗಟ್ಟು","'ಕೈ ಕಟ್ಟಿ ಕುಳಿತುಕೊಳ್ಳುವುದು' ಎಂಬ ನುಡಿಗಟ್ಟಿನ ಅರ್ಥವೇನು?",["ಕಠಿಣ ಪರಿಶ್ರಮ ಪಡುವುದು","ಸುಮ್ಮನೆ ಏನೂ ಮಾಡದೆ ಇರುವುದು","ಬೇಗ ಬೇಗ ಕೆಲಸ ಮುಗಿಸುವುದು","ಇನ್ನೊಬ್ಬರಿಗೆ ಸಹಾಯ ಮಾಡುವುದು"],1,"Medium","'ಕೈ ಕಟ್ಟಿ ಕುಳಿತುಕೊಳ್ಳುವುದು' ಎಂಬ ನುಡಿಗಟ್ಟು ಯಾವುದೇ ಕೆಲಸ ಮಾಡದೆ ಸುಮ್ಮನೆ, ನಿಷ್ಕ್ರಿಯವಾಗಿ ಇರುವುದು ಎಂಬ ಅರ್ಥವನ್ನು ಸೂಚಿಸುತ್ತದೆ."],["ಕನ್ನಡ: ಗಾದೆ","'ಕೂಸು ಹುಟ್ಟುವ ಮುನ್ನ ಕುಲಾವಿ ಹೊಲಿಸಿದರು' ಎಂಬ ಗಾದೆಯ ತಾತ್ಪರ್ಯವೇನು?",["ಕಾರ್ಯ ಆಗುವ ಮೊದಲೇ ಅನಗತ್ಯ ತಯಾರಿ ಮಾಡುವುದು","ಕಷ್ಟಪಟ್ಟು ಕೆಲಸ ಮಾಡುವುದು","ಸಮಯಕ್ಕೆ ಸರಿಯಾಗಿ ಕೆಲಸ ಮಾಡುವುದು","ಇತರರ ಸಹಾಯ ಪಡೆಯುವುದು"],0,"Medium","ಈ ಗಾದೆ ಮಗು ಹುಟ್ಟುವ ಮೊದಲೇ ಅದಕ್ಕೆ ಟೋಪಿ (ಕುಲಾವಿ) ಹೊಲಿಸುವಂತಹ, ಕಾರ್ಯ ನೆರವೇರುವ ಮೊದಲೇ ಅವಸರದಿಂದ, ಅನಗತ್ಯವಾಗಿ ತಯಾರಿ ಮಾಡುವ ಪ್ರವೃತ್ತಿಯನ್ನು ಟೀಕಿಸುತ್ತದೆ."],["ಕನ್ನಡ: ಕಾಗುಣಿತ","ಈ ಕೆಳಗಿನ ಪದಗಳಲ್ಲಿ ಸರಿಯಾದ ಕಾಗುಣಿತವುಳ್ಳ ಪದವನ್ನು ಗುರುತಿಸಿ.",["ವ್ಯಾವಹಾರಿಕ","ವಾಯುವಹಾರಿಕ","ವ್ಯವಹಾರಿಕ","ವೈಯಾವಹಾರಿಕ"],2,"Medium","'ವ್ಯವಹಾರಿಕ' ಎಂಬುದು ಸರಿಯಾದ ಕಾಗುಣಿತ ರೂಪ; ಉಳಿದ ಆಯ್ಕೆಗಳು ಸಾಮಾನ್ಯವಾಗಿ ಬಳಕೆಯಲ್ಲಿ ಕಂಡುಬರುವ ತಪ್ಪು ರೂಪಗಳಾಗಿವೆ."],["ಕನ್ನಡ: ಶಬ್ದ ಭೇದ","'ಸುಂದರವಾದ ಹೂವು ಅರಳಿತು' ಎಂಬ ವಾಕ್ಯದಲ್ಲಿ ಗುಣವಾಚಕ (ವಿಶೇಷಣ) ಪದ ಯಾವುದು?",["ಹೂವು","ಸುಂದರವಾದ","ಅರಳಿತು","ಇವಾವುದೂ ಅಲ್ಲ"],1,"Medium","ಗುಣವಾಚಕ (ವಿಶೇಷಣ) ಎಂದರೆ ನಾಮಪದದ ಗುಣವನ್ನು ಸೂಚಿಸುವ ಪದ. ಇಲ್ಲಿ 'ಸುಂದರವಾದ' ಎಂಬ ಪದವು 'ಹೂವು' ಎಂಬ ನಾಮಪದದ ಗುಣವನ್ನು ವಿವರಿಸುತ್ತಿರುವುದರಿಂದ ಅದೇ ಗುಣವಾಚಕ ಪದ."],["ಕನ್ನಡ: ಸಾಹಿತ್ಯ","ಕನ್ನಡದ ಆದಿಕವಿ ಎಂದು ಪ್ರಸಿದ್ಧರಾದ ಪಂಪ ಕವಿಯ ಎರಡು ಪ್ರಮುಖ ಕೃತಿಗಳು ಯಾವುವು?",["ಆದಿಪುರಾಣ ಮತ್ತು ವಿಕ್ರಮಾರ್ಜುನ ವಿಜಯ","ಜೈಮಿನಿ ಭಾರತ ಮತ್ತು ಕರ್ಣಾಟ ಭಾರತ ಕಥಾಮಂಜರಿ","ವಡ್ಡಾರಾಧನೆ ಮತ್ತು ಶಬ್ದಮಣಿದರ್ಪಣ","ರಾಮಾಯಣ ದರ್ಶನಂ ಮತ್ತು ಶ್ರೀ ರಾಮಾಯಣ ದರ್ಶನಂ"],0,"Medium","ಆದಿಕವಿ ಪಂಪನ ಎರಡು ಪ್ರಮುಖ ಕೃತಿಗಳೆಂದರೆ ಜೈನ ಧರ್ಮದ ಆದಿತೀರ್ಥಂಕರರ ಕಥೆಯುಳ್ಳ 'ಆದಿಪುರಾಣ' ಮತ್ತು ಮಹಾಭಾರತ ಆಧಾರಿತ 'ವಿಕ್ರಮಾರ್ಜುನ ವಿಜಯ' (ಪಂಪಭಾರತ)."],["ಕನ್ನಡ: ವಾಕ್ಯ ಶುದ್ಧತೆ","ಈ ಕೆಳಗಿನ ವಾಕ್ಯಗಳಲ್ಲಿ ವ್ಯಾಕರಣ ದೃಷ್ಟಿಯಿಂದ ಸರಿಯಾದ ವಾಕ್ಯವನ್ನು ಗುರುತಿಸಿ.",["ಅವನು ಶಾಲೆಗೆ ಹೋದಳು","ಅವಳು ಶಾಲೆಗೆ ಹೋದಳು","ಅವಳು ಶಾಲೆಗೆ ಹೋದನು","ಅವನು ಶಾಲೆಗೆ ಹೋಗಿದ್ದಳು"],1,"Medium","ಕರ್ತೃ ಮತ್ತು ಕ್ರಿಯಾಪದದ ಲಿಂಗ ಹೊಂದಾಣಿಕೆ ಸರಿಯಾಗಿರಬೇಕು. 'ಅವಳು' (ಸ್ತ್ರೀಲಿಂಗ) 'ಹೋದಳು' (ಸ್ತ್ರೀಲಿಂಗ ಕ್ರಿಯಾಪದ) ಎಂಬ ಜೋಡಣೆ ಮಾತ್ರ ವ್ಯಾಕರಣಬದ್ಧವಾಗಿ ಸರಿಯಾಗಿದೆ."],["ಕನ್ನಡ: ವಿಭಕ್ತಿ","'ರಾಮ ರಾವಣನನ್ನು ಕೊಂದನು' ಎಂಬ ವಾಕ್ಯದಲ್ಲಿ 'ರಾವಣನನ್ನು' ಪದದಲ್ಲಿರುವ ವಿಭಕ್ತಿ ಯಾವುದು?",["ಪ್ರಥಮಾ ವಿಭಕ್ತಿ","ದ್ವಿತೀಯಾ ವಿಭಕ್ತಿ","ತೃತೀಯಾ ವಿಭಕ್ತಿ","ಷಷ್ಠಿ ವಿಭಕ್ತಿ"],1,"Hard","'ಅನ್ನು' ಪ್ರತ್ಯಯವು ಕರ್ಮಪದವನ್ನು (ಕ್ರಿಯೆಗೆ ಒಳಗಾಗುವ ವಸ್ತು/ವ್ಯಕ್ತಿಯನ್ನು) ಸೂಚಿಸುವ ದ್ವಿತೀಯಾ ವಿಭಕ್ತಿ ಪ್ರತ್ಯಯವಾಗಿದೆ. ಇಲ್ಲಿ 'ರಾವಣ' ಎಂಬಾತ ಕ್ರಿಯೆಗೆ (ಕೊಲ್ಲುವಿಕೆಗೆ) ಒಳಗಾಗುವ ಕರ್ಮ ಪದವಾಗಿರುವುದರಿಂದ ಇದು ದ್ವಿತೀಯಾ ವಿಭಕ್ತಿ."],["ಕನ್ನಡ: ಏಕ ಪದ","'ಬರೆಯಲು ಬಾರದವನು' ಎಂಬುದಕ್ಕೆ ಸೂಕ್ತವಾದ ಒಂದು ಪದ ಯಾವುದು?",["ಅನಕ್ಷರಸ್ಥ","ಅಜ್ಞಾನಿ","ಮೂರ್ಖ","ಅಪ್ರಬುದ್ಧ"],0,"Medium","'ಬರೆಯಲು ಬಾರದವನು' ಅಂದರೆ ಓದಲು-ಬರೆಯಲು ಬಾರದ ವ್ಯಕ್ತಿ ಎಂಬ ಅರ್ಥವನ್ನು ನಿಖರವಾಗಿ ಸೂಚಿಸುವ ಒಂದು ಪದ 'ಅನಕ್ಷರಸ್ಥ'. ಇತರ ಪದಗಳು ಬೇರೆಯದೇ ಅರ್ಥಗಳನ್ನು (ಜ್ಞಾನದ ಕೊರತೆ, ಮೂರ್ಖತನ, ಅಪಕ್ವತೆ) ಸೂಚಿಸುತ್ತವೆ."],["ಕನ್ನಡ: ಸಾಹಿತ್ಯ ಹೊಂದಾಣಿಕೆ","ಈ ಕೆಳಗಿನವುಗಳನ್ನು ಸರಿಯಾಗಿ ಹೊಂದಿಸಿ:\nಪಟ್ಟಿ-I (ಕವಿ) | ಪಟ್ಟಿ-II (ಕೃತಿ)\nA. ಕುಮಾರವ್ಯಾಸ | 1. ಕರ್ಣಾಟ ಭಾರತ ಕಥಾಮಂಜರಿ\nB. ಕುವೆಂಪು | 2. ಶ್ರೀ ರಾಮಾಯಣ ದರ್ಶನಂ\nC. ಡಿ.ವಿ. ಗುಂಡಪ್ಪ | 3. ಮಂಕುತಿಮ್ಮನ ಕಗ್ಗ\nಸರಿಯಾದ ಜೋಡಣೆಯನ್ನು ಆಯ್ಕೆಮಾಡಿ:",["A-1, B-2, C-3","A-2, B-1, C-3","A-1, B-3, C-2","A-3, B-2, C-1"],0,"Medium","ಕುಮಾರವ್ಯಾಸ 'ಕರ್ಣಾಟ ಭಾರತ ಕಥಾಮಂಜರಿ' (ಕುಮಾರವ್ಯಾಸ ಭಾರತ) ಎಂಬ ಕೃತಿಯ ಕರ್ತೃ; ಕುವೆಂಪು 'ಶ್ರೀ ರಾಮಾಯಣ ದರ್ಶನಂ' ಬರೆದರು; ಡಿ.ವಿ. ಗುಂಡಪ್ಪ 'ಮಂಕುತಿಮ್ಮನ ಕಗ್ಗ' ರಚಿಸಿದರು -- ಆದ್ದರಿಂದ ಸರಿಯಾದ ಜೋಡಣೆ A-1, B-2, C-3."],["ಕನ್ನಡ: ವರ್ಣಮಾಲೆ","ಆಧುನಿಕ ಕನ್ನಡ ವರ್ಣಮಾಲೆಯಲ್ಲಿ ಸ್ವರಗಳ ಸಂಖ್ಯೆ ಎಷ್ಟು?",["13","34","25","49"],0,"Medium","ಕನ್ನಡ ವರ್ಣಮಾಲೆಯಲ್ಲಿ 13 ಸ್ವರಗಳಿವೆ (ಅ, ಆ, ಇ, ಈ, ಉ, ಊ, ಋ, ಎ, ಏ, ಐ, ಒ, ಓ, ಔ) ಮತ್ತು 34 ವ್ಯಂಜನಗಳಿವೆ; ಎರಡನ್ನೂ ಸೇರಿಸಿ ಒಟ್ಟು ಸುಮಾರು 49 ಅಕ್ಷರಗಳಾಗುತ್ತವೆ."],["ಕನ್ನಡ: ಗಾದೆ","'ಕೈ ಸುಟ್ಟುಕೊಂಡ ಮೇಲೆ ಬುದ್ಧಿ ಬಂತು' ಎಂಬ ಗಾದೆ ಯಾವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ?",["ಮೊದಲೇ ಎಚ್ಚರಿಕೆಯಿಂದ ಇರುವುದು","ನಷ್ಟ ಅನುಭವಿಸಿದ ನಂತರವಷ್ಟೇ ಜ್ಞಾನೋದಯವಾಗುವುದು","ಬೇಗ ಬೇಗ ಕೆಲಸ ಮುಗಿಸುವುದು","ಇತರರ ಸಲಹೆ ಕೇಳುವುದು"],1,"Medium","ಈ ಗಾದೆ ಒಬ್ಬ ವ್ಯಕ್ತಿ ನಷ್ಟ ಅಥವಾ ತೊಂದರೆ ಅನುಭವಿಸಿದ ನಂತರವಷ್ಟೇ ಎಚ್ಚೆತ್ತುಕೊಂಡು ಬುದ್ಧಿವಂತಿಕೆಯಿಂದ ವರ್ತಿಸುವುದನ್ನು ಸೂಚಿಸುತ್ತದೆ -- ಮೊದಲೇ ಎಚ್ಚರಿಕೆ ವಹಿಸದೆ ಇರುವುದನ್ನು ಪರೋಕ್ಷವಾಗಿ ಟೀಕಿಸುತ್ತದೆ."],["ಕನ್ನಡ: ವ್ಯಾಕರಣ ಪರಿಕಲ್ಪನೆ","ಈ ಕೆಳಗಿನ ಜೋಡಿಗಳಲ್ಲಿ ತಪ್ಪಾಗಿ ಹೊಂದಿಸಲಾದ ಜೋಡಿಯನ್ನು ಗುರುತಿಸಿ.",["ನಾಮಪದ - ವ್ಯಕ್ತಿ, ವಸ್ತು, ಸ್ಥಳಗಳ ಹೆಸರು","ಕ್ರಿಯಾಪದ - ಕ್ರಿಯೆಯನ್ನು ಸೂಚಿಸುವ ಪದ","ಸರ್ವನಾಮ - ನಾಮಪದದ ಬದಲಿಗೆ ಬಳಸುವ ಪದ","ಗುಣವಾಚಕ - ಕ್ರಿಯಾಪದದ ಗುಣವನ್ನು ಸೂಚಿಸುವ ಪದ"],3,"Hard","ಗುಣವಾಚಕ (ವಿಶೇಷಣ) ವಾಸ್ತವವಾಗಿ ನಾಮಪದದ ಗುಣವನ್ನು ಸೂಚಿಸುತ್ತದೆಯೇ ಹೊರತು ಕ್ರಿಯಾಪದದ ಗುಣವನ್ನಲ್ಲ; ಕ್ರಿಯಾಪದದ ಗುಣ/ರೀತಿಯನ್ನು ಸೂಚಿಸುವ ಪದವನ್ನು ಕ್ರಿಯಾವಿಶೇಷಣ ಎನ್ನುತ್ತಾರೆ. ಆದ್ದರಿಂದ ನಾಲ್ಕನೇ ಜೋಡಿ ತಪ್ಪಾಗಿ ಹೊಂದಿಸಲಾಗಿದೆ."],["ಕನ್ನಡ: ಸಂಬೋಧನೆ","'ಎಲೈ ಗೆಳೆಯಾ, ಇಲ್ಲಿ ಬಾ' ಎಂಬ ವಾಕ್ಯದಲ್ಲಿ 'ಗೆಳೆಯಾ' ಪದವು ಯಾವ ವಿಭಕ್ತಿಯ ಸಂಬೋಧನಾ ರೂಪವಾಗಿದೆ?",["ಪ್ರಥಮಾ ವಿಭಕ್ತಿ (ಸಂಬೋಧನೆ)","ದ್ವಿತೀಯಾ ವಿಭಕ್ತಿ","ಷಷ್ಠಿ ವಿಭಕ್ತಿ","ಸಪ್ತಮಿ ವಿಭಕ್ತಿ"],0,"Hard","ಯಾರನ್ನಾದರೂ ಕರೆಯುವ/ಸಂಬೋಧಿಸುವ ರೂಪವು ಪ್ರಥಮಾ ವಿಭಕ್ತಿಯ ಸಂಬೋಧನಾ ಪ್ರತ್ಯಯದ ಅಡಿಯಲ್ಲಿ ಬರುತ್ತದೆ. 'ಗೆಳೆಯಾ' ಎಂಬುದು 'ಗೆಳೆಯ' ಪದದ ಸಂಬೋಧನಾ ರೂಪವಾಗಿದ್ದು ಪ್ರಥಮಾ ವಿಭಕ್ತಿಗೆ ಸೇರಿದೆ."],["Computer: Networking","In IPv4 addressing, which class of IP address is reserved primarily for multicast communication?",["Class A","Class B","Class C","Class D"],3,"Medium","Class D addresses (ranging from 224.0.0.0 to 239.255.255.255) are reserved for multicast communication, where a single sender transmits data to multiple designated receivers simultaneously. Classes A, B and C are used for standard unicast addressing of varying network sizes."],["Computer: Number Systems","What is the decimal equivalent of the octal number 157₈?",["109","111","115","117"],1,"Hard","Converting 157 (base 8) to decimal: (1×64) + (5×8) + (7×1) = 64 + 40 + 7 = 111. Remembering the place values of an octal number (64, 8, 1 for a 3-digit number) makes such conversions quick."],["Computer: Logic Gates","An XOR (Exclusive-OR) gate produces a high (1) output when:",["Both inputs are the same (both 0 or both 1)","Exactly one of the two inputs is high and the other is low","Both inputs are high","At least one input is low"],1,"Medium","An XOR gate outputs 1 only when its two inputs differ -- i.e., exactly one input is high and the other is low. If both inputs are identical (both 0 or both 1), the output is 0, which distinguishes it from a simple OR gate."],["Computer: Programming Concepts","Which of the following statements correctly distinguishes a compiler from an interpreter?",["A compiler executes code line-by-line while an interpreter translates the whole program at once","A compiler translates the entire source code into machine code before execution, while an interpreter translates and executes code line-by-line","Both compilers and interpreters always produce a standalone executable file","An interpreter is always faster at runtime than a compiled program"],1,"Medium","A compiler converts the entire high-level source code into machine code in one pass before the program runs, producing an executable; an interpreter, by contrast, translates and executes the program one line/statement at a time without first producing a full executable, which is generally slower at runtime, not faster."],["Computer: Operating Systems","Which of the following is NOT one of the four necessary conditions for a deadlock to occur in an operating system?",["Mutual Exclusion","Hold and Wait","Preemption","Circular Wait"],2,"Hard","The four necessary conditions for deadlock are Mutual Exclusion, Hold and Wait, NO Preemption (resources cannot be forcibly taken away), and Circular Wait. 'Preemption' as stated (without 'no') is actually the opposite condition and would help prevent, not cause, a deadlock."],["Computer: Databases","The primary purpose of database normalization is to:",["Increase data redundancy for faster access","Reduce data redundancy and improve data integrity","Encrypt sensitive data stored in the database","Increase the physical storage size of the database"],1,"Medium","Normalization is the process of organising database tables and columns to minimise data redundancy and dependency, thereby improving data integrity and consistency -- it is unrelated to encryption or deliberately increasing storage size."],["Computer: Networking","At which layer of the OSI model does a Router primarily operate, using logical (IP) addressing to forward data between different networks?",["Physical Layer","Data Link Layer","Network Layer","Transport Layer"],2,"Medium","Routers operate at the Network Layer (Layer 3) of the OSI model, using logical IP addresses to determine the best path for forwarding data packets between different networks, unlike switches which work at the Data Link Layer using MAC addresses."],["Computer: MS Excel","In MS Excel, which function would you use to display 'Pass' if the value in cell A1 is 40 or above, and 'Fail' otherwise?",["=SUM(A1,40,\"Pass\",\"Fail\")","=IF(A1>=40,\"Pass\",\"Fail\")","=VLOOKUP(A1,40,\"Pass\",\"Fail\")","=COUNTIF(A1>=40,\"Pass\",\"Fail\")"],1,"Medium","The IF function tests a logical condition and returns one value if true and another if false; =IF(A1>=40,\"Pass\",\"Fail\") correctly checks whether A1 is 40 or more and displays the appropriate text -- SUM, VLOOKUP and COUNTIF are not suited to this kind of conditional text output."],["Computer: MS Word","Which MS Word feature allows a reviewer's insertions, deletions, and formatting changes to a document to be recorded and displayed for the author's approval or rejection?",["AutoCorrect","Track Changes","Spell Check","Mail Merge"],1,"Medium","Track Changes records every edit made by a reviewer -- insertions, deletions and formatting changes -- as visible markup, allowing the original author to review, accept, or reject each change individually."],["Computer: Cybersecurity","How does 'spear phishing' primarily differ from generic 'phishing'?",["Spear phishing uses only voice calls, while phishing uses only emails","Spear phishing is a highly targeted attack aimed at a specific individual or organisation, while phishing is sent broadly to a large number of random recipients","Spear phishing never involves fraudulent emails","Phishing exclusively targets banking systems while spear phishing targets social media"],1,"Medium","Spear phishing is a targeted form of phishing directed at a specific individual, organisation or business, often using personalised information to appear more convincing, whereas generic phishing casts a wide net, sending the same deceptive message to a large number of random recipients."],["Computer: IT Trends","Which of the following cloud computing service models provides users with a ready-to-use software application over the internet, without the user managing the underlying infrastructure or platform?",["Infrastructure as a Service (IaaS)","Platform as a Service (PaaS)","Software as a Service (SaaS)","Data as a Service (DaaS)"],2,"Medium","Software as a Service (SaaS) delivers a complete, ready-to-use application over the internet (e.g. webmail, Google Docs), with the provider managing all underlying infrastructure and platforms. IaaS provides raw computing infrastructure, and PaaS provides a platform for developers to build applications."],["Computer: Data Communication","In data communication, which statement correctly distinguishes 'bandwidth' from 'throughput'?",["Bandwidth and throughput always have identical values in a network","Bandwidth refers to the theoretical maximum data transfer capacity of a channel, while throughput refers to the actual data successfully transferred over time","Throughput is measured only in decibels, while bandwidth is measured in bits per second","Bandwidth applies only to wireless networks, while throughput applies only to wired networks"],1,"Hard","Bandwidth is the theoretical maximum capacity of a communication channel to carry data (typically measured in bits per second), while throughput is the actual amount of data successfully delivered over the channel in a given time -- throughput is usually lower than bandwidth due to overheads, congestion, and errors."],["Computer: Web Development","Consider the following statements about CSS (Cascading Style Sheets):\n1. Internal CSS is written within a <style> tag inside the HTML document's <head> section.\n2. External CSS files are typically linked to HTML documents using the <script> tag.\nWhich of the statements given above is/are correct?",["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],0,"Medium","Internal CSS is correctly written within a <style> tag in the <head> section, making statement 1 correct. However, external CSS files are linked using the <link> tag (e.g. <link rel=\"stylesheet\" href=\"style.css\">), not the <script> tag, which is used for JavaScript -- making statement 2 incorrect."],["Computer: Kannada Computing","Which of the following statements about the Nudi Kannada typing software is correct?",["Nudi can only be used to type in English and does not support the Kannada script","Nudi supports Kannada typing through both a fixed KGP-based keyboard layout and a phonetic (transliteration-style) layout","Nudi is a hardware scanner device used to digitise printed Kannada documents","Nudi was developed exclusively for use outside Karnataka"],1,"Medium","Nudi, the official Kannada software standard adopted by the Karnataka government, allows users to type Kannada text using different input methods, including the standard KGP (Kannada Ganaka Parishat) fixed keyboard layout as well as phonetic/transliteration-based typing -- it is a software input tool, not scanning hardware."],["Computer: Computer Architecture","The term 'Von Neumann bottleneck' refers to a fundamental limitation in computer architecture arising from:",["The CPU being unable to perform arithmetic operations","Data and program instructions sharing the same bus/memory pathway between the CPU and memory, limiting overall throughput","The absence of an Arithmetic Logic Unit in early computers","The inability of a computer to store data permanently"],1,"Hard","In the classic Von Neumann architecture, both data and program instructions share the same memory and the same bus connecting the CPU to memory, which limits the rate at which data can be transferred and processed -- this shared-pathway limitation is known as the Von Neumann bottleneck."]];

}

  status = {};
  for(var i=0;i<Q.length;i++){ status[i] = freshStatus(); }

/* =========================================================
   DIFFICULTY CLASSIFIER (derived at runtime from question
   wording — the question database itself is never altered)
========================================================= */
function classifyDifficulty(item){
  return item[4] || 'Medium';
}

/* =========================================================
   RANDOMIZATION — shuffles question order and, within each
   question, the option order (remapping the correct index so
   scoring stays accurate). Runs fresh each time a full test is
   started, so every attempt sees a different arrangement.
========================================================= */
function shuffleArray(arr){
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  }
  return arr;
}
function shuffleQuestionOptions(){
  Q.forEach(function(item){
    var opts = item[2], correct = item[3];
    var order = opts.map(function(_,i){return i;});
    shuffleArray(order);
    item[2] = order.map(function(i){return opts[i];});
    item[3] = order.indexOf(correct);
  });
}

/* =========================================================
   UTIL
========================================================= */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function el(html){
  var d=document.createElement('div');
  d.innerHTML=html.trim();
  return d.firstChild;
}

  });
