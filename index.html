<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Karnataka Geography — CBT Examination</title>
<style>
  :root{
    --navy:#1F3A5F; --navy-dark:#16283F;
    --gold:#B08D57;
    --cream:#F4F1E8;
    --ink:#2A2622; --ink-soft:#5A4F3A; --ink-mute:#7A6F5C;
    --border:#D9D2BE; --border-soft:#E3DCC8;
    --white:#FFFFFF;
    --green:#2F6F4E; --green-bg:#E4EFE7;
    --red:#B23A2E; --red-bg:#F6E6E4;
    --amber:#8A6D1F; --amber-bg:#F5E7B2; --amber-border:#C9A227;
    --topicbg:#EFEADA;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:Georgia,'Tinos',serif;color:var(--ink);background:var(--cream)}
  button{font-family:inherit}
  #app{min-height:100vh;display:flex;flex-direction:column}

  /* ---------- START SCREEN ---------- */
  .start-wrap{max-width:640px;margin:40px auto;background:var(--white);border:1px solid var(--border);border-radius:8px;padding:30px 32px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .start-wrap h1{font-size:19px;color:var(--navy);margin:0 0 4px}
  .start-wrap h2{font-size:14px;font-weight:normal;color:var(--ink-soft);margin:0 0 22px}
  .start-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
  .start-card{background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:12px 14px}
  .start-card .lbl{font-family:'Courier New',monospace;font-size:11px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.5px}
  .start-card .val{font-size:16px;color:var(--navy);margin-top:4px}
  .instructions{font-size:13.5px;line-height:1.7;color:var(--ink-soft);margin-bottom:22px}
  .instructions li{margin-bottom:4px}
  .toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:22px;font-size:13.5px}
  .btn-primary{font-family:Georgia,serif;font-size:15px;background:var(--navy);color:var(--cream);border:none;padding:12px 26px;border-radius:5px;cursor:pointer}
  .btn-primary:hover{background:var(--navy-dark)}
  .btn-secondary{font-family:Georgia,serif;font-size:14px;background:var(--gold);color:var(--ink);border:none;padding:9px 20px;border-radius:5px;cursor:pointer}
  .btn-ghost{font-family:Georgia,serif;font-size:13.5px;background:transparent;color:var(--navy);border:1px solid var(--navy);padding:8px 16px;border-radius:5px;cursor:pointer}

  /* ---------- EXAM HEADER ---------- */
  .exam-header{background:var(--navy);color:var(--cream);padding:10px 18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
  .exam-header .titles h1{font-size:14.5px;font-weight:normal;margin:0;letter-spacing:.2px}
  .exam-header .titles h2{font-size:12px;font-weight:normal;margin:2px 0 0;color:#D8CBA9}
  .exam-header .mid{display:flex;align-items:center;gap:16px;font-family:'Courier New',monospace;font-size:12.5px}
  .exam-header .timer{background:#16283F;padding:5px 12px;border-radius:4px;font-size:14px;letter-spacing:.5px}
  .exam-header .timer.low{background:var(--red)}
  .palette-toggle{display:none;background:var(--gold);color:var(--ink);border:none;padding:7px 12px;border-radius:4px;font-size:12.5px;cursor:pointer}
  .progress-track{height:4px;background:var(--border)}
  .progress-fill{height:100%;background:var(--gold);transition:width .25s}

  /* ---------- MAIN EXAM LAYOUT ---------- */
  .exam-body{flex:1;display:flex;gap:0;align-items:flex-start}
  .qcol{flex:1;padding:22px 26px;max-width:760px}
  .qmeta{font-family:'Courier New',monospace;font-size:11.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .qmeta .qtopic{background:var(--topicbg);color:var(--ink-soft);padding:2px 8px;border-radius:3px;text-transform:none;letter-spacing:0}
  .qmeta .qstatus{padding:2px 8px;border-radius:3px}
  .qtext{font-size:15.5px;line-height:1.6;margin:0 0 18px;white-space:pre-line;background:var(--white);border:1px solid var(--border);border-radius:6px;padding:16px 18px}
  .opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:11px 14px;margin-bottom:9px;background:var(--white);border:1px solid var(--border);border-radius:5px;font-family:Georgia,serif;font-size:14px;color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
  .opt:hover{border-color:var(--navy);background:var(--topicbg)}
  .opt .oletter{font-family:'Courier New',monospace;font-weight:bold;color:var(--navy);flex-shrink:0}
  .opt.selected{background:#E9EEF4;border-color:var(--navy)}
  .opt.selected .oletter{color:var(--navy)}

  .bottom-bar{display:flex;flex-wrap:wrap;gap:8px;padding:14px 26px;border-top:1px solid var(--border);background:var(--white)}
  .bottom-bar button{font-size:13.5px;padding:9px 16px;border-radius:5px;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--ink)}
  .bottom-bar .bb-primary{background:var(--navy);color:var(--cream);border-color:var(--navy)}
  .bottom-bar .bb-primary:hover{background:var(--navy-dark)}
  .bottom-bar .bb-warn{background:var(--amber-bg);border-color:var(--amber-border);color:var(--amber)}
  .bottom-bar .bb-clear{color:var(--red);border-color:var(--red)}
  .bottom-bar .bb-submit{background:var(--red);border-color:var(--red);color:var(--white);margin-left:auto}
  .bottom-bar button:disabled{opacity:.4;cursor:default}

  /* ---------- PALETTE ---------- */
  .palette{width:270px;flex-shrink:0;background:var(--white);border-left:1px solid var(--border);padding:16px;height:100%}
  .palette h3{font-size:12.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11.5px;margin-bottom:14px;color:var(--ink-soft)}
  .legend span.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;border:1px solid var(--border)}
  .pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .pnum{aspect-ratio:1;border:1px solid var(--border);border-radius:4px;background:var(--white);font-family:'Courier New',monospace;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
  .pnum.notvisited{background:var(--white);color:var(--ink)}
  .pnum.visited{background:var(--red-bg);border-color:var(--red);color:var(--red)}
  .pnum.answered{background:var(--green-bg);border-color:var(--green);color:var(--green)}
  .pnum.marked{background:var(--amber-bg);border-color:var(--amber-border);color:var(--amber)}
  .pnum.current{outline:2px solid var(--navy);outline-offset:1px}
  .palette-summary{margin-top:14px;font-size:12px;color:var(--ink-soft);border-top:1px dashed var(--border-soft);padding-top:10px}
  .palette-summary div{display:flex;justify-content:space-between;padding:2px 0}

  /* ---------- MODAL ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(42,38,34,.55);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal-box{background:var(--white);border-radius:8px;padding:24px 26px;max-width:420px;width:90%;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .modal-box p{font-size:14.5px;line-height:1.6;margin:0 0 18px;color:var(--ink)}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px}

  /* ---------- RESULT DASHBOARD ---------- */
  .result-wrap{max-width:920px;margin:0 auto;padding:24px 20px 60px}
  .result-head{text-align:center;padding:18px 0 8px}
  .result-head .big{font-family:'Courier New',monospace;font-size:44px;color:var(--navy);margin:6px 0}
  .result-head p{color:var(--ink-soft);font-size:14px;margin:2px 0}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
  .stat-card{background:var(--white);border:1px solid var(--border);border-radius:6px;padding:14px;text-align:center}
  .stat-card .n{font-family:'Courier New',monospace;font-size:22px;color:var(--navy)}
  .stat-card .l{font-size:11.5px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.4px;margin-top:4px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:24px 0 14px;border-bottom:1px solid var(--border)}
  .tab-btn{background:transparent;border:none;border-bottom:3px solid transparent;padding:9px 14px;font-size:13.5px;color:var(--ink-soft);cursor:pointer}
  .tab-btn.active{color:var(--navy);border-color:var(--navy);font-weight:bold}
  .tab-panel{display:none}
  .tab-panel.active{display:block}
  .abar-row{margin-bottom:14px;background:var(--white);border:1px solid var(--border);border-radius:6px;padding:12px 14px}
  .abar-top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
  .abar-top b{color:var(--navy)}
  .abar-track{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
  .abar-fill{height:100%;background:var(--green)}
  .review-item{background:var(--white);border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:12px}
  .review-item .rmeta{font-family:'Courier New',monospace;font-size:11px;color:var(--ink-mute);text-transform:uppercase;margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .review-item .rq{font-size:14.5px;white-space:pre-line;margin-bottom:10px}
  .review-item .ropt{padding:7px 10px;border-radius:4px;font-size:13.5px;margin-bottom:6px;border:1px solid var(--border)}
  .review-item .ropt.correctopt{background:var(--green-bg);border-color:var(--green);color:var(--green)}
  .review-item .ropt.wrongopt{background:var(--red-bg);border-color:var(--red);color:var(--red)}
  .tag{padding:2px 8px;border-radius:3px;font-size:11px}
  .tag.correct{background:var(--green-bg);color:var(--green)}
  .tag.wrong{background:var(--red-bg);color:var(--red)}
  .tag.skip{background:var(--border-soft);color:var(--ink-soft)}
  .explain{font-size:12.5px;color:var(--ink-mute);border-top:1px dashed var(--border-soft);margin-top:8px;padding-top:8px}
  .perf-block{background:var(--white);border:1px solid var(--border);border-radius:6px;padding:16px 18px;margin-bottom:14px}
  .perf-block h4{margin:0 0 8px;font-size:13.5px;color:var(--navy)}
  .perf-block ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7;color:var(--ink)}
  .smart-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
  .filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .filter-btn{background:var(--white);border:1px solid var(--border);padding:6px 12px;border-radius:14px;font-size:12px;cursor:pointer;color:var(--ink-soft)}
  .filter-btn.active{background:var(--navy);color:var(--cream);border-color:var(--navy)}
  .practice-banner{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);padding:8px 14px;border-radius:5px;font-size:12.5px;text-align:center}

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:900px){
    .palette-toggle{display:inline-block}
    .palette{position:fixed;top:0;right:0;height:100%;width:82%;max-width:320px;transform:translateX(100%);transition:transform .25s;z-index:40;box-shadow:-4px 0 16px rgba(0,0,0,.15)}
    .palette.open{transform:translateX(0)}
    .stat-grid{grid-template-columns:repeat(2,1fr)}
    .qcol{padding:16px}
  }
  @media (max-width:520px){
    .exam-header .mid{font-size:11px;gap:10px}
    .bottom-bar{padding:10px 12px}
    .bottom-bar button{flex:1 1 auto;font-size:12.5px;padding:9px 10px}
    .bottom-bar .bb-submit{margin-left:0;order:99;flex-basis:100%}
    .result-wrap{padding:16px 10px 50px}
    .stat-grid{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* =========================================================
   CONFIG — change these to reconfigure the exam engine
========================================================= */
var CONFIG = {
  examName: "Karnataka State Competitive Examination — Mock CBT",
  subjectName: "Karnataka Geography — Advanced + Current Affairs",
  durationMinutes: 60,     // total exam duration; easy to change
  marksPerQuestion: 1,
  negativeMarking: { enabled: false, value: 0.25 }
};

/* =========================================================
   QUESTION DATABASE — untouched, exactly as supplied.
   Format per item: [topic, questionText, [options...], correctIndex]
========================================================= */
var Q = [
["Introduction to Karnataka","In which year was the State of Mysore officially renamed 'Karnataka'?",["1956","1973","1965","1980"],1,"Easy","The State of Mysore was renamed Karnataka on 1 November 1973 during the tenure of Chief Minister D. Devaraj Urs, to better reflect its unified Kannada-speaking identity."],
["Introduction to Karnataka","Karnataka is the ______ largest state in India by geographical area.",["4th","6th","8th","10th"],1,"Easy","With an area of about 1,91,791 sq km, Karnataka ranks sixth among Indian states by area, after Rajasthan, Madhya Pradesh, Maharashtra, Uttar Pradesh and Gujarat."],
["Introduction to Karnataka","Consider the statements:\n1. Karnataka was formed under the States Reorganisation Act, 1956.\n2. The new state initially named 'Mysore State' merged Kannada-speaking areas from the erstwhile Bombay, Madras and Hyderabad states, and Coorg, with the old Mysore State.\nWhich is/are correct?",["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],2,"Medium","The States Reorganisation Act, 1956 merged Kannada-speaking regions of Bombay, Madras, Hyderabad and Coorg with the old princely Mysore State to create a unified Mysore State, later renamed Karnataka in 1973."],

["Size, Shape and Geographical Location","Karnataka lies approximately between which latitudes?",["4°N to 8°N","11°30'N to 18°30'N","20°N to 26°N","28°N to 32°N"],1,"Easy","Karnataka extends roughly between 11°30'N and 18°30'N latitude and 74°E to 78°30'E longitude, in the western part of peninsular India."],
["Size, Shape and Geographical Location","What is the approximate total geographical area of Karnataka?",["1,00,000 sq km","1,50,000 sq km","1,91,791 sq km","2,50,000 sq km"],2,"Easy","Karnataka covers about 1,91,791 sq km, roughly 5.8% of India's total geographical area."],
["Size, Shape and Geographical Location","Which of the following best describes Karnataka's overall shape?",["A compact square aligned east-west","An elongated shape with greater north-south extent than east-west extent","A perfectly circular shape","A narrow coastal strip with negligible interior extent"],1,"Medium","Karnataka is elongated, stretching further from north (Bidar area) to south (Chamarajanagar area) than from east to west, giving it a wedge-like diagonal orientation."],
["Size, Shape and Geographical Location","Consider the statements:\n1. Karnataka's coastline extends for about 300 km along the Arabian Sea.\n2. This coastline covers Uttara Kannada, Udupi and Dakshina Kannada districts.\nWhich is/are correct?",["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],2,"Medium","Karnataka has roughly 300 km of coastline along the Arabian Sea, spanning the three coastal districts of Uttara Kannada, Udupi and Dakshina Kannada."],

["Boundaries and Bordering States","With how many states does Karnataka share a land boundary?",["4","5","6","7"],2,"Easy","Karnataka borders six states — Goa, Maharashtra, Telangana, Andhra Pradesh, Tamil Nadu and Kerala — besides having a coastline along the Arabian Sea."],
["Boundaries and Bordering States","Match: (a) Goa (b) Maharashtra (c) Telangana (d) Kerala\nWith direction from Karnataka: (i) North (ii) North-west (iii) North-east (iv) South",["a-ii,b-i,c-iii,d-iv","a-i,b-ii,c-iv,d-iii","a-iii,b-iv,c-i,d-ii","a-iv,b-iii,c-ii,d-i"],0,"Medium","Goa lies north-west, Maharashtra north, Telangana north-east and Kerala south of Karnataka, reflecting the state's central position among its six neighbours."],
["Boundaries and Bordering States","Which of the following does NOT share a border with Karnataka?",["Telangana","Tamil Nadu","Odisha","Kerala"],2,"Medium","Odisha lies on India's eastern coast and shares no boundary with Karnataka, whose actual neighbours are Goa, Maharashtra, Telangana, Andhra Pradesh, Tamil Nadu and Kerala."],
["Boundaries and Bordering States","Assertion (A): Karnataka shares its longest interstate boundary with Maharashtra.\nReason (R): Several northern Karnataka districts, including Belagavi, Bidar and Vijayapura, adjoin Maharashtra along an extended stretch.",["Both A and R true, R correctly explains A","Both A and R true, R does not explain A","A true, R false","A false, R true"],0,"Hard","Karnataka's longest interstate boundary is with Maharashtra to the north, running along several northern districts such as Belagavi, Bidar and Vijayapura."],

["Administrative Divisions and Districts","As of 2026, how many districts does Karnataka have?",["28","29","30","31"],3,"Easy","Karnataka has 31 districts, the most recent addition being Vijayanagara, carved out of Ballari district in 2021."],
["Administrative Divisions and Districts","Karnataka's districts are grouped into how many revenue divisions?",["2","3","4","5"],2,"Easy","Karnataka has four revenue divisions — Bengaluru, Mysuru, Belagavi and Kalaburagi — each headed by a Divisional Commissioner."],
["Administrative Divisions and Districts","Consider the statements:\n1. Vijayanagara district was carved out of Ballari district.\n2. It is administratively part of the Kalaburagi division.\nWhich is/are correct?",["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],0,"Medium","Vijayanagara was carved out of Ballari district in 2021, but it falls under the Belagavi revenue division, not Kalaburagi."],
["Administrative Divisions and Districts","Assertion (A): The erstwhile Bruhat Bengaluru Mahanagara Palike (BBMP) area is now governed by the Greater Bengaluru Authority (GBA) with multiple city corporations.\nReason (R): The Karnataka government replaced the single BBMP structure with five city corporations under the GBA framework around 2025.",["Both A and R true, R correctly explains A","Both A and R true, R does not explain A","A true, R false","A false, R true"],0,"Hard","The Karnataka government dissolved the BBMP and created the Greater Bengaluru Authority (GBA) with five separate city corporations — Bengaluru Central, North, South, East and West — to manage the capital's civic administration."],

["Mountain Ranges of Karnataka","The Western Ghats in Karnataka are also known by which name?",["Aravalli Range","Sahyadri","Vindhya Range","Satpura Range"],1,"Easy","The Western Ghats, running along Karnataka's western edge, are also known as the Sahyadri range."],
["Mountain Ranges of Karnataka","Which of the following correctly ranks these peaks from highest to lowest elevation?",["Mullayanagiri > Kudremukh > Kumara Parvatha","Kudremukh > Mullayanagiri > Kumara Parvatha","Kumara Parvatha > Mullayanagiri > Kudremukh","Mullayanagiri > Kumara Parvatha > Kudremukh"],0,"Medium","Mullayanagiri (Karnataka's highest peak, about 1,930 m) is followed by Kudremukh (about 1,894 m) and then Kumara Parvatha (about 1,712 m) in elevation."],
["Mountain Ranges of Karnataka","The Baba Budangiri range, historically associated with coffee cultivation, is a part of which hill system and district?",["Western Ghats, Chikkamagaluru district","Eastern Ghats, Kolar district","Western Ghats, Kodagu district","Nilgiri Hills, Mysuru district"],0,"Medium","The Baba Budangiri range lies in Chikkamagaluru district as part of the Western Ghats and is historically credited as the region where coffee cultivation began in India."],
["Mountain Ranges of Karnataka","Match: (a) Kodachadri (b) Mullayanagiri (c) Kumara Parvatha (d) Nandi Hills\nWith district: (i) Shivamogga (ii) Chikkamagaluru (iii) Dakshina Kannada/Kodagu border (iv) Chikkaballapur",["a-i,b-ii,c-iii,d-iv","a-iii,b-i,c-iv,d-ii","a-ii,b-iv,c-i,d-iii","a-iv,b-ii,c-iii,d-i"],0,"Hard","Kodachadri is in Shivamogga district, Mullayanagiri in Chikkamagaluru, Kumara Parvatha near the Dakshina Kannada-Kodagu border, and Nandi Hills in Chikkaballapur district."],

["Western Ghats and Eastern Ghats in Karnataka","Which mountain range forms the natural western boundary of Karnataka's Malnad region?",["Eastern Ghats","Western Ghats","Vindhya Range","Nilgiri Range (independently of Western Ghats)"],1,"Easy","The Western Ghats run along the western edge of Karnataka, separating the humid Malnad hill tracts from the coastal plain and the drier Maidan plateau to the east."],
["Western Ghats and Eastern Ghats in Karnataka","Consider the statements:\n1. The Western Ghats in Karnataka are a continuous, unbroken mountain wall.\n2. Eastern Ghats in Karnataka appear only as isolated, discontinuous hill ranges in the south-east of the state.\nWhich is/are correct?",["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],1,"Medium","The Western Ghats are not perfectly continuous (they have gaps/passes), but statement 2 is broadly correct: in Karnataka, the Eastern Ghats appear only as scattered, low, discontinuous hills in the south-eastern districts rather than a continuous range."],
["Western Ghats and Eastern Ghats in Karnataka","Which of the following hill ranges in Karnataka is generally associated with the Eastern Ghats system rather than the Western Ghats?",["Baba Budangiri","Nandi Hills","Kudremukh","Kodachadri"],1,"Medium","Nandi Hills, in Chikkaballapur district in south-eastern Karnataka, is associated with the (discontinuous) Eastern Ghats system, unlike the Western Ghats peaks of Baba Budangiri, Kudremukh and Kodachadri."],
["Western Ghats and Eastern Ghats in Karnataka","Assertion (A): The Western Ghats in Karnataka are ecologically far more significant for biodiversity than the Eastern Ghats stretches in the state.\nReason (R): The Western Ghats are a recognised global biodiversity hotspot with high rainfall and dense evergreen forest cover, unlike the drier, degraded Eastern Ghats hill tracts of Karnataka.",["Both A and R true, R correctly explains A","Both A and R true, R does not explain A","A true, R false","A false, R true"],0,"Hard","The Western Ghats are a UNESCO-recognised global biodiversity hotspot with rich evergreen forests due to heavy monsoon rainfall, while Karnataka's Eastern Ghats stretches are drier, more fragmented, and comparatively less biodiverse."],
["Western Ghats and Eastern Ghats in Karnataka","Which of the following statements about the 2026 Western Ghats Ecologically Sensitive Area (ESA) draft notification is correct?",["It proposes an ESA of about 56,825.7 sq km across six Western Ghats states, with Karnataka having the largest share","It applies only to Kerala and Tamil Nadu","It was withdrawn permanently in 2026","It covers only wildlife sanctuaries, not private or revenue land"],0,"Hard","The Union Environment Ministry's latest (seventh) draft ESA notification for the Western Ghats, reissued in 2026, proposes about 56,825.7 sq km as ecologically sensitive across Gujarat, Maharashtra, Goa, Karnataka, Kerala and Tamil Nadu, with Karnataka accounting for the largest area among these states."],

["Relief Features","Karnataka's physiography is broadly divided into which three regions?",["Coastal, Malnad and Maidan","Coastal, Deccan and Konkan","Malnad, Konkan and Vindhyan","Maidan, Sahyadri and Ganga plains"],0,"Easy","Karnataka's relief is broadly divided into the narrow Coastal plain, the hilly, forested Malnad (Western Ghats belt), and the plateau-like Maidan (Bayaluseeme) in the east."],
["Relief Features","Consider the statements:\n1. The Malnad region has the highest average elevation among Karnataka's three physiographic regions.\n2. The Maidan region lies mostly in the rain-shadow area east of the Western Ghats.\nWhich is/are correct?",["Only 1","Only 2","Both 1 and 2","Neither 1 nor 2"],2,"Medium","The hilly Malnad region has the highest average elevation of the three regions, while the Maidan plateau lies largely in the rain-shadow zone east of the Western Ghats, receiving comparatively less rainfall."],

var LETTERS = ['A','B','C','D'];

/* =========================================================
   STATE
========================================================= */
var app = document.getElementById('app');
var status = {};          // per-question status, keyed by qId (index in Q)
var activeIndices = [];    // ordered list of qIds in the current run
var currentPos = 0;        // position within activeIndices
var timerInterval = null;
var remainingSeconds = 0;
var examStartTs = null;
var questionStartTs = null;
var screen = 'start';      // start | exam | result
var isPractice = false;    // true when running a retry/practice subset
var practiceLabel = '';
var resultData = null;     // cached computed results after submission
var activeTab = 'summary';
var reviewFilter = 'all';

function freshStatus(){
  return { selected:null, visited:false, answered:false, marked:false, timeSpent:0, attempts:0 };
}

function initStatuses(){
  status = {};
  for(var i=0;i<Q.length;i++){ status[i] = freshStatus(); }
}

/* =========================================================
   DIFFICULTY CLASSIFIER (derived at runtime from question
   wording — the question database itself is never altered)
========================================================= */
function classifyDifficulty(item){
  return item[4] || 'Medium';
}

/* =========================================================
   RANDOMIZATION — shuffles question order and, within each
   question, the option order (remapping the correct index so
   scoring stays accurate). Runs fresh each time a full test is
   started, so every attempt sees a different arrangement.
========================================================= */
function shuffleArray(arr){
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  }
  return arr;
}
function shuffleQuestionOptions(){
  Q.forEach(function(item){
    var opts = item[2], correct = item[3];
    var order = opts.map(function(_,i){return i;});
    shuffleArray(order);
    item[2] = order.map(function(i){return opts[i];});
    item[3] = order.indexOf(correct);
  });
}

/* =========================================================
   UTIL
========================================================= */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function el(html){
  var d=document.createElement('div');
  d.innerHTML=html.trim();
  return d.firstChild;
}

/* =========================================================
   START SCREEN
========================================================= */
function renderStart(){
  screen='start';
  var negChecked = CONFIG.negativeMarking.enabled ? 'checked' : '';
  app.innerHTML =
  '<div class="start-wrap">'+
    '<h1>'+esc(CONFIG.examName)+'</h1>'+
    '<h2>'+esc(CONFIG.subjectName)+'</h2>'+
    '<div class="start-grid">'+
      '<div class="start-card"><div class="lbl">Total Questions</div><div class="val">'+Q.length+'</div></div>'+
      '<div class="start-card"><div class="lbl">Duration</div><div class="val">'+CONFIG.durationMinutes+' minutes</div></div>'+
      '<div class="start-card"><div class="lbl">Marks / Question</div><div class="val">+'+CONFIG.marksPerQuestion+'</div></div>'+
      '<div class="start-card"><div class="lbl">Negative Marking</div><div class="val" id="neg-val">'+(CONFIG.negativeMarking.enabled?('-'+CONFIG.negativeMarking.value):'Off')+'</div></div>'+
    '</div>'+
    '<ul class="instructions">'+
      '<li>The test contains '+Q.length+' multiple-choice questions across several topics.</li>'+
      '<li>Each question has four options (A–D); choose the single best answer.</li>'+
      '<li>Use <b>Save &amp; Next</b> / <b>Next</b> / <b>Previous</b> to move between questions, or click any number on the palette to jump directly.</li>'+

      '<li>The test will auto-submit when the timer reaches zero.</li>'+
      '<li>Keyboard shortcuts: <b>1–4</b> select an option, <b>←/→</b> move between questions, <b>N</b> next, <b>P</b> previous, <b>M</b> mark for review.</li>'+
    '</ul>'+
    '<div class="toggle-row"><label><input type="checkbox" id="neg-toggle" '+negChecked+'> Enable negative marking (-'+CONFIG.negativeMarking.value+' per wrong answer)</label></div>'+
    '<button class="btn-primary" id="start-btn">Start Test</button>'+
  '</div>';
  document.getElementById('neg-toggle').addEventListener('change', function(e){
    CONFIG.negativeMarking.enabled = e.target.checked;
    document.getElementById('neg-val').textContent = CONFIG.negativeMarking.enabled ? ('-'+CONFIG.negativeMarking.value) : 'Off';
  });
  document.getElementById('start-btn').addEventListener('click', startFullExam);

function startFullExam(){
  shuffleQuestionOptions();
  initStatuses();
  activeIndices = shuffleArray(Q.map(function(_,i){return i;}));
  currentPos = 0;
  isPractice = false;
  practiceLabel = '';
  remainingSeconds = CONFIG.durationMinutes*60;
  examStartTs = Date.now();
  startTimer();
  renderExamScreen();
}

/* =========================================================
   TIMER
========================================================= */
function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  if(isPractice) return; // practice/retry mode is untimed
  timerInterval = setInterval(function(){
    remainingSeconds--;
    updateTimerDisplay();
    if(remainingSeconds<=0){
      clearInterval(timerInterval);
      submitTest(true);
    }
  },1000);
}
function stopTimer(){ if(timerInterval) clearInterval(timerInterval); }
function updateTimerDisplay(){
  var t = document.getElementById('timer-display');
  if(!t) return;
  t.textContent = isPractice ? 'PRACTICE (untimed)' : fmtTime(remainingSeconds);
  t.classList.toggle('low', !isPractice && remainingSeconds<=120);
}

/* =========================================================
   EXAM SCREEN
========================================================= */
function currentQid(){ return activeIndices[currentPos]; }

function commitTimeSpent(){
  if(questionStartTs!==null){
    var qid = currentQid();
    if(qid!==undefined && status[qid]){
      status[qid].timeSpent += (Date.now()-questionStartTs)/1000;
    }
  }
  questionStartTs = Date.now();
}

function renderExamScreen(){
  screen='exam';
  var qid = currentQid();
  status[qid].visited = true;
  questionStartTs = Date.now();

  var answeredCount=0, visitedCount=0, markedCount=0, notVisited=0;
  activeIndices.forEach(function(id){
    var st=status[id];
    if(st.marked) markedCount++;
    else if(st.answered) answeredCount++;
    else if(st.visited) visitedCount++;
    else notVisited++;
  });

  var html = '';
  html += '<div class="exam-header">';
  html +=   '<div class="titles"><h1>'+esc(CONFIG.examName)+'</h1><h2>'+esc(CONFIG.subjectName)+(isPractice?(' — '+esc(practiceLabel)):'')+'</h2></div>';
  html +=   '<div class="mid">';
  html +=     '<span>Question <b>'+(currentPos+1)+'</b> / '+activeIndices.length+'</span>';
  html +=     '<span class="timer" id="timer-display">'+(isPractice?'PRACTICE (untimed)':fmtTime(remainingSeconds))+'</span>';
  html +=     '<button class="palette-toggle" id="palette-toggle-btn">Palette</button>';
  html +=   '</div>';
  html += '</div>';
  html += '<div class="progress-track"><div class="progress-fill" style="width:'+Math.round(((currentPos+1)/activeIndices.length)*100)+'%"></div></div>';
  if(isPractice){
    html += '<div class="practice-banner">Practice mode — '+esc(practiceLabel)+'. This run is untimed and separate from your main result.</div>';
  }
  html += '<div class="exam-body">';
  html +=   '<div class="qcol" id="qcol"></div>';
  html +=   '<div class="palette" id="palette"></div>';
  html += '</div>';
  html += '<div class="bottom-bar">';
  html +=   '<button id="btn-prev" '+(currentPos===0?'disabled':'')+'>Previous</button>';
  html +=   '<button id="btn-clear" class="bb-clear">Clear Response</button>';
  html +=   '<button id="btn-mark" class="bb-warn">Mark for Review</button>';
  html +=   '<button id="btn-save" class="bb-primary">Save &amp; Next</button>';
  html +=   '<button id="btn-next" '+(currentPos===activeIndices.length-1?'disabled':'')+'>Next</button>';
  html +=   '<button id="btn-submit" class="bb-submit">Submit Test</button>';
  html += '</div>';

  app.innerHTML = html;
  renderQuestion();
  renderPalette();

  document.getElementById('btn-prev').addEventListener('click', goPrev);
  document.getElementById('btn-next').addEventListener('click', goNext);
  document.getElementById('btn-save').addEventListener('click', goNext);
  document.getElementById('btn-clear').addEventListener('click', clearResponse);
  document.getElementById('btn-mark').addEventListener('click', markForReview);
  document.getElementById('btn-submit').addEventListener('click', requestSubmit);
  var pt = document.getElementById('palette-toggle-btn');
  if(pt) pt.addEventListener('click', function(){
    document.getElementById('palette').classList.toggle('open');
  });
}

function renderQuestion(){
  var qid = currentQid();
  var item = Q[qid];
  var st = status[qid];
  var qcol = document.getElementById('qcol');

  var statusLabel = st.marked ? '<span class="qstatus" style="background:var(--amber-bg);color:var(--amber)">Marked for review</span>'
    : st.answered ? '<span class="qstatus" style="background:var(--green-bg);color:var(--green)">Answered</span>'
    : '<span class="qstatus" style="background:var(--red-bg);color:var(--red)">Not answered</span>';

  var html = '<div class="qmeta">Question '+(currentPos+1)+' of '+activeIndices.length+'<span class="qtopic">'+esc(item[0])+'</span>'+statusLabel+'</div>';
  html += '<div class="qtext">'+esc(item[1])+'</div>';
  item[2].forEach(function(optText,i){
    var sel = (st.selected===i) ? ' selected' : '';
    html += '<button class="opt'+sel+'" data-i="'+i+'"><span class="oletter">'+LETTERS[i]+'.</span><span>'+esc(optText)+'</span></button>';
  });
  qcol.innerHTML = html;

  qcol.querySelectorAll('.opt').forEach(function(btn){
    btn.addEventListener('click', function(){
      selectOption(parseInt(btn.getAttribute('data-i'),10));
    });
  });
}

function renderPalette(){
  var pal = document.getElementById('palette');
  if(!pal) return;
  var answeredCount=0, visitedCount=0, markedCount=0, notVisited=0;
  var html = '<h3>Question Palette</h3>';
  html += '<div class="legend">'+
    '<div><span class="sw" style="background:var(--white)"></span>Not visited</div>'+
    '<div><span class="sw" style="background:var(--red-bg);border-color:var(--red)"></span>Not answered</div>'+
    '<div><span class="sw" style="background:var(--green-bg);border-color:var(--green)"></span>Answered</div>'+
    '<div><span class="sw" style="background:var(--amber-bg);border-color:var(--amber-border)"></span>Marked</div>'+
  '</div>';
  html += '<div class="pgrid">';
  activeIndices.forEach(function(id,pos){
    var st = status[id];
    var cls = 'notvisited';
    if(st.marked){ cls='marked'; markedCount++; }
    else if(st.answered){ cls='answered'; answeredCount++; }
    else if(st.visited){ cls='visited'; visitedCount++; }
    else { notVisited++; }
    var cur = (pos===currentPos) ? ' current' : '';
    html += '<button class="pnum '+cls+cur+'" data-pos="'+pos+'">'+(pos+1)+'</button>';
  });
  html += '</div>';
  html += '<div class="palette-summary">'+
    '<div><span>Answered</span><span>'+answeredCount+'</span></div>'+
    '<div><span>Not answered</span><span>'+visitedCount+'</span></div>'+
    '<div><span>Marked</span><span>'+markedCount+'</span></div>'+
    '<div><span>Not visited</span><span>'+notVisited+'</span></div>'+
  '</div>';
  pal.innerHTML = html;
  pal.querySelectorAll('.pnum').forEach(function(btn){
    btn.addEventListener('click', function(){
      goToPosition(parseInt(btn.getAttribute('data-pos'),10));
      pal.classList.remove('open');
    });
  });
}

function selectOption(i){
  var qid = currentQid();
  var st = status[qid];
  st.selected = i;
  st.answered = true;
  st.attempts++;
  renderQuestion();
  renderPalette();
}

function clearResponse(){
  var qid = currentQid();
  var st = status[qid];
  st.selected = null;
  st.answered = false;
  renderQuestion();
  renderPalette();
}

function markForReview(){
  var qid = currentQid();
  status[qid].marked = !status[qid].marked;
  goNext(true);
}

function goToPosition(pos){
  if(pos<0 || pos>=activeIndices.length) return;
  commitTimeSpent();
  currentPos = pos;
  renderExamScreen();
}

function goNext(fromMark){
  commitTimeSpent();
  if(currentPos < activeIndices.length-1){
    currentPos++;
    renderExamScreen();
  } else if(!fromMark){
    renderExamScreen();
  } else {
    renderExamScreen();
  }
}

function goPrev(){
  commitTimeSpent();
  if(currentPos>0){
    currentPos--;
    renderExamScreen();
  }
}

/* =========================================================
   MODAL
========================================================= */
function showModal(message, onConfirm, confirmLabel, cancelLabel){
  var overlay = el('<div class="modal-overlay"><div class="modal-box"><p></p><div class="modal-actions"><button class="btn-ghost" id="modal-cancel">'+esc(cancelLabel||'Cancel')+'</button><button class="btn-primary" id="modal-confirm">'+esc(confirmLabel||'Confirm')+'</button></div></div></div>');
  overlay.querySelector('p').textContent = message;
  document.body.appendChild(overlay);
  overlay.querySelector('#modal-cancel').addEventListener('click', function(){ document.body.removeChild(overlay); });
  overlay.querySelector('#modal-confirm').addEventListener('click', function(){
    document.body.removeChild(overlay);
    onConfirm();
  });
}

/* =========================================================
   SUBMISSION
========================================================= */
function countUnanswered(){
  var n=0;
  activeIndices.forEach(function(id){ if(!status[id].answered) n++; });
  return n;
}

function requestSubmit(){
  var unanswered = countUnanswered();
  var msg = unanswered>0
    ? ('You still have '+unanswered+' unanswered question'+(unanswered===1?'':'s')+'. Do you want to submit the test now?')
    : 'All questions are answered. Submit the test now?';
  showModal(msg, function(){ submitTest(false); }, 'Submit Test', 'Continue Test');
}

function submitTest(auto){
  commitTimeSpent();
  stopTimer();
  resultData = computeResults();
  if(isPractice){
    renderPracticeResult();
  } else {
    activeTab = 'summary';
    reviewFilter = 'all';
    renderResultDashboard();
  }
}

/* =========================================================
   RESULTS COMPUTATION
========================================================= */
function computeResults(){
  var total = activeIndices.length;
  var correct=0, wrong=0, attempted=0, timeTotal=0;
  var topicStats = {};
  var diffStats = { Easy:{c:0,w:0,t:0}, Medium:{c:0,w:0,t:0}, Hard:{c:0,w:0,t:0} };

  activeIndices.forEach(function(id){
    var item = Q[id], st = status[id];
    var topic = item[0];
    if(!topicStats[topic]) topicStats[topic] = {c:0,w:0,t:0};
    topicStats[topic].t++;
    var diff = classifyDifficulty(item);
    diffStats[diff].t++;
    timeTotal += st.timeSpent;
    if(st.answered){
      attempted++;
      if(st.selected===item[3]){
        correct++; topicStats[topic].c++; diffStats[diff].c++;
      } else {
        wrong++; topicStats[topic].w++; diffStats[diff].w++;
      }
    }
  });

  var unattempted = total - attempted;
  var rawScore = correct*CONFIG.marksPerQuestion - (CONFIG.negativeMarking.enabled ? wrong*CONFIG.negativeMarking.value : 0);
  var maxScore = total*CONFIG.marksPerQuestion;
  var percentage = maxScore>0 ? (rawScore/maxScore*100) : 0;
  var accuracy = attempted>0 ? (correct/attempted*100) : 0;
  var timeTakenSec = isPractice ? timeTotal : Math.max(0, CONFIG.durationMinutes*60 - remainingSeconds);
  var avgTimePerQ = attempted>0 ? (timeTakenSec/attempted) : 0;

  return {
    total: total, correct: correct, wrong: wrong, attempted: attempted, unattempted: unattempted,
    rawScore: rawScore, maxScore: maxScore, percentage: percentage, accuracy: accuracy,
    timeTakenSec: timeTakenSec, avgTimePerQ: avgTimePerQ,
    topicStats: topicStats, diffStats: diffStats
  };
}

/* =========================================================
   PRACTICE (RETRY) RESULT — lightweight summary
========================================================= */
function renderPracticeResult(){
  screen='result';
  var r = resultData;
  var html = '<div class="result-wrap">';
  html += '<div class="result-head"><p>Practice complete — '+esc(practiceLabel)+'</p><div class="big">'+r.correct+' / '+r.total+'</div><p>'+Math.round(r.percentage)+'% correct in this practice set</p></div>';
  html += '<div class="smart-row" style="justify-content:center;margin-top:20px">';
  html += '<button class="btn-primary" id="back-dash">Back to Full Result</button>';
  html += '<button class="btn-secondary" id="retry-again">Retry This Set Again</button>';
  html += '</div></div>';
  app.innerHTML = html;
  document.getElementById('back-dash').addEventListener('click', function(){
    isPractice=false; practiceLabel=''; renderResultDashboard();
  });
  document.getElementById('retry-again').addEventListener('click', function(){
    var ids = activeIndices.slice();
    startPracticeRun(ids, practiceLabel);
  });
}

function startPracticeRun(ids, label){
  ids.forEach(function(id){ status[id] = freshStatus(); });
  activeIndices = ids;
  currentPos = 0;
  isPractice = true;
  practiceLabel = label;
  remainingSeconds = 0;
  startTimer();
  renderExamScreen();
}

/* =========================================================
   RESULT DASHBOARD (main test)
========================================================= */
function readinessLabel(pct){
  if(pct>=80) return 'Exam ready — strong overall command of the syllabus.';
  if(pct>=60) return 'Good foundation — a bit more revision will get you exam-ready.';
  if(pct>=40) return 'Moderate — focused revision of weak topics is recommended.';
  return 'Needs significant revision before attempting the real exam.';
}

function renderResultDashboard(){
  screen='result';
  var r = resultData;
  var html = '<div class="result-wrap">';
  html += '<div class="result-head"><p>Test complete</p><div class="big">'+r.rawScore.toFixed(2)+' / '+r.maxScore+'</div><p>'+Math.round(r.percentage)+'% overall</p></div>';

  html += '<div class="stat-grid">';
  html += statCard(r.correct,'Correct');
  html += statCard(r.wrong,'Wrong');
  html += statCard(r.attempted,'Attempted');
  html += statCard(r.unattempted,'Unattempted');
  html += statCard(Math.round(r.accuracy)+'%','Accuracy');
  html += statCard(Math.round(r.percentage)+'%','Percentage');
  html += statCard(fmtTime(r.timeTakenSec),'Time Taken');
  html += statCard(fmtTime(r.avgTimePerQ),'Avg / Question');
  html += '</div>';

  html += '<div class="tabs">'+
    tabBtn('summary','Summary')+
    tabBtn('topic','Topic Analysis')+
    tabBtn('difficulty','Difficulty Analysis')+
    tabBtn('review','Question Review')+
    tabBtn('performance','Performance Analysis')+
    tabBtn('actions','Smart Actions')+
  '</div>';

  html += '<div class="tab-panel'+(activeTab==='summary'?' active':'')+'" id="panel-summary">'+summaryPanelHtml(r)+'</div>';
  html += '<div class="tab-panel'+(activeTab==='topic'?' active':'')+'" id="panel-topic">'+topicPanelHtml(r)+'</div>';
  html += '<div class="tab-panel'+(activeTab==='difficulty'?' active':'')+'" id="panel-difficulty">'+difficultyPanelHtml(r)+'</div>';
  html += '<div class="tab-panel'+(activeTab==='review'?' active':'')+'" id="panel-review">'+reviewPanelHtml()+'</div>';
  html += '<div class="tab-panel'+(activeTab==='performance'?' active':'')+'" id="panel-performance">'+performancePanelHtml(r)+'</div>';
  html += '<div class="tab-panel'+(activeTab==='actions'?' active':'')+'" id="panel-actions">'+actionsPanelHtml(r)+'</div>';

  html += '</div>';
  app.innerHTML = html;

  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      activeTab = btn.getAttribute('data-tab');
      renderResultDashboard();
    });
  });

  wireActionButtons(r);
  wireReviewFilters();
}

function statCard(n,l){
  return '<div class="stat-card"><div class="n">'+n+'</div><div class="l">'+esc(l)+'</div></div>';
}
function tabBtn(key,label){
  return '<button class="tab-btn'+(activeTab===key?' active':'')+'" data-tab="'+key+'">'+esc(label)+'</button>';
}

function summaryPanelHtml(r){
  var negNote = CONFIG.negativeMarking.enabled ? ('Negative marking is ON (-'+CONFIG.negativeMarking.value+' per wrong answer).') : 'Negative marking is OFF.';
  return '<div class="perf-block"><h4>Overview</h4><ul>'+
    '<li>Total questions: '+r.total+'</li>'+
    '<li>Correct: '+r.correct+' &nbsp;|&nbsp; Wrong: '+r.wrong+' &nbsp;|&nbsp; Unattempted: '+r.unattempted+'</li>'+
    '<li>Accuracy (of attempted): '+r.accuracy.toFixed(1)+'%</li>'+
    '<li>Overall percentage: '+r.percentage.toFixed(1)+'%</li>'+
    '<li>Time taken: '+fmtTime(r.timeTakenSec)+' &nbsp;|&nbsp; Average time per question: '+fmtTime(r.avgTimePerQ)+'</li>'+
    '<li>'+negNote+'</li>'+
  '</ul></div>';
}

function topicPanelHtml(r){
  var html='';
  Object.keys(r.topicStats).forEach(function(topic){
    var s = r.topicStats[topic];
    var pct = s.t>0 ? Math.round((s.c/s.t)*100) : 0;
    html += '<div class="abar-row"><div class="abar-top"><span>'+esc(topic)+'</span><b>'+s.c+' correct / '+s.w+' wrong / '+s.t+' total — '+pct+'%</b></div>'+
      '<div class="abar-track"><div class="abar-fill" style="width:'+pct+'%"></div></div></div>';
  });
  return html || '<p>No data.</p>';
}

function difficultyPanelHtml(r){
  var html='';
  ['Easy','Medium','Hard'].forEach(function(d){
    var s = r.diffStats[d];
    var pct = s.t>0 ? Math.round((s.c/s.t)*100) : 0;
    html += '<div class="abar-row"><div class="abar-top"><span>'+d+'</span><b>'+s.c+' correct / '+s.w+' wrong / '+s.t+' total — '+pct+'%</b></div>'+
      '<div class="abar-track"><div class="abar-fill" style="width:'+pct+'%"></div></div></div>';
  });
  html += '<p style="font-size:12px;color:var(--ink-mute);margin-top:10px">Each question in the bank carries an explicit Easy / Medium / Hard tag set by the paper-setter.</p>';
  return html;
}

function reviewPanelHtml(){
  var html = '<div class="filter-row">'+
    filterBtn('all','All')+filterBtn('correct','Correct')+filterBtn('wrong','Wrong')+filterBtn('unattempted','Unattempted')+filterBtn('marked','Marked')+
  '</div><div id="review-list">'+reviewListHtml()+'</div>';
  return html;
}
function filterBtn(key,label){
  return '<button class="filter-btn'+(reviewFilter===key?' active':'')+'" data-filter="'+key+'">'+esc(label)+'</button>';
}
function reviewListHtml(){
  var html='';
  activeIndices.forEach(function(id,pos){
    var item=Q[id], st=status[id];
    var wasCorrect = st.answered && st.selected===item[3];
    var wasWrong = st.answered && st.selected!==item[3];
    var unattempted = !st.answered;
    if(reviewFilter==='correct' && !wasCorrect) return;
    if(reviewFilter==='wrong' && !wasWrong) return;
    if(reviewFilter==='unattempted' && !unattempted) return;
    if(reviewFilter==='marked' && !st.marked) return;

    var tag = wasCorrect ? '<span class="tag correct">Correct</span>' : wasWrong ? '<span class="tag wrong">Wrong</span>' : '<span class="tag skip">Not attempted</span>';
    html += '<div class="review-item">';
    html += '<div class="rmeta"><span class="qtopic" style="background:var(--topicbg);padding:2px 8px;border-radius:3px">'+esc(item[0])+'</span>Q'+(pos+1)+tag+(st.marked?'<span class="tag" style="background:var(--amber-bg);color:var(--amber)">Marked</span>':'')+'</div>';
    html += '<div class="rq">'+esc(item[1])+'</div>';
    item[2].forEach(function(opt,i){
      var cls='';
      if(i===item[3]) cls='correctopt';
      else if(i===st.selected) cls='wrongopt';
      html += '<div class="ropt'+(cls?(' '+cls):'')+'">'+LETTERS[i]+'. '+esc(opt)+(i===st.selected?' (Your answer)':'')+(i===item[3]?' (Correct answer)':'')+'</div>';
    });
    html += '<div class="explain">Explanation: '+esc(item[5]||'')+'</div>';
    html += '</div>';
  });
  return html || '<p style="color:var(--ink-mute)">No questions match this filter.</p>';
}
function wireReviewFilters(){
  document.querySelectorAll('.filter-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      reviewFilter = btn.getAttribute('data-filter');
      document.getElementById('review-list').innerHTML = reviewListHtml();
      document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.toggle('active', b===btn); });
    });
  });
}

function performancePanelHtml(r){
  var topics = Object.keys(r.topicStats).map(function(t){
    var s=r.topicStats[t];
    return { topic:t, pct: s.t>0?(s.c/s.t*100):0, total:s.t };
  });
  var strong = topics.filter(function(t){return t.pct>=75;}).sort(function(a,b){return b.pct-a.pct;});
  var weak = topics.filter(function(t){return t.pct<50;}).sort(function(a,b){return a.pct-b.pct;});
  var revisionOrder = weak.slice();

  var html='';
  html += '<div class="perf-block"><h4>Strong Areas</h4><ul>'+(strong.length?strong.map(function(t){return '<li>'+esc(t.topic)+' — '+Math.round(t.pct)+'%</li>';}).join(''):'<li>None yet — accuracy across topics is still developing.</li>')+'</ul></div>';
  html += '<div class="perf-block"><h4>Weak Areas</h4><ul>'+(weak.length?weak.map(function(t){return '<li>'+esc(t.topic)+' — '+Math.round(t.pct)+'%</li>';}).join(''):'<li>No topic fell below 50% — solid overall performance.</li>')+'</ul></div>';
  html += '<div class="perf-block"><h4>Topics To Revise</h4><ul>'+(weak.length?weak.map(function(t){return '<li>'+esc(t.topic)+'</li>';}).join(''):'<li>No specific topic flagged for urgent revision.</li>')+'</ul></div>';
  html += '<div class="perf-block"><h4>Accuracy Analysis</h4><ul><li>Overall accuracy on attempted questions: '+r.accuracy.toFixed(1)+'%</li><li>Overall percentage (of full paper): '+r.percentage.toFixed(1)+'%</li></ul></div>';
  html += '<div class="perf-block"><h4>Suggested Revision Order</h4><ul>'+(revisionOrder.length?revisionOrder.map(function(t,i){return '<li>'+(i+1)+'. '+esc(t.topic)+' ('+Math.round(t.pct)+'%)</li>';}).join(''):'<li>No priority order needed — no weak topics detected.</li>')+'</ul></div>';
  html += '<div class="perf-block"><h4>Estimated Readiness</h4><ul><li>'+readinessLabel(r.percentage)+'</li></ul></div>';
  return html;
}

function actionsPanelHtml(r){
  var wrongCount = 0, unansCount = 0;
  activeIndices.forEach(function(id){
    var item=Q[id], st=status[id];
    if(st.answered && st.selected!==item[3]) wrongCount++;
    if(!st.answered) unansCount++;
  });
  return '<div class="perf-block"><h4>Smart Actions</h4>'+
    '<div class="smart-row">'+
      '<button class="btn-secondary" id="retry-wrong" '+(wrongCount===0?'disabled':'')+'>Retry Wrong Questions ('+wrongCount+')</button>'+
      '<button class="btn-secondary" id="retry-unanswered" '+(unansCount===0?'disabled':'')+'>Retry Unanswered Questions ('+unansCount+')</button>'+
      '<button class="btn-ghost" id="restart-test">Restart Full Test</button>'+
    '</div></div>';
}

function wireActionButtons(r){
  var rw = document.getElementById('retry-wrong');
  var ru = document.getElementById('retry-unanswered');
  var rt = document.getElementById('restart-test');
  if(rw) rw.addEventListener('click', function(){
    var ids = activeIndices.filter(function(id){
      var item=Q[id], st=status[id];
      return st.answered && st.selected!==item[3];
    });
    startPracticeRun(ids, 'Retry — Wrong Questions');
  });
  if(ru) ru.addEventListener('click', function(){
    var ids = activeIndices.filter(function(id){ return !status[id].answered; });
    startPracticeRun(ids, 'Retry — Unanswered Questions');
  });
  if(rt) rt.addEventListener('click', function(){
    renderStart();
  });
}

/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */
document.addEventListener('keydown', function(e){
  if(screen!=='exam') return;
  var tag = (e.target && e.target.tagName) || '';
  if(tag==='INPUT' || tag==='TEXTAREA') return;

  if(e.key>='1' && e.key<='4'){
    var i = parseInt(e.key,10)-1;
    var item = Q[currentQid()];
    if(i < item[2].length){ selectOption(i); }
  } else if(e.key==='ArrowRight'){
    goNext();
  } else if(e.key==='ArrowLeft'){
    goPrev();
  } else if(e.key==='n' || e.key==='N'){
    goNext();
  } else if(e.key==='p' || e.key==='P'){
    goPrev();
  } else if(e.key==='m' || e.key==='M'){
    markForReview();
  }
});

/* =========================================================
   BOOT
========================================================= */
renderStart();

})();
</script>
</body>
</html>
